---
# Het register van proof-of-concepts achter poc.regelrecht.rijks.app.
#
# Dit bestand is de enige bron. Hieruit volgen de kaarten op de
# overzichtspagina, de naam van de wachtwoord-env-var per poc, welke paden het
# portaal serveert of doorstuurt, en welke paden het poc-image raken
# (script/deploy-filters.mjs). Voeg een poc toe met de skill `/poc-add`, niet
# met de hand: die loopt ook de bedrading langs die hier niet in staat.
#
# Wat hier publiek is en wat niet
#
# De overzichtspagina en het inlogscherm zijn allebei zonder wachtwoord te
# lezen — het inlogscherm door een slug te raden. Alles wat op die twee komt,
# geeft de casus dus weg aan wie er langsloopt. Daarom staat er per poc een
# publieke helft en een interne helft, en niet één tekst die op beide plekken
# dienst doet.
#
# Publiek (`titel`, `samenvatting`): wat voor soort verkenning dit is en waar
# hij toe dient. Géén interne stukken en géén uitkomsten, maar wél met wie er
# verkend wordt en waar het ongeveer over gaat: iemand die met een doorgestuurde
# link op de kaartenpagina landt, moet zijn eigen verkenning kunnen herkennen.
# Dat is een afweging van OCW en ons samen (Irene Bruggemann, september 2026),
# niet iets om per poc opnieuw los te laten — hou je aan wat er bij een
# bestaande poc staat, en overleg met de eigenaar van het dossier voordat je
# meer prijsgeeft dan dat.
#
# Intern (`titel_intern`, `samenvatting_intern`, `tags`, `status`,
# `voorbehoud`): het echte onderwerp — het dossier bij naam, de stukken, hoe
# ver het is. Alleen zichtbaar achter het wachtwoord.
#
# Velden:
#   slug         het pad onder poc.regelrecht.rijks.app, ook de sleutel van de
#                env-var met het wachtwoord: slug -> POC_PW_<SLUG in hoofdletters,
#                streepje wordt liggend streepje>. Alleen [a-z0-9-].
#                Publiek zichtbaar in de URL, dus net zo terughoudend als
#                `titel` en `samenvatting`.
#   titel        PUBLIEK. De kop op de kaart en het inlogscherm.
#   samenvatting PUBLIEK. Een of twee zinnen; wat voor verkenning is dit.
#   titel_intern de kop binnen de poc. Optioneel; zonder deze valt hij terug op
#                `titel`.
#   samenvatting_intern
#                het echte onderwerp, achter het wachtwoord. Optioneel.
#   soort        `statisch` (uit dit image geserveerd) of `proxy` (doorgestuurd
#                naar een ander ZAD-component).
#   bron         bij `statisch`: de npm-workspace die de dist bouwt. Meestal
#                in frontend-poc-<slug>/; een poc met een eigen WASM-crate
#                heeft zijn app in packages/poc-<slug>/frontend/.
#   upstream     bij `proxy`: de ZAD-componentnaam, bereikt op
#                http://{deployment}-{upstream}:8000
#   corpus       de mappen met casus-regelgeving die dit image meeneemt.
#   assistent    true als de beleidsassistent voor deze casus aanstaat.
#   sources      bij `statisch`: corpora die de poc laadt terwijl hij draait,
#                niet in de build. Het portaal haalt per bron de map `path`
#                van `branch` op met het token in de env-var `token_env` (de
#                naam, nooit de waarde) en serveert haar achter het
#                wachtwoord op /<slug>/bron/<name>. Een nieuwe commit op die
#                branch staat er na hooguit een minuut, zonder build. Lokaal
#                neemt de map in POC_BRON_<NAME> de plaats van de branch in,
#                zonder token. Zie de pagina van het poc-portaal in de docs.
#   tags         INTERN. Korte labels: departement, uitvoerder, het beleidsveld.
#                Samen wijzen ze het dossier aan, ook waar de publieke helft
#                dat bewust niet doet.
#   status       hoe af deze uitwerking is; verplicht. Zie hieronder.
#   voorbehoud   één of twee zinnen: waarom dit nog niet klopt, of waar het
#                overheen loopt. Verplicht, en in eigen woorden — een lege
#                huisregel leest iedereen heen.
#
# De status is er omdat een bezoeker anders niet kan zien of hij naar een
# schets kijkt of naar iets dat met juristen is doorgelopen. Een uitgerekend
# bedrag ziet er in beide gevallen even stellig uit. Hij staat op elke plek
# waar een uitkomst te zien is, en dat is de publieke kaart niet: daar valt
# niets te geloven wat een waarschuwing nodig heeft. Toegestane waarden:
#
#   verkenning      een eerste uitwerking; niet nagelopen door iemand van het
#                   beleidsterrein. Neem geen enkele uitkomst voor waar aan.
#   in-ontwikkeling gedeeltelijk nagelopen; delen kloppen, andere niet, en
#                   welke dat zijn staat niet vast.
#   gevalideerd     met uitvoerings- of beleidsexperts doorgelopen. Nog steeds
#                   een demo op fictieve gegevens, geen besluit.

pocs:
  - slug: terugbetaalregimes
    titel: RegelRecht en OCW/DUO I
    samenvatting: >-
      Regelingen voor terugbetalers: een verkenning om te bepalen of de
      verschillende terugbetaalregelingen die nu bestaan vereenvoudigd en/of
      verminderd kunnen worden en wat de impact daarvan is op terugbetalers
      zelf, de kosten voor OCW en de uitvoeringslast bij DUO.
    titel_intern: Terugbetaalregimes studieschuld
    samenvatting_intern: >-
      De vier terugbetaalregimes voor studieschulden (SF15-oud, SF15-nieuw,
      SF15-LLLK en SF35), met een burgerview, de scenario's en een
      beleidsmakersview die varianten naast elkaar doorrekent.
    soort: statisch
    bron: poc-terugbetaalregimes
    corpus:
      - corpus-poc/terugbetaalregimes
    assistent: true
    tags: [OCW, DUO, studiefinanciering]
    status: in-ontwikkeling
    voorbehoud: >-
      De regimes zijn uitgewerkt voor een sessie met OCW en DUO en op die
      onderdelen nagelopen; daarbuiten is de uitwerking niet getoetst.
      Bedragen en uitkomsten zijn illustratief en gelden voor niemand.

  - slug: nieuwkomersbekostiging
    titel: RegelRecht en OCW/DUO II
    samenvatting: >-
      Nieuwkomers bekostiging: zou de regeling zoals die wordt uitgevoerd in het
      voortgezet onderwijs ook kunnen worden uitgevoerd in het primair
      onderwijs? En wat is de verwachte impact daarvan op scholen, DUO en OCW?
    titel_intern: Aanvullende bekostiging nieuwkomers
    samenvatting_intern: >-
      Aanvullende bekostiging voor nieuwkomers in het po en vo (maatregel 1 uit
      de DUO-knelpuntenbrief 2025), met varianten, een populatiesimulatie en een
      uitvoeringslastmodel.
    soort: statisch
    bron: poc-nieuwkomersbekostiging
    corpus:
      - corpus-poc/nieuwkomersbekostiging
    assistent: true
    tags: [OCW, DUO, bekostiging]
    status: verkenning
    voorbehoud: >-
      Een verkenning van maatregel 1 uit de knelpunten brief + simulaties van
      nieuwe varianten. Informatie is niet gevalideerd op juridische juistheid
      en is enkel bedoeld om de mogelijkheden te verkennen van AI tijdens een
      multidisciplinaire samenwerking.

  - slug: napp
    titel: Een uitvoeringsketen uit de regelgeving
    samenvatting: >-
      Een verkenning van een subsidieproces van aanvraag tot bezwaar, om te zien
      of een uitvoeringsketen rechtstreeks uit de regelgeving kan draaien.
    titel_intern: Nederlandse autoriteit politieke partijen (Napp)
    samenvatting_intern: >-
      Het subsidieproces uit het wetsvoorstel Wet op de politieke partijen,
      end-to-end uitgevoerd door de engine: aanvragen, besluiten,
      betaalopdrachten, bezwaar en een openbaar register.
    soort: proxy
    upstream: napp
    corpus:
      - corpus-poc/napp
    assistent: false
    tags: [BZK, Wpp, subsidie, AWB]
    status: verkenning
    voorbehoud: >-
      De Napp bestaat niet en de Wet op de politieke partijen is een
      wetsvoorstel; de wettekst hier is een uitvoerbare reconstructie, geen
      geldend recht. Partijen, aanvragen en besluiten zijn verzonnen.

  - slug: chronolexografie
    titel: Een uitvoeringsproces dat zichzelf terugleest
    samenvatting: >-
      Een verkenning van een aanvraag, het besluit erop en het bezwaar
      ertegen, om te zien hoe een uitvoerder vastlegt wat er gebeurde en dat
      bij een volgend besluit weer terugleest. Je kiest een van twee
      processen om na te spelen.
    titel_intern: Chronolexografie in twee casussen
    samenvatting_intern: >-
      Een uitvoeringsproces bij een fictieve uitvoerder, uitgevoerd door de
      cel uit packages/cel: aanvraag met de Awb-haken, besluit met het
      waarom, bezwaar en heroverweging (Awb 7:11), de kroniek en de reductie
      die de cel erover draait (RFC-045 tot en met RFC-050). De bezoeker
      kiest de casus: vakantieverlof (Leerplichtwet 1969 artikel 13a) bij een
      school, of de gehandicaptenparkeerkaart (BABW artikel 49) bij een
      gemeente. Een derde casus, een fictieve subsidie bij de Napp, komt
      uit de NAPP-bron (sources hieronder) en verschijnt alleen waar het
      portaal die bron kan ophalen. Per casus noemt de app de cel en het
      artikel; de rest leidt zij zo veel mogelijk af uit de wet.
    soort: statisch
    bron: poc-chronolexografie
    # De bundel die de app in de browser draait: de casussen, en per casus
    # de regelwerken die haar cel draait en de cellen zelf. Volgt uit de
    # casussen en de wet; de test the_register_lists_what_every_case_needs
    # in packages/poc-chronolexografie/src/bundel.rs houdt deze lijst gelijk.
    corpus:
      - corpus/cells/cbr
      - corpus/cells/gemeente_oostmeer
      - corpus/cells/gemeente_wilgendaal
      - corpus/cells/ggd_wilgendaal
      - corpus/cells/obs_de_klimop
      - corpus/regulation/nl/amvb/besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw
      - corpus/regulation/nl/ministeriele_regeling/regeling_gehandicaptenparkeerkaart
      - corpus/regulation/nl/ministeriele_regeling/regeling_vaststelling_schoolvakanties_20252030
      - corpus/regulation/nl/uitvoeringsbeleid/fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal
      - corpus/regulation/nl/uitvoeringsbeleid/fictief_beleid_schooljaar_obs_de_klimop
      - corpus/regulation/nl/uitvoeringsbeleid/fictief_beleid_schooljaargrenzen_obs_de_klimop
      - corpus/regulation/nl/uitvoeringsbeleid/fictief_beleid_vakantierooster_obs_de_klimop
      - corpus/regulation/nl/uitvoeringsbeleid/fictief_beleid_vestiging_obs_de_klimop
      - corpus/regulation/nl/wet/algemene_wet_bestuursrecht
      - corpus/regulation/nl/wet/leerplichtwet_1969
      - packages/poc-chronolexografie/casussen
    # De NAPP-casus staat met haar regeling en cel in deze bron, niet in
    # deze repository; zij draait op de bron en het regelrecht-corpus
    # hierboven (src/bundel.rs, met_bronnen).
    sources:
      - name: napp
        github:
          owner: NederlandseDigitaleDienst
          repo: regelrecht-corpus-NAPP
          branch: poc/chronolexografie
          path: chronolexografie
        token_env: NAPP_CORPUS_TOKEN
    assistent: false
    tags: [Leerplichtwet, BABW, AWB, chronolexografie]
    status: verkenning
    voorbehoud: >-
      De school, de gemeente, hun beleid en alle gegevens zijn verzonnen. De
      modellen van artikel 13a van de Leerplichtwet 1969 en artikel 49 van het
      BABW zijn niet met juristen of uitvoerders nagelopen. Het spel draait
      in je eigen browser: elk tabblad speelt zijn eigen casus, en wat je
      vastlegt verdwijnt als je het tabblad sluit.
