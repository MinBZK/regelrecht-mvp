[package]
name = "regelrecht-poc-vakantieverlof"
version = "0.1.0"
edition = "2021"
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "PoC: het proces van vakantieverlof (Leerplichtwet 1969 art. 13a) naspelen op de cel van een fictieve school"
license = "EUPL-1.2"
repository = "https://github.com/NederlandseDigitaleDienst/regelrecht"
publish = false

[[bin]]
name = "regelrecht-poc-vakantieverlof"
path = "src/main.rs"

[lib]
name = "regelrecht_poc_vakantieverlof"
path = "src/lib.rs"

[dependencies]
regelrecht-cel = { path = "../cel" }
regelrecht-engine = { path = "../engine" }
regelrecht-law-model = { path = "../law-model" }
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
