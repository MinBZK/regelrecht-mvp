---
# Casus: vakantieverlof bij een fictieve school.
#
# Configuratie is alleen wat niet uit de wet volgt. De regelwerken die de cel
# draait, het artikel van het bezwaar en de naam van wie beslist, leidt de app
# af uit dit artikel en de cel (src/casus.rs).
cel: obs_de_klimop
artikel: leerplichtwet_1969#13a
# De uitvoer die zegt of het besluit het gevraagde toewijst. De wet merkt die
# niet aan: decision_type TOEKENNING zegt wat voor besluit het is, niet welke
# van zijn uitvoer de toewijzing is.
uitkomst: verlof_verleend

# Wat de bezoeker leest.
titel: Vakantieverlof
omschrijving: >-
  Een ouder vraagt de school om verlof buiten de schoolvakanties
  (Leerplichtwet 1969 artikel 13a). Het hoofd beslist, en de school leest
  haar eigen besluiten terug om te weten of de jongere dit schooljaar al
  verlof kreeg. Of het verlof buiten de schoolvakanties valt, leest zij uit
  de regeling, uit haar eigen vakantierooster en uit wat zij zelf vastlegde:
  haar vestiging.
cel_naam: OBS De Klimop
speeldatum: 2026-10-14

# Fictieve voorbeeldgegevens, zodat je snel door het proces klikt. Een BSN
# uit de testreeks; vijf schooldagen, dus het oordeel van het hoofd over het
# beroep van de ouder beslist.
voorbeeld:
  aanvraag:
    bsn_jongere: '999990019'
    eerste_verlofdag: '2027-02-01'
    laatste_verlofdag: '2027-02-05'
    aanvraag_ondertekend: true
    naam_aanvrager: J. Jansen
    adres_aanvrager: Voorbeeldstraat 1
    dagtekening: '2026-10-12'
    gevraagde_beschikking: vakantieverlof
  bevindingen:
    specifieke_aard_beroep_ouder: true
  bezwaar:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: J. Jansen
    adres_indiener: Voorbeeldstraat 1
    omschrijving_bestreden_besluit: weigering vakantieverlof
    gronden_bezwaar_of_beroep: 'verklaring van de werkgever: geen verlof in de schoolvakanties'
  # Het beroepschrift (Awb 6:5): dezelfde velden als het bezwaarschrift.
  beroep:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: J. Jansen
    adres_indiener: Voorbeeldstraat 1
    omschrijving_bestreden_besluit: beslissing op bezwaar tegen de weigering van vakantieverlof
    gronden_bezwaar_of_beroep: de beslissing is niet deugdelijk gemotiveerd
  # Wat de rechter vindt (Awb 8:70 en 8:72): het beroep is gegrond, de
  # rechtsgevolgen blijven niet in stand, de rechter voorziet niet zelf in
  # de zaak en de school krijgt twee weken.
  uitspraak:
    indiener_is_belanghebbende: true
    rechtsregel_geschonden: true
    geschonden_rechtsregel: artikel 7:12, eerste lid, van de Algemene wet bestuursrecht
    rechtsgevolgen_in_stand: false
    uitspraak_treedt_in_de_plaats: false
    termijn_nieuw_besluit: '2027-01-25'

# Wat de school vastlegde vóór het eerste scenario (RFC-051), bij elke start
# en reset opnieuw, via de cel zoals elke stap. De regeling vaststelling
# schoolvakanties leidt de regio af uit de plaats van vestiging (art. 2): de
# vestiging is een executogram van het feit dat het fictieve beleid
# fictief_beleid_vestiging_obs_de_klimop vereist; geen artikel in het corpus
# vereist dat feit letterlijk. De herfst- en
# voorjaarsvakantie staan in het fictieve beleid van de school
# (fictief_beleid_vakantierooster_obs_de_klimop). Zo beantwoordt de cel
# verlof_valt_buiten_schoolvakanties zelf; 1 tot en met 5 februari en 10 tot
# en met 14 mei 2027 vallen buiten de vakanties van regio midden.
begin:
  datum: 2026-08-01
  executogrammen:
    - feit: fictief_beleid_vestiging_obs_de_klimop#1#vestiging
      velden:
        gemeente: Utrecht
        provincie: Utrecht
        sinds: '2020-08-01'

# De andere cellen van de sfeer (RFC-052).
andere_cellen:
  # De bestuursrechter (RFC-053): ook een andere cel, met een eigen kroniek.
  # Dat zij de rechter is, zegt haar cel.yaml (categorie "de
  # bestuursrechter", wie volgens Awb 8:70 beslist). Het artikel van het
  # beroep en het feit waarin de school de ontvangst van een uitspraak
  # vastlegt (Awb 8:79), leidt de app af uit de wet.
  - cel: rechtbank_wilgendaal
    cel_naam: Rechtbank Wilgendaal

# The app shows these scenarios step by step in a guide beside the page
# (frontend/src/scenarioGuides.js), which follows a scenario by its `naam`;
# change a name or a step in both places.
scenarios:
  - naam: Aanvraag wordt verleend
    stappen:
      - >-
        Aanvrager, speeldatum 14 oktober 2026: klik op Aanvraag indienen. De
        voorbeeldwaarden vragen verlof van 1 tot en met 5 februari 2027.
      - >-
        Bestuursorgaan: laat de bevinding aan staan en klik op Besluit nemen.
        Dat 1 tot en met 5 februari buiten de schoolvakanties valt, antwoordt
        de school zelf: haar voorjaarsvakantie begint op 20 februari.
    eind: >-
      Onder Besluiten staat Toegewezen. Bij Aanvrager staat de aanvraag op
      Toegewezen.
  - naam: 'Afwijzing, bezwaar en heroverweging: gegrond'
    stappen:
      - 'Aanvrager, speeldatum 14 oktober 2026: klik op Aanvraag indienen.'
      - >-
        Bestuursorgaan: zet "specifieke aard beroep ouder" uit. Het hoofd vindt
        het beroep niet bijzonder genoeg. Klik op Besluit nemen. Het verlof
        wordt geweigerd.
      - >-
        Aanvrager, speeldatum 1 november 2026: klik bij het besluit op Bezwaar
        maken. De gronden noemen een verklaring van de werkgever. Klik op
        Bezwaar indienen.
      - >-
        Bestuursorgaan, speeldatum 15 november 2026: klik op Ontvankelijkheid
        toetsen. Het bezwaar is ontvankelijk.
      - >-
        Kies bij "specifieke aard beroep ouder" Ja: het hoofd beoordeelt het
        beroep nu anders. Klik op Beslissen op bezwaar.
    eind: >-
      Gegrond: het besluit is herroepen. Er is een nieuw besluit, en dat
      verleent het verlof. In de Kroniek staan zes chronolexogrammen: de
      vestiging die de school vooraf vastlegde en vijf uit dit scenario.
  - naam: 'Afwijzing, bezwaar en heroverweging: ongegrond'
    stappen:
      - >-
        Aanvrager, speeldatum 14 oktober 2026: klik op Aanvraag indienen. Bestuursorgaan:
        klik op Besluit nemen. Het verlof wordt verleend.
      - >-
        Aanvrager: vul als eerste verlofdag 10 mei 2027 en als laatste
        verlofdag 14 mei 2027 in. Klik op Aanvraag indienen.
      - >-
        Bestuursorgaan: klik op Besluit nemen. Het verlof wordt geweigerd: de
        jongere kreeg dit schooljaar al verlof.
      - >-
        Aanvrager, speeldatum 1 november 2026: klik bij het tweede besluit op
        Bezwaar maken en dan op Bezwaar indienen.
      - >-
        Bestuursorgaan, speeldatum 15 november 2026: klik op Ontvankelijkheid
        toetsen. Laat de bevinding staan en klik op Beslissen op bezwaar.
    eind: >-
      Ongegrond: de heroverweging geeft dezelfde uitkomst. Het besluit blijft,
      er komt geen nieuw besluit.
  - naam: 'Bezwaar te laat: niet-ontvankelijk'
    stappen:
      - >-
        Aanvrager, speeldatum 14 oktober 2026: klik op Aanvraag indienen. Bestuursorgaan:
        zet "specifieke aard beroep ouder" uit en klik op Besluit nemen.
      - >-
        Aanvrager, speeldatum 1 december 2026: de bezwaartermijn is voorbij.
        Klik op Bezwaar maken en dan op Bezwaar indienen.
      - 'Bestuursorgaan: klik op Ontvankelijkheid toetsen.'
    eind: >-
      Niet-ontvankelijk: het bezwaar kwam te laat. Er is geen heroverweging,
      dus geen vragen aan het hoofd. Na Beslissen op bezwaar blijft het
      besluit staan.
  - naam: Tweede bezwaar tegen een vervangen besluit
    stappen:
      - >-
        Aanvrager, speeldatum 14 oktober 2026: klik op Aanvraag indienen. Bestuursorgaan:
        klik op Besluit nemen. Het verlof wordt verleend.
      - >-
        Aanvrager, speeldatum 1 november 2026: maak bezwaar tegen het besluit.
        Speeldatum 2 november: maak nog een bezwaar tegen hetzelfde besluit.
      - >-
        Bestuursorgaan, speeldatum 15 november 2026: toets het eerste bezwaar.
        Kies bij "specifieke aard beroep ouder" Nee en beslis. Gegrond: een
        weigering komt in de plaats van het besluit.
      - >-
        Speeldatum 16 november 2026: toets het tweede bezwaar. Kies weer Nee en
        beslis.
    eind: >-
      De cel weigert deze stap: een besluit wordt maar één keer vervangen. De
      melding noemt het besluit dat het al vervangt; onder Details staat wat
      de cel zelf meldt. Er komt niets bij in de kroniek.
  - naam: Een herroepen verlof telt niet meer mee
    stappen:
      - >-
        Aanvrager, speeldatum 14 oktober 2026: klik op Aanvraag indienen (verlof A, 1 tot
        en met 5 februari 2027). Bestuursorgaan: klik op Besluit nemen. A wordt
        verleend.
      - >-
        Aanvrager: vul als eerste verlofdag 10 mei 2027 en als laatste
        verlofdag 14 mei 2027 in en klik op Aanvraag indienen (verlof B).
        Bestuursorgaan: klik op Besluit nemen. B wordt geweigerd: de school
        antwoordt uit haar kroniek dat de jongere dit schooljaar al verlof
        kreeg, namelijk A.
      - 'Aanvrager, speeldatum 1 november 2026: maak bezwaar tegen A.'
      - >-
        Bestuursorgaan, speeldatum 15 november 2026: toets dat bezwaar. Kies
        bij "specifieke aard beroep ouder" Nee en beslis. Gegrond: A is
        herroepen, een weigering komt in de plaats.
      - 'Aanvrager, speeldatum 20 november 2026: maak bezwaar tegen B.'
      - >-
        Bestuursorgaan, speeldatum 1 december 2026: toets dat bezwaar, laat de
        bevinding staan en beslis.
    eind: >-
      Gegrond: B is herroepen, en het nieuwe besluit verleent het verlof. Bij
      het besluit staat "verlof al verleend in schooljaar: nee", ingevuld door
      het beleid van het hoofd met het antwoord van de cel. Onder "Hoe de cel
      dit beantwoordde" staat A bij de herroepen besluiten, en het
      spoor laat zien dat het filter twee besluiten onder artikel 13a
      oversloeg. Dat zijn A en de weigering die ervoor in de plaats kwam.
  - naam: 'Verlof in de kerstvakantie: geweigerd zonder oordeel van het hoofd'
    stappen:
      - >-
        Aanvrager, speeldatum 14 oktober 2026: vul als eerste verlofdag 21
        december 2026 en als laatste verlofdag 23 december 2026 in. Klik op
        Aanvraag indienen.
      - >-
        Bestuursorgaan: het hoofd geeft alleen "specifieke aard beroep ouder".
        Laat die aan staan en klik op Besluit nemen.
    eind: >-
      Het verlof wordt geweigerd. Het hoofd oordeelde niet over de
      schoolvakanties: bij het besluit staat "verlof valt buiten
      schoolvakanties: nee", ingevuld door het beleid van het hoofd met het
      antwoord van de cel. Onder "Hoe de cel dit beantwoordde" staat dat haar
      reductie de regio Midden en de kerstvakantie van 19 december 2026 tot en
      met 3 januari 2027 uit de regeling las, en
      de herfst- en voorjaarsvakantie uit het beleid van de school. De
      regio volgt uit de plaats van vestiging, Utrecht, die de cel binnen die
      reductie zelf gaf; klik daar nog eens op "Hoe de cel dit
      beantwoordde" voor haar vestiging. In het Logboek staat het besluit met
      dezelfde keten, en onderaan het executogram van de vestiging.
  - naam: 'Verlof in een schooljaar dat de school nog niet kent: het hoofd oordeelt'
    stappen:
      - >-
        Aanvrager, speeldatum 14 oktober 2026: vul als eerste verlofdag 20
        december 2027 en als laatste verlofdag 22 december 2027 in. Klik op
        Aanvraag indienen.
      - >-
        Bestuursorgaan: het vakantierooster van de school reikt nog niet tot
        schooljaar 2027–2028, dus de school weet niet of het verlof buiten de
        schoolvakanties valt. De voorvertoning meldt dat, en het formulier
        vraagt het nu aan het hoofd. Kies bij "verlof valt buiten
        schoolvakanties" Nee en klik op Besluit nemen.
    eind: >-
      Het verlof wordt geweigerd. Bij het besluit staat "verlof valt buiten
      schoolvakanties: nee" als bevinding van het bestuursorgaan, niet als
      antwoord van de school.
  - naam: Bezwaar ongegrond, beroep gegrond, nieuw besluit op bezwaar
    stappen:
      - >-
        Aanvrager, speeldatum 14 oktober 2026: klik op Aanvraag indienen.
        Bestuursorgaan: zet "specifieke aard beroep ouder" uit en klik op
        Besluit nemen. Het verlof wordt geweigerd.
      - >-
        Aanvrager, speeldatum 1 november 2026: klik bij het besluit op Bezwaar
        maken en dan op Bezwaar indienen.
      - >-
        Bestuursorgaan, speeldatum 15 november 2026: klik op Ontvankelijkheid
        toetsen. Laat de bevinding staan en klik op Beslissen op bezwaar.
        Ongegrond: de weigering blijft.
      - >-
        Aanvrager, speeldatum 1 december 2026: klik bij de beslissing op
        bezwaar op Beroep instellen en dan op Beroepschrift indienen. De
        school maakt een afschrift van haar beslissing, en de rechtbank legt
        het beroep vast met wat zij ontving.
      - >-
        Andere cellen, Rechtbank Wilgendaal, speeldatum 11 januari 2027: de
        voorbeeldbevindingen zeggen
        dat de beslissing artikel 7:12, eerste lid, Awb schendt (geen
        deugdelijke motivering), dat de rechtsgevolgen niet in stand blijven
        en dat de school tot en met 25 januari 2027 heeft. Klik op Uitspraak
        doen en dan op Toezenden.
      - >-
        Bestuursorgaan, speeldatum 18 januari 2027: klik onder "Na een
        uitspraak" op Heroverwegen, kies bij "specifieke aard beroep ouder" Ja
        en klik op Opnieuw beslissen op bezwaar.
    eind: >-
      Gegrond: de weigering is herroepen, en het nieuwe besluit verleent het
      verlof van 1 tot en met 5 februari 2027, binnen de termijn van de
      rechter. De Kroniek toont twee kronieken. In die van de school staan de
      ontvangst van de uitspraak, ontvangen van de rechtbank, en twee
      beslissingen op hetzelfde bezwaar; de tweede is genomen na die
      ontvangst. In die van de rechtbank staan het beroep, met het afschrift
      dat zij van de school ontving, en de uitspraak.
