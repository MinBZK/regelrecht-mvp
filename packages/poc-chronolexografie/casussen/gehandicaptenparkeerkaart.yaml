---
# Casus: de gehandicaptenparkeerkaart bij een fictieve gemeente.
#
# Configuratie is alleen wat niet uit de wet volgt. De regelwerken die de cel
# draait, het artikel van het bezwaar en de naam van wie beslist, leidt de app
# af uit dit artikel en de cel (src/casus.rs).
cel: gemeente_wilgendaal
artikel: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49
# De uitvoer die zegt of het besluit het gevraagde toewijst. De wet merkt die
# niet aan: decision_type TOEKENNING zegt wat voor besluit het is, niet welke
# van zijn uitvoer de toewijzing is, en de kaart vermeldt ook nog of zij voor
# een bestuurder of een passagier is.
uitkomst: gehandicaptenparkeerkaart_verstrekt

# Wat de bezoeker leest.
titel: Gehandicaptenparkeerkaart
omschrijving: >-
  Iemand met een loopbeperking vraagt de gemeente om een
  gehandicaptenparkeerkaart (BABW artikel 49). Het college beslist na een
  geneeskundig onderzoek door de GGD. Of het onderzoek plaatsvond en wat het
  advies van de GGD per criterium zegt, vraagt de gemeente aan de GGD; of de
  aanvrager eerder een kaart kreeg, aan elke instantie die kaarten verstrekt:
  zijzelf, een andere gemeente en het CBR. Elke cel antwoordt uit haar eigen
  kroniek (synthese, RFC-048). Het advies staat in fictief beleid van de
  gemeente: het college oordeelt zoals het advies, en zonder advies zelf.
cel_naam: gemeente Wilgendaal
speeldatum: 2026-10-13

# Fictieve voorbeeldgegevens, zodat je snel door het proces klikt. Een BSN
# uit de testreeks; een kaart als bestuurder. De vier criteria vult het
# beleid uit het advies van de GGD; het formulier vraagt ze alleen zonder
# advies, en dan is het voorbeeld alleen een langdurige loopbeperking. Het
# college laat het onderzoek niet achterwege (Regeling
# gehandicaptenparkeerkaart, artikel 2, tweede lid): die drie bevindingen
# staan uit.
voorbeeld:
  aanvraag:
    bsn_aanvrager: '999990020'
    kaart_als_bestuurder: true
    kaart_als_passagier: false
    aanvraag_ondertekend: true
    naam_aanvrager: A. de Vries
    adres_aanvrager: Voorbeeldlaan 2
    dagtekening: '2026-10-05'
    gevraagde_beschikking: gehandicaptenparkeerkaart
  bevindingen:
    langdurige_loopbeperking: true
    continu_afhankelijk_van_hulp_bestuurder: false
    permanent_rolstoelgebonden: false
    ernstige_beperkingen_andere_dan_loopbeperkingen: false
    geneeskundig_onderzoek_achterwege_gelaten: false
    bekend_dat_aanvrager_nog_steeds_voldoet: false
    keurende_instantie_oordeelt_dat_aanvrager_nog_steeds_voldoet: false
  bezwaar:
    bezwaar_of_beroepschrift_ondertekend: true
    naam_indiener: A. de Vries
    adres_indiener: Voorbeeldlaan 2
    omschrijving_bestreden_besluit: besluit op de aanvraag om een gehandicaptenparkeerkaart
    gronden_bezwaar_of_beroep: ik kan niet verder lopen dan vijftig meter

# De andere cellen van de sfeer (RFC-052). Het open begrip zegt wie bevoegd
# is: de GGD of de aangewezen deskundige voor het onderzoek (Regeling
# gehandicaptenparkeerkaart, artikel 3), het college van elke gemeente en het
# CBR voor een eerdere kaart (artikel 2, tweede lid, van de regeling). De engine vraagt alleen een
# cel die het begrip noemt. Elke cel legt bij
# elke start en reset opnieuw vast wat zij vóór het eerste scenario wist, via
# de cel zoals elke stap.
#
# - De GGD onderzocht de voorbeeldaanvrager op 9 oktober, na de dagtekening
#   van de voorbeeldaanvraag (5 oktober), dus het onderzoek telt voor die
#   aanvraag. Een executogram van het feit dat artikel 3 vereist; dat
#   artikel zegt ook wat het bevat. Dezelfde dag bracht zij haar advies uit:
#   een langdurige loopbeperking, verder niets (het feit dat artikel 5 van
#   het fictieve beleid van Wilgendaal vereist).
# - Een tweede aanvrager (BSN 999990068) onderzocht zij ook op 9 oktober;
#   haar advies vindt geen enkel criterium.
# - Oostmeer (fictief) en het CBR verstrekten in 2026 een kaart aan een
#   andere aanvrager. Eerder kan niet: het BABW staat hier vanaf 1 januari
#   2026 in het corpus. Eigen keuze: beide beslissen op het model van
#   artikel 49, eerste lid, en het fictieve beleid van Wilgendaal geldt ook
#   voor hen (het is ongescoped); daarom geven zij hier ook de bevinding of
#   de aanvrager al een geldige kaart heeft. Het derde lid (het CBR, voor
#   wie geen ingezetene is) is niet gemodelleerd: het CBR beslist hier op
#   het model van het eerste lid.
andere_cellen:
  - cel: ggd_wilgendaal
    cel_naam: GGD Wilgendaal
    begin:
      datum: 2026-10-09
      executogrammen:
        - feit: regeling_gehandicaptenparkeerkaart#3#geneeskundig_onderzoek_verricht
          velden:
            bsn_aanvrager: '999990020'
            datum_onderzoek: '2026-10-09'
            verricht_door: Gemeentelijke Gezondheidsdienst
        - feit: fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#5#geneeskundig_advies_uitgebracht
          velden:
            bsn_aanvrager: '999990020'
            datum_onderzoek: '2026-10-09'
            langdurige_loopbeperking: true
            continu_afhankelijk_van_hulp_bestuurder: false
            permanent_rolstoelgebonden: false
            ernstige_beperkingen_andere_dan_loopbeperkingen: false
        - feit: regeling_gehandicaptenparkeerkaart#3#geneeskundig_onderzoek_verricht
          velden:
            bsn_aanvrager: '999990068'
            datum_onderzoek: '2026-10-09'
            verricht_door: Gemeentelijke Gezondheidsdienst
        - feit: fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal#5#geneeskundig_advies_uitgebracht
          velden:
            bsn_aanvrager: '999990068'
            datum_onderzoek: '2026-10-09'
            langdurige_loopbeperking: false
            continu_afhankelijk_van_hulp_bestuurder: false
            permanent_rolstoelgebonden: false
            ernstige_beperkingen_andere_dan_loopbeperkingen: false
  - cel: gemeente_oostmeer
    cel_naam: gemeente Oostmeer
    begin:
      datum: 2026-01-15
      aanvragen:
        - datum: 2026-01-15
          velden:
            bsn_aanvrager: '999990044'
            kaart_als_bestuurder: true
            kaart_als_passagier: false
            aanvraag_ondertekend: true
            naam_aanvrager: B. Jansen
            adres_aanvrager: Voorbeeldstraat 4
            dagtekening: '2026-01-10'
            gevraagde_beschikking: gehandicaptenparkeerkaart
          bevindingen:
            langdurige_loopbeperking: true
            continu_afhankelijk_van_hulp_bestuurder: false
            permanent_rolstoelgebonden: false
            ernstige_beperkingen_andere_dan_loopbeperkingen: false
            geneeskundig_onderzoek_achterwege_gelaten: false
            bekend_dat_aanvrager_nog_steeds_voldoet: false
            keurende_instantie_oordeelt_dat_aanvrager_nog_steeds_voldoet: false
            geneeskundig_onderzoek_heeft_plaatsgehad: true
            aanvrager_heeft_geldige_gehandicaptenparkeerkaart: false
  - cel: cbr
    cel_naam: CBR
    begin:
      datum: 2026-02-02
      aanvragen:
        - datum: 2026-02-02
          velden:
            bsn_aanvrager: '999990056'
            kaart_als_bestuurder: true
            kaart_als_passagier: false
            aanvraag_ondertekend: true
            naam_aanvrager: C. Smit
            adres_aanvrager: Voorbeeldstraat 6
            dagtekening: '2026-01-28'
            gevraagde_beschikking: gehandicaptenparkeerkaart
          bevindingen:
            langdurige_loopbeperking: true
            continu_afhankelijk_van_hulp_bestuurder: false
            permanent_rolstoelgebonden: false
            ernstige_beperkingen_andere_dan_loopbeperkingen: false
            geneeskundig_onderzoek_achterwege_gelaten: false
            bekend_dat_aanvrager_nog_steeds_voldoet: false
            keurende_instantie_oordeelt_dat_aanvrager_nog_steeds_voldoet: false
            geneeskundig_onderzoek_heeft_plaatsgehad: true
            aanvrager_heeft_geldige_gehandicaptenparkeerkaart: false

scenarios:
  - naam: De kaart wordt verstrekt op het advies van de GGD
    stappen:
      - >-
        Aanvrager, speeldatum 13 oktober 2026: klik op Aanvraag indienen. De
        voorbeeldwaarden vragen een kaart als bestuurder.
      - >-
        Bestuursorgaan, speeldatum 20 oktober 2026: het formulier vraagt de
        vier criteria niet, want het advies van de GGD geeft ze. Klik op
        Besluit nemen.
    eind: >-
      Onder Besluiten staat Toegewezen: de kaart is verstrekt en vermeldt de
      bestuurder. Ze is geldig tot en met 19 oktober 2031, vijf jaar vanaf de
      dag van het besluit (BABW artikel 51). Bij het besluit staat
      "langdurige loopbeperking: ja", ingevuld door het fictieve beleid van
      Wilgendaal (artikel 6) uit het advies. In het Logboek staat dat de GGD
      Wilgendaal het advies gaf en antwoordde dat het onderzoek plaatsvond:
      de gemeente vroeg het aan de cel die de wet en het beleid daarvoor
      bevoegd maken. Het onderzoek en het advies staan in de kroniek van de
      GGD, onder Andere cellen.
  - naam: Het advies vindt geen criterium
    stappen:
      - >-
        Aanvrager, speeldatum 13 oktober 2026: verander het BSN in 999990068
        en klik op Aanvraag indienen. De GGD onderzocht deze aanvrager op 9
        oktober en vond geen enkel criterium.
      - 'Bestuursorgaan, speeldatum 20 oktober 2026: klik op Besluit nemen.'
    eind: >-
      Afgewezen. Het college oordeelt zoals het advies (artikel 6 van het
      fictieve beleid), en kan daar niet van afwijken: een beleid dat een
      begrip invult gaat voor een oordeel van het college (RFC-045). Of het
      college per geval van zijn beleid mag afwijken (Awb 4:84), is niet
      gebouwd. Bij het besluit staat geen antwoord over een eerdere kaart:
      artikel 49 leest het beleid over een tweede kaart alleen voor een
      aanvrager die aan een criterium voldoet.
  - naam: Een tweede kaart naast een geldige
    stappen:
      - >-
        Aanvrager, speeldatum 13 oktober 2026: klik op Aanvraag indienen. Bestuursorgaan,
        speeldatum 20 oktober 2026: klik op Besluit nemen. De kaart wordt
        verstrekt.
      - 'Aanvrager, speeldatum 1 maart 2027: klik nog een keer op Aanvraag indienen.'
      - >-
        Bestuursorgaan: klik op Besluit nemen. Afgewezen: het beleid van de
        gemeente geeft geen tweede kaart naast een geldige.
    eind: >-
      Bij het besluit staat "aanvrager heeft geldige gehandicaptenparkeerkaart:
      ja", ingevuld door het beleid van Wilgendaal met het antwoord van de cel. Onder "Hoe de cel dit
      beantwoordde" staat het spoor van haar reductie, met het eerste besluit.
      In het Logboek staat bij het tweede besluit de keten: artikel 49, het
      beleid van Wilgendaal en het begrip dat de cel beantwoordde.
  - naam: Ongegrond bezwaar tegen een verstrekking
    stappen:
      - >-
        Aanvrager, speeldatum 13 oktober 2026: klik op Aanvraag indienen. Bestuursorgaan,
        speeldatum 20 oktober 2026: klik op Besluit nemen. De kaart is geldig
        tot en met 19 oktober 2031.
      - >-
        Aanvrager, speeldatum 1 november 2026: klik bij het besluit op Bezwaar
        maken en dan op Bezwaar indienen.
      - >-
        Bestuursorgaan, speeldatum 20 november 2026: klik op Ontvankelijkheid
        toetsen. Laat alle bevindingen staan en klik op Beslissen op bezwaar.
    eind: >-
      Ongegrond: de heroverweging geeft dezelfde uitkomst, en het besluit
      blijft geldig tot en met 19 oktober 2031. Opnieuw beslist zou de kaart
      later aflopen, maar de einddatum is afgeleid en geen uitkomst. Bij de
      heroverweging laat de cel het bestreden besluit buiten beschouwing,
      zodat de kaart niet wordt geweigerd vanwege zichzelf. De vier criteria
      vraagt de heroverweging niet: het advies gaf ze, en dat geldt nog.
  - naam: Gegrond bezwaar na een nieuw advies
    stappen:
      - >-
        Aanvrager, speeldatum 13 oktober 2026: verander het BSN in 999990068
        en klik op Aanvraag indienen. Bestuursorgaan, speeldatum 20 oktober
        2026: klik op Besluit nemen. Het advies vindt geen criterium, en de
        kaart wordt geweigerd.
      - >-
        Aanvrager, speeldatum 1 november 2026: klik bij het besluit op Bezwaar
        maken en dan op Bezwaar indienen.
      - >-
        Andere cellen, speeldatum 10 november 2026: de GGD brengt een nieuw
        advies uit. Leg bij de GGD een geneeskundig advies vast voor BSN
        999990068, met datum onderzoek 10 november 2026 en alleen een
        langdurige loopbeperking.
      - >-
        Bestuursorgaan, speeldatum 20 november 2026: klik op Ontvankelijkheid
        toetsen en dan op Beslissen op bezwaar.
    eind: >-
      Gegrond: de weigering is herroepen. Bij de heroverweging telt het
      advies van het laatste onderzoek voor de aanvraag (artikel 5, derde
      lid, van het fictieve beleid), dat van 10 november. Het nieuwe besluit verstrekt de
      kaart, geldig tot en met 19 november 2031, vijf jaar vanaf dat nieuwe
      besluit. Een andere bevinding van het college over de loopbeperking
      had niets veranderd: het advies gaat voor.
  - naam: Zonder advies oordeelt het college, en zonder onderzoek nog geen kaart
    stappen:
      - >-
        Aanvrager, speeldatum 13 oktober 2026: verander het BSN in 999990032
        en klik op Aanvraag indienen. Deze aanvrager heeft de GGD niet
        onderzocht.
      - >-
        Bestuursorgaan, speeldatum 20 oktober 2026: er is geen advies, dus het
        beleid zwijgt en het formulier vraagt de vier criteria een voor een
        aan het college (artikel 6, tweede lid, van het fictieve beleid). Kies
        bij "langdurige loopbeperking" Ja en bij de andere drie Nee. Dan
        vraagt het ook "geneeskundig onderzoek heeft plaatsgehad",
        want de GGD zwijgt ook daarover. Laat dat op "Nog niet beoordeeld" en
        klik op Besluit nemen.
    eind: >-
      Er komt geen besluit, maar een melding: het college heeft niet
      beoordeeld of het geneeskundig onderzoek plaatsvond. De kaart "wordt
      niet afgegeven alvorens een geneeskundig onderzoek heeft plaatsgehad"
      (Regeling gehandicaptenparkeerkaart, artikel 2, eerste lid); dat is geen
      grond om te weigeren, dus het college wacht. De kroniek blijft zoals zij
      was. Kiest het college Ja, dan stelt het zelf vast dat het onderzoek
      plaatsvond en volgt de kaart; kiest het Nee, dan weigert het (eigen
      keuze). Of: onder Andere cellen legt de GGD het onderzoek vast (BSN
      999990032, een dag op of na de dagtekening), en dan volgt de kaart
      zonder vaststelling van het college.
  - naam: Een nieuwe kaart zonder nieuw onderzoek
    stappen:
      - 'Aanvrager, speeldatum 13 oktober 2026: klik op Aanvraag indienen.'
      - >-
        Bestuursorgaan, speeldatum 20 oktober 2026: klik op Besluit nemen. De
        kaart is geldig tot en met 19 oktober 2031.
      - >-
        Aanvrager, speeldatum 20 oktober 2031: zet de dagtekening op 20
        oktober 2031 en klik op Aanvraag indienen. Het onderzoek en het advies
        van 2026 tellen niet voor deze aanvraag.
      - >-
        Bestuursorgaan: er is geen advies voor deze aanvraag, dus het
        college oordeelt over de vier criteria: Ja bij "langdurige
        loopbeperking", Nee bij de andere drie. Zet "geneeskundig onderzoek
        achterwege gelaten" en "bekend dat aanvrager nog steeds voldoet" aan,
        en klik op Besluit nemen.
    eind: >-
      Toegewezen, zonder nieuw onderzoek (Regeling gehandicaptenparkeerkaart,
      artikel 2, tweede lid, onder a). Bij het besluit staat "aanvrager eerder
      gehandicaptenparkeerkaart verstrekt: ja", ingevuld door het beleid van
      Wilgendaal met het antwoord van de cel. Laat je ze uit, dan volgt de melding van het vorige scenario.
  - naam: Een kaart van een andere gemeente telt mee
    stappen:
      - >-
        Aanvrager, speeldatum 13 oktober 2026: verander het BSN in 999990044
        en klik op Aanvraag indienen. Deze aanvrager kreeg in januari 2026 een
        kaart van de (fictieve) gemeente Oostmeer en woont nu in Wilgendaal.
      - >-
        Bestuursorgaan, speeldatum 20 oktober 2026: er is geen advies, dus
        het college oordeelt over de vier criteria: Ja bij "langdurige
        loopbeperking", Nee bij de andere drie. Zet "geneeskundig onderzoek
        achterwege gelaten" en "bekend dat aanvrager nog steeds voldoet" aan,
        en klik op Besluit nemen.
    eind: >-
      Toegewezen, zonder onderzoek (Regeling gehandicaptenparkeerkaart,
      artikel 2, tweede lid, onder a). Wilgendaal kent die eerdere kaart niet,
      maar vroeg elke verstrekkende instantie die de wet noemt (Regeling
      gehandicaptenparkeerkaart, artikel 2, tweede lid): het CBR en Wilgendaal zelf zwegen, Oostmeer antwoordde ja.
      Het Logboek noemt bij het begrip de gemeente Oostmeer.
  - naam: Een kaart van het CBR telt ook
    stappen:
      - >-
        Aanvrager, speeldatum 13 oktober 2026: verander het BSN in 999990056
        en klik op Aanvraag indienen. Het CBR gaf deze aanvrager in februari
        2026 een kaart.
      - >-
        Bestuursorgaan, speeldatum 20 oktober 2026: geef de vier criteria
        zoals hierboven, zet "geneeskundig onderzoek achterwege gelaten" en
        "bekend dat aanvrager nog steeds voldoet" aan, en klik op Besluit
        nemen.
    eind: >-
      Toegewezen. Bij het begrip staat nu het CBR als de cel die antwoordde.
  - naam: Twee uitgevers, één antwoord
    stappen:
      - Speel eerst "Een kaart van een andere gemeente telt mee".
      - >-
        Aanvrager, speeldatum 20 oktober 2031, als de kaart van Wilgendaal is
        verlopen: BSN 999990044, dagtekening 20 oktober 2031, klik op Aanvraag
        indienen.
      - >-
        Bestuursorgaan: geef de vier criteria (Ja bij "langdurige
        loopbeperking", Nee bij de andere drie), zet "geneeskundig
        onderzoek achterwege gelaten" en "bekend dat aanvrager nog steeds
        voldoet" aan, en klik op Besluit nemen.
    eind: >-
      Toegewezen. Nu antwoordden twee cellen ja: Oostmeer en Wilgendaal. De
      wet zegt hoe hun antwoorden één waarde worden: eerder een kaart
      verstrekt is waar als één verstrekkende instantie het zegt (combine:
      OR op artikel 2 van de regeling). Het Logboek noemt beide.
