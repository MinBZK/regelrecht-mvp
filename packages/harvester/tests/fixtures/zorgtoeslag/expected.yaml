preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat personen voor wie de premie voor een
    zorgverzekering in verhouding tot hun inkomen een te zware last vormt, een financiële tegemoetkoming kunnen
    krijgen;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018451/2025-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt, tenzij anders is geregeld, verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. zorgverzekering: de schadeverzekering, bedoeld in [artikel 1, onder d, van de Zorgverzekeringswet][ref1];

      c. verzekerde: de persoon, bedoeld in [artikel 1, onder f, van de Zorgverzekeringswet][ref2], de persoon
      die een bijdrage als bedoeld in [artikel 68b, vijfde lid, van de Zorgverzekeringswet][ref3] verschuldigd is,
      of de persoon, bedoeld in [artikel 69 van de Zorgverzekeringswet][ref4], steeds vanaf de eerste dag van de
      kalendermaand volgende op de maand waarin hij achttien jaar wordt, met uitzondering van de verzekerde, bedoeld in
      [artikel 24, eerste of derde lid, van die wet][ref5];

      d. premie: een premie als bedoeld in [afdeling 3.3.1 van de Zorgverzekeringswet][ref6];

      e. zorgtoeslag: een tegemoetkoming in een premie dan wel in een bestuursrechtelijke premie als bedoeld in
      [artikel 18d][ref7] of [18e van de Zorgverzekeringswet][ref8] en in het verplicht eigen risico, bedoeld in
      [artikel 19 van de Zorgverzekeringswet][ref9];

      f. drempelinkomen: 108% van het twaalfvoud van het voor de maand januari van het berekeningsjaar geldende in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref10] bedoelde bedrag per
      maand;

      g. de standaardpremie: het op grond van [artikel 4][ref11] vastgestelde bedrag;

      h. de normpremie: de aan de hand van het drempelinkomen en het toetsingsinkomen van de verzekerde berekende premie
      voor een zorgverzekering in het berekeningsjaar.

      2 De hoogte van de zorgtoeslag is afhankelijk van de draagkracht op basis van het inkomen en het vermogen.


