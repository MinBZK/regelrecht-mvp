---
# Tier C: a reduction (schema v0.8.2, RFC-048): no regulation, but a cell's
# reading of its own chronicle. It reads the decisions taken under an article
# with `source.decisions`, which only a reduction may do.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.3/schema/v0.8.3/schema.json
$id: test_conformance_reduction
regulatory_layer: REDUCTIE
publication_date: '2026-10-14'
valid_from: '2026-10-14'
name: Testreductie verleende verloven
url: https://example.invalid/reduction
articles:
  - number: '1'
    url: https://example.invalid/reduction/1
    text: De verleende verloven zijn de besluiten waarin verlof is verleend.
    machine_readable:
      execution:
        input:
          - name: besluiten
            type: array
            source:
              decisions: test_conformance_produces_list#1
              description: De besluiten van het hoofd onder artikel 1.
        output:
          - name: verleende_verloven
            type: array
        actions:
          - output: verleende_verloven
            value:
              operation: FOREACH
              collection: $besluiten
              as: besluit
              filter:
                operation: EQUALS
                subject: $besluit.verlof_verleend
                value: true
              body: $besluit
