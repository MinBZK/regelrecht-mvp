---
# A reduction that fills an open term: schema v0.8.5 to v0.8.8 allow it
# (RFC-048), v0.8.9 forbids it again, since a cell gives its reduction as a
# named answer that a policy binds to the term. The engine still loads such
# a file and gives the declaration no meaning.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.8/schema/v0.8.8/schema.json
$id: test_conformance_reduction_implements
regulatory_layer: REDUCTIE
publication_date: '2026-10-16'
valid_from: '2026-10-16'
name: Testreductie eerder verleend verlof
url: https://example.invalid/reduction-implements
articles:
  - number: '1'
    url: https://example.invalid/reduction-implements/1
    text: Er is al verlof verleend als een besluit verlof verleende.
    machine_readable:
      implements:
        - law: test_conformance_produces_list
          article: '1'
          open_term: al_verleend
      execution:
        input:
          - name: besluiten
            type: array
            source:
              decisions: test_conformance_produces_list#1
              description: De besluiten van het hoofd onder artikel 1.
        output:
          - name: al_verleend
            type: boolean
        actions:
          - output: al_verleend
            value:
              operation: FOREACH
              collection: $besluiten
              as: besluit
              filter:
                operation: EQUALS
                subject: $besluit.verlof_verleend
                value: true
              body: true
              combine: OR
