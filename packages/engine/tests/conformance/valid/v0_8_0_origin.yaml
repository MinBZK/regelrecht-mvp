---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: test_conformance_origin
regulatory_layer: MINISTERIELE_REGELING
publication_date: '2026-10-13'
valid_from: '2026-10-13'
bwb_id: BWBR0099996
name: Testregeling herkomst van parameters
url: https://example.invalid/law
articles:
  - number: '1'
    text: Elke parameter zegt wie hem aanlevert (RFC-048).
    url: https://example.invalid/law/artikel/1
    machine_readable:
      execution:
        parameters:
          - name: eerste_verlofdag
            type: date
            origin:
              waarde: BELANGHEBBENDE
              grondslag: test_conformance_origin#1
          - name: datum_ontvangst
            type: date
            origin:
              waarde: DOSSIER
          - name: geboortedatum
            type: date
            origin:
              waarde: REGISTER
              register: wet_basisregistratie_personen
          - name: ingelogd_als_ouder
            type: boolean
            origin:
              waarde: KANAAL
          - name: beroep_verhindert_vakantie
            type: boolean
            origin:
              waarde: OORDEEL
              grondslag: test_conformance_origin#1 lid 2
        output:
          - name: verlof_mogelijk
            type: boolean
        actions:
          - output: verlof_mogelijk
            value: $beroep_verhindert_vakantie
