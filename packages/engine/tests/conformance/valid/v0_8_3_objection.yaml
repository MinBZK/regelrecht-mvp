---
# Tier C: an objection as a kind of submission (schema v0.8.3, RFC-045). The
# article that decides on the objection establishes it, as a list item of
# type BEZWAAR, and a hook applies to every objection.
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.9/schema/v0.8.9/schema.json
$id: test_conformance_objection
regulatory_layer: WET
publication_date: '2026-10-14'
valid_from: '2026-10-14'
bwb_id: BWBR0099993
name: Testwet bezwaar
url: https://example.invalid/objection
articles:
  - number: '1'
    url: https://example.invalid/objection/1
    text: Het bestuursorgaan beslist op het bezwaar.
    machine_readable:
      execution:
        produces:
          - type: BEZWAAR
            requests: test_conformance_objection#1
          - type: BESCHIKKING
            outputs:
              - bestreden_besluit_herroepen
        output:
          - name: bestreden_besluit_herroepen
            type: boolean
        actions:
          - output: bestreden_besluit_herroepen
            value: false
  - number: '2'
    url: https://example.invalid/objection/2
    text: Het bezwaarschrift wordt ondertekend.
    machine_readable:
      hooks:
        - hook_point: pre_actions
          applies_to:
            submission: BEZWAAR
      execution:
        parameters:
          - name: ondertekend
            type: boolean
        output:
          - name: bezwaarschrift_ondertekend
            type: boolean
        actions:
          - output: bezwaarschrift_ondertekend
            value: $ondertekend
