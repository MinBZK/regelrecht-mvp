# A REDUCTIE is no regulation and hooks onto nothing (schema v0.8.2, RFC-048).
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.2/schema/v0.8.2/schema.json
$id: test_conformance_reduction_with_hooks
regulatory_layer: REDUCTIE
publication_date: '2026-10-14'
valid_from: '2026-10-14'
url: https://example.invalid/reduction
articles:
  - number: '1'
    text: De verleende verloven zijn de besluiten waarin verlof is verleend.
    url: https://example.invalid/reduction/1
    machine_readable:
      hooks:
        - hook_point: pre_actions
          applies_to:
            legal_character: BESCHIKKING
      execution:
        input:
          - name: besluiten
            type: array
            source:
              decisions: wet_fictief#1
        output:
          - name: verleende_verloven
            type: array
        actions:
          - output: verleende_verloven
            value: $besluiten
