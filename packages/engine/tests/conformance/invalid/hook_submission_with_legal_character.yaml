$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.0/schema/v0.8.0/schema.json
$id: test_conformance_hook_submission_with_legal_character
regulatory_layer: UITVOERINGSBELEID
publication_date: '2026-10-13'
valid_from: '2026-10-13'
url: https://example.invalid/law
articles:
  - number: '1'
    text: >-
      A hook applies to a decision (`legal_character`) or to a submission
      (`submission`), not both (RFC-045). The schema refuses both with
      `oneOf`; the engine refuses the law when it loads it.
    url: https://example.invalid/law/artikel/1
    machine_readable:
      hooks:
        - hook_point: pre_actions
          applies_to:
            submission: AANVRAAG
            legal_character: BESCHIKKING
      execution:
        output:
          - name: gevraagd
            type: boolean
        actions:
          - output: gevraagd
            value: true
