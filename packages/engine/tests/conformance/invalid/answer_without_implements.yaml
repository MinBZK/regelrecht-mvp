$id: test_conformance_answer_without_implements
regulatory_layer: UITVOERINGSBELEID
publication_date: '2026-10-22'
valid_from: '2026-10-22'
url: https://example.invalid/policy
competent_authority:
  name: Het hoofd van een testschool
articles:
  - number: '1'
    text: Het hoofd ontleent het aan het antwoord van zijn cel.
    url: https://example.invalid/policy/1
    machine_readable:
      execution:
        input:
          - name: antwoord
            type: boolean
            nullable: true
            source:
              reduction: verlof_al_verleend
        output:
          - name: al_verleend
            type: boolean
            nullable: true
