[package]
name = "regelrecht-poc-wetsgeschiedenis"
version = "0.1.0"
edition = "2021"
authors = ["MinBZK <noreply@minbzk.nl>"]
description = "PoC: een wet door de tijd, uit haar bekendmakingen en Kamerstukken afgespeeld; een bezoeker haalt zelf een wet op vanaf haar BWB-id"
license = "EUPL-1.2"
repository = "https://github.com/NederlandseDigitaleDienst/regelrecht"
publish = false

[[bin]]
name = "regelrecht-poc-wetsgeschiedenis"
path = "src/main.rs"

[lib]
name = "regelrecht_poc_wetsgeschiedenis"
path = "src/lib.rs"

[dependencies]
axum.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "process", "sync", "time", "io-util", "fs"] }
tower-http = { workspace = true, features = ["fs", "trace"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
http-body-util.workspace = true
tower.workspace = true

[lints]
workspace = true
