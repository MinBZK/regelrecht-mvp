---
# Cel van de Belastingdienst/Toeslagen. Zij legt de ontvangst van een
# aanvraag om zorgtoeslag (Awir art. 15), het voorschot en de toekenning erop
# (Zorgtoeslagwet art. 2 in de procedure van de Awir), de
# betaalopdrachten voor de voorschottermijnen (Awir art. 22) en het antwoord
# van de bank erop vast als gram in haar kroniek (RFC-022).
# Wat de aanvraag, de besluiten en de termijnen bevatten, zegt de wet; zie de
# stromen.
id: toeslagen
recording_actor: belastingdienst_toeslagen   # Awir art. 14 lid 1
streams:
  - streams/zorgtoeslag_aanvragen.yaml
  - streams/zorgtoeslag_besluiten.yaml
  - streams/zorgtoeslag_betalingen.yaml
# Het dossier van Toeslagen (RFC-045 §1): wat de wet vraagt met origin
# DOSSIER, uit het eigen dossier van het orgaan. Het register heet naar dat
# dossier, niet naar het beleid dat het leest: de wet geeft de interface, het
# beleid alleen hoe het dossier gelezen wordt. Het beleidsartikel leest het als
# invoer zonder bron (`source: {}`); alleen deze regel zegt dat die invoer de
# kroniek `toeslagen` van deze cel is. Een herkomst noemt het register
# `belastingdienst_toeslagen#dossier`.
# Ter verankering, geen grondslag: Toeslagen voert uit (Awir art. 14 lid 1) en
# houdt haar archiefbescheiden in goede staat (Archiefwet 1995 art. 3).
registers:
  dossier:
    chronicle: toeslagen
    read_by: [fictief_beleid_kroniek_toeslagen]
