---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.2/schema/v0.8.2/schema.json
$id: reductie_verleende_verloven
regulatory_layer: REDUCTIE
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# Geen regelgeving: een reductie van de cel van OBS De Klimop over haar eigen
# kroniek (RFC-022 §4.1, RFC-048). Ze staat bij de cel en niet in
# corpus/regulation; alleen de cel laadt haar. Er is geen bekendmaking; de url
# wijst naar het artikel waaronder de besluiten zijn genomen.
url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
name: Verleende verloven van OBS De Klimop (reductie)
competent_authority:
  name: Het hoofd van OBS De Klimop
articles:
  - number: '1'
    text: >-
      Geen regelgeving: een reductie van de cel over haar eigen kroniek. De
      verleende verloven zijn de besluiten van het hoofd op een aanvraag om
      vakantieverlof (artikel 13a van de Leerplichtwet 1969) waarin het
      verlof verleende, elk met de jongere en de eerste verlofdag.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      execution:
        input:
          # De besluiten onder artikel 13a, één rij per besluit, met de
          # gegevens en de uitvoer van dat besluit onder hun eigen naam: onder
          # meer bsn_jongere, eerste_verlofdag en verlof_verleend.
          - name: besluiten
            type: array
            source:
              decisions: leerplichtwet_1969#13a
        output:
          - name: verleende_verloven
            type: array
            description: >-
              De besluiten waarin het hoofd verlof verleende, elk met de
              jongere (bsn_jongere) en de eerste verlofdag (eerste_verlofdag).
        actions:
          # Een weigering is geen verleend verlof. Het formaat kent geen
          # operatie die een rij samenstelt, dus een verleend verlof is de hele
          # rij van het besluit; het beleid leest er de jongere en de eerste
          # verlofdag uit.
          - output: verleende_verloven
            value:
              operation: FOREACH
              collection: $besluiten
              as: besluit
              filter:
                operation: EQUALS
                subject: $besluit.verlof_verleend
                value: true
              body: $besluit
