---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.6/schema/v0.8.6/schema.json
$id: reductie_verlof_valt_buiten_schoolvakanties
regulatory_layer: REDUCTIE
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# Geen regelgeving: een reductie van de cel van OBS De Klimop over haar eigen
# kroniek (RFC-022 §4.1, RFC-048, RFC-051). Ze vult het open begrip
# verlof_valt_buiten_schoolvakanties van artikel 13a van de Leerplichtwet
# 1969 (artikel 11, onder f: "slechts buiten de schoolvakanties"), dat het
# hoofd anders per aanvraag oordeelt. De schoolvakanties komen uit twee
# bronnen. De kerst-, mei- en zomervakantie stelt de Regeling vaststelling
# schoolvakanties 2025–2030 vast (op grond van artikel 15, tweede lid, van de
# Wet op het primair onderwijs), de zomervakantie per regio; de regio volgt
# uit de plaats van vestiging, die de cel uit haar executogrammen geeft
# (reductie_plaats_van_vestiging). De herfst- en voorjaarsvakantie stelt het
# bevoegd gezag zelf vast, als regel van de school in zijn beleid
# (fictief_beleid_vakantierooster_obs_de_klimop).
# Niet gemodelleerd: de verlenging van de zomervakantie door het bevoegd
# gezag (artikel 7, eerste lid, van de regeling), de afwijkingen in artikel 7,
# tweede tot en met zesde lid, de ontheffing van artikel 8, en vrije dagen die
# geen vakantie zijn. Er is geen bekendmaking; de url wijst naar artikel 11.
# De regeling stelt geen zomervakantie van 2025 vast (artikel 6 begint bij
# 2026). Voor verlof in het schooljaar 2025–2026 kent de reductie de vorige
# zomer dus niet en zwijgt zij; de cel van de school begint op 1 augustus
# 2026.
url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel11
name: Verlof buiten de schoolvakanties bij OBS De Klimop (reductie)
competent_authority:
  name: Het hoofd van OBS De Klimop
articles:
  - number: '1'
    text: >-
      Geen regelgeving: een reductie van de cel over haar eigen kroniek. Het
      gevraagde verlof valt buiten de schoolvakanties als geen dag ervan valt
      in de kerst-, mei- of zomervakantie die de Regeling vaststelling
      schoolvakanties 2025–2030 voor de regio van de school vaststelt, of in
      de herfst- of voorjaarsvakantie die het beleid van het bevoegd gezag
      vaststelt voor het schooljaar van de eerste verlofdag.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel11
    machine_readable:
      implements:
        - law: leerplichtwet_1969
          article: 13a
          open_term: verlof_valt_buiten_schoolvakanties
      execution:
        # Parameters van artikel 13a; de cel geeft ze op naam door.
        parameters:
          - name: eerste_verlofdag
            type: date
            description: Eerste dag van het gevraagde verlof.
          - name: laatste_verlofdag
            type: date
            description: Laatste dag van het gevraagde verlof.
        input:
          # Het schooljaar van het gevraagde verlof is dat van de eerste
          # verlofdag (eigen keuze, zoals bij artikel 13a, tweede lid).
          - name: eerste_jaar_schooljaar
            type: number
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: eerste_jaar_schooljaar
              parameters:
                datum: $eerste_verlofdag
          - name: laatste_jaar_schooljaar
            type: number
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: laatste_jaar_schooljaar
              parameters:
                datum: $eerste_verlofdag
          # De regio van de school (artikel 2 van de regeling). De plaats van
          # vestiging vult de cel daar zelf in.
          - name: regio
            type: string
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: regio_van_school
          - name: kerstvakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: kerstvakantie_eerste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 5, de kerstvakantie van het schooljaar.
          - name: kerstvakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: kerstvakantie_laatste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 5.
          - name: meivakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: meivakantie_eerste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 5, de meivakantie van het schooljaar.
          - name: meivakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: meivakantie_laatste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 5.
          - name: zomervakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: zomervakantie_eerste_dag
              parameters:
                jaar: $laatste_jaar_schooljaar
                regio: $regio
            description: Artikel 6, de zomervakantie aan het eind van het schooljaar.
          - name: zomervakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: zomervakantie_laatste_dag
              parameters:
                jaar: $laatste_jaar_schooljaar
                regio: $regio
            description: Artikel 6.
          - name: vorige_zomervakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: zomervakantie_eerste_dag
              parameters:
                jaar: $eerste_jaar_schooljaar
                regio: $regio
            description: >-
              Artikel 6, de zomervakantie aan het eind van het vorige
              schooljaar, die tot in dit schooljaar kan lopen.
          - name: vorige_zomervakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: zomervakantie_laatste_dag
              parameters:
                jaar: $eerste_jaar_schooljaar
                regio: $regio
            description: Artikel 6.
          - name: herfstvakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: fictief_beleid_vakantierooster_obs_de_klimop
              output: herfstvakantie_eerste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
            description: De herfstvakantie van het schooljaar, uit het beleid van de school.
          - name: herfstvakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: fictief_beleid_vakantierooster_obs_de_klimop
              output: herfstvakantie_laatste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
            description: Uit het beleid van de school.
          - name: voorjaarsvakantie_eerste_dag
            type: date
            nullable: true
            source:
              regulation: fictief_beleid_vakantierooster_obs_de_klimop
              output: voorjaarsvakantie_eerste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
            description: De voorjaarsvakantie van het schooljaar, uit het beleid van de school.
          - name: voorjaarsvakantie_laatste_dag
            type: date
            nullable: true
            source:
              regulation: fictief_beleid_vakantierooster_obs_de_klimop
              output: voorjaarsvakantie_laatste_dag
              parameters:
                eerste_jaar_schooljaar: $eerste_jaar_schooljaar
            description: Uit het beleid van de school.
        output:
          - name: verlof_valt_buiten_schoolvakanties
            type: boolean
            nullable: true
            description: >-
              Of het gevraagde verlof buiten de schoolvakanties valt; afwezig
              als de cel een vakantie van het schooljaar niet kent.
        actions:
          # Een vakantie raakt het verlof als zij begint op of vóór de
          # laatste verlofdag en eindigt op of na de eerste. Weet de cel een
          # periode niet (de regeling stelt er geen vast voor deze regio of
          # dit jaar, of het beleid van de school kent het schooljaar
          # niet), dan zwijgt zij
          # (null): het hoofd oordeelt dan, zoals zonder reductie (RFC-048).
          - output: verlof_valt_buiten_schoolvakanties
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $kerstvakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $kerstvakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $meivakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $meivakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $vorige_zomervakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $vorige_zomervakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $zomervakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $zomervakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $herfstvakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $herfstvakantie_laatste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $voorjaarsvakantie_eerste_dag
                          value: null
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $voorjaarsvakantie_laatste_dag
                          value: null
                  then:
                    operation: NOT
                    value:
                      operation: OR
                      conditions:
                        # Kerstvakantie (regeling, artikel 5).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $kerstvakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $kerstvakantie_laatste_dag
                                in: days
                              value: 0
                        # Meivakantie (regeling, artikel 5).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $meivakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $meivakantie_laatste_dag
                                in: days
                              value: 0
                        # Zomervakantie van het vorige schooljaar (regeling, artikel 6).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $vorige_zomervakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $vorige_zomervakantie_laatste_dag
                                in: days
                              value: 0
                        # Zomervakantie (regeling, artikel 6).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $zomervakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $zomervakantie_laatste_dag
                                in: days
                              value: 0
                        # Herfstvakantie (beleid van de school).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $herfstvakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $herfstvakantie_laatste_dag
                                in: days
                              value: 0
                        # Voorjaarsvakantie (beleid van de school).
                        - operation: AND
                          conditions:
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $voorjaarsvakantie_eerste_dag
                                to: $laatste_verlofdag
                                in: days
                              value: 0
                            - operation: GREATER_THAN_OR_EQUAL
                              subject:
                                operation: DATE_DIFF
                                from: $eerste_verlofdag
                                to: $voorjaarsvakantie_laatste_dag
                                in: days
                              value: 0
