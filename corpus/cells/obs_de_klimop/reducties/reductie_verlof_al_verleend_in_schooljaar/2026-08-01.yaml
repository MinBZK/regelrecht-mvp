---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/tags/schema-v0.8.2/schema/v0.8.2/schema.json
$id: reductie_verlof_al_verleend_in_schooljaar
regulatory_layer: REDUCTIE
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# Geen regelgeving: een reductie van de cel van OBS De Klimop over haar eigen
# kroniek (RFC-022 §4.1, RFC-048). Ze staat bij de cel en niet in
# corpus/regulation; alleen de cel laadt haar. Ze zoekt de besluiten die
# ertoe doen en vraagt het beleid van de school in welk schooljaar een dag
# valt. Haar antwoord neemt het besluit onder artikel 13a als parameter op
# naam. Er is geen bekendmaking; de url wijst naar dat artikel.
url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
name: Al verleend vakantieverlof in het schooljaar bij OBS De Klimop (reductie)
competent_authority:
  name: Het hoofd van OBS De Klimop
articles:
  - number: '1'
    text: >-
      Geen regelgeving: een reductie van de cel over haar eigen kroniek. Het
      hoofd heeft de jongere in het schooljaar van het gevraagde verlof al
      verlof verleend als het in een besluit op een aanvraag om vakantieverlof
      (artikel 13a van de Leerplichtwet 1969) de jongere verlof verleende met
      een eerste verlofdag in dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      execution:
        # Wat het besluit zelf ook vraagt; de cel geeft het op naam door.
        parameters:
          - name: bsn_jongere
            type: string
            description: Burgerservicenummer van de jongere voor wie verlof wordt gevraagd.
          - name: eerste_verlofdag
            type: date
            description: Eerste dag van het gevraagde verlof.
        input:
          # De besluiten onder artikel 13a, één rij per besluit, met de
          # gegevens en de uitvoer van dat besluit onder hun eigen naam: onder
          # meer bsn_jongere, eerste_verlofdag en verlof_verleend.
          - name: besluiten
            type: array
            source:
              decisions: leerplichtwet_1969#13a
          # Het schooljaar van het gevraagde verlof is dat van de eerste
          # verlofdag (eigen keuze, zie artikel 13a).
          - name: begin_schooljaar
            type: date
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: begin_schooljaar
              parameters:
                datum: $eerste_verlofdag
          - name: einde_schooljaar
            type: date
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: einde_schooljaar
              parameters:
                datum: $eerste_verlofdag
        output:
          # Hulpuitvoer: binnen de FOREACH is elk veld van een besluit ook
          # onder zijn eigen naam te lezen (RFC-016), zoals `$bsn_jongere`.
          # De jongere van de aanvraag staat daarom erbuiten, en een veld van
          # een besluit wordt steeds als `$besluit.<veld>` gelezen.
          - name: jongere_van_de_aanvraag
            type: string
            description: De jongere voor wie verlof wordt gevraagd.
          - name: verlof_al_verleend_in_schooljaar
            type: boolean
            description: >-
              Of het hoofd de jongere in het schooljaar van het gevraagde verlof
              al verlof verleende.
        actions:
          - output: jongere_van_de_aanvraag
            value: $bsn_jongere
          # Een besluit dat dezelfde jongere verlof verleende, met een eerste
          # verlofdag in het schooljaar van het gevraagde verlof. Een
          # weigering telt niet.
          - output: verlof_al_verleend_in_schooljaar
            value:
              operation: FOREACH
              collection: $besluiten
              as: besluit
              filter:
                operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $besluit.verlof_verleend
                    value: true
                  - operation: EQUALS
                    subject: $besluit.bsn_jongere
                    value: $jongere_van_de_aanvraag
                  - operation: GREATER_THAN_OR_EQUAL
                    subject:
                      operation: DATE_DIFF
                      from: $begin_schooljaar
                      to: $besluit.eerste_verlofdag
                      in: days
                    value: 0
                  - operation: GREATER_THAN_OR_EQUAL
                    subject:
                      operation: DATE_DIFF
                      from: $besluit.eerste_verlofdag
                      to: $einde_schooljaar
                      in: days
                    value: 0
              body: true
              combine: OR
