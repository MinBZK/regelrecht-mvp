---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.5/schema/v0.8.5/schema.json
$id: reductie_verlof_al_verleend_in_schooljaar
regulatory_layer: REDUCTIE
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# Geen regelgeving: een reductie van de cel van OBS De Klimop over haar eigen
# kroniek (RFC-022 §4.1, RFC-048). Ze staat bij de cel en niet in
# corpus/regulation; alleen de cel laadt haar. Ze zoekt de besluiten die
# ertoe doen en vraagt het beleid van de school in welk schooljaar een dag
# valt. Haar antwoord vult het open begrip van artikel 13a (implements,
# schema v0.8.5): waar de engine dat begrip leest, ook als Awb 7:11 het
# artikel opnieuw aanroept, vraagt hij het de cel, en de cel draait haar.
# Er is geen bekendmaking; de url wijst naar dat artikel.
url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
name: Al verleend vakantieverlof in het schooljaar bij OBS De Klimop (reductie)
competent_authority:
  name: Het hoofd van OBS De Klimop
articles:
  - number: '1'
    text: >-
      Geen regelgeving: een reductie van de cel over haar eigen kroniek. Het
      hoofd heeft de jongere in het schooljaar van het gevraagde verlof al
      verlof verleend als het in een besluit op een aanvraag om vakantieverlof
      (artikel 13a van de Leerplichtwet 1969) de jongere verlof verleende met
      een eerste verlofdag in dat schooljaar.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      # Het open begrip van lid 2, dat het hoofd anders per geval vaststelt.
      implements:
        - law: leerplichtwet_1969
          article: 13a
          open_term: verlof_al_verleend_in_schooljaar
      execution:
        # Parameters van artikel 13a; de cel geeft ze op naam door.
        parameters:
          - name: bsn_jongere
            type: string
            description: Burgerservicenummer van de jongere voor wie verlof wordt gevraagd.
          - name: eerste_verlofdag
            type: date
            description: Eerste dag van het gevraagde verlof.
        input:
          # De besluiten onder artikel 13a, één rij per besluit, met de
          # gegevens en de uitvoer van dat besluit onder hun eigen naam: onder
          # meer bsn_jongere, eerste_verlofdag en verlof_verleend, en het id
          # van het besluit.
          - name: besluiten
            type: array
            source:
              decisions: leerplichtwet_1969#13a
          # De beslissingen op bezwaar (Awb 7:11), ook één rij per besluit.
          # Een rij noemt het bestreden besluit bij zijn id
          # (bestreden_besluit), en of zij het herriep
          # (bestreden_besluit_herroepen). De cel moet daarvoor de Awb
          # geladen hebben.
          - name: beslissingen_op_bezwaar
            type: array
            source:
              decisions: algemene_wet_bestuursrecht#7:11
          # Het schooljaar van het gevraagde verlof is dat van de eerste
          # verlofdag (eigen keuze, zie artikel 13a).
          - name: begin_schooljaar
            type: date
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: begin_schooljaar
              parameters:
                datum: $eerste_verlofdag
          - name: einde_schooljaar
            type: date
            source:
              regulation: fictief_beleid_schooljaargrenzen_obs_de_klimop
              output: einde_schooljaar
              parameters:
                datum: $eerste_verlofdag
        output:
          - name: herroepen_besluiten
            type: array
            description: >-
              De ids van de besluiten die een beslissing op bezwaar herriep
              (Awb 7:11, tweede lid).
          - name: verlof_al_verleend_in_schooljaar
            type: boolean
            description: >-
              Of het hoofd de jongere in het schooljaar van het gevraagde verlof
              al verlof verleende.
        actions:
          # Een besluit dat een beslissing op bezwaar herriep, is er niet meer
          # (Awb 7:11, tweede lid). De koppeling loopt via een lijst ids:
          # binnen een FOREACH is de binding van een buitenste FOREACH niet te
          # lezen.
          - output: herroepen_besluiten
            value:
              operation: FOREACH
              collection: $beslissingen_op_bezwaar
              as: beslissing
              filter:
                operation: EQUALS
                subject: $beslissing.bestreden_besluit_herroepen
                value: true
              body: $beslissing.bestreden_besluit
          # Een besluit dat dezelfde jongere verlof verleende, met een eerste
          # verlofdag in het schooljaar van het gevraagde verlof. Een
          # weigering telt niet, en een herroepen besluit ook niet. Het besluit
          # dat in zijn plaats kwam, telt als elk ander (RFC-050). Met `as` is
          # een besluit alleen als `$besluit.<veld>` te lezen (RFC-049);
          # `$bsn_jongere` is de parameter.
          - output: verlof_al_verleend_in_schooljaar
            value:
              operation: FOREACH
              collection: $besluiten
              as: besluit
              filter:
                operation: AND
                conditions:
                  - operation: EQUALS
                    subject: $besluit.verlof_verleend
                    value: true
                  - operation: NOT
                    value:
                      operation: IN
                      subject: $besluit.id
                      value: $herroepen_besluiten
                  - operation: EQUALS
                    subject: $besluit.bsn_jongere
                    value: $bsn_jongere
                  - operation: GREATER_THAN_OR_EQUAL
                    subject:
                      operation: DATE_DIFF
                      from: $begin_schooljaar
                      to: $besluit.eerste_verlofdag
                      in: days
                    value: 0
                  - operation: GREATER_THAN_OR_EQUAL
                    subject:
                      operation: DATE_DIFF
                      from: $besluit.eerste_verlofdag
                      to: $einde_schooljaar
                      in: days
                    value: 0
              body: true
              combine: OR
