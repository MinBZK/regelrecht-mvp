---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.8/schema/v0.8.8/schema.json
$id: reductie_eerder_verstrekte_gehandicaptenparkeerkaart_gemeente_oostmeer
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van de cel van gemeente Oostmeer (fictief) over
# haar eigen kroniek (RFC-022 §4.1, RFC-048). Ze vult het open begrip van
# artikel 2, tweede lid, van de Regeling gehandicaptenparkeerkaart: of de
# aanvrager eerder een kaart kreeg, van deze
# verstrekkende instantie (RFC-052). Een kopie van het filter van de reductie
# van de gemeente Wilgendaal (reductie_geldige_gehandicaptenparkeerkaart);
# het gaat op in een gedeelde reductie zodra een cel die kan laden. Er is
# geen bekendmaking; de url wijst naar dat artikel.
url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel2
name: Eerder verstrekte gehandicaptenparkeerkaart bij gemeente Oostmeer (reductie)
competent_authority:
  name: Het college van burgemeester en wethouders van de gemeente Oostmeer
articles:
  - number: '1'
    text: >-
      Geen regelgeving: een reductie van de cel over haar eigen kroniek. De
      aanvrager kreeg eerder een kaart als deze instantie hem in een besluit op
      een aanvraag (artikel 49 van het BABW) een kaart verstrekte die niet op
      bezwaar is herroepen; anders zegt de cel niets.
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel2
    machine_readable:
      implements:
        - law: regeling_gehandicaptenparkeerkaart
          article: '2'
          open_term: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
      execution:
        parameters:
          - name: bsn_aanvrager
            type: string
            description: Burgerservicenummer van de gehandicapte die de kaart aanvraagt.
        input:
          - name: besluiten
            type: array
            source:
              decisions: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49
          - name: beslissingen_op_bezwaar
            type: array
            source:
              decisions: algemene_wet_bestuursrecht#7:11
        output:
          - name: herroepen_besluiten
            type: array
            description: >-
              De ids van de besluiten die een beslissing op bezwaar herriep
              (Awb 7:11, tweede lid).
          - name: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
            type: boolean
            nullable: true
            description: >-
              Waar, als deze instantie de aanvrager eerder een kaart
              verstrekte; anders afwezig.
        actions:
          - output: herroepen_besluiten
            value:
              operation: FOREACH
              collection: $beslissingen_op_bezwaar
              as: beslissing
              filter:
                operation: EQUALS
                subject: $beslissing.bestreden_besluit_herroepen
                value: true
              body: $beslissing.bestreden_besluit
          - output: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
            value:
              operation: IF
              cases:
                - when:
                    operation: FOREACH
                    collection: $besluiten
                    as: besluit
                    filter:
                      operation: AND
                      conditions:
                        - operation: EQUALS
                          subject: $besluit.gehandicaptenparkeerkaart_verstrekt
                          value: true
                        - operation: NOT
                          value:
                            operation: IN
                            subject: $besluit.id
                            value: $herroepen_besluiten
                        - operation: EQUALS
                          subject: $besluit.bsn_aanvrager
                          value: $bsn_aanvrager
                    body: true
                    combine: OR
                  then: true
              default: null
