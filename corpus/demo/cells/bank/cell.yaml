---
# Cel van een fictieve bank (geen bestaande bank, geen overheid). Zij legt
# elke overboeking en elke incasso die binnenkomt vast in haar kroniek
# `rekeningen`: bijgeschreven, afgeschreven of geweigerd, naar haar eigen
# (fictieve) voorwaarden (fictieve_bankvoorwaarden art. 1 en 2). Wat er
# binnenkomt en van wie, zegt het transport tussen de cellen van de demo
# (`channels` in demo-config.yaml).
id: bank
recording_actor: fictieve_bank
streams:
  - streams/overboekingen.yaml
  - streams/incasso.yaml
# Het dossier van de bank (RFC-045 §1): wat er op een rekening is
# bijgeschreven en afgeschreven, voor het saldo bij een incasso. Het register
# heet naar het dossier van de bank, niet naar het (fictieve) beleid dat het
# leest. Een herkomst noemt het `fictieve_bank#dossier`.
registers:
  dossier:
    chronicle: rekeningen
    read_by: [fictief_beleid_kroniek_bank]
