# Waar de speler stopt om de kijker zelf te laten rondkijken. De uitnodigingen
# vindt de build zelf; hier staat wat anders moet. De presentator zegt na de
# uitnodiging nog wat de kijker kan doen en "dan gaan we zo weer verder", dus
# de pauze valt na die zin en niet na de uitnodiging zelf.
pauses:
  - {take: 2026-10-11T14-24-13, at: 291.75, off: true}
  - take: 2026-10-11T14-24-13
    at: 305.4
    hint: Klik rond, zoom in en volg de lijnen tussen wetten.
  - take: 2026-10-11T14-24-13
    at: 566.0
    hint: Speel met de scenario's en volg de trace.
  - {take: 2026-10-11T14-24-13, at: 837.83, off: true}
  - take: 2026-10-11T14-24-13
    at: 839.9
    hint: Probeer een andere wetswijziging en vergelijk.
  # "klik gewoon rond" in de afsluiting is geen pauze
  - {take: 2026-10-11T14-24-13, at: 1285.09, off: true}

# Tekst op een dia aanpassen zonder nieuwe opname, op dia-index.
#
#   5:
#     title: De wet, machine-leesbaar
#     lead: Elk artikel staat er twee keer in, als tekst en als regels.
slides:
  # Wat in de opname van 11 oktober gezegd wordt, kort.
  1:
    lines:
      - Iedere uitvoeringsorganisatie
      - heeft een **eigen interpretatie** van de wet
      - die al decennia landt in **eigen software**
  5:
    lead: Per artikel de wettekst, en daaronder hoe hij werkt.
    bullets:
      - '**Parameter**: voor wie, een BSN.'
      - '**Actions**: de voorwaarden en de berekening.'
      - '**Input** uit andere wetten: verzekerd (Zvw), gedetineerd (Pbw).'
  6:
    lead: Zorgtoeslag hangt af van verzekerd zijn, en dat van detentie.
    bullets:
      - Volg de lijn van wet naar wet.
      - 'Dezelfde naam, andere definitie: de machine wijst naar de juiste.'
      - Overzicht van wat meeverandert bij een wijziging.
  7:
    lead: Voorbeelden uit de memorie van toelichting, uitgevoerd.
    bullets:
      - '**Uitvoeren** geeft een trace: welke wet, welk gegeven.'
      - 'Onder de 18 stopt het vroeg: dataminimalisatie.'
      - Een taalmodel maakt de eerste versie; een jurist beoordeelt.
  8:
    title: Wat doet een wijziging met iedereen?
    lead: Alle wetten tegelijk op een populatie.
    bullets:
      - Besteedbaar inkomen, met alle wisselwerking tussen wetten.
      - 'Wijziging doorrekenen: de standaardpremie omhoog.'
      - Vergelijk voor en na, vóór er gestemd wordt.

# Veelgestelde vragen, en het moment in de hoofdlijn waarop de vraag
# verschijnt (in take-tijd, of als hoofdstuk plus seconden:
# `offer: {chapter: 5, after: 20}`). Twee soorten antwoord:
#
# - een oordeel: de presentator in beeld, opgenomen op een dia zonder
#   tabblad; het gezicht staat dan groot naast de vraag;
#
#   - id: open-normen
#     question: Hoe gaan jullie om met open normen?
#     segments:
#       - take: 2026-10-02T11-00-00
#     offer: {chapter: 5, after: 20}
#
# - laat-maar-zien: een script met de gegenereerde stem en de demo die
#   meeklikt, eventueel met een opgenomen eerste zin.
#
#   - id: eigen-wet
#     question: Kan ik zelf een wet toevoegen?
#     segments:
#       - take: 2026-10-02T11-10-00
#         to: 4.5
#       - script: faq-eigen-wet
#     offer: {chapter: 7, after: 10}
faq:
  - id: open-normen
    question: Wat gebeurt er met open normen?
    segments:
      - {take: 2026-10-11T14-53-23, from: 3.0, to: 146.2}
    # na "of iemand voldoet aan de voorwaarden"
    offer: {take: 2026-10-11T14-24-13, at: 165.3}
  - id: juridisch-bindend
    question: Is dit juridisch bindend?
    segments:
      - {take: 2026-10-11T14-53-23, from: 150.3, to: 208.7}
    # na "dat is een interpretatie van die wet"
    offer: {take: 2026-10-11T14-24-13, at: 149.9}
  - id: volgorde-artikelen
    question: Maakt de volgorde van artikelen uit?
    segments:
      - {take: 2026-10-11T15-04-59, from: 2.5, to: 109.4}
    # na "er zit automatisch iets van dataminimalisatie in"
    offer: {take: 2026-10-11T14-24-13, at: 554.1}
  - id: vertaling-klopt
    question: Hoe weten we of de vertaling klopt?
    segments:
      - {take: 2026-10-11T14-53-23, from: 212.8, to: 369.4}
    # na het stuk over hoe de regelwerken gemaakt worden
    offer: {take: 2026-10-11T14-24-13, at: 642.5}

# Wat de presentator zegt als de kijker zelf gaat klikken (wait) en als hij
