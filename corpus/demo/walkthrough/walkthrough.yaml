          - Ten onrechte toekennen betekent later terugbetalen.
          - Dat vraagt politieke keuzes.
        route: /portaal
      - at: 1109.5
        overline: De behandelaar
        title: Hetzelfde recht, andere kant van de balie
        lead: De aanvraag komt binnen met de berekening die Merijn zag.
        bullets:
          - De wijziging goedkeuren of afwijzen.
          - Toekennen of afwijzen, met motivering.
        route: /zaaksysteem
      - at: 1151.4
        overline: Bezwaar
        title: Ook de Awb is een regelwerk
        lead: Of bezwaar mogelijk is, staat in het regelwerk en niet in het scherm.
        bullets:
          - Eén keer geïnterpreteerd, overal bruikbaar.
          - 'Ook voor andere proceswetten: Archiefwet, AVG, Woo.'
        route: /portaal
      - at: 1270.4
        kind: closing
        overline: Demo RegelRecht
        title: Van wet naar digitale werking
        lines:
          - Compleet verhaal, **geen eindproduct**
          - We maken beleid **door te doen**
        link:
          href: https://regelrecht.rijks.app
          label: regelrecht.rijks.app

