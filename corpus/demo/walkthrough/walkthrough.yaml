    # Vanaf de simulatie zette de presentator het dek uit en liep hij via de
    # tabbladen verder. Die stukken krijgen hier achteraf hun hoofdstuk, met
    # een dia die volgt wat er gezegd wordt. `at` is take-tijd; zonder `route`
    # blijft de demo op het tabblad waar de presentator was.
    chapters:
      - at: 842.1
        overline: De burger
        title: Eén burger, Merijn
        lead: Alles waar Merijn recht op heeft, berekend door de wet zelf.
        bullets:
          - Dezelfde gegevens als in de trace van zojuist.
          - 'Zorgtoeslag aanvragen: direct toegekend.'
          - Geen rekenhulp, maar de regel waarmee ook de Dienst Toeslagen rekent.
        route: /portaal
      - at: 927.0
        overline: Aanvragen
        title: Alleen vragen wat de overheid niet weet
        lead: De huurtoeslag vraagt alleen de huur en de servicekosten.
        bullets:
          - Klopt een gegeven niet? Merijn corrigeert het.
          - Het bedrag rekent direct mee.
          - Een behandelaar beoordeelt de wijziging.
        route: /portaal
      - at: 1017.0
        overline: Veelgestelde vraag
        title: Kan dit niet proactief?
        lead: Technisch misschien, maar de overheid weet niet alles.
        bullets:
