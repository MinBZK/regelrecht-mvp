            Gezondheidsdienst of de aangewezen deskundige (artikel 3, eerste
            lid, van de Regeling gehandicaptenparkeerkaart), in het advies
          description: >-
            Wat wie het onderzoek verrichtte in het advies opgeeft over
            de hulp van de bestuurder, als de cel van de GGD geen antwoord geeft.
        - id: advies_permanent_rolstoelgebonden_volgens_ggd
          competent_authority:
            - name: Gemeentelijke Gezondheidsdienst
              type: CATEGORY
            - name: vanwege het gemeentelijk gezag aangewezen deskundige
              type: CATEGORY
          type: boolean
          required: false
          decided_per_case_by: >-
            wie het geneeskundig onderzoek verricht: de Gemeentelijke
            Gezondheidsdienst of de aangewezen deskundige (artikel 3, eerste
            lid, van de Regeling gehandicaptenparkeerkaart), in het advies
          description: >-
            Wat wie het onderzoek verrichtte in het advies opgeeft over
            rolstoelgebondenheid, als de cel van de GGD geen antwoord geeft.
        - id: advies_ernstige_beperkingen_andere_dan_loopbeperkingen_volgens_ggd
          competent_authority:
            - name: Gemeentelijke Gezondheidsdienst
              type: CATEGORY
            - name: vanwege het gemeentelijk gezag aangewezen deskundige
              type: CATEGORY
          type: boolean
          required: false
          decided_per_case_by: >-
            wie het geneeskundig onderzoek verricht: de Gemeentelijke
            Gezondheidsdienst of de aangewezen deskundige (artikel 3, eerste
            lid, van de Regeling gehandicaptenparkeerkaart), in het advies
          description: >-
            Wat wie het onderzoek verrichtte in het advies opgeeft over
            andere ernstige beperkingen, als de cel van de GGD geen antwoord geeft.
      implements:
        - law: fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal
          article: '5'
          open_term: advies_langdurige_loopbeperking
        - law: fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal
          article: '5'
          open_term: advies_continu_afhankelijk_van_hulp_bestuurder
        - law: fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal
          article: '5'
          open_term: advies_permanent_rolstoelgebonden
        - law: fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal
          article: '5'
          open_term: advies_ernstige_beperkingen_andere_dan_loopbeperkingen
      execution:
        # De parameters van artikel 5, onder hun eigen naam.
        parameters:
          - name: bsn_aanvrager
