  - number: 58b
    text: >-
      Het is eenieder die niet is aangesteld als verkeersregelaar verboden zich op zodanige wijze te kleden dan wel te
      gedragen, dat daardoor bij weggebruikers de indruk kan worden gewekt, dat hij bevoegd is als zodanig op te treden.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel58b
  - number: '59'
    text: |-
      Overtreding van de [artikelen 1a][ref1], [2][ref2], [54][ref3],
      [58a, eerste lid en derde tot en met zesde lid][ref4], en [58b][ref5] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel1a
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0004826#Artikel58a
      [ref5]: https://wetten.overheid.nl/BWBR0004826#Artikel58b
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel59
