        paragraaf: '6'
  - number: '49'
    text: |-
      1 Aan een gehandicapte kan, overeenkomstig de bij ministeriële regeling gestelde criteria, door het college
      van burgemeester en wethouders van de gemeente waar hij als ingezetene met een adres is ingeschreven in de
      basisregistratie personen, een gehandicaptenparkeerkaart worden verstrekt.

      2 Aan de zorgaanbieder in de zin van de [Wet langdurige zorg][ref1] en die zorg verleent als bedoeld in
      [artikel 3.1.1 van de Wet langdurige zorg][ref2] kan, overeenkomstig de bij ministeriële regeling gestelde
      criteria, door het college van burgemeester en wethouders van de gemeente waar de instelling is gevestigd, een
      gehandicaptenparkeerkaart worden verstrekt ten behoeve van het vervoer van gehandicapten die in de betrokken
      instelling verblijven.

      3 Aan een gehandicapte die niet als ingezetene is ingeschreven in de basisregistratie personen kan, overeenkomstig
      de bij ministeriële regeling gestelde criteria, door het CBR een gehandicaptenparkeerkaart worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel3.1.1
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel49
    machine_readable:
      # Lid 1: het college verstrekt de kaart aan een gehandicapte "overeenkomstig
      # de bij ministeriële regeling gestelde criteria". Die criteria staan in
      # artikel 1 van de Regeling gehandicaptenparkeerkaart. Lid 2 (de
      # zorgaanbieder) en lid 3 (het CBR, voor wie niet als ingezetene is
      # ingeschreven) zijn niet gemodelleerd. Dat het college bevoegd is (de
      # aanvrager is als ingezetene met een adres in deze gemeente
      # ingeschreven), is niet getoetst: de cel van de gemeente geeft haar
      # eigen naam niet aan de wet door.
      open_terms:
        # Of de aanvrager aan de criteria voldoet, blijkt uit een geneeskundig
        # onderzoek (artikel 2, eerste lid, van de regeling), door de GGD of een
        # door het college aangewezen deskundige (artikel 3, eerste lid). Het
        # college oordeelt per aanvraag op dat onderzoek, zoals het hoofd bij
        # vakantieverlof over de twee gegevens van artikel 11, onder f, van de
        # Leerplichtwet 1969. De oordelen staan hier en niet bij de regeling:
        # de cel leidt de invoer van een besluit alleen af uit het beslissende
        # artikel, en een besluitwaarde draagt bij een heroverweging alleen
        # diens vaststellingen. De regeling krijgt ze als parameters.
        - id: langdurige_loopbeperking
          type: boolean
          required: true
          decided_per_case_by: >-
            het college van burgemeester en wethouders, na geneeskundig onderzoek
            (Regeling gehandicaptenparkeerkaart, artikelen 2 en 3)
          description: >-
            Of de aanvrager ten gevolge van een aandoening of gebrek een
            aantoonbare loopbeperking van langdurige aard heeft, waardoor hij met
            de gebruikelijke loophulpmiddelen in redelijkheid niet zelfstandig meer
            dan 100 meter aan een stuk te voet kan overbruggen (Regeling
            gehandicaptenparkeerkaart, artikel 1, eerste lid, onder a en b).
        - id: continu_afhankelijk_van_hulp_bestuurder
          type: boolean
          required: true
          decided_per_case_by: >-
            het college van burgemeester en wethouders, na geneeskundig onderzoek
            (Regeling gehandicaptenparkeerkaart, artikelen 2 en 3)
          description: >-
            Of de aanvrager voor het vervoer van deur tot deur continu afhankelijk
            is van de hulp van de bestuurder (Regeling gehandicaptenparkeerkaart,
            artikel 1, eerste lid, onder b).
        - id: permanent_rolstoelgebonden
          type: boolean
          required: true
          decided_per_case_by: >-
            het college van burgemeester en wethouders, na geneeskundig onderzoek
            (Regeling gehandicaptenparkeerkaart, artikelen 2 en 3)
          description: >-
            Of de aanvrager ten gevolge van een aandoening of gebrek permanent
            rolstoelgebonden is (Regeling gehandicaptenparkeerkaart, artikel 1,
            eerste lid, onder c).
        - id: ernstige_beperkingen_andere_dan_loopbeperkingen
          type: boolean
          required: true
          decided_per_case_by: >-
            het college van burgemeester en wethouders, na geneeskundig onderzoek
            (Regeling gehandicaptenparkeerkaart, artikelen 2 en 3)
          description: >-
            Of de aanvrager ten gevolge van een aandoening of gebrek aantoonbare
            ernstige beperkingen heeft, andere dan loopbeperkingen (Regeling
            gehandicaptenparkeerkaart, artikel 1, eerste lid, onder d).
        # Lid 1: de kaart "kan" worden verstrekt; het college heeft een
        # bevoegdheid, geen plicht. Hoe het die gebruikt, zegt dit besluit
        # niet. Het beleid van de gemeente vult dit in, hier het fictieve
        # beleid fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal.
        # Of de aanvrager al een geldige kaart heeft, vraagt dit artikel niet:
        # het besluit verbiedt geen kaart naast een geldige (artikel 53,
        # eerste lid, onder b, rekent met een nieuwe kaart die de oude doet
        # vervallen). Dat vraagt het beleid, als open begrip van zichzelf.
        - id: bevoegdheid_tot_verstrekken_gebruikt
          type: boolean
          required: true
          decided_per_case_by: het college van burgemeester en wethouders (artikel 49, eerste lid)
          description: >-
            Of het college van zijn bevoegdheid gebruikmaakt om een
            gehandicaptenparkeerkaart te verstrekken aan een aanvrager die aan
            de criteria voldoet.
      execution:
        # Lid 1: de kaart wordt verstrekt op aanvraag van de gehandicapte. Dit
        # artikel brengt twee dingen voort, zoals artikel 13a van de
        # Leerplichtwet 1969 (RFC-047). De aanvraag, waar de Awb op haakt, met
        # wat zij bevat en het besluit dat zij vraagt. En het verstrekken of
        # weigeren, een beschikking die de procedure van de Awb volgt.
        produces:
          - type: AANVRAAG
            requests: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49
            parameters:
              - bsn_aanvrager
              - kaart_als_bestuurder
              - kaart_als_passagier
          # De uitkomst is of het college een kaart verstrekt, en welke
          # letters zij draagt. De laatste geldige dag volgt uit de dag van
          # afgifte (artikel 51) en is afgeleid (RFC-050): zij staat bij het
          # besluit, maar telt niet als uitkomst. Een heroverweging op bezwaar
          # (Awb 7:11) valt op een andere dag; die geeft geen aanleiding
          # alleen omdat de kaart dan later zou aflopen.
          - type: BESCHIKKING
            decision_type: TOEKENNING
            outputs:
              - gehandicaptenparkeerkaart_verstrekt
              - kaart_vermeldt_bestuurder
              - kaart_vermeldt_passagier
            derived:
              - kaart_geldig_tot
        parameters:
          # De eerste drie zijn de inhoud van de aanvraag (produces hierboven).
          # De kaart vermeldt of zij voor een bestuurder of een passagier is,
          # of voor beide (Regeling gehandicaptenparkeerkaart, artikel 1,
          # tweede lid). Eigen keuze: de aanvrager vraagt welke.
          - name: bsn_aanvrager
            type: string
            description: Burgerservicenummer van de gehandicapte die de kaart aanvraagt.
          - name: kaart_als_bestuurder
            type: boolean
            description: Of de aanvrager de kaart vraagt als bestuurder.
          - name: kaart_als_passagier
            type: boolean
            description: Of de aanvrager de kaart vraagt als passagier.
          # De dag van het besluit (Awb 1:3). Eigen keuze: de kaart wordt
          # afgegeven op die dag; vanaf de afgifte loopt de geldigheidsduur
          # (artikel 51).
          - name: besluit_datum
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        input:
          - name: komt_in_aanmerking_als_bestuurder
            type: boolean
            source:
              regulation: regeling_gehandicaptenparkeerkaart
              output: komt_in_aanmerking_als_bestuurder
              parameters:
                langdurige_loopbeperking: $langdurige_loopbeperking
                continu_afhankelijk_van_hulp_bestuurder: $continu_afhankelijk_van_hulp_bestuurder
                permanent_rolstoelgebonden: $permanent_rolstoelgebonden
                ernstige_beperkingen_andere_dan_loopbeperkingen: $ernstige_beperkingen_andere_dan_loopbeperkingen
          - name: komt_in_aanmerking_als_passagier
            type: boolean
            source:
              regulation: regeling_gehandicaptenparkeerkaart
              output: komt_in_aanmerking_als_passagier
              parameters:
                langdurige_loopbeperking: $langdurige_loopbeperking
                continu_afhankelijk_van_hulp_bestuurder: $continu_afhankelijk_van_hulp_bestuurder
                permanent_rolstoelgebonden: $permanent_rolstoelgebonden
                ernstige_beperkingen_andere_dan_loopbeperkingen: $ernstige_beperkingen_andere_dan_loopbeperkingen
          - name: einde_geldigheidsduur_bij_afgifte
            type: date
            source:
              regulation: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw
              output: einde_geldigheidsduur
              parameters:
                datum_afgifte: $besluit_datum
        output:
          - name: gehandicaptenparkeerkaart_verstrekt
            type: boolean
            description: >-
              Of het college de aanvrager een gehandicaptenparkeerkaart verstrekt
              (lid 1).
          - name: kaart_vermeldt_bestuurder
            type: boolean
            description: >-
              Of de verstrekte kaart met een hoofdletter B aangeeft dat zij voor
              een gehandicapte bestuurder is (Regeling gehandicaptenparkeerkaart,
              artikel 1, tweede lid).
          - name: kaart_vermeldt_passagier
            type: boolean
            description: >-
              Of de verstrekte kaart met een hoofdletter P aangeeft dat zij voor
              een gehandicapte passagier is (Regeling gehandicaptenparkeerkaart,
              artikel 1, tweede lid).
          - name: kaart_geldig_tot
            type: date
            nullable: true
            description: >-
              De laatste dag waarop de verstrekte kaart geldig is (artikel 51,
              eerste lid); leeg als geen kaart wordt verstrekt.
        actions:
          # Lid 1, met artikel 1 van de regeling: de aanvrager komt in
          # aanmerking voor wat hij vraagt, als bestuurder, als passagier of
          # als beide. Eigen keuze: wie als bestuurder en als passagier vraagt
          # en maar voor een van beide in aanmerking komt, krijgt een kaart met
          # alleen die letter. En het college gebruikt zijn bevoegdheid, zoals
          # zijn beleid dat invult.
          - output: gehandicaptenparkeerkaart_verstrekt
            value:
              operation: AND
              conditions:
                - operation: OR
                  conditions:
                    - operation: AND
                      conditions:
                        - $kaart_als_bestuurder
                        - $komt_in_aanmerking_als_bestuurder
                    - operation: AND
                      conditions:
                        - $kaart_als_passagier
                        - $komt_in_aanmerking_als_passagier
                - $bevoegdheid_tot_verstrekken_gebruikt
          - output: kaart_vermeldt_bestuurder
            value:
              operation: AND
              conditions:
                - $gehandicaptenparkeerkaart_verstrekt
                - $kaart_als_bestuurder
                - $komt_in_aanmerking_als_bestuurder
          - output: kaart_vermeldt_passagier
            value:
              operation: AND
              conditions:
                - $gehandicaptenparkeerkaart_verstrekt
                - $kaart_als_passagier
                - $komt_in_aanmerking_als_passagier
          - output: kaart_geldig_tot
            value:
              operation: IF
              cases:
                - when: $gehandicaptenparkeerkaart_verstrekt
                  then: $einde_geldigheidsduur_bij_afgifte
              default: null
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0035917
        artikel: 3.1.1
  - number: '50'
    text: >-
      De houder van een gehandicaptenparkeerkaart laat van de kaart geen gebruik maken indien het parkeren niet
      rechtstreeks verband houdt met het vervoer van hemzelf, dan wel van het vervoer van gehandicapten die verblijven in
      de instelling waaraan de kaart is verstrekt.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel50
  - number: '51'
    text: >-
      1 Behoudens het tweede en het derde lid is een gehandicaptenparkeerkaart geldig voor de duur van vijf
      achtereenvolgende jaren, gerekend vanaf de dag van afgifte.


      2 Indien redelijke grond bestaat voor de verwachting dat de termijn gedurende welke de gehandicapte in aanmerking
      komt voor een gehandicaptenparkeerkaart, korter zal zijn dan vijf jaren, beperkt het gezag dat bevoegd is tot de
      afgifte van gehandicaptenparkeerkaarten, de geldigheidsduur tot die termijn.


      3 Indien een gehandicaptenparkeerkaart wordt afgegeven aan een aanvrager die tijdelijk in Nederland verblijft,
      beperkt het gezag dat bevoegd is tot de afgifte van gehandicaptenparkeerkaarten, de geldigheidsduur van de kaart
      tot de termijn van verblijf van de aanvrager in Nederland.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel51
    machine_readable:
      # Lid 1. Lid 2 (een kortere termijn als redelijke grond bestaat voor de
      # verwachting dat de gehandicapte korter in aanmerking komt) en lid 3
      # (tijdelijk verblijf in Nederland) zijn niet gemodelleerd.
      execution:
        parameters:
          - name: datum_afgifte
            type: date
            description: De dag waarop de gehandicaptenparkeerkaart is afgegeven.
        output:
          - name: einde_geldigheidsduur
            type: date
            description: >-
              De laatste dag van de vijf achtereenvolgende jaren, gerekend vanaf
              de dag van afgifte (lid 1).
        actions:
          # "gerekend vanaf de dag van afgifte": de dag van afgifte is de eerste
          # dag, dus vijf jaren eindigen de dag vóór dezelfde dag vijf jaar
          # later. Eigen keuze in de telling. Een kaart afgegeven op 29
          # februari: vijf jaar later is er geen 29 februari, dus de jaren
          # lopen tot en met 28 februari (DATE_ADD rondt af naar het einde van
          # de maand, en daar gaat geen dag meer af).
          - output: einde_geldigheidsduur
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject:
                          operation: DATE_PART
                          date: $datum_afgifte
                          in: month
                        value: 2
                      - operation: EQUALS
                        subject:
                          operation: DATE_PART
                          date: $datum_afgifte
                          in: day
                        value: 29
                  then:
                    operation: DATE_ADD
                    date: $datum_afgifte
                    years: 5
              default:
                operation: DATE_ADD
                date:
                  operation: DATE_ADD
                  date: $datum_afgifte
                  years: 5
                days: -1
  - number: '52'
    text: >-
      1 Het tot de afgifte van gehandicaptenparkeerkaarten bevoegde gezag geeft voor gehandicaptenparkeerkaarten die
      versleten of geheel of ten dele onleesbaar zijn, dan wel verloren zijn geraakt of teniet zijn gegaan, een duplicaat
      af.


      2 Indien de gehandicaptenparkeerkaart is versleten of geheel of ten dele onleesbaar is geworden, wordt een
      duplicaat slechts uitgereikt tegen inlevering van de versleten of geheel of ten dele onleesbare kaart.


      3 Indien de gehandicaptenparkeerkaart verloren is geraakt of teniet is gegaan, wordt een duplicaat slechts
      uitgereikt tegen overlegging van een door de aanvrager ondertekende verklaring, dat de kaart verloren is geraakt
      of teniet is gegaan. In de verklaring dienen de omstandigheden waaronder de kaart verloren geraakt of teniet gegaan
      is, te worden omschreven.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel52
  - number: '53'
    text: |-
      1 Een gehandicaptenparkeerkaart verliest zijn geldigheid:

      a. door het verstrijken van de geldigheidsduur;

      b. door afgifte van een nieuwe gehandicaptenparkeerkaart of een duplicaat gehandicaptenparkeerkaart;

      c. door het onbevoegd daarin aanbrengen van wijzigingen;

      d. door het overlijden van de houder;

      e. door ongeldigverklaring.

      2 Het gezag dat de gehandicaptenparkeerkaart heeft afgegeven, verklaart de kaart ongeldig indien deze is afgegeven
      op grond van door de aanvrager verschafte onjuiste gegevens en de kaart niet zou zijn afgegeven indien de
      onjuistheid van die gegevens ten tijde van de aanvraag bekend zou zijn geweest.

      3 Het gezag dat de gehandicaptenparkeerkaart heeft afgegeven, kan de kaart ongeldig verklaren indien de houder van
      de kaart gebruik laat maken in strijd met [artikel 50][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel50
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '50'
        hoofdstuk: IV
  - number: '54'
    text: >-
      Indien een gehandicaptenparkeerkaart zijn geldigheid heeft verloren, levert de gehandicapte aan wie de kaart is
      verstrekt of, indien deze is overleden, degene die de kaart onder zich heeft, de kaart zo spoedig mogelijk in bij
      het gezag dat de kaart heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel54
  - number: '55'
    text: >-
      1 Bij ministeriële regeling worden voorschriften vastgesteld omtrent:


      a. de bestelling van gehandicaptenparkeerkaarten;


      b. de afgifte van gehandicaptenparkeerkaarten;


      c. de wijze waarop een gehandicaptenparkeerkaart in een voertuig moet worden aangebracht.


      2 Het model van de gehandicaptenparkeerkaart wordt vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel55
  - number: '56'
    text: |-
      1 Verkeersregelaars worden aangesteld door:

      a. Onze Minister, indien het gaat om

      1°. transportbegeleiders, of

      2°. verkeersregelaars met in het kader van het beroep verkeersregelende taken, voor zover deze taken in meerdere
      provincies op het grondgebied van meerdere niet aangrenzende gemeenten worden uitgevoerd.

      b. de burgemeester van de gemeente waar de werkzaamheden worden verricht, in de overige gevallen.

      2 Verkeersregelaars met in het kader van het beroep verkeersregelende taken worden uitsluitend als zodanig
      aangesteld indien deze taken naar het oordeel van het tot aanstelling bevoegd gezag:

      a. als hun hoofdwerkzaamheden worden beschouwd, of

      b. geacht worden nauw verband te houden met de uitoefening van hun hoofdwerkzaamheden.

      3 Het in het eerste lid genoemde bestuursorgaan kan de door hem afgegeven aanstelling in de bij ministeriële
      regeling aangegeven gevallen intrekken.

      4 Verkeersbrigadiers als bedoeld in [artikel 82, derde lid, van het RVV 1990][ref1], worden aangesteld door de
      burgemeester.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '57'
    text: |-
      Op verkeersregelaars, personen als bedoeld in [artikel 82, eerste lid, onderdeel d, van het RVV 1990][ref1] en op
      verkeersbrigadiers wordt toezicht gehouden door de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel82
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '82'
  - number: '58'
    text: >-
      Bij ministeriële regeling worden voorschriften vastgesteld omtrent:


      a. de aanstelling, de verlenging van de aanstelling van verkeersregelaars, alsmede de aanstelling van
      verkeersbrigadiers;


      b. het toezicht op verkeersregelaars en verkeersbrigadiers;


      c. de opleiding van verkeersbrigadiers;


      d. de opleiding en examinering van verkeersregelaars;


      e. de plaatsen waar en de tijdstippen waarop verkeersregelaars en verkeersbrigadiers hun taken mogen uitoefenen;


      f. de uitoefening van de bevoegdheden van verkeersregelaars en verkeersbrigadiers;


      g. de aanstellingspas;


      h. de gevallen waarin de aanstelling kan worden ingetrokken;


      i. de uitrusting van verkeersregelaars en verkeersbrigadiers, alsmede de begeleidingsvoertuigen en de hulpmiddelen
      die daarin aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel58
  - number: 58a
    text: |-
      1 Transportbegeleiders maken tijdens de uitoefening van hun werkzaamheden gebruik van een begeleidingsvoertuig dat
      voldoet aan de in de ministeriële regeling, bedoeld in [artikel 58, onderdeel i][ref1], opgenomen eisen.

      2 Verkeersregelaars dragen tijdens de uitoefening van hun werkzaamheden de kleding voorgeschreven in de
      ministeriële regeling, bedoeld in [artikel 58, onderdeel i][ref2].

      3 Verkeersregelaars die krachtens de wet moeten beschikken over een aanstellingspas zijn verplicht dit document op
      eerste vordering van de in [artikel 159, eerste lid, onderdeel a, van de wet][ref3] genoemde personen ter inzage af
      te geven.

      4 Aanwijzingen als bedoeld in [artikel 82, eerste lid, van het RVV 1990][ref4], worden voor zover het betreft
      verkeersregelaars niet zijnde weginspecteurs in dienst van Rijkswaterstaat, niet gegeven vanaf een motorrijtuig
      of, voorzover het betreft verkeersregelaars niet zijnde transportbegeleiders of weginspecteurs in dienst van
      Rijkswaterstaat, vanuit een motorrijtuig.

      5 Onverminderd het vierde lid, geven transportbegeleiders of weginspecteurs in dienst van Rijkswaterstaat vanuit
      een motorrijtuig geen aanwijzingen als bedoeld in [artikel 82, eerste lid, van het RVV 1990][ref5], op wegen onder
      beheer van het Rijk of op kruispunten gelegen op andere wegen.

      6 Transportbegeleiders houden zich aan de in de ministeriële regeling gestelde regels als bedoeld in
      [artikel 58, onderdeel f][ref6], over de uitoefening van hun bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref4]: https://wetten.overheid.nl/BWBR0004825#Artikel82
      [ref5]: https://wetten.overheid.nl/BWBR0004825#Artikel82
      [ref6]: https://wetten.overheid.nl/BWBR0004826#Artikel58
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '58'
        hoofdstuk: V
      - id: ref2
