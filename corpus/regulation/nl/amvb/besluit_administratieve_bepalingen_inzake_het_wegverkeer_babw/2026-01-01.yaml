  - number: '7'
    text: Andere verkeerstekens dan de in dit hoofdstuk genoemde worden niet geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel7
  - number: '8'
    text: |-
      1 Onder verkeersborden kunnen onderborden worden geplaatst.

      2 Deze onderborden kunnen:

      a. een nadere uitleg van de op de verkeersborden voorkomende aanduiding inhouden;

      b. bij verkeersborden die een gebod of verbod aanduiden, een beperking van de werkingssfeer van die verkeersborden
      inhouden;

      c. bij bord C7 van [bijlage I, behorende bij het RVV 1990][ref1], de aanduiding inhouden dat de uit
      dit verkeersbord voortvloeiende beperking niet geldt voor motorvoertuigen die zijn voorzien van een
      gezichtsveldverbeterende voorziening;

      d. bij de verkeersborden E4 tot en met E8 en E10 tot en met E13 van [bijlage 1, behorende bij het RVV 1990][ref2],
      betrekking hebben op

      1°. de voertuigcategorie of groep voertuigen waarvoor de parkeergelegenheid is bestemd en, voor zover het betreft
      bord E6, tevens op de aanduiding dat de parkeergelegenheid is gereserveerd voor een bepaald voertuig;

      2°. de wijze waarop of het doel waarmee het parkeren dient te geschieden;

      3°. de dagen of uren waarop het parkeren is verboden of

      4°. de dagen of uren waarop een beperking als bedoeld in 1° en 2° geldt en, voor zover:

      - het verkeersbord E6 betreft, de dagen of uren waarop het in het
      [tweede lid van artikel 26 van het RVV 1990][ref3] bedoelde gebruik van de parkeerschijf van toepassing is, en
      - het verkeersbord E10 betreft, de dagen of uren waarop het in het
      [tweede lid van artikel 25 van het RVV 1990][ref4] bedoelde gebruik van de parkeerschijf van toepassing is;

      e. bij de verkeersborden G7, G9, G11 en G12a van [bijlage 1, behorende bij het RVV 1990][ref5], een aanduiding
      inhouden dat de uit het verkeersbord voortvloeiende geboden of verboden niet gelden voor het verkeersgebruik als op
      het onderbord is aangegeven;

      f. bij het verkeersbord G11 van [bijlage 1, behorende bij het RVV 1990][ref6], een aanduiding inhoudende dat het
      gebruik van het fietspad niet is toegestaan voor snorfietsen, waaronder hier niet begrepen worden bromfietsen die
      zijn aangewezen op grond van [artikel 20b, eerste lid, van de wet][ref7].

      3 De in het tweede lid, onderdeel d, onder 1° en 2°, bedoelde aanduidingen kunnen in plaats van op een onderbord,
      ook op het verkeersbord worden aangebracht.

      4 Bij verkeersbord C22e, van [bijlage 1, behorende bij het RVV 1990][ref8], wordt een of meerdere onderborden
      geplaatst als bedoeld in de [artikelen 86d][ref9] en [86e van het RVV 1990][ref10]. De onderborden C22e4 en C22e5
      kunnen alleen in combinatie met het onderbord C22e1 geplaatst worden.


