  - number: '12'
    text: |-
      De plaatsing of verwijdering van de hierna genoemde verkeerstekens moet geschieden krachtens een verkeersbesluit:

      a. de volgende borden:

      I de borden die zijn opgenomen in de hoofdstukken A tot en met G van [bijlage 1, behorende bij het RVV 1990][ref1],
      uitgezonderd de borden C22 en E9, alsmede de borden E4, E12 en E13 tenzij onder deze verkeersborden een onderbord
      als bedoeld in artikel 8, tweede lid, onderdeel d, wordt aangebracht, dan wel toepassing wordt gegeven aan artikel
      8, derde lid;

      II bord L3 van [bijlage 1, behorende bij het RVV 1990][ref2], voor zover het een bushalte betreft;

      b. de volgende verkeerstekens op het wegdek:

      I. doorgetrokken strepen;

      II. de aanduiding van fietsstroken;

      III. de aanduiding van busstroken en busbanen;

      IV. voetgangersoversteekplaatsen;

      V. gele doorgetrokken strepen;

      VI. gele onderbroken strepen;

      VII. haaietanden.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0004825
  - number: '13'
    text: >-
      In het verkeersbesluit tot plaatsing van borden die de snelheid, het parkeren of geslotenverklaringen betreffen
      alsmede van bord G7 kan worden bepaald, dat de door deze borden aangeduide geboden of verboden gelden in een
      bepaald gebied.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel13
  - number: '14'
    text: |-
      Indien onder de in deze paragraaf genoemde verkeersborden onderborden als bedoeld in
      [artikel 8, tweede en vierde lid][ref1], worden geplaatst, of toepassing wordt gegeven aan artikel 8, derde lid,
      wordt zulks in het betrokken verkeersbesluit tot uitdrukking gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel8
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14a
    text: |-
      Indien het onderbord, bedoeld in [artikel 8, tweede lid, onderdeel f][ref1], wordt geplaatst, vermeldt het
      verkeersbesluit de bijzondere redenen daarvoor. Deze redenen hebben betrekking op het vanwege grote drukte op een
      fietspad of op plaatsen binnen het stelsel van de in het verkeersbesluit betrokken fietspaden:

      a. verzekeren van de veiligheid op de weg, en

      b. waarborgen van de bruikbaarheid van de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel8
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15'
    text: |-
      In het verkeersbesluit tot plaatsing van bord A1, voorzover dit aanduidt dat een maximumsnelheid van 30 km/h of 60
      km/h geldt, bord B3, B4, B5 of B6 op een 30 km/h- of 60 km/h weg of in een 30 km/h- of 60 km/hzone, en bord G5
      van [bijlage 1, behorende bij het RVV 1990][ref1], wordt aangegeven op welke wijze wordt voldaan aan de krachtens
      [artikel 14 van de wet][ref2] gestelde voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0004825
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel14
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004825
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '14'
  - number: '16'
    text: >-
      Geen verkeersbesluit behoeft te worden genomen indien het betrokken verkeersteken wordt geplaatst of verwijderd
      ter nadere aanduiding dat een verkeersregel van toepassing is dan wel dat een ander verkeersteken dat een gebod of
      verbod inhoudt is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel16
  - number: '18'
    text: In het verkeersbesluit worden de aard en de omvang van de maatregelen aangegeven.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel18
  - number: '19'
    text: >-
      Geen verkeersbesluit behoeft te worden genomen, indien de betrokken maatregel strekt tot ondersteuning van een
      verkeersregel of een aldaar geplaatst verkeersteken dat een gebod of verbod inhoudt.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel19
  - number: '21'
    text: |-
      De motivering van het verkeersbesluit vermeldt in ieder geval welke doelstelling of doelstellingen met het
      verkeersbesluit worden beoogd. Daarbij wordt aangegeven welke van de in [artikel 2, eerste en tweede lid][ref1],
      van de wet genoemde belangen ten grondslag liggen aan het verkeersbesluit. Indien tevens andere van de in
      [artikel 2, eerste en tweede lid][ref2], van de wet genoemde belangen in het geding zijn, wordt voorts aangegeven
      op welke wijze de belangen tegen elkaar zijn afgewogen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '2'
  - number: 21a
    text: |-
      1 Op het nemen van een verkeersbesluit dat leidt tot een toename van het geluid door een weg in beheer
      bij een gemeente of waterschap met meer dan 1,5 dB, zijn de [artikelen 5.78a][ref1], [5.78i][ref2],
      [5.78m, tweede en derde lid][ref3], [5.78n][ref4] en [5.78o van het Besluit kwaliteit leefomgeving][ref5] van
      overeenkomstige toepassing, waarbij voor «een omgevingsplan dat een wijziging van een gemeenteweg, waterschapsweg
      of lokale spoorweg of een wijziging van het gebruik van een lokale spoorweg toelaat», «de wijziging van het
      omgevingsplan» en «een omgevingsplan dat de aanleg of wijziging van een gemeenteweg, waterschapsweg of lokale
      spoorweg toelaat of dat regels bevat over een wijziging van het gebruik van een lokale spoorweg» wordt gelezen:
      «het verkeersbesluit».

      2 De in het eerste lid bedoelde toename wordt bepaald door de situatie in een voor het verkeer op die weg
      maatgevend jaar nadat het verkeersbesluit is genomen, te vergelijken met de situatie in datzelfde jaar in het geval
      het verkeersbesluit niet genomen zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0041313#Artikel5.78a
      [ref2]: https://wetten.overheid.nl/BWBR0041313#Artikel5.78i
      [ref3]: https://wetten.overheid.nl/BWBR0041313#Artikel5.78m
      [ref4]: https://wetten.overheid.nl/BWBR0041313#Artikel5.78n
      [ref5]: https://wetten.overheid.nl/BWBR0041313#Artikel5.78o
