  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Op de voordracht van Onze Minister van Verkeer en Waterstaat van 12 mei 1989, nr. RW 26148, Hoofddirectie van de
    Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;


    Gelet op de Wegenverkeerswet (Stb. 1935, 554);


    De Raad van State gehoord (advies van 5 december 1989, nr. W09.89.0261);


    Gezien het nader rapport van Onze Minister van Verkeer en Waterstaat van 16 juli 1990, nr. RW 65900, Hoofddirectie
    van de Waterstaat, Hoofdafdeling Bestuurlijke en Juridische Zaken;


    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder:

      a. *begeleidingsvoertuig:* bedrijfsauto als bedoeld in [artikel 1.1, van de Regeling voertuigen][ref1],
      met een toegestane maximummassa van niet meer dan 3500 kg dat is
      bestemd voor de begeleiding van exceptionele transporten als bedoeld in
      [artikel 1, onderdeel c, van het Besluit ontheffingverlening Dienst Wegverkeer exceptionele transporten][ref2];

      b. *verkeersregelaar met in het kader van zijn beroep verkeersregelende taken:* verkeersregelaar, niet zijnde
      transportbegeleider of verkeersregelaar die tot taak heeft eenvoudige verkeersregelende werkzaamheden te verrichten
      bij evenementen, die uit hoofde van zijn beroep verkeersregelende werkzaamheden verricht;

      c. *bevoegd gezag:* gezag als bedoeld in [artikel 18, eerste lid, van de wet][ref3];

      d. *gezichtsveldverbeterende voorziening:* voorziening als bedoeld in
      [artikel 5.3.45, zesde en elfde lid, van de Regeling voertuigen][ref4];

      e. *wegvak:* gedeelte van een weg tussen twee zijwegen of – indien geen zijweg aanwezig is – tussen twee punten
      waarop een verkeersmaatregel betrekking heeft;

      f. *experiment:* experiment als bedoeld in [artikel 186 van de wet][ref5];

      g. *experimentverkeersbesluit:* verkeersbesluit als bedoeld in [artikel 60][ref6];

      h. *transportbegeleider:* verkeersregelaar die optreedt ter begeleiding van een exceptioneel transport als bedoeld
      in [artikel 1, onderdeel c, van het Besluit ontheffingverlening Dienst Wegverkeer exceptionele transporten][ref7];

      i. *verkeersregelaar:* persoon behorend tot de ingevolge [artikel 12, eerste lid, van de wet][ref8], aangewezen
      categorie, niet zijnde een persoon als bedoeld in [artikel 82, eerste lid, onderdeel d][ref9], of artikel 82, derde
      lid, van het RVV 1990;

      j. *wet:* [Wegenverkeerswet 1994](onbekend);

      k. *verwerking van kentekengegevens:* verwerking van persoonsgegevens in de zin van
      [artikel 1, onderdeel b, van de Wet bescherming persoonsgegevens][ref10], met betrekking tot kentekengegevens;

      l. *verantwoordelijke:* verantwoordelijke als bedoeld in
      [artikel 1, onderdeel d, van de Wet bescherming persoonsgegevens][ref11];

      m. *technisch hulpmiddel:* hulpmiddel waarmee kentekens van voertuigen automatisch worden gefotografeerd of op
      andere wijze automatisch worden geregistreerd;

      n. *kentekengegevens:* de gegevens omtrent de naam, het adres en de woonplaats van de kentekenhouder, het kenteken
      van het voertuig, de locatie en het tijdstip van de registratie daarvan, de foto-opname of andere wijze van
      registratie van het kenteken en de kenmerken van het motorvoertuig;

      o. *kentekenhouder:* degene op wiens naam het kenteken is gesteld;

      p. *verkeersonderzoek:* onderzoek naar verkeersstromen, ten behoeve van maatregelen om de veiligheid en
      doorstroming op wegen te bevorderen;

      q. *spitsmijdenproject:* door of in samenwerking met Onze Minister geïnitieerd mobiliteitsproject waarbij frequente
      spitsreizigers in het wegverkeer uitgenodigd worden om in ruil voor een beloning de spitstijden te gaan mijden
      door buiten de spitstijden, met een andere vervoersmodaliteit of, binnen het kader van de doelstellingen van het
      project, helemaal niet meer te gaan reizen.


