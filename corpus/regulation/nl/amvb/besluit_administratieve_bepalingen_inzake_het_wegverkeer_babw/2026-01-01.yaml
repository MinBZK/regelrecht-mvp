  - number: '23'
    text: >-
      Het openbaar lichaam dat het beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, de
      eigenaar van de weg wordt met betrekking tot verkeersbesluiten gehoord.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel23
  - number: '24'
    text: |-
      Verkeersbesluiten worden genomen na overleg met:

      a. de korpschef,

      b. de commandant van de Koninklijke marechaussee, indien de taak ten aanzien van het verkeer mede wordt vervuld op
      een luchtvaartterrein als bedoeld in [artikel 4, eerste lid, onder c, van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
  - number: '25'
    text: |-
      1 Verkeersbesluiten als gevolg waarvan het verkeer op wegen anders dan die waarop het verkeersbesluit betrekking
      heeft rechtstreeks en ingrijpend wordt beïnvloed, worden genomen na overleg met het ten aanzien van die andere
      wegen bevoegd gezag.

      2 Verkeersbesluiten worden genomen na overleg met de betrokken spoorwegbeheerder, indien het besluit maatregelen
      betreft nabij een overweg als bedoeld in [artikel 1, onderdeel aab, van het RVV 1990][ref1] , waardoor het verkeer
      over die overweg wordt beïnvloed.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel1
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '1'
  - number: '26'
    text: |-
      De bekendmaking van verkeersbesluiten geschiedt op de in de [artikelen 5][ref1] onderscheidenlijk
      [6 van de Bekendmakingswet][ref2] bepaalde wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0004287#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0004287#Artikel6
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004287
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0004287
        artikel: '6'
  - number: '27'
    text: |-
      Verkeersbesluiten als bedoeld in [artikel 15, tweede lid][ref1], van de wet treden in werking met ingang van de
      dag, nadat een termijn van zes weken na de dag waarop het besluit is bekend gemaakt, is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel15
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '15'
  - number: '29'
    text: >-
      De kosten, voortvloeiende uit de plaatsing van bord E6 van [bijlage I, behorende bij het RVV 1990](onbekend),
      kunnen worden verhaald op degene of degenen ten behoeve van wie het bord is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel29
  - number: '33'
    text: >-
      Indien in, op, boven of langs een weg activiteiten worden ondernomen welke niet behoren tot het normale
      verkeersgebruik van die weg en het bevoegd gezag het noodzakelijk acht verkeerstekens te plaatsen of te verwijderen
      in verband met die activiteiten, kan het bevoegd gezag de kosten die het voor de plaatsing, het onderhoud of de
      verwijdering heeft gemaakt ten laste brengen van degene die deze activiteiten uitvoert.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel33
  - number: '34'
    text: |-
      Door het bevoegd gezag dan wel door het openbaar lichaam, dat het beheer heeft over een weg of, indien geen
      openbaar lichaam het beheer heeft, door de eigenaar van de weg kunnen in de hierna genoemde omstandigheden en
      voor de duur van die omstandigheden verkeerstekens als bedoeld in [artikel 12][ref1], worden geplaatst alsmede
      maatregelen als bedoeld in [artikel 15, tweede lid][ref2], van de wet, worden uitgevoerd:

      a. ingeval van de uitvoering van werken, opdooi, de doorweekte toestand van een weg of weggedeelte, dreigend gevaar
      of andere dringende omstandigheid van voorbijgaande aard;

      b. ingeval van een door het wegverkeer veroorzaakte ernstige aantasting van voorbijgaande aard van de in
      [het tweede lid, onder ][ref3] van de wet genoemde belangen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel2
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '12'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '2'
  - number: '35'
    text: |-
      De plaatsing van verkeerstekens en het uitvoeren van maatregelen, bedoeld in [artikel 34][ref1], kunnen geschieden
      zonder een daaraan ten grondslag liggend verkeersbesluit.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel34
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '34'
        hoofdstuk: II
        paragraaf: '8'
  - number: '36'
    text: >-
      Van het voornemen tot tijdelijke plaatsing van verkeerstekens en tot het tijdelijk uitvoeren van maatregelen of,
      indien hiertoe reeds is overgegaan, van dat feit wordt zo spoedig mogelijk kennis gegeven aan het bevoegd gezag dat
      de tijdelijke plaatsing of de tijdelijke maatregel ongedaan kan maken. De kennisgeving kan achterwege blijven voor
      zover dit gezag dit heeft bepaald.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel36
  - number: '37'
    text: |-
      In afwijking van [artikel 35][ref1] geschieden de tijdelijke plaatsing en de tijdelijke maatregel krachtens een
      verkeersbesluit indien de omstandigheden die tot de tijdelijke plaatsing of tot de tijdelijke maatregel leiden van
      langere duur zijn dan vier maanden dan wel zich regelmatig voordoen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel35
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '35'
        hoofdstuk: II
        paragraaf: '8'
  - number: '38'
    text: |-
      De met verkeersregeling belaste ambtenaren van politie die zijn aangesteld voor de uitvoering van de politietaak,
      en de buitengewone opsporingsambtenaren van de Inspectie Verkeer en Waterstaat, kunnen ten behoeve van
      verkeerscontroles en, indien in onvoorziene omstandigheden de afwikkeling van het verkeer zulks noodzakelijk maakt,
      voor ten hoogste drie uren verkeerstekens plaatsen en maatregelen uitvoeren zonder dat kennisgeving aan het bevoegd
      gezag behoeft te geschieden. Geschiedt de plaatsing of maatregel voor langere tijd, dan is [artikel 36][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel36
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '36'
        hoofdstuk: II
        paragraaf: '8'
  - number: '39'
    text: >-
      Indien de toestand van een waterkerende dijk waarop een weg is gelegen zulks vordert, heeft de onderhoudsplichtige
      van de dijk de bevoegdheid tot het tijdelijk plaatsen van verkeerstekens die een gebod of verbod inhouden alsmede
      tot het tijdelijk uitvoeren van maatregelen.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel39
  - number: '40'
    text: |-
      Door of namens de onderhoudsplichtige van de dijk wordt onverwijld aan Onze commissaris in de provincie en aan
      het openbaar lichaam, dat het beheer heeft over de weg of, indien geen openbaar lichaam het beheer heeft, aan de
      eigenaar van de weg kennis gegeven van het voornemen tot tijdelijke plaatsing en tot het tijdelijk uitvoeren van
      maatregelen bedoeld in [artikel 39][ref1] of, indien hiertoe reeds is overgegaan, van dat feit. Onze commissaris in
      de provincie kan de tijdelijke plaatsing of de tijdelijke maatregel ongedaan maken.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel39
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '39'
        hoofdstuk: II
        paragraaf: '8'
  - number: '41'
    text: |-
      Tot het ongedaan maken van de tijdelijke plaatsing van verkeerstekens of het tijdelijk uitvoeren van maatregelen
      als bedoeld in de [artikelen 36][ref1] en [40][ref2] kan worden overgegaan indien:

      a. de omstandigheden als bedoeld in [artikel 34][ref3] zich niet of niet langer voordoen of

      b. deze omstandigheden de plaatsing of de maatregel niet kunnen rechtvaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel34
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '36'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '40'
        hoofdstuk: II
        paragraaf: '8'
      - id: ref3
        bwb_id: BWBR0004826
        artikel: '34'
        hoofdstuk: II
        paragraaf: '8'
  - number: '42'
    text: |-
      1 Als verkeerstekens als bedoeld in [artikel 16, derde lid, van de wet][ref1] worden aangewezen de verkeerstekens
      die zijn opgenomen in [bijlage I, hoofdstuk K, van het Reglement verkeersregels en verkeerstekens 1990][ref2], met
      uitzondering van bord K14.

      2 In afwijking van het eerste lid worden onder de categorie bewegwijzering niet begrepen verkeerstekens die
      geplaatst of verwijderd worden in verband met omstandigheden die niet van langere duur zijn dan vier maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004825
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0004825
  - number: '43'
    text: |-
      1 Een ontheffingverlening met toepassing van [artikel 149c van de wet][ref1] voor plaatsing of verwijdering van de
      verkeerstekens als bedoeld in [artikel 42][ref2] kan zowel ambtshalve plaatsvinden als op verzoek van degene die
      bevoegd is tot het plaatsen van deze verkeerstekens.

      2 Onze Minister kan de in het eerste lid bedoelde ontheffing slechts verlenen indien:

      a. voldoende bijzondere belangen aanwezig zijn voor de verkrijger van de ontheffing om geen uitvoering te geven aan
      [artikel 16, vierde lid, van de wet][ref3];

      b. de verkrijger van een ontheffing naar het oordeel van Onze Minister in staat is de bewegwijzering vast te
      stellen op een kwaliteitsniveau dat niet onderdoet voor het kwaliteitsniveau van de bewegwijzering dat zou worden
      bereikt bij het weigeren van de ontheffing;

      c. verzekerd is dat ontheffingverlening niet tot gevolg heeft dat er onvoldoende gelijkvormigheid is met en
      aansluiting is op de bewegwijzering buiten het geografische gebied waarvoor de ontheffing zal gelden, en

      d. de doelmatigheid van het tot stand brengen en vaststellen van ontwerpen voor bewegwijzering niet vermindert door
      het verlenen van de ontheffing.

      3 Een verzoek tot ontheffingverlening bevat de feitelijke gronden voor de overwegingen die ingevolge het tweede lid
      ten grondslag moeten liggen aan een besluit tot verlening van de ontheffing.

      4 Onze Minister stelt een elektronisch formulier vast waarmee het verzoek om ontheffing wordt ingediend, op de
      wijze als aangegeven op dat formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149c
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel16
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149c
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '42'
        hoofdstuk: IIA
      - id: ref3
        bwb_id: BWBR0006622
        artikel: '16'
  - number: '44'
    text: >-
      1 Het bestuursorgaan dat tot een verkeersonderzoek of een spitsmijdenproject besluit is de verantwoordelijke voor
      de verwerking van de persoonsgegevens die gebruikt worden voor het verkeersonderzoek of het spitsmijdenproject.


      2 De verantwoordelijke draagt ervoor zorg dat een verkeersonderzoek of een spitsmijdenproject ten minste tien
      dagen voor de start van het gebruik van een technisch hulpmiddel op de weg wordt aangekondigd in ten minste een
      persbericht in een door de verantwoordelijke te selecteren landelijk of regionaal nieuwsblad.


      3 Het bevoegd gezag kan ten behoeve van een verkeersonderzoek of een spitsmijdenproject kentekengegevens verwerken
      met behulp van een technisch hulpmiddel.


      4 De verwerking van kentekengegevens met behulp van een technisch hulpmiddel ten behoeve van een spitsmijdenproject
      is slechts toegestaan als er sprake is van:


      a. groot onderhoud of renovatiewerkzaamheden;


      b. werkzaamheden tijdens aanleg of uitbreiding van infrastructuur, of


      c. concrete voorbereiding van de feitelijke werkzaamheden beschreven onder a of b.


      5 Gedurende de zomervakanties worden geen kentekengegevens geregistreerd ten behoeve van spitsmijdenprojecten.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel44
  - number: '45'
    text: |-
      1 De verantwoordelijke draagt ervoor zorg dat kentekenhouders:

      a) na de in [artikel 44, tweede lid][ref1], genoemde aankondiging van een verkeersonderzoek binnen vier weken na
      de verwerking van persoonsgegevens met een technisch hulpmiddel schriftelijk worden uitgenodigd tot deelname aan
      het onderzoek;

      b) na de in [artikel 44, tweede lid][ref2], genoemde aankondiging van een spitsmijdenproject binnen twaalf weken
      na de verwerking van persoonsgegevens met een technisch hulpmiddel schriftelijk worden uitgenodigd tot deelname aan
      het project.

      2 De in het eerste lid, onder a en b, genoemde termijnen worden verlengd met de duur van binnen die termijn
      begonnen schoolvakanties.

      3 Indien een in het eerste lid genoemde termijn, na verlenging met toepassing van het tweede lid, wordt
      overschreden, dan worden de desbetreffende persoonsgegevens, onverminderd de gevallen als bedoeld in
      [artikel 47][ref3], direct vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel47
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '44'
        hoofdstuk: IIb
      - id: ref2
        bwb_id: BWBR0004826
        artikel: '44'
        hoofdstuk: IIb
      - id: ref3
        bwb_id: BWBR0004826
        artikel: '47'
        hoofdstuk: IIb
  - number: '46'
    text: |-
      1 De verantwoordelijke verstrekt kentekengegevens die voortkomen uit een verkeersonderzoek of een
      spitsmijdenproject niet dan na een daartoe strekkend verzoek, behoudens in het geval genoemd onder a, aan:

      a. de bewerker met wie een bewerkersovereenkomst is afgesloten, voor zover die overeenkomst in de verstrekking van
      gegevens voorziet;

      b. de kentekenhouder voor zover het gegevens betreft die op hem betrekking hebben;

      c. een verzekeraar als bedoeld in [artikel 1:1, van de Wet op het financieel toezicht][ref1], indien deze
      verzekeraar aannemelijk maakt dat deze gegevens noodzakelijk zijn voor het behartigen van de belangen van de bij
      hem verzekerde, voor zover het gaat om de kentekengegevens van deze verzekerde en nadat deze verzekerde daarvoor
      toestemming heeft verleend;

      d. een advocaat indien deze aannemelijk maakt dat deze gegevens noodzakelijk zijn voor het behartigen van de
      belangen van zijn cliënt en voor zover het gaat om de kentekengegevens van zijn cliënt nadat deze cliënt daarvoor
      toestemming heeft verleend.

      2 Een verzoek om verstrekking van gegevens wordt schriftelijk ingediend door degene, bedoeld in het eerste lid,
      onder b tot en met d, die de gegevens wenst te ontvangen.

      3 Bij het verstrekken van persoonsgegevens worden gegevens van andere personen geanonimiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 1:1
  - number: '47'
    text: >-
      Kentekengegevens die zijn verkregen met behulp van een technisch hulpmiddel worden:


      a. bij een verkeersonderzoek waarbij individuele deelname van de kentekenhouder niet nodig is, direct
      geanonimiseerd of gepseudonimiseerd;


      b. indien bij de selectie van kentekengegevens voor de uitnodiging voor een verkeersonderzoek of een
      spitsmijdenproject blijkt dat de kentekenhouder niet voldoende frequent op het betreffende wegvak wordt
      gesignaleerd voor een uitnodiging direct vernietigd;


      c. indien bij de selectie van kentekengegevens voor de uitnodiging voor spitsmijdenproject blijkt dat de
      kentekenhouder eerder heeft aangegeven niet benaderd te willen worden voor deze projecten direct vernietigd;


      d. indien de kentekenhouder laat blijken niet te willen deelnemen aan het verkeersonderzoek of het
      spitsmijdenproject direct nadat hij dit kenbaar heeft gemaakt vernietigd;


      e. indien de kentekenhouder binnen drie weken na daartoe schriftelijk te zijn uitgenodigd niet reageert op een
      uitnodiging tot deelname aan een verkeersonderzoek of spitsmijdenproject na het verstrijken van die periode direct
      vernietigd;


      f. indien de kentekenhouder heeft ingestemd met deelname aan het verkeersonderzoek of het spitsmijdenproject, niet
      langer bewaard dan vier weken na beëindiging van het verkeersonderzoek of spitsmijdenproject en uiterlijk aan het
      einde van die termijn geanonimiseerd of vernietigd.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel47
  - number: '48'
    text: |-
      Bij de vaststelling van de grenzen van de bebouwde kom of kommen als bedoeld in [artikel 20a][ref1] van de wet,
      zijn de [artikelen 23][ref2] en [24][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20a
      [ref2]: https://wetten.overheid.nl/BWBR0004826#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004826#Artikel24
