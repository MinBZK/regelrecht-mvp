        bwb_id: BWBR0004825
        artikel: '68'
  - number: '6'
    text: |-
      1 De verkeerstekens op het wegdek die een gebod of verbod betreffen zijn de verkeerstekens
      genoemd in [artikel 10, tweede lid][ref1], [artikel 23, eerste lid, onderdeel e en g][ref2],
      [artikel 24, eerste lid, onderdeel e][ref3], [artikel 25, eerste lid][ref4], [artikel 46, eerste lid][ref5],
      [artikel 49, tweede lid][ref6] en de [artikelen 76 tot en met 81 van het RVV 1990][ref7].

      2 Andere verkeerstekens op het wegdek kunnen worden aangebracht ter geleiding van het verkeer, ter herinnering aan
      de ter plaatse geldende maximumsnelheid en ter aanduiding van andere omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel10
