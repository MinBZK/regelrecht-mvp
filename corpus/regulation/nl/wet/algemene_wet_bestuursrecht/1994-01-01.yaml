---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.9/schema/v0.8.9/schema.json
$id: algemene_wet_bestuursrecht
regulatory_layer: WET
publication_date: '2026-01-01'
valid_from: '1994-01-01'
name: Algemene wet bestuursrecht
bwb_id: BWBR0005537
url: https://wetten.overheid.nl/BWBR0005537/2024-01-01

procedure:
  - id: beschikking
    default: true
    applies_to:
      legal_character: BESCHIKKING
    stages:
      - name: AANVRAAG
        description: Belanghebbende dient aanvraag in (AWB 4:1)
        requires:
          - name: aanvraag_datum
            type: date

      - name: BEHANDELING
        description: Bestuursorgaan onderzoekt de aanvraag (AWB 3:2)
        requires:
          - name: beslistermijn_start
            type: date

      - name: BESLUIT
        description: Bestuursorgaan neemt besluit (AWB 1:3)
        requires:
          - name: besluit_datum
            type: date

      - name: BEKENDMAKING
        description: Besluit wordt bekendgemaakt (AWB 3:41)
        requires:
          - name: bekendmaking_datum
            type: date

      - name: BEZWAAR
        description: Bezwaarperiode (AWB 6:4 e.v.)

articles:
  - number: '3:46'
    text: |-
      Een besluit dient te berusten op een deugdelijke motivering.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel3:46
    machine_readable:
      hooks:
        - hook_point: pre_actions
          applies_to:
            legal_character: BESCHIKKING
            stage: BESLUIT
      execution:
        output:
          - name: motivering_vereist
            type: boolean
        actions:
          - output: motivering_vereist
            value: true

  - number: '4:2'
    text: |-
      1. De aanvraag wordt ondertekend en bevat ten minste:
      a. de naam en het adres van de aanvrager;
      b. de dagtekening;
      c. een aanduiding van de beschikking die wordt gevraagd.
      2. De aanvrager verschaft voorts de gegevens en bescheiden die voor de
      beslissing op de aanvraag nodig zijn en waarover hij redelijkerwijs de
      beschikking kan krijgen.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel4:2
    machine_readable:
      # Lid 1: wat elke aanvraag ten minste bevat. Het artikel haakt op elke
      # aanvraag (RFC-045). Afdeling 4.1.1 gaat over de aanvraag om een
      # beschikking; dat onderscheid kent een haak nog niet, dus een aanvraag
      # om een ander besluit krijgt dit artikel nu ook. Lid 2 hangt af van de
      # beslissing op de aanvraag en is niet gemodelleerd.
      hooks:
        - hook_point: pre_actions
          applies_to:
            submission: AANVRAAG
      execution:
        parameters:
          - name: aanvraag_ondertekend
            type: boolean
            nullable: true
            required: false
            description: Of de aanvraag is ondertekend (lid 1, aanhef).
          - name: naam_aanvrager
            type: string
            nullable: true
            required: false
            description: De naam van de aanvrager (lid 1, onder a).
          - name: adres_aanvrager
            type: string
            nullable: true
            required: false
            description: Het adres van de aanvrager (lid 1, onder a).
          - name: dagtekening
            type: date
            nullable: true
            required: false
            description: De dagtekening van de aanvraag (lid 1, onder b).
          # Kan later volgen uit `requests` van het aanvraag-item (RFC-047).
          - name: gevraagde_beschikking
            type: string
            nullable: true
            required: false
            description: Een aanduiding van de beschikking die wordt gevraagd (lid 1, onder c).
        output:
          - name: aanvraag_bevat_wat_artikel_4_2_eist
            type: boolean
            description: Of de aanvraag is ondertekend en ten minste de gegevens van lid 1 bevat.
        actions:
          - output: aanvraag_bevat_wat_artikel_4_2_eist
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $aanvraag_ondertekend
                  value: true
                - operation: NOT
                  value: {operation: EQUALS, subject: $naam_aanvrager, value: null}
                - operation: NOT
                  value: {operation: EQUALS, subject: $adres_aanvrager, value: null}
                - operation: NOT
                  value: {operation: EQUALS, subject: $dagtekening, value: null}
                - operation: NOT
                  value: {operation: EQUALS, subject: $gevraagde_beschikking, value: null}

  - number: '4:13'
    text: |-
      1. Een beschikking dient te worden gegeven binnen de bij wettelijk
      voorschrift bepaalde termijn of, bij het ontbreken van zulk een termijn,
      binnen een redelijke termijn na ontvangst van de aanvraag.
      2. De in het eerste lid bedoelde redelijke termijn is in ieder geval
      verstreken wanneer het bestuursorgaan binnen acht weken na ontvangst van
      de aanvraag geen beschikking heeft gegeven, noch een mededeling als
      bedoeld in artikel 4:14, derde lid, heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel4:13
    machine_readable:
      # Lid 1: de beslistermijn loopt vanaf de ontvangst van de aanvraag; dat is
      # het moment dat voor de aanvraag rechtens telt.
      hooks:
        - hook_point: post_actions
          applies_to:
            submission: AANVRAAG
      execution:
        produces:
          moment:
            parameter: datum_ontvangst
            legal_basis:
              law: Algemene wet bestuursrecht
              bwb_id: BWBR0005537
              article: '4:13'
              paragraph: '1'
              url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel4:13
              juriconnect: jci1.3:c:BWBR0005537&artikel=4:13&lid=1&z=2024-01-01&g=2024-01-01
        parameters:
          - name: datum_ontvangst
            type: date
            required: false
            description: De dag waarop het bestuursorgaan de aanvraag ontving (lid 1).
        output:
          - name: redelijke_beslistermijn_einddatum
            type: date
            description: >-
              De laatste dag van de redelijke termijn van lid 1 voor zover lid 2
              die begrenst: acht weken na ontvangst. De dag erna is de termijn
              in ieder geval verstreken.
        actions:
          # Lid 2, voor een aanvraag waarvoor geen wettelijk voorschrift een
          # beslistermijn bepaalt (lid 1). Een wet met een eigen termijn gaat
          # voor; daarvoor is geen haak nodig maar een override. Een mededeling
          # als bedoeld in artikel 4:14, derde lid, is niet gemodelleerd.
          # Telling als bij artikel 6:8: de dag van ontvangst telt niet mee.
          # Verlenging door de Algemene termijnenwet (weekend, feestdag) is
          # niet gemodelleerd.
          - output: redelijke_beslistermijn_einddatum
            value:
              operation: DATE_ADD
              date: $datum_ontvangst
              weeks: 8

  - number: '6:4'
    text: |-
      1. Het maken van bezwaar geschiedt door het indienen van een
      bezwaarschrift bij het bestuursorgaan dat het besluit heeft genomen.
      2. Het instellen van administratief beroep geschiedt door het indienen
      van een beroepschrift bij het beroepsorgaan.
      3. Het instellen van beroep bij een bestuursrechter geschiedt door het
      indienen van een beroepschrift bij die rechter.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel6:4
    # Niet uitvoerbaar gemaakt. Lid 1 zegt bij wie het bezwaarschrift wordt
    # ingediend, zoals artikel 4:1 dat voor de aanvraag zegt. Het bezwaar zelf
    # ontstaat bij het artikel dat erop beslist (7:11), zoals de aanvraag om
    # vakantieverlof bij artikel 13a van de Leerplichtwet 1969 (RFC-050).

  - number: '6:5'
    text: |-
      1. Het bezwaar- of beroepschrift wordt ondertekend en bevat ten minste:
      a. de naam en het adres van de indiener;
      b. de dagtekening;
      c. een omschrijving van het besluit waartegen het bezwaar of beroep is
      gericht;
      d. de gronden van het bezwaar of beroep.
      2. Bij het beroepschrift wordt zo mogelijk een afschrift van het besluit
      waarop het geschil betrekking heeft, overgelegd.
      3. Indien het bezwaar- of beroepschrift in een vreemde taal is gesteld en
      een vertaling voor een goede behandeling van het bezwaar of beroep
      noodzakelijk is, dient de indiener zorg te dragen voor een vertaling.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel6:5
    machine_readable:
      # Lid 1, voor het bezwaarschrift. Het beroepschrift (lid 1 en 2) en de
      # vertaling (lid 3) zijn niet gemodelleerd. Wat volgt als het
      # bezwaarschrift niet voldoet, regelt artikel 6:6; dat is niet
      # gemodelleerd.
      hooks:
        - hook_point: pre_actions
          applies_to:
            submission: BEZWAAR
      execution:
        parameters:
          - name: bezwaarschrift_ondertekend
            type: boolean
            nullable: true
            required: false
            description: Of het bezwaarschrift is ondertekend (lid 1, aanhef).
          - name: naam_indiener
            type: string
            nullable: true
            required: false
            description: De naam van de indiener (lid 1, onder a).
          - name: adres_indiener
            type: string
            nullable: true
            required: false
            description: Het adres van de indiener (lid 1, onder a).
          - name: dagtekening_bezwaarschrift
            type: date
            nullable: true
            required: false
            description: De dagtekening van het bezwaarschrift (lid 1, onder b).
          - name: omschrijving_bestreden_besluit
            type: string
            nullable: true
            required: false
            description: Een omschrijving van het besluit waartegen het bezwaar is gericht (lid 1, onder c).
          - name: gronden_bezwaar
            type: string
            nullable: true
            required: false
            description: De gronden van het bezwaar (lid 1, onder d).
        output:
          - name: bezwaarschrift_bevat_wat_artikel_6_5_eist
            type: boolean
            description: Of het bezwaarschrift is ondertekend en ten minste de gegevens van lid 1 bevat.
        actions:
          - output: bezwaarschrift_bevat_wat_artikel_6_5_eist
            value:
              operation: AND
              conditions:
                - operation: EQUALS
                  subject: $bezwaarschrift_ondertekend
                  value: true
                - operation: NOT
                  value: {operation: EQUALS, subject: $naam_indiener, value: null}
                - operation: NOT
                  value: {operation: EQUALS, subject: $adres_indiener, value: null}
                - operation: NOT
                  value: {operation: EQUALS, subject: $dagtekening_bezwaarschrift, value: null}
                - operation: NOT
                  value: {operation: EQUALS, subject: $omschrijving_bestreden_besluit, value: null}
                - operation: NOT
                  value: {operation: EQUALS, subject: $gronden_bezwaar, value: null}

  - number: '6:7'
    text: |-
      De termijn voor het indienen van een bezwaar- of
      beroepschrift bedraagt zes weken.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel6:7
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            legal_character: BESCHIKKING
            stage: BESLUIT
      execution:
        output:
          - name: bezwaartermijn_weken
            type: number
        actions:
          - output: bezwaartermijn_weken
            value: 6

  - number: '6:8'
    text: |-
      1. De termijn vangt aan met ingang van de dag na die
      waarop het besluit op de voorgeschreven wijze is
      bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel6:8
    machine_readable:
      hooks:
        - hook_point: post_actions
          applies_to:
            legal_character: BESCHIKKING
            stage: BEKENDMAKING
      execution:
        parameters:
          - name: bekendmaking_datum
            type: date
            required: true
            description: Datum waarop het besluit is bekendgemaakt
        input:
          - name: bezwaartermijn_weken
            type: number
            source:
              regulation: algemene_wet_bestuursrecht
              output: bezwaartermijn_weken
        output:
          - name: bezwaartermijn_startdatum
            type: date
          - name: bezwaartermijn_einddatum
            type: date
        actions:
          # "met ingang van de dag na die waarop het besluit is bekendgemaakt"
          # startdatum = bekendmaking + 1 dag (dies a quo: bekendmakingsdatum telt niet mee)
          - output: bezwaartermijn_startdatum
            value:
              operation: DATE_ADD
              date: $bekendmaking_datum
              days: 1
          # einddatum = bekendmaking + termijn (NIET startdatum + termijn).
          # De startdatum is dag 1 van de termijn (inclusief), dus 6 weken
          # = 42 dagen gerekend vanaf startdatum = dag 42 = bekendmaking + 42.
          # startdatum + 6 weken zou dag 43 geven — één dag te veel.
          - output: bezwaartermijn_einddatum
            value:
              operation: DATE_ADD
              date: $bekendmaking_datum
              weeks: $bezwaartermijn_weken

  - number: '6:9'
    text: |-
      1. Een bezwaar- of beroepschrift is tijdig ingediend indien het voor het
      einde van de termijn is ontvangen.
      2. Bij verzending per post is een bezwaar- of beroepschrift tijdig
      ingediend indien het voor het einde van de termijn ter post is bezorgd,
      mits het niet later dan een week na afloop van de termijn is ontvangen.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel6:9
    machine_readable:
      # Lid 1: of het bezwaarschrift op tijd is, hangt af van de ontvangst. Dat
      # is het moment dat voor het bezwaar rechtens telt. Lid 2 (verzending
      # per post) is niet gemodelleerd. Een te laat bezwaarschrift is nog
      # steeds een bezwaarschrift; artikel 6:11 (verschoonbare
      # termijnoverschrijding) is niet gemodelleerd.
      hooks:
        - hook_point: post_actions
          applies_to:
            submission: BEZWAAR
      execution:
        produces:
          moment:
            parameter: datum_ontvangst_bezwaarschrift
            legal_basis:
              law: Algemene wet bestuursrecht
              bwb_id: BWBR0005537
              article: '6:9'
              paragraph: '1'
              url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel6:9
              juriconnect: jci1.3:c:BWBR0005537&artikel=6:9&lid=1&z=2024-01-01&g=2024-01-01
        parameters:
          - name: datum_ontvangst_bezwaarschrift
            type: date
            required: false
            description: De dag waarop het bestuursorgaan het bezwaarschrift ontving (lid 1).
          - name: bezwaartermijn_einddatum
            type: date
            required: false
            description: De laatste dag van de termijn voor het indienen van het bezwaarschrift (artikelen 6:7 en 6:8).
        output:
          - name: bezwaarschrift_tijdig_ingediend
            type: boolean
            description: Of het bezwaarschrift voor het einde van de termijn is ontvangen (lid 1).
        actions:
          # "voor het einde van de termijn": uiterlijk op de laatste dag.
          - output: bezwaarschrift_tijdig_ingediend
            value:
              operation: GREATER_THAN_OR_EQUAL
              subject:
                operation: DATE_DIFF
                from: $datum_ontvangst_bezwaarschrift
                to: $bezwaartermijn_einddatum
                in: days
              value: 0

  - number: '7:2'
    text: |-
      1. Voordat een bestuursorgaan op het bezwaar beslist, stelt het
      belanghebbenden in de gelegenheid te worden gehoord.
      2. Het bestuursorgaan stelt daarvan in ieder geval de indiener van het
      bezwaarschrift op de hoogte alsmede de belanghebbenden die bij de
      voorbereiding van het besluit hun zienswijze naar voren hebben gebracht.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel7:2
    # Niet gemodelleerd. Het horen is een handeling vóór de beslissing op het
    # bezwaar, geen berekening.

  - number: '7:10'
    text: |-
      1. Het bestuursorgaan beslist binnen zes weken of – indien een commissie
      als bedoeld in artikel 7:13 is ingesteld – binnen twaalf weken, gerekend
      vanaf de dag na die waarop de termijn voor het indienen van het
      bezwaarschrift is verstreken.
      2. De termijn wordt opgeschort gerekend vanaf de dag na die waarop de
      indiener is verzocht een verzuim als bedoeld in artikel 6:6 te
      herstellen, tot de dag waarop het verzuim is hersteld of de daarvoor
      gestelde termijn ongebruikt is verstreken.
      3. Het bestuursorgaan kan de beslissing voor ten hoogste zes weken
      verdagen.
      4. Verder uitstel is mogelijk voor zover:
      a. alle belanghebbenden daarmee instemmen,
      b. de indiener van het bezwaarschrift daarmee instemt en andere
      belanghebbenden daardoor niet in hun belangen kunnen worden geschaad, of
      c. dit nodig is in verband met de naleving van wettelijke
      procedurevoorschriften.
      5. Indien toepassing is gegeven aan het tweede, derde of vierde lid, doet
      het bestuursorgaan hiervan schriftelijk mededeling aan belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel7:10
    machine_readable:
      # Lid 1, zonder commissie als bedoeld in artikel 7:13. Opschorting (lid 2),
      # verdaging (lid 3) en verder uitstel (lid 4) zijn niet gemodelleerd.
      hooks:
        - hook_point: post_actions
          applies_to:
            submission: BEZWAAR
      execution:
        parameters:
          - name: bezwaartermijn_einddatum
            type: date
            required: false
            description: De laatste dag van de termijn voor het indienen van het bezwaarschrift (artikelen 6:7 en 6:8).
        output:
          - name: beslistermijn_bezwaar_einddatum
            type: date
            description: De laatste dag waarop het bestuursorgaan op het bezwaar beslist (lid 1).
        actions:
          # Telling als bij artikel 6:8: de dag na het verstrijken van de
          # bezwaartermijn is de eerste dag, dus zes weken eindigen op de
          # laatste dag van de bezwaartermijn plus zes weken.
          - output: beslistermijn_bezwaar_einddatum
            value:
              operation: DATE_ADD
              date: $bezwaartermijn_einddatum
              weeks: 6

  - number: '7:11'
    text: |-
      1. Indien het bezwaar ontvankelijk is, vindt op grondslag daarvan een
      heroverweging van het bestreden besluit plaats.
      2. Voor zover de heroverweging daartoe aanleiding geeft, herroept het
      bestuursorgaan het bestreden besluit en neemt het voor zover nodig in de
      plaats daarvan een nieuw besluit.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel7:11
    machine_readable:
      # Lid 1: de heroverweging van het bestreden besluit is dat besluit
      # opnieuw nemen, onder het artikel waarop het berust, met zijn gegevens
      # en wat het bestuursorgaan bij de heroverweging opnieuw oordeelt. Lid 2:
      # geeft dat een andere uitkomst, dan herroept het bestuursorgaan het
      # besluit en neemt het in zijn plaats het besluit dat de heroverweging
      # gaf (RFC-050).
      execution:
        # Lid 1: de heroverweging vindt plaats "op grondslag van" het bezwaar.
        # Dit artikel brengt twee dingen voort, zoals artikel 13a van de
        # Leerplichtwet 1969 de aanvraag en het besluit erop (RFC-047,
        # RFC-050). Het bezwaar, waar de Awb op haakt (6:5, 6:9, 7:10), met
        # het bestreden besluit. En de beslissing op het bezwaar, een besluit
        # dat de procedure van de Awb volgt, met de uitvoer die daarbij hoort.
        # Eigen keuze: de beslissing op bezwaar tegen een beschikking is zelf
        # een beschikking. Bezwaar tegen een ander besluit is niet
        # gemodelleerd.
        produces:
          - type: BEZWAAR
            requests: algemene_wet_bestuursrecht#7:11
            parameters:
              - bestreden_besluit
          - type: BESCHIKKING
            outputs:
              - bezwaar_ontvankelijk
              - heroverweging_geeft_aanleiding
              - bestreden_besluit_herroepen
              - nieuw_besluit
        parameters:
          # Lid 1 en 2: "het bestreden besluit"; het bezwaarschrift omschrijft
          # het (artikel 6:5, eerste lid, onder c). De indiener levert het
          # niet als gegeven aan: het is een besluit dat het bestuursorgaan
          # nam.
          - name: bestreden_besluit
            type: decision
            description: Het besluit waartegen het bezwaar is gericht.
          # Wat artikel 6:9 bij het bezwaarschrift geeft; de indiener levert
          # het niet aan.
          - name: bezwaarschrift_tijdig_ingediend
            type: boolean
            description: Of het bezwaarschrift tijdig is ingediend (artikel 6:9).
        input:
          # Lid 1: de heroverweging. Het bestreden besluit opnieuw genomen,
          # op de dag van de beslissing op het bezwaar (ex nunc), met zijn
          # eigen gegevens en bevindingen; wat het bestuursorgaan opnieuw
          # vaststelt, geeft de uitvoering mee (RFC-050). Alleen gelezen als
          # het bezwaar ontvankelijk is.
          - name: heroverweging
            type: decision
            nullable: true
            source:
              article: $bestreden_besluit
        output:
          - name: bezwaar_ontvankelijk
            type: boolean
            description: >-
              Of het bezwaar ontvankelijk is (lid 1). Getoetst zijn de termijn
              (artikel 6:9) en dat het bestreden besluit niet op bezwaar onder
              dit artikel is genomen (artikel 7:1, eerste lid, onder a): de
              beslissing op bezwaar niet, en het nieuwe besluit dat zij in de
              plaats van een herroepen besluit nam evenmin. De overige
              vereisten en artikel 6:11 nog niet.
          - name: heroverweging_geeft_aanleiding
            type: boolean
            nullable: true
            description: >-
              Of de heroverweging aanleiding geeft het bestreden besluit te
              herroepen (lid 2). Leeg bij een niet-ontvankelijk bezwaar: dan
              vindt geen heroverweging plaats (lid 1).
          - name: bestreden_besluit_herroepen
            type: boolean
            description: Of het bestuursorgaan het bestreden besluit herroept (lid 2).
          - name: nieuw_besluit
            type: decision
            nullable: true
            description: >-
              Het besluit dat het bestuursorgaan in de plaats van het
              herroepen besluit neemt (lid 2).
        actions:
          # Eigen keuze: lid 1 zegt niet wanneer een bezwaar ontvankelijk is.
          # Hier de termijn (artikel 6:9), en dat er geen bezwaar openstaat
          # tegen een besluit dat op bezwaar is genomen: daartegen staat
          # beroep open (artikel 7:1, eerste lid, onder a, dat niet is
          # opgenomen). Dat is de beslissing op het bezwaar, en ook het nieuwe
          # besluit dat zij in de plaats van een herroepen besluit nam: dat
          # berust op het artikel van het herroepen besluit, maar is genomen
          # op het bezwaar. Een besluitwaarde uit de kroniek noemt in
          # taken_on het artikel van de indiening waarop het besluit is
          # genomen (RFC-050). De overige vereisten (artikelen 1:2, 6:5 met
          # 6:6) en artikel 6:11 nog niet.
          - output: bezwaar_ontvankelijk
            value:
              operation: AND
              conditions:
                - $bezwaarschrift_tijdig_ingediend
                - operation: NOT
                  value:
                    operation: EQUALS
                    subject: $bestreden_besluit.taken_on
                    value: algemene_wet_bestuursrecht#7:11
          # Lid 2: "voor zover de heroverweging daartoe aanleiding geeft".
          # Eigen keuze: aanleiding is er als de heroverweging een andere
          # uitkomst geeft dan het bestreden besluit. Alleen wat het
          # besluit-item van dat artikel als uitkomst noemt telt; gegevens die
          # voor het besluit worden afgeleid niet (RFC-050). Elke uitkomst van
          # dat besluit-item telt, niet alleen de beslissing zelf: geeft de
          # heroverweging bij artikel 13a een ander aantal verlofdagen en
          # weigert zij het verlof opnieuw, dan wordt de weigering herroepen
          # en komt er een andere weigering voor in de plaats. Bij een
          # niet-ontvankelijk bezwaar wordt de heroverweging niet gelezen.
          - output: heroverweging_geeft_aanleiding
            value:
              operation: IF
              cases:
                - when: $bezwaar_ontvankelijk
                  then:
                    operation: NOT
                    value:
                      operation: EQUALS
                      subject: $heroverweging.outputs
                      value: $bestreden_besluit.outputs
              default: null
          - output: bestreden_besluit_herroepen
            value:
              operation: EQUALS
              subject: $heroverweging_geeft_aanleiding
              value: true
          # Lid 2: "neemt het voor zover nodig in de plaats daarvan een nieuw
          # besluit". Eigen keuze: dat is nodig zodra het besluit is
          # herroepen, want de heroverweging gaf een andere uitkomst; het
          # nieuwe besluit is wat de heroverweging gaf.
          - output: nieuw_besluit
            value:
              operation: IF
              cases:
                - when: $bestreden_besluit_herroepen
                  then: $heroverweging
              default: null

  - number: '7:12'
    text: |-
      1. De beslissing op het bezwaar dient te berusten op een deugdelijke
      motivering, die bij de bekendmaking van de beslissing wordt vermeld.
      Daarbij wordt, indien ingevolge artikel 7:3 van het horen is afgezien,
      tevens aangegeven op welke grond dat is geschied.
      2. De beslissing wordt bekendgemaakt door toezending of uitreiking aan
      degenen tot wie zij is gericht. Betreft het een besluit dat niet tot een
      of meer belanghebbenden is gericht, dan wordt de beslissing tevens
      bekendgemaakt op dezelfde wijze als waarop dat besluit bekendgemaakt is,
      tenzij het bestreden besluit in stand wordt gelaten.
      3. Zo spoedig mogelijk na de bekendmaking van de beslissing wordt hiervan
      mededeling gedaan aan de belanghebbenden die in bezwaar of bij de
      voorbereiding van het bestreden besluit hun zienswijze naar voren hebben
      gebracht.
      4. Bij de mededeling, bedoeld in het derde lid, is artikel 6:23 van
      overeenkomstige toepassing en wordt met het oog op de aanvang van de
      beroepstermijn zo duidelijk mogelijk aangegeven wanneer de bekendmaking
      van de beslissing overeenkomstig het tweede lid heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0005537/2024-01-01#Artikel7:12
    # Niet apart gemodelleerd. De beslissing op het bezwaar is een beschikking
    # (zie 7:11), dus artikel 3:46 haakt er al op en geeft motivering_vereist.
    # Lid 2 tot en met 4 (bekendmaking en mededeling) zijn niet gemodelleerd.
