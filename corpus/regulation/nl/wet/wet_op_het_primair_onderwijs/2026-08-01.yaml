  - number: '116'
    text: |-
      1 Onze Minister stelt jaarlijks de bekostiging voor een school vast.

      2 De bekostiging voor een school bestaat uit een bedrag per school en een bedrag per leerling.

      3 Het bedrag per school en het bedrag per leerling kunnen in ieder geval verschillend worden vastgesteld voor
      speciale scholen voor basisonderwijs en voor scholen van verschillende grootte.

      4 Onze Minister kan extra bekostiging toekennen. Bij of krachtens algemene maatregel van bestuur worden regels
      gesteld over de gevallen waarin, de voorwaarden waaronder en het bedrag dat aan extra bekostiging kan worden
      toegekend. In ieder geval wordt extra bekostiging toegekend:

      a. aan kleine basisscholen;

      b. aan basisscholen met een afdeling voor internationaal georiënteerd basisonderwijs;

      c. aan basisscholen voor de groei van het aantal leerlingen gedurende het schooljaar;

      d. voor de omstandigheid dat onderwijs wordt gegeven op een of meer nevenvestigingen van een school;

      e. voor de bestrijding van onderwijsachterstanden.

      5 Onze Minister stelt de hoogte van de bedragen, bedoeld in het tweede en vierde lid, en de bekostiging, bedoeld
      in [artikel 121][ref1], zodanig vast dat zij voldoet aan de redelijke behoefte van een in normale omstandigheden
      verkerende school.

      6 Bij ministeriële regeling worden jaarlijks de bedragen, bedoeld in het tweede en vierde lid, vastgesteld, worden
      nadere regels gesteld over de wijze waarop de hoogte van de bekostiging wordt berekend en worden regels gesteld
      over de termijnen van de betaling daarvan.

      7 De bedragen, bedoeld in het tweede en vierde lid, gelden voor het kalenderjaar volgend op het tijdstip van de
      vaststelling.

      8 Indien met toepassing van [artikel 84a][ref2] een nevenvestiging, of een deel van een school of nevenvestiging
      als school voor bekostiging in aanmerking is gebracht, wordt een bedrag in mindering gebracht op de bekostiging
      van het overblijvende deel van de school bedoeld in artikel 84a, vierde lid, onderdeel b. Bij of krachtens algemene
      maatregel van bestuur worden nadere regels gesteld over de berekening van het bedrag.

      9 Bij de vaststelling of tussentijdse aanpassing van de bedragen, bedoeld in het eerste en vijfde lid, worden de
      loonontwikkelingen verwerkt, tenzij de toestand van ’s Rijks financiën zich daartegen verzet.

      10 Voor de kosten, bedoeld in [artikel 115, tweede lid, onderdelen e, f, g, h, j en k][ref3], wordt jaarlijks
      voor 1 oktober eenmalig de prijsontwikkeling verwerkt in de bedragen, bedoeld in het eerste en vijfde lid. De
      prijsontwikkeling geldt voor het jaar volgend op het jaar waarin de vaststelling plaatsvindt.

      11 Bij ministeriële regeling worden nadere regels gesteld over de berekening van de prijsontwikkeling, bedoeld in
      het tiende lid. In ieder geval worden de bedragen aangepast op basis van de ramingen van het Centraal planbureau
      overeenkomstig de prijsmutatie van de netto materiële overheidsconsumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel84a
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel115
