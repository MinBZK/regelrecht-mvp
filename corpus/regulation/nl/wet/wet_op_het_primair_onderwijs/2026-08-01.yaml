  - number: '160'
    text: |-
      1 Het college van burgemeester en wethouders voert ten minste jaarlijks overleg en draagt zorg voor het maken van
      afspraken over:

      a. met het oog op een zo groot mogelijke deelname van het aantal kinderen aan voorschoolse educatie:

      1°. het vaststellen welke kinderen met een risico op een achterstand in de Nederlandse taal in aanmerking komen
      voor voorschoolse educatie,

      2°. de wijze waarop die kinderen worden toegeleid naar voorschoolse en vroegschoolse educatie, en

      3°. de organisatie van een doorlopende leerlijn van voorschoolse naar vroegschoolse educatie, en

      b. resultaten van vroegschoolse educatie.

      2 Het college van burgemeester en wethouders voert overleg en maakt de afspraken, bedoeld in het eerste lid, met de
      volgende partijen:

      a. voor het eerste lid, onderdeel a: met de bevoegde gezagsorganen van scholen en de houders van kindercentra als
      bedoeld in de [Wet kinderopvang][ref1] in de gemeente,

      b. voor het eerste lid, onderdeel b: met de bevoegde gezagsorganen van scholen.

      Alle partijen werken mee aan de totstandkoming van de afspraken.

      3 Een houder van een kindercentrum verwerkt persoonsgegevens met als doel de bevordering van een goede doorstroom
      naar het basisonderwijs. De gegevens die een houder van een kindercentrum verplicht overdraagt aan het bevoegd
      gezag van een basisschool over leerlingen die op de basisschool zijn ingeschreven, zijn het programma van
      voorschoolse educatie dat een leerling heeft gevolgd en de duur van het programma dat is gevolgd. Houders van
      kindercentra maken afspraken met de basisscholen binnen een gemeente over de wijze van gegevenslevering. De
      bewaartermijn voor de overgedragen gegevens is twee jaar nadat het kind het kindercentrum heeft verlaten.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel160
    references:
      - id: ref1
        bwb_id: BWBR0017017
  - number: '161'
    text: |-
      1 Het college van burgemeester en wethouders en de bevoegde gezagsorganen van de scholen en de kinderopvang,
      bedoeld in de [Wet kinderopvang][ref1] in de gemeente voeren tenminste jaarlijks overleg over het voorkomen
      van segregatie, het bevorderen van integratie en het bestrijden van onderwijsachterstanden, de afstemming over
      inschrijvings- en toelatingsprocedures en het uit het overleg voortvloeiende voorstel van het bevoegd gezag van
      in de gemeente gevestigde scholen om tot een evenwichtige verdeling van leerlingen met een onderwijsachterstand
      over de scholen te komen. Het overleg is gericht op het maken van afspraken over de in de eerste volzin bedoelde
      onderwerpen. Deze afspraken hebben zoveel mogelijk het karakter van meetbare doelen. De inspectie rapporteert
      jaarlijks over de mate waarin die doelen worden bereikt. Het college van burgemeester en wethouders kan de
      uitkomsten van het verplichte op overeenstemming gerichte overleg omzetten in bindende afspraken over onder andere
      de te realiseren prestaties en inspanningen, die – alvorens de afspraken tot stand komen – aan alle partijen worden
      voorgelegd. Indien het overleg over de voorgenomen bindende afspraken niet tot overeenstemming leidt, schrijft
      het college van burgemeester en wethouders een nieuw overleg uit, waarbij het initiatieven neemt tot het bereiken
      van een zo groot mogelijke consensus. Indien ook dit overleg niet tot overeenstemming leidt, vraagt het college
      van burgemeester en wethouders of een van de bevoegde gezagsorganen aan de geschillencommissie, bedoeld in het
      tweede lid, om een bindend advies. De geschillencommissie brengt binnen 4 weken aan het college van burgemeester en
      wethouders dan wel aan het bevoegd gezag dat om het advies heeft verzocht, een bindend advies uit. Het college van
      burgemeester en wethouders maakt dit advies bekend aan de bevoegde gezagsorganen van de scholen en de kinderopvang,
      bedoeld in de [Wet kinderopvang][ref2] in de gemeente.

      2 Onze Minister stelt een geschillencommissie in.

      3 De commissie bestaat uit een voorzitter en 4 leden, die allen door Onze Minister worden benoemd. De 4 leden
      worden benoemd op voordracht van de gezamenlijke besturenorganisaties en de Vereniging van Nederlandse Gemeenten.
      De voorzitter is een jurist.

      4 De voorzitter en de leden worden benoemd voor een termijn van 4 jaar. Zij zijn opnieuw benoembaar. Op eigen
      verzoek wordt aan hen ontslag verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0017017
      [ref2]: https://wetten.overheid.nl/BWBR0017017
