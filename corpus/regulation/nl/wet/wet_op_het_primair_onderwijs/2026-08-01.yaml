  - number: '149'
    text: |-
      1 Indien naar het oordeel van Onze Minister de bekostiging van een bijzondere school dient te worden beëindigd of
      een openbare school dient te worden opgeheven, maakt Onze Minister dit voor 1 januari voorafgaand aan de datum van
      beëindiging van de bekostiging onderscheidenlijk opheffing van de school bekend aan het bevoegd gezag.

      2 Indien naar het oordeel van het bevoegd gezag sprake is van een uitzonderingssituatie als bedoeld in
      [artikel 139, vierde of vijfde lid][ref1], dan wel [artikel 143][ref2], deelt het bevoegd gezag dit voor
      1 februari voorafgaand aan de datum voor de beëindiging van de bekostiging onderscheidenlijk de opheffing
      schriftelijk mede aan Onze Minister. Bij algemene maatregel van bestuur wordt bepaald welke gegevens bij deze
      mededeling worden overgelegd.

      3 Voor zover Onze Minister niet reeds heeft bekendgemaakt dat hij de mededeling, bedoeld in het tweede lid, buiten
      behandeling laat wegens het niet verstrekken van de voorgeschreven gegevens, maakt hij voor 1 mei, volgend op de
      mededeling, bedoeld in het tweede lid, aan het bevoegd gezag van de desbetreffende school bekend dat:

      a. naar zijn oordeel geen sprake is van een van de uitzonderingssituaties, bedoeld in het tweede lid, en dat met
      ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt beëindigd dan wel
      de openbare school dient te worden opgeheven, of

      b. met ingang van 1 augustus van het volgende schooljaar de bekostiging van de bijzondere school wordt voortgezet
      of de openbare school in stand dient te worden gehouden.

      4 Indien Onze Minister niet voor 1 mei, volgend op de mededeling, bedoeld in het tweede lid, een bekendmaking als
      bedoeld in het derde lid heeft gedaan, wordt met ingang van 1 augustus van het volgende schooljaar de bekostiging
      van de bijzondere school voortgezet of dient de openbare school met ingang van laatstgenoemde datum in stand te
      worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel139
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel143
