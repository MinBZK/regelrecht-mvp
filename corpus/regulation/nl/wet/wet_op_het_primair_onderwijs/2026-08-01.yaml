  - number: '125'
    text: |-
      1 Indien het totaal van de bedragen, bedoeld in [artikel 124, vierde lid][ref1], en artikel 124, zesde lid,
      de bekostiging bedoeld in artikel 124, eerste lid, overschrijdt, wordt het bedrag waarmee die bekostiging wordt
      overschreden door Onze Minister in mindering gebracht op de bekostiging van alle scholen waarvan één of meer
      vestigingen zijn gelegen in het gebied van het samenwerkingsverband.

      2 Het bedrag dat in mindering wordt gebracht wordt per school bepaald op basis van het leerlingenaantal van de
      desbetreffende vestiging of vestigingen in het samenwerkingsverband.


