  - number: '40'
    text: |-
      1 De beslissing over toelating en verwijdering van leerlingen berust bij het bevoegd gezag. De
      toelating tot de school is niet afhankelijk van het houden van rechtmatig verblijf in de zin van
      [artikel 8 van de Vreemdelingenwet 2000][ref1]. De toelating mag niet afhankelijk worden gesteld van een geldelijke
      bijdrage van de ouders.

      2 De aanmelding van kinderen voor toelating geschiedt schriftelijk en kan worden gedaan vanaf de dag waarop het
      kind de leeftijd van 3 jaar bereikt. De ouders doen de aanmelding zo mogelijk ten minste 10 weken voor de datum
      waarop toelating wordt gevraagd en geven bij de aanmelding aan bij welke school of scholen eveneens om toelating
      is verzocht.

      3 Het bevoegd gezag beoordeelt of de aanmelding een kind betreft dat extra ondersteuning behoeft. Hiertoe
      kan het bevoegd gezag de ouders verzoeken gegevens te overleggen betreffende stoornissen of handicaps van het
      kind of beperkingen in de onderwijsparticipatie. Onder extra ondersteuning wordt niet verstaan ondersteuning
      ter bevordering van de beheersing van de Nederlandse taal met het oog op het voorkomen en bestrijden van
      onderwijsachterstanden.

      4 Indien de toelating van een leerling die extra ondersteuning behoeft, wordt geweigerd, vindt de weigering niet
      plaats dan nadat het bevoegd gezag er, na overleg met de ouders en met inachtneming van de ondersteuningsbehoefte
      van de leerling en het ondersteuningsaanbod van de betrokken scholen, voor heeft zorg gedragen dat een andere
      school bereid is de leerling toe te laten. Onder andere school kan ook worden verstaan een school voor speciaal
      onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor speciaal en voortgezet
      speciaal onderwijs.

      5 Het derde en vierde lid zijn niet van toepassing:

      a. indien op de school waar de leerling is aangemeld geen plaatsruimte beschikbaar is, of

      b. indien het bevoegd gezag de ouders bij de aanmelding verzoekt te verklaren dat zij de grondslag van het
      onderwijs op de school zullen respecteren dan wel te verklaren dat zij de grondslag van het onderwijs op de school
      zullen onderschrijven, en de ouders dit weigeren te verklaren.

      6 Het bevoegd gezag neemt de beslissing over toelating van een leerling zo spoedig mogelijk doch uiterlijk 6
      weken na ontvangst van de aanmelding. Indien de beslissing, bedoeld in de vorige volzin, niet binnen 6 weken kan
      worden gegeven, deelt het bevoegd gezag dit aan de ouders mede en noemt het daarbij een zo kort mogelijke termijn
      waarbinnen de beslissing wel tegemoet kan worden gezien, welke termijn ten hoogste 4 weken bedraagt.

      7 Indien de aanmelding een kind betreft dat niet is ingeschreven op een andere school, een school voor speciaal
      onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor speciaal en voortgezet
      speciaal onderwijs, en de beslissing over de toelating is 10 weken na de dag waarop het verzoek om toelating is
      gedaan nog niet genomen, wordt het kind met ingang van de dag volgend op bedoelde 10 weken, doch niet eerder dan de
      datum waarop het kind de leeftijd heeft bereikt om te kunnen worden toegelaten tot de school, tijdelijk geplaatst
      op de school en als leerling ingeschreven. Indien de leerling wordt toegelaten, wordt de tijdelijke plaatsing
      omgezet in een definitieve plaatsing. Indien de toelating van de leerling wordt geweigerd of een beslissing
      wordt genomen de aanmelding niet te behandelen, wordt de tijdelijke plaatsing beëindigd en wordt de leerling
      uitgeschreven met ingang van de dag die volgt op de dag waarop de toelating wordt geweigerd of de beslissing wordt
      genomen de aanmelding niet te behandelen.

      8 Een leerling wordt slechts toegelaten tot een speciale school voor basisonderwijs nadat de leerling toelaatbaar
      is verklaard tot het onderwijs aan een speciale school voor basisonderwijs. De beslissing over de toelaatbaarheid
      is geen besluit als bedoeld in [artikel 8:4, derde lid, onderdeel b, van de Algemene wet bestuursrecht][ref2].
      Deze beslissing wordt genomen:

      a. indien de leerling onmiddellijk voorafgaand aan de toelating was ingeschreven op een basisschool: door het
      samenwerkingsverband waartoe die school behoort;

      b. indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een basisschool:

      1°. door het samenwerkingsverband in het gebied waar de leerling woont;

      2°. door het samenwerkingsverband waartoe de speciale school voor basisonderwijs, waarvoor toelating wordt verzocht
      behoort, indien de leerling buiten Nederland woont;

      c. indien de leerling onmiddellijk voorafgaand aan de toelating niet was ingeschreven op een basisschool
      en de leerling was aangemeld bij een speciale school voor basisonderwijs, die behoort tot een landelijk
      samenwerkingsverband, bedoeld in [artikel 18a, vijftiende lid][ref3]: door het landelijk samenwerkingsverband
      waartoe de speciale school voor basisonderwijs, waar de leerling was aangemeld, behoort.

      9 De toelating van een leerling van een basisschool tot een speciale school voor basisonderwijs wordt niet
      geweigerd op denominatieve gronden, tenzij de ouders van de leerling weigeren te verklaren dat zij de grondslag van
      het onderwijs van de school zullen respecteren.

      10 Tot een afdeling als bedoeld in [artikel 85a][ref4] kan uitsluitend worden toegelaten degene die:

      a. een andere dan de Nederlandse nationaliteit bezit of mede een dergelijke nationaliteit bezit en van wie ten
      minste een van de ouders voor een bepaalde tijd in Nederland of het grensgebied van Nederland werkzaam is, dan wel

      b. uitsluitend de Nederlandse nationaliteit bezit, langere tijd in het buitenland heeft doorgebracht doordat ten
      minste een van de ouders voor een bepaalde tijd in het buitenland werkzaam was en de leerling daar langer dan 2
      jaar onderwijs heeft genoten volgens het daar geldende onderwijssysteem, dan wel

      c. uitsluitend de Nederlandse nationaliteit bezit en waarvan blijkens een schriftelijke verklaring van de werkgever
      vaststaat dat ten minste een van de ouders binnen 2 jaar voor ten minste 2 jaar in het buitenland werkzaam zal zijn
      en de leerling mee verhuist naar het buitenland.

      11 Voordat wordt besloten tot verwijdering hoort het bevoegd gezag de betrokken groepsleraar en de ouders van de
      leerling. Definitieve verwijdering van een leerling vindt niet plaats dan nadat het bevoegd gezag ervoor heeft zorg
      gedragen dat een andere school bereid is de leerling toe te laten. Onder andere school kan ook worden verstaan een
      school voor speciaal onderwijs, een school voor speciaal en voortgezet speciaal onderwijs of een instelling voor
      speciaal en voortgezet speciaal onderwijs.

      12 Indien tegen het besluit, bedoeld in het eerste lid, van het bevoegd gezag van een openbare school bezwaar is
      gemaakt, besluit het bevoegd gezag in afwijking van [artikel 7:10 van de Algemene wet bestuursrecht][ref5] binnen 4
      weken gerekend vanaf de dag na die waarop de termijn voor het indienen van het bezwaarschrift is verstreken.

      13 De toelaatbaarheidsverklaring, bedoeld in het achtste lid, heeft betrekking op een periode van één of meer
      schooljaren. Indien de toelaatbaarheidsverklaring in de loop van een schooljaar wordt gegeven, wordt de periode tot
      de eerste dag van het eerstvolgende schooljaar toegevoegd aan de in de eerste volzin bedoelde periode.

      14 In het laatste schooljaar waarop de toelaatbaarheidsverklaring betrekking heeft, draagt het bevoegd gezag van
      een speciale school voor basisonderwijs er zorg voor dat terugplaatsing of overplaatsing van de leerling naar een
      basisschool plaatsvindt, tenzij het bevoegd gezag van oordeel is dat voortgezet verblijf van de leerling in een
      speciale school voor basisonderwijs noodzakelijk is en het samenwerkingsverband, bedoeld in het achtste lid, een
      nieuwe toelaatbaarheidsverklaring heeft verstrekt.

      15 In afwijking van het zesde lid neemt het bevoegd gezag de beslissing over toelating van een minderjarig kind van
      verzoeker dan wel minderjarige verzoeker als bedoeld in artikel 16 van de [richtlijn (EU) 2024/1346](32024L1346) zo
      spoedig mogelijk doch uiterlijk binnen 6 weken na ontvangst van de aanmelding.

      16 In afwijking van het zevende lid wordt een minderjarig kind van verzoeker dan wel minderjarige verzoeker als
      bedoeld in artikel 16 van de [richtlijn (EU) 2024/1346](32024L1346), toegelaten indien de beslissing over de
      toelating 6 weken na de dag waarop het verzoek om toelating is gedaan nog niet is genomen.


