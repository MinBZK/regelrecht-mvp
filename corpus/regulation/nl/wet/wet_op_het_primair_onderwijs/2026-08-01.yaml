  - number: '85'
    text: |-
      1 De bekostiging van een nevenvestiging van een school neemt een aanvang met ingang van 1 augustus indien:

      a. de nevenvestiging overeenkomstig [artikel 146][ref1] voldoet aan een der normen voor bekostiging, genoemd in
      dat artikel en, voor zover het een nevenvestiging betreft die voor bekostiging in aanmerking komt op grond van
      het eerste lid, onder e, van dat artikel, op die grond aan alle scholen van het bevoegd gezag of, bij toepassing
      van [artikel 143, derde lid][ref2], de samenwerkende bevoegde gezagsorganen, niet meer nevenvestigingen worden
      verbonden dan het verschil tussen het totale aantal leerlingen van die scholen gedeeld door 260 en het totale
      aantal leerlingen van die scholen gedeeld door 290, waarbij de quotiënten naar beneden worden afgerond op een
      geheel getal,

      b. de nevenvestiging niet wordt verbonden aan een school die met toepassing van [artikel 143][ref3] in
      stand wordt gehouden of aan een school waarvan de kwaliteit van het onderwijs zeer zwak is als bedoeld in
      [artikel 10a, eerste en vierde lid][ref4],

      c. 1°. de nevenvestiging, onmiddellijk voorafgaand aan het tijdstip van ingang van de bekostiging als
      nevenvestiging, werd bekostigd als zelfstandige school, of

      2°. de nevenvestiging voor bekostiging in aanmerking kwam als nevenvestiging van de voormalige school bedoeld onder
      1°,

      d. ingeval het betreft een nevenvestiging van een openbare school die in stand wordt gehouden door een andere
      rechtspersoon dan de gemeente op wier grondgebied de nevenvestiging is gelegen, die gemeente bij notariële akte de
      instandhouding van de school die nevenvestiging is geworden, heeft overgedragen aan die andere rechtspersoon, en

      e. van de omvorming tot nevenvestiging voor 1 februari voorafgaand aan de datum, bedoeld in de aanhef, mededeling
      is gedaan aan Onze Minister, en indien het betreft een situatie als bedoeld onder d, onder overlegging van gegevens
      waaruit blijkt dat aan het vereiste onder d is voldaan.

      2 Bij de akte, bedoeld in het eerste lid onder d, worden tevens overgedragen de rechten die het bevoegd gezag van
      een school toekomen, ten aanzien van het gebouw en terrein, alsmede ten aanzien van de roerende zaken. In de akte
      wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en onder
      dezelfde voorwaarden als vermeld in de arbeidsovereenkomst, benoemt met ingang van de datum van overdracht.

      3 Door overdracht met inachtneming van het eerste en tweede lid, treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger voor zover deze zijn hoedanigheid van
      bevoegd gezag betroffen.

      4 Onze Minister maakt voor 1 mei volgend op de mededeling, bedoeld in het eerste lid onder e, aan het bevoegd gezag
      van de beoogde nevenvestiging bekend of de nevenvestiging zal worden bekostigd.


