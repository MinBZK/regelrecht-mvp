  - number: '181'
    text: >-
      1 Onze Minister kan bepalen dat geen of slechts een gedeeltelijke bekostiging wordt verstrekt voor uitgaven die het
      gevolg zijn van schuld of nalatigheid van het bevoegd gezag.


      2 Indien de uitgaven bedoeld in het eerste lid, voor bekostiging door het Rijk in aanmerking komen, treedt het Rijk
      op het moment van een uitdrukkelijk besluit tot bekostiging in alle rechten die het bevoegd gezag ter zake tegen
      derden mocht hebben.


      3 Indien de gemeente een collectieve verzekering heeft afgesloten voor de vergoeding van schade, ontstaan aan
      gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden school, heeft het bevoegd
      gezag van de desbetreffende school jegens de gemeente geen aanspraak op vergoeding van dergelijke schade, voor
      zover die collectieve verzekering de schade dekt.


      4 Indien schade, ontstaan aan gebouwen, terreinen of roerende zaken van een niet door de gemeente in stand gehouden
      school voor vergoeding door de gemeente in aanmerking komt, treedt de gemeente op het moment van een uitdrukkelijk
      besluit tot vergoeding in alle rechten die het bevoegd gezag ter zake van die schade tegen derden mocht hebben.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel181
  - number: '182'
    text: |-
      1 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling gebruiken in het verkeer met de leerling op
      wie het nummer betrekking heeft, of met de ouders van deze leerling.

      2

      3

      4 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling, al dan niet tezamen met een of meer van de
      gegevens, bedoeld in [artikel 12, eerste lid, van de Wet register onderwijsdeelnemers][ref1], gebruiken in het
      verkeer met Onze Minister ten behoeve van de vaststelling van de bekostiging van de school.

      5 Het bevoegd gezag en het hoofd, bedoeld in [artikel 1, onder d, van de Leerplichtwet 1969][ref2],
      gebruiken het persoonsgebonden nummer van een leerling in contacten met een gemeente in het kader van de
      [Leerplichtwet 1969][ref3], tezamen met de gegevens die noodzakelijk zijn voor het toezicht op de naleving van die
      wet door de gemeente.

      6 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het contact met een andere school of
      een school voor ander onderwijs ten behoeve van de in- en uitschrijving van die leerling en bij het overleggen van
      het onderwijskundig rapport, bedoeld in [artikel 42][ref4].

      7

      8 Het bevoegd gezag gebruikt het persoonsgebonden nummer van een leerling in het kader van de uitvoering van
      subsidieregelingen van het Europees Sociaal Fonds.

      9 Het bevoegd gezag verstrekt geen persoonsgebonden nummer van een leerling ter uitvoering van
      [artikel 107, tweede en vijfde lid, van de Vreemdelingenwet 2000][ref5].

      10

      11 Het bevoegd gezag kan het persoonsgebonden nummer van een leerling eenmalig gebruiken ten behoeve van het
      genereren van een pseudoniem voor deze leerling met het oog op het bieden van voorzieningen in het kader van het
      onderwijs en de begeleiding van leerlingen. Het bevoegd gezag draagt er zorg voor dat het pseudoniem wordt bewaard
      in de systemen waarin de leerlingen zijn geregistreerd.

      12 Het bevoegd gezag kan het pseudoniem, bedoeld in het elfde lid, gebruiken voor het genereren van een ander
      pseudoniem voor een leerling in het kader van de toegang tot en het gebruik van digitale leermiddelen of het
      digitaal afnemen van toetsen, waarbij het bevoegd gezag er zorg voor draagt dat dit andere pseudoniem wordt bewaard
      in de systemen waarin de leerlingen zijn geregistreerd. Dit andere pseudoniem wordt uitsluitend verstrekt aan
      een leverancier die een digitaal product of een digitale dienst aanbiedt bestaande uit leerstof of toetsen en de
      daarmee samenhangende digitale diensten.

      13 Bij algemene maatregel van bestuur kunnen andere gevallen worden aangewezen dan het geval, bedoeld in het
      twaalfde lid, waarvoor het bevoegd gezag op basis van het pseudoniem, bedoeld in het elfde lid, een ander
      pseudoniem kan genereren. Daarbij worden in ieder geval de categorieën van ontvangers van dit andere pseudoniem
      aangewezen.

      14 Bij ministeriële regeling worden regels gesteld over de voorwaarden waaronder de pseudoniemen, bedoeld in het
      elfde tot en met het dertiende lid, kunnen worden gegenereerd en gebruikt. Deze voorwaarden betreffen in ieder
      geval de duur en de beveiliging, waaronder de gescheiden opslag van de pseudoniemen.


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
