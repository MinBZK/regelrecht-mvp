  - number: '114'
    text: |-
      De gemeente bekostigt aan het bevoegd gezag van een niet door de gemeente in stand gehouden school dat is
      onderworpen aan een of meer der in [artikel 220 van de Gemeentewet][ref1] bedoelde belastingen ter zake van
      onroerende zaken het bedrag dat is uitgegeven voor de belastingen met betrekking tot de in de gemeente gelegen
      gebouwen en terreinen.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel220
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel114
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '220'
  - number: '115'
    text: |-
      1 De bekostiging van een school is bestemd voor kosten voor personeel en exploitatie van die school.

      2 De bekostiging wordt in ieder geval verstrekt voor de kosten van:

      a. de salarissen, toelagen, uitkeringen en vergoedingen voor het personeel;

      b. de bijdragen voor het pensioen voor het personeel en dat van de nagelaten betrekkingen;

      c. de schoolbegeleiding;

      d. de vervanging van het personeel, de werkloosheidsuitkeringen van het personeel en de uitkeringen wegens ziekte
      en arbeidsongeschiktheid van gewezen personeel anders dan op grond van de [Ziektewet][ref1];

      e. het onderhoud van het gebouw en het terrein;

      f. het energie- en waterverbruik;

      g. de middelen;

      h. de administratie, het beheer en het bestuur;

      i. de loopbaanoriëntatie en -begeleiding;

      j. de schoonmaak van het gebouw en het terrein; en

      k. de publiekrechtelijke heffingen, met uitzondering van belastingen inzake onroerende zaken.

      3 Het bevoegd gezag wendt de bekostiging aan voor de kosten, bedoeld in het tweede lid.

      4 Het bevoegd gezag kan de bekostiging ook aanwenden voor de kosten, bedoeld in het tweede lid, van:

      a. een centrale dienst, een samenwerkingsverband of een andere school;

      b. een centrale dienst dan wel een school voor speciaal onderwijs, voor voortgezet speciaal onderwijs, voor
      speciaal en voortgezet speciaal onderwijs, een instelling voor speciaal en voortgezet speciaal onderwijs als
      bedoeld in de [Wet op de expertisecentra][ref2] of een centrale dienst dan wel een school als bedoeld in de
      [Wet voortgezet onderwijs 2020][ref3].

      5 Het bevoegd gezag beheert de middelen van de school op zodanige wijze dat het voortbestaan van de school is
      verzekerd.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van het eerste en tweede
      lid.

      7 Bij ministeriële regeling kunnen regels worden gesteld over het door het bevoegd gezag uitzetten van gelden, het
      aangaan van geldleningen en het aangaan van verbintenissen voor financiële producten.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0003549
      [ref3]: https://wetten.overheid.nl/BWBR0044212
