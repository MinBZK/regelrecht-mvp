  - number: 40c
    text: >-
      1 Het bevoegd gezag kan met opgave van redenen een leerling voor een periode van ten hoogste één week schorsen.


      2 De beslissing tot schorsing wordt schriftelijk aan de ouders bekendgemaakt.


      3 Het bevoegd gezag stelt de inspectie van een schorsing voor een periode langer dan één dag schriftelijk en met
      opgave van redenen onverwijld in kennis.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel40c
  - number: '41'
    text: |-
      1 De leerlingen nemen deel aan alle voor hen bestemde onderwijsactiviteiten, met dien verstande dat die
      onderwijsactiviteiten voor de leerlingen onderling kunnen verschillen.

      2 Het bevoegd gezag kan op verzoek van de ouders een leerling vrijstellen van het deelnemen aan bepaalde
      onderwijsactiviteiten met uitzondering van een doorstroomtoets als bedoeld in [artikel 45b, derde lid][ref1]. Een
      vrijstelling kan slechts worden verleend op door het bevoegd gezag vastgestelde gronden. Het bevoegd gezag bepaalt
      bij de vrijstelling welke onderwijsactiviteiten voor de leerling in de plaats komen van die waarvan vrijstelling
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel45b
