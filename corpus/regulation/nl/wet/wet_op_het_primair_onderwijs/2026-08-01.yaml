      Onverminderd het overigens bij of krachtens de wet bepaalde omtrent het gebruik van het burgerservicenummer
      door de gemeente, gebruikt de gemeente het persoonsgebonden nummer van een leerling uitsluitend ten
      behoeve van een registratie van leerplichtige jongeren in het belang van het toezicht op de naleving van
      de[ Leerplichtwet 1969][ref1].


