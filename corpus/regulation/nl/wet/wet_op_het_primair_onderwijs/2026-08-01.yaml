  - number: 193j
    text: |-
      1 Indien een vacature voor het geven van onderwijs in een tijdelijke nieuwkomersvoorziening niet kan worden vervuld
      door de benoeming van een bevoegde leraar als bedoeld in [artikel 3][ref1], kan het onderwijs niet langer dan
      strikt noodzakelijk, in afwijking van artikel 3, eerste lid, onderdeel b, ook worden gegeven door:

      a. studenten van een opleiding leidend tot een getuigschrift als bedoeld in
      [artikel 3, eerste lid, onder b.1°][ref2];

      b. degene die bevoegd is tot het geven van voortgezet onderwijs op grond van de
      [Wet voortgezet onderwijs 2020][ref3], met dien verstande dat het onderwijs niet gegeven kan worden door degene,
      bedoeld in [artikel 7.14 van de Wet voortgezet onderwijs 2020][ref4];

      c. een onderwijsondersteunende functionaris als bedoeld in [artikel 3a][ref5].

      2 Het bevoegd gezag draagt zorg voor schriftelijke afspraken met degene, bedoeld in het eerste lid, waarin wordt
      vastgelegd op welke wijze het bevoegd gezag betrokkene ondersteunt om zo snel mogelijk te voldoen aan de eisen
      opgenomen in [artikel 3][ref6].

      3 Het eerste lid is niet van toepassing op het onderwijs in:

      1°. Nederlands;

      2°. Rekenen en wiskunde;

      3°. Lichamelijke oefening;

      4°. Actief burgerschap en sociale cohesie.


