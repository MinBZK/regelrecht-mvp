  - number: 215a
    text: |-
      1 Na het vervallen van [artikel 180b][ref1], regelt het bevoegd gezag zo spoedig mogelijk dat de leerlingen van de
      tijdelijke onderwijsvoorziening doorstromen naar een basisschool of speciale school voor basisonderwijs.

      2 Bij ministeriële regeling kunnen na het vervallen van artikel 180b, regels worden gesteld over de wijze waarop
      een tijdelijke onderwijsvoorziening wordt opgeheven en binnen welke termijn.

      3 De [artikelen 180c][ref2] en [180f][ref3] zoals die luidden bij de inwerkingtreding van
      [Titel IV, Afdeling 12, paragraaf 2][ref4], zijn van overeenkomstige toepassing op de ministeriële regeling bedoeld
      in het tweede lid.

      4 De ministeriële regeling, bedoeld in het tweede lid, wordt niet eerder vastgesteld dan twee weken nadat het
      ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      5 Dit artikel vervalt op een bij koninklijk besluit te bepalen tijdstip.


