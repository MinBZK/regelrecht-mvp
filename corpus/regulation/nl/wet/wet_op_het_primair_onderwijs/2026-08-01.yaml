        artikel: 230a
  - number: '111'
    text: >-
      In afwijking van deze afdeling kan de gemeenteraad besluiten dat jaarlijks een bedrag voor huisvestingskosten
      wordt betaald aan het bevoegd gezag van een niet door de gemeente in stand gehouden school voor zover die op het
      grondgebied van die gemeente in stand wordt gehouden. De gemeenteraad neemt het besluit in overeenstemming met het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel111
  - number: '112'
    text: >-
      Het bevoegd gezag van een niet door de desbetreffende gemeente in stand gehouden school is gehouden aan de
      gemeenteraad onderscheidenlijk het college van burgemeester en wethouders alle inlichtingen te verschaffen die
      de gemeenteraad onderscheidenlijk het college van burgemeester en wethouders voor een adequate uitvoering van de
      bepalingen in deze afdeling noodzakelijk achten.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel112
  - number: '113'
    text: |-
      1 Het bevoegd gezag dat, dan wel de gemeente die eigenaar is van een schoolgebouw, zorgt voor het deel van de
      exploitatie waarop de bekostiging, bedoeld in [artikel 115, tweede lid, onderdelen e, f, j en k][ref1], betrekking
      heeft.

      2 Het bevoegd gezag van een bijzondere school en het bevoegd gezag van een openbare nevenvestiging ten aanzien
      waarvan [artikel 85, tweede lid][ref2], toepassing heeft gevonden en dat eigenaar is van een schoolgebouw, kan met
      het college van burgemeester en wethouders overeenkomen dat de gemeente het deel van de exploitatie, bedoeld in het
      eerste lid, geheel of gedeeltelijk verzorgt.

      3 Het bevoegd gezag dat eigenaar is van een schoolgebouw kan met een bevoegd gezag dat gebruikmaakt van dat
      schoolgebouw overeenkomen dat het laatstgenoemde bevoegd gezag een deel van de exploitatie, bedoeld in het eerste
      lid, geheel of gedeeltelijk verzorgt.

      4 Indien de gemeente eigenaar is van het schoolgebouw, kan het bevoegd gezag van een bijzondere school of het
      bevoegd gezag van een openbare nevenvestiging ten aanzien waarvan [artikel 85, tweede lid][ref3], toepassing heeft
      gevonden, met de gemeente overeenkomen dat het bevoegd gezag het deel van de exploitatie, bedoeld in het eerste
      lid, geheel of gedeeltelijk verzorgt.

      5 Het bevoegd gezag zorgt voor het deel van de exploitatie waarop de bekostiging, bedoeld in
      [artikel 115, tweede lid, onderdelen g en h][ref4], betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel115
