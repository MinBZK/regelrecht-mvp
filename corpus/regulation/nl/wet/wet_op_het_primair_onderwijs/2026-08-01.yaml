      1 Na inwerkingtreding van de Wet van 20 mei 2020 tot wijziging van diverse onderwijswetten door het wijzigen van de
      systematiek van het in aanmerking brengen voor bekostiging van nieuwe openbare en bijzondere scholen zodat er meer
      ruimte is voor een nieuw onderwijsaanbod (Wet meer ruimte voor nieuwe scholen) (Stb. 2020, 160) vindt nog één maal
      vaststelling plaats van een plan van scholen conform [titel IV, afdeling 2][ref1], zoals luidend direct voorafgaand
      aan de datum van inwerkingtreding van genoemde wet.

      2 Een school die is vermeld op het laatste plan van scholen dat is vastgesteld en door Onze Minister is goedgekeurd
      voor inwerkingtreding van de in het eerste lid genoemde wet en ten aanzien waarvan op dat tijdstip nog niet is
      beslist over aanvang van de bekostiging of die is vermeld op het plan van scholen dat is vastgesteld op grond van
      het eerste lid, wordt aangemerkt als een school waarvoor Onze Minister op grond van [artikel 75, derde lid][ref2],
      zoals luidend op de dag van inwerkingtreding van artikel I, onderdeel D, van de in het eerste lid genoemde wet
      heeft beslist dat zij voor bekostiging uit ’s Rijks kas in aanmerking wordt gebracht. Artikel 75, zesde, zevende en
      achtste lid, is van toepassing.

      3 Op geschillen die in beroep aanhangig zijn of binnen de beroepstermijn dan wel verschoonbaar daarbuiten aanhangig
      worden gemaakt tegen besluiten die zijn genomen door Onze Minister op grond van het eerste lid of op grond van
      [titel IV, afdeling 2][ref3], en daarop berustende bepalingen zoals luidend op de dag voor de inwerkingtreding
      van de desbetreffende onderdelen van de in het eerste lid genoemde wet blijven de op die datum geldende regelingen
      van toepassing. Indien de uitspraak op een beroep als bedoeld in [artikel 80][ref4] zoals luidend voor de
      inwerkingtreding van de in het eerste lid genoemde wet strekt tot opneming van een school in het plan van scholen,
      is het tweede lid van overeenkomstige toepassing. De eerste volzin is hangende het, beroep van overeenkomstige
      toepassing op de bevoegdheid tot het intrekken en vervangen van besluiten die tot de aldaar bedoelde geschillen
      hebben geleid.

      4 Het derde lid is van overeenkomstige toepassing op geschillen die betrekking hebben op de toepassing van
      [artikel 84a][ref5], zoals dat luidde op de dag voor de inwerkingtreding van de desbetreffende onderdelen van de in
      het eerste lid genoemde wet.

      5 Bij ministeriële regeling kunnen nadere uitvoeringsvoorschriften worden gesteld.


