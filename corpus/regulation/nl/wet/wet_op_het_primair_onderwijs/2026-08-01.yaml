  - number: '95'
    text: |-
      1 Het college van burgemeester en wethouders stelt, na overleg met de bevoegde gezagsorganen van de niet
      door de gemeente in stand gehouden scholen in de gemeente, jaarlijks ten behoeve van het onderwijs op het
      grondgebied van de gemeente voor een door het college van burgemeester en wethouders te bepalen tijdstip
      een programma als bedoeld in het tweede lid vast. Het programma heeft betrekking op scholen als bedoeld in
      [artikel 93, eerste lid, onderdelen a, b en c][ref1].

      2 Het programma omvat de voorzieningen in de huisvesting, bedoeld in [artikel 92][ref2], die in het jaar na de
      vaststelling van het programma voor bekostiging in aanmerking zullen worden gebracht voor niet door de gemeente in
      stand gehouden scholen alsmede voorzieningen die nodig zijn voor door de gemeente in stand gehouden scholen.

      3 Het college van burgemeester en wethouders neemt uitsluitend voorzieningen in de huisvesting in het programma op,
      voor zover:

      a. met de voorzieningen in het kalenderjaar volgend op het jaar van vaststelling van het programma redelijkerwijs
      een aanvang kan worden gemaakt dan wel de voorzieningen in het desbetreffende kalenderjaar kunnen worden
      gerealiseerd, en

      b. niet een van de weigeringsgronden, genoemd in [artikel 100][ref3], van toepassing is.

      4 Indien het bekostigingsplafond, bedoeld in [artikel 93][ref4], niet toereikend is, worden die voorzieningen in
      het programma opgenomen die uit dat bekostigingsplafond kunnen worden bekostigd, waarbij de volgorde wordt bepaald
      met inachtneming van de criteria, bedoeld in [artikel 102, eerste lid, onderdeel c][ref5].

      5 De beschikking van het college van burgemeester en wethouders kan een gedeelte van de gewenste voorziening dan
      wel een andere voorziening dan gewenst omvatten.

      6 Het college van burgemeester en wethouders kan aan de opneming in het programma voorwaarden verbinden betreffende
      ingebruikneming of buitengebruikstelling van gebouwen of lokalen.

      7 Het college van burgemeester en wethouders neemt bij de vaststelling van het programma de criteria, bedoeld in
      [artikel 102, eerste lid, onderdeel c][ref6], in acht.

      8 Binnen vier weken na de vaststelling van het programma treedt het college van burgemeester en wethouders met het
      bevoegd gezag in overleg over de wijze van uitvoering. Indien dit overleg niet tot overeenstemming leidt, deelt het
      college van burgemeester en wethouders het bevoegd gezag mede dat het niet kan instemmen met de door het bevoegd
      gezag gewenste wijze van uitvoering.

      9 Tijdens het in het eerste lid bedoelde overleg kan het college van burgemeester en wethouders de Onderwijsraad
      verzoeken een advies uit te brengen over de vaststelling van het programma huisvestingsvoorzieningen in relatie tot
      de vrijheid van richting en de vrijheid van inrichting. Het verzoek wordt gedaan indien een bevoegd gezag hierom
      heeft gevraagd dan wel uit eigen beweging. Het verzoek bevat een omschrijving van de onderwerpen waarover advies
      wordt verwacht. Het advies wordt binnen vier weken uitgebracht aan het college van burgemeester en wethouders. Het
      advies wordt bekend gemaakt tezamen met het programma.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel93
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel92
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel100
      [ref4]: https://wetten.overheid.nl/BWBR0003420#Artikel93
      [ref5]: https://wetten.overheid.nl/BWBR0003420#Artikel102
      [ref6]: https://wetten.overheid.nl/BWBR0003420#Artikel102
