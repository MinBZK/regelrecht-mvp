  - number: '142'
    text: |-
      1 In het geval van een wijziging van de gemeentelijke indeling of een grenscorrectie als bedoeld in
      [artikel 3 van de Wet algemene regels herindeling][ref1], stelt Onze Minister op de wijze als aangegeven
      in [artikelen 140][ref2] en [141, tweede lid][ref3], de nieuwe opheffingsnormen voor de betrokken
      gemeenten onderscheidenlijk delen van gemeenten vast, voor zover deze afwijken van de op grond van
      [artikel 139, tweede lid][ref4], en [artikel 141][ref5] bepaalde opheffingsnormen.

      2 Indien het college van burgemeester en wethouders binnen 3 maanden na de datum van herindeling, bedoeld
      in [artikel 1, onderdeel h, van de Wet algemene regels herindeling][ref6], een besluit neemt tot splitsing
      van de gemeente, stelt Onze Minister voor de beide gebiedsdelen een afzonderlijke opheffingsnorm vast.
      [Artikel 141, eerste lid eerste, tweede en vierde volzin en tweede lid eerste en derde volzin][ref7], is van
      overeenkomstige toepassing.

      3 [Artikel 141, derde lid, eerste, derde en vierde volzin, en vierde lid][ref8] is van overeenkomstige toepassing,
      met dien verstande dat in het vierde lid voor «6 maanden» wordt gelezen: 3 maanden.

      4 De ingevolge het eerste en tweede lid vastgestelde opheffingsnormen treden in de plaats van de
      op grond van [artikel 139, tweede lid][ref9], en [artikel 141][ref10] bepaalde opheffingsnormen
      en treden in werking met ingang van 1 januari volgend op de datum van herindeling, bedoeld in
      [artikel 1, onderdeel h, van de Wet algemene regels herindeling][ref11]. Tot en met 31 december volgend op de datum
      van herindeling blijven op de scholen in de gemeenten die bij de wijziging van de gemeentelijke indeling of de
      grenscorrectie zijn betrokken, de opheffingsnormen van toepassing die golden op de dag voorafgaande aan de datum
      van herindeling.


