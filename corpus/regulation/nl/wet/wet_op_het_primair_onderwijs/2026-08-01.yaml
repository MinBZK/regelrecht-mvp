  - number: '133'
    text: |-
      1 In het jaar volgend op de definitieve vaststelling, bedoeld in [artikel 132, negende lid][ref1], wordt het
      overschrijdingsbedrag vastgesteld waarop het bevoegd gezag van een niet door de gemeente in stand gehouden school,
      die gedurende een of meer jaren van het desbetreffende tijdvak in de gemeente was gevestigd, aanspraak heeft.

      2 Het overschrijdingsbedrag, bedoeld in het eerste lid, wordt vastgeste1ld door het percentage, bedoeld in
      [artikel 132, negende lid][ref2], te vermenigvuldigen met het totaal van de ontvangsten van een niet door de
      gemeente in stand gehouden school dat is gebaseerd op de bedragen die krachtens de [artikelen 115][ref3] en
      [116][ref4] voor het desbetreffende tijdvak zijn vastgesteld, met dien verstande dat bij het vaststellen van
      het totaal van de ontvangsten, bedoeld in voorgaande volzin, de ontvangsten, bedoeld in artikel 115, tweede lid,
      onderdeel h, voor de exploitatie van ruimen voor het onderwijs in lichamelijke oefening en in verband met de
      toepassing van [artikel 158][ref5] buiten beschouwing blijven.

      3 Indien aan het bevoegd gezag van een niet door de gemeente in stand gehouden school een deel van de bekostiging
      is overgedragen door een ander bevoegd gezag, wordt bij het vaststellen van het totaal van de ontvangsten,
      bedoeld in het tweede lid, dat deel bij genoemde school wel en bij de school van laatstgenoemd bevoegd gezag niet
      aangemerkt als ontvangsten.

      4 Indien een gemeente voor een niet door de gemeente in stand gehouden school het deel van de bekostiging, bedoeld
      in [artikel 115, tweede lid, onderdelen e, f en k][ref6], betrekking hebben, geheel of gedeeltelijk verzorgt,
      wordt een overeenkomstig deel van de ontvangsten in mindering gebracht op het totaal van de ontvangsten voor de
      betrokken school waarover het overschrijdingsbedrag, bedoeld in het eerste lid, wordt vastgesteld.

      5 Indien een gemeente gedurende een gedeelte van het desbetreffende tijdvak een of meer basisscholen
      onderscheidenlijk speciale scholen voor basisonderwijs in stand houdt, wordt voor het vaststellen van het
      overschrijdingsbedrag, bedoeld in het eerste lid, uitgegaan van het totaal van de ontvangsten van een niet door de
      gemeente in stand gehouden school over een overeenkomstig gedeelte van het desbetreffende tijdvak.


