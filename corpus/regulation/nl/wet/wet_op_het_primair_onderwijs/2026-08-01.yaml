  - number: '187'
    text: >-
      Het bevoegd gezag van een bijzondere school is verplicht de uit de overheidskassen ontvangen gelden overeenkomstig
      de bestemming te gebruiken. Van de inkomsten en uitgaven wordt volgens bij algemene maatregel van bestuur te geven
      voorschriften nauwkeurig boekgehouden.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel187
  - number: '188'
    text: |-
      1 Het bevoegd gezag van een school onderscheidenlijk het samenwerkingsverband is aangesloten bij een door Onze
      Minister aan te wijzen rechtspersoon met volledige rechtsbevoegdheid die zich ten doel stelt waarborgen te bieden
      voor de kosten voor vervanging bij afwezigheid van personeel.

      2 Het bevoegd gezag van een school onderscheidenlijk het samenwerkingsverband is voorts verplicht jaarlijks
      een door het bestuur van de in het eerste lid bedoelde rechtspersoon te bepalen bijdrage te voldoen aan die
      rechtspersoon in verband met de kosten voor vervanging.

      3 Van de in het eerste juncto tweede lid bedoelde verplichting kan Onze Minister op aanvraag van het bevoegd gezag
      ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke aard. Onze Minister verleent
      de ontheffing slechts indien het bevoegd gezag aantoont dat een afdoende andere voorziening is getroffen met
      betrekking tot de gevolgen van vervanging bij afwezigheid van personeel. Onze Minister besluit binnen zes maanden
      na ontvangst van een aanvraag als bedoeld in de eerste volzin.

      4 Het bestuur van de rechtspersoon kan regels vaststellen ter uitvoering van het eerste lid.

      5 Uit 's Rijks kas wordt jaarlijks een door Onze Minister te bepalen bedrag betaald aan de rechtspersoon, bedoeld
      in het eerste lid, in verband met de kosten, bedoeld in dat lid onder b.

      6 Op de rechtspersoon, bedoeld in het eerste lid, is de [Kaderwet zelfstandige bestuursorganen][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '189'
    text: |-
      1 De rechtspersoon, bedoeld in [artikel 188][ref1], kan het burgerservicenummer van het personeelslid dat bij
      afwezigheid wordt vervangen, en van degene die het personeelslid tijdelijk vervangt, uitsluitend in het kader van
      het doel, bedoeld in artikel 188, eerste lid, onderdeel a, gebruiken in het verkeer met:

      a. het personeelslid onderscheidenlijk degene die het personeelslid tijdelijk vervangt,

      b. het bevoegd gezag van de school dan wel het samenwerkingsverband waar de in onderdeel a bedoelde personen
      werkzaam zijn,

      c. Onze Minister,

      d. de instantie, bedoeld in [artikel 190, vijfde lid][ref2], of

      e. het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3].

      2 Het burgerservicenummer wordt op een daartoe strekkend verzoek van de in het eerste lid bedoelde rechtspersoon
      aan die rechtspersoon verstrekt door het bevoegd gezag van de school dan wel het samenwerkingsverband waar het
      personeelslid dat bij afwezigheid wordt vervangen, werkzaam is.

      3 Indien dat ten behoeve van het jaarverslag, bedoeld in
      [artikel 18, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref4], noodzakelijk is, worden gegevens
      daarin slechts zodanig openbaar gemaakt dat daaraan geen herkenbare gegevens over een afzonderlijk persoon
      kunnen worden ontleend, tenzij het betreft de controle op de juistheid van de gegevens in het kader van de
      controle op de rechtmatigheid en de doelmatigheid van door de rechtspersoon gedane uitgaven. Daarbij kunnen de
      burgerservicenummers worden vergeleken met de burgerservicenummers die door andere daartoe bij of krachtens de wet
      bevoegde instanties zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel188
