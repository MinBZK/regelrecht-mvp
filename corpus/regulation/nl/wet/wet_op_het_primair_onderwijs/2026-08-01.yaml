  - number: '86'
    text: 'In deze paragraaf wordt onder «school» verstaan: speciale school voor basisonderwijs.'
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel86
  - number: '87'
    text: >-
      1 Onze Minister kan een school op aanvraag van het bevoegd gezag van de school voor bekostiging in aanmerking
      brengen. Onze Minister willigt de aanvraag slechts in, indien


      a. de bevoegde gezagsorganen van alle basisscholen in het samenwerkingsverband met de aanvraag instemmen,


      b. het samenwerkingsverband meer dan de helft van de basisscholen omvat in een nieuwe woningbouwlocatie van ten
      minste 15 000 woningen of in aan elkaar grenzende woningbouwlocaties waar binnen 10 jaar in totaal ten minste
      15 000 woningen worden gebouwd, en


      c. het samenwerkingsverband nog niet over een speciale school voor basisonderwijs beschikt.


      2 De bekostiging kan slechts aanvangen met ingang van 1 augustus van een schooljaar.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel87
  - number: '88'
    text: |-
      1 Onze Minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school
      die wordt omgezet van een openbare in een bijzondere school of omgekeerd, waaraan de richting van het onderwijs
      verandert, waaraan het onderwijs wordt uitgebreid met onderwijs van een of meer andere richtingen, of die tot stand
      komt als samenwerkingsschool.

      2 Onze Minister kan besluiten toe te staan dat een bekostigde school een andere plaats van vestiging krijgt. Onze
      Minister kan aan zijn toestemming voorwaarden verbinden.

      3 Een aanvraag van een besluit als bedoeld in het eerste of tweede lid is met redenen omkleed en gaat vergezeld van

      a. een opgave van het samenwerkingsverband of de samenwerkingsverbanden waaraan de school deelneemt en zal gaan
      deelnemen,

      b. de voorgestelde datum van ingang van de bekostiging,

      c. indien het betreft een aanvraag van een besluit als bedoeld in het eerste lid, het openbaar onderwijs of de
      richting of richtingen van het bijzonder onderwijs dat de school voor en na de omzetting, wijziging van richting,
      uitbreiding met een of meer andere richtingen of totstandkoming van een samenwerkingsschool omvat, en

      d. indien het betreft een aanvraag van een besluit als bedoeld in het tweede lid, de aanduiding van de plaats in de
      gemeente waar het onderwijs moet worden gegeven.

      4 Onze Minister willigt de aanvraag van een besluit als bedoeld in het tweede lid slechts in, ingeval binnen het
      betrokken samenwerkingsverband of de betrokken samenwerkingsverbanden sprake blijft van een goede bereikbaarheid
      van speciale scholen voor basisonderwijs.

      5 [Artikel 17d, tweede lid][ref1], is niet van toepassing bij de totstandkoming van een samenwerkingsschool.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel88
