  - number: '13'
    text: |-
      1 De schoolgids bevat voor ouders, verzorgers en leerlingen informatie over de werkwijze van de school en bevat in
      elk geval informatie over:

      a. de doelen van het onderwijs en de resultaten die met het onderwijsleerproces worden bereikt, met dien verstande
      dat bij algemene maatregel van bestuur voorschriften kunnen worden gegeven met betrekking tot de wijze waarop

      1°. de resultaten worden beschreven die met het onderwijsleerproces worden bereikt, en

      2°. de context wordt vermeld waarin de onder 1° bedoelde resultaten dienen te worden geplaatst,

      b. de wijze waarop aan de ondersteuning van het jonge kind wordt vormgegeven,

      c. de basisondersteuningsvoorzieningen en het ondersteuningsaanbod van de school,

      d. de wijze waarop de verplichte onderwijstijd wordt benut,

      e. de geldelijke bijdrage, bedoeld in [artikel 40, eerste lid][ref1], waarbij wordt vermeld dat deze vrijwillig
      is en dat het niet voldoen van die bijdrage niet leidt tot het uitsluiten van leerlingen van deelname aan
      activiteiten,

      f. de rechten en plichten van de ouders, de verzorgers, de leerlingen en het bevoegd gezag, waaronder de informatie
      over de klachtenregeling, bedoeld in [artikel 14][ref2], en de gronden voor vrijstelling van het onderwijs, bedoeld
      in [artikel 41, tweede lid][ref3],

      g. de wijze waarop het bevoegd gezag omgaat met de in [artikel 12, eerste lid][ref4], omschreven bijdragen,

      i. het beleid met betrekking tot de veiligheid,

      j. de wijze waarop de voorzieningen, bedoeld in [artikel 45][ref5], worden georganiseerd,

      k. het verzuimbeleid,

      l. de wijze waarop de identiteitscommissie, bedoeld in [artikel 17d][ref6], invulling geeft aan het openbare
      karakter onderscheidenlijk de identiteit voor zover het betreft een samenwerkingsschool,

      m. het samenwerkingsverband en in voorkomend geval de samenwerkingsverbanden waarbij het bevoegd gezag van de
      school is aangesloten,

      n. de persoon bij wie de taken, bedoeld in [artikel 4c, eerste lid, onderdeel c][ref7], zijn belegd,

      o. de in het kader van het stelsel van kwaliteitszorg, bedoeld in [artikel 12, vierde lid][ref8], gedane
      bevindingen en de maatregelen die naar aanleiding daarvan zijn getroffen,

      p. de wijze van totstandkoming van het schooladvies en het definitieve schooladvies, bedoeld in
      [artikel 45d, eerste en derde lid][ref9], en

      q. de wijze waarop het bevoegd gezag ouders en leerlingen actief informeert over de totstandkoming van het
      schooladvies en het definitieve schooladvies, bedoeld in [artikel 45d, eerste en derde lid][ref10].

      2 De algemene maatregel van bestuur, bedoeld in het eerste lid, onder a, wordt aan de beide kamers der Staten-
      Generaal overgelegd. De maatregel treedt niet in werking dan nadat 4 weken na de overlegging zijn verstreken en
      gedurende die termijn niet door of namens een der kamers de wens te kennen wordt gegeven dat het in die maatregel
      geregelde onderwerp bij de wet wordt geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk
      ingediend.


