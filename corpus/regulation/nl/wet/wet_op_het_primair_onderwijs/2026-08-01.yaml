  - number: 85a
    text: >-
      1 Onze Minister kan op aanvraag van het bevoegd gezag van een basisschool een afdeling voor internationaal
      georiënteerd basisonderwijs aan die school en in die gemeente voor bekostiging in aanmerking brengen. Een
      aanvraag als bedoeld in de eerste volzin moet voor 1 oktober van het jaar voorafgaand aan het schooljaar waarin
      de bekostiging van de afdeling wordt verzocht, worden ingediend bij Onze Minister. Onze Minister besluit voor
      1 januari daaropvolgend.


      2 Onze Minister willigt de aanvraag slechts in, indien de aanvraag vergezeld gaat van een prognose die is gebaseerd
      op statistische gegevens, op basis waarvan het te verwachten aantal leerlingen op de afdeling binnen 5 schooljaren
      ten minste 80 bedraagt en de afdeling past binnen een evenwichtig landelijk gespreid geheel van basisscholen met
      een afdeling voor internationaal georiënteerd basisonderwijs.


      3 Bij de berekening van het aantal leerlingen dat de afdeling, bedoeld in het eerste lid, zal bezoeken worden
      leerlingen die wonen binnen een redelijke afstand van een basisschool met een afdeling voor internationaal
      georiënteerd basisonderwijs en voor wie op die afdeling plaatsruimte aanwezig is, niet meegeteld.


      4 Bij ministeriële regeling kan een model worden vastgesteld voor de berekening van de prognose, bedoeld in het
      tweede lid, en de wijze van indiening ervan.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel85a
  - number: 85b
    text: |-
      1 De afdelingen voor internationaal georiënteerd basisonderwijs die op 31 juli 2014 door Onze Minister werden
      bekostigd, worden aangemerkt als afdelingen, bedoeld in [artikel 85a][ref1].

      2 [Artikel 40, vijfde lid][ref2], is niet van toepassing ten aanzien van de leerlingen die op 31 juli 2014
      onderwijs volgden op een afdeling als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel85a
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel40
