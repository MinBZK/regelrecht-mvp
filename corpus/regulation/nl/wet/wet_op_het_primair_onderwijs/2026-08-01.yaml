    text: |-
      1 Het onderwijs is op doelgerichte en samenhangende wijze gericht op het realiseren van de kerndoelen.

      2 Een kerndoel, alsmede de uitwerking daarvan, wordt, met inachtneming van
      [artikel 8, eerste tot en met derde lid][ref1], bij algemene maatregel van bestuur vastgesteld als een na te
      streven inhoudelijke doelstelling voor het onderwijsprogramma, gericht op het verwerven van kennis, inzicht of
      vaardigheden of het opdoen van ervaringen door leerlingen.

      3 De kerndoelen hebben betrekking op lezen, schrijven en rekenen.

      4 Het primair onderwijs omvat verder:

      a. Nederlandse taal;

      b. rekenen en wiskunde;

      c.

      d.

      e. Engelse taal;

      f. geschiedenis en staatsinrichting;

      g. geestelijke stromingen;

      h. sociale redzaamheid, gezond gedrag en gedrag in het verkeer;

      i. aardrijkskunde;

      j. biologie;

      k. natuur;

      l. techniek;

      m. muziek, beeldende vormgeving en dans, theater of film; en

      n. lichamelijke oefening.

      5 Voor de onderwerpen genoemd in het vierde lid worden eveneens kerndoelen vastgesteld.

      6 Het onderwijs in lichamelijke oefening wordt gespreid verzorgd over alle schooljaren en beslaat in een schooljaar
      gemiddeld ten minste 1,5 uur per schoolweek.

      7 Het onderwijs kan naast de onderwijsactiviteiten, bedoeld in het eerste lid, tevens onderwijs in de Duitse taal
      of de Franse taal omvatten.

      8 Op de scholen in de provincie Fryslân wordt tevens onderwijs gegeven in de Friese taal. Gedeputeerde staten
      kunnen op aanvraag van het bevoegd gezag gedeeltelijke of volledige ontheffing van deze verplichting verlenen.
      Gedeputeerde staten stellen in een beleidsregel criteria vast voor die gedeeltelijke en volledige ontheffing. De
      vaststelling geschiedt niet eerder dan nadat gedeputeerde staten overleg hebben gevoerd met het Friese primair
      onderwijs.

      9 Ten aanzien van de onderwijsactiviteit, bedoeld in het achtste lid, stellen provinciale staten van Fryslân
      in afwijking van het tweede lid bij verordening kerndoelen Friese taal vast. De vaststelling geschiedt niet
      eerder dan nadat gedeputeerde staten overleg hebben gevoerd met het Friese primair onderwijs. De verordening
      behoeft de goedkeuring van Onze Minister. Indien Onze Minister voornemens is goedkeuring te onthouden, verzoekt
      hij de Onderwijsraad een advies uit te brengen. Het verzoek bevat een omschrijving van de onderwerpen waarover
      advies wordt verwacht. Het advies wordt binnen zes weken uitgebracht aan Onze Minister en wordt bekend gemaakt.
      Onze Minister informeert beide Kamers der Staten-Generaal over zijn voornemen om al dan niet goed te keuren.
      [Paragraaf 4.1.3.3 van de Algemene wet bestuursrecht][ref2] is niet van overeenkomstige toepassing.

      10 Onze Minister kan goedkeuring als bedoeld in het negende lid in ieder geval onthouden indien aan de volgende
      voorwaarden, waarvoor gedeputeerde staten gegevens aandragen, niet wordt voldaan:

      a. het bestaan van voldoende draagvlak in het Friese primair onderwijs voor de voorgelegde kerndoelen Friese taal;

      b. dat de kerndoelen Friese taal niet meer inspanningen van het Friese primair onderwijs vergen dan het aandeel van
      het onderwijs in de Friese taal binnen het totaal aan onderwijsactiviteiten rechtvaardigt.

      11 Onze Minister kan goedkeuring als bedoeld in het negende lid in ieder geval onthouden indien de kerndoelen
      Friese taal geen aandacht schenken aan:

      a. het zich mondeling uitdrukken in het Fries en het verstaan van de Fries gesproken taal,

      b. het zich schriftelijk uitdrukken in het Fries en het verwerven van informatie uit in het Fries gestelde teksten,

      c. bevordering van het begrip van de Friese taal, en

      d. het ontwikkelen van een positieve houding ten aanzien van het gebruik van het Fries.

      12 Het bevoegd gezag hanteert de kerndoelen bij zijn onderwijsactiviteiten als aan het einde van het basisonderwijs
      te bereiken doelstellingen. Indien de eerste volzin niet kan worden toegepast voor een leerling vanwege zijn
      handicap, wordt in het ontwikkelingsperspectief, bedoeld in [artikel 40a][ref3], aangegeven welke vervangende
      onderwijsdoelen worden gehanteerd.

      13 Indien een bevoegd gezag van een bijzondere school dringend bedenkingen heeft tegen de krachtens het tweede
      of negende lid vastgestelde kerndoelen, kan het bevoegd gezag eigen kerndoelen voor de school vaststellen. Deze
      kerndoelen zijn van gelijk niveau als de krachtens het tweede of negende lid vastgestelde kerndoelen. Het bevoegd
      gezag zendt de vastgestelde kerndoelen aan de inspecteur.

      14 Bij de verzorging van het onderwijs op basis van de kerndoelen voor Nederlandse taal en
      rekenen en wiskunde, neemt het bevoegd gezag, met inachtneming van [artikel 8, eerste lid][ref4],
      de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref5],
      als uitgangspunt.

      15

      16 Het onderwijs wordt gegeven in het Nederlands. Daar waar naast de Nederlandse taal, de Friese taal of een
      streektaal in levend gebruik is, kan de Friese taal of de streektaal mede als voertaal bij het onderwijs worden
      gebruikt. Voor de opvang in en de aansluiting bij het Nederlandse onderwijs van leerlingen met een niet-Nederlandse
      culturele achtergrond kan de taal van het land van oorsprong mede als voertaal bij het onderwijs worden gebruikt,
      overeenkomstig een door het bevoegd gezag vastgestelde gedragscode.

      17 In afwijking van het zestiende lid kan een deel van het onderwijs worden gegeven in de Engelse, Duitse of Franse
      taal tot ten hoogste een bij algemene maatregel van bestuur vast te stellen percentage per schooljaar.

      18 In afwijking van het zestiende lid, eerste volzin, kan het onderwijs aan een afdeling als bedoeld in
      [artikel 85a][ref6] worden gegeven in de Engelse taal, mits ten minste 10% van het aantal uren, bedoeld in
      [artikel 8, zevende lid][ref7], wordt gegeven in het Nederlands of wordt besteed aan de Nederlandse taal.

      19 Onze Minister kan in bijzondere gevallen op aanvraag van het bevoegd gezag besluiten toe te staan dat wordt
      afgeweken van de krachtens het tweede lid vastgestelde kerndoelen. De toestemming wordt verleend voor een bepaald
      tijdvak; zij kan voorwaarden bevatten.

      20 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.

      21 Onze Minister zendt iedere tien jaar aan de Staten-Generaal een verslag over de noodzaak tot herziening van de
      krachtens het tweede lid vastgestelde kerndoelen en betrekt daarbij het advies van de Onderwijsraad, bedoeld in
      [artikel 2, eerste lid, onderdeel c, van de Wet op de Onderwijsraad][ref8].


