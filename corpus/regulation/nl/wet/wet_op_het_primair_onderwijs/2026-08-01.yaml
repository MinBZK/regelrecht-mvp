  - number: 45d
    text: |-
      1 Het bevoegd gezag stelt in de periode van 10 januari tot en met 31 januari, voorafgaand aan de afname van
      de doorstroomtoets, voor een leerling in het laatste leerjaar van het basisonderwijs een schooladvies op voor
      het volgen van aansluitend voortgezet onderwijs of voortgezet speciaal onderwijs. Het bevoegd gezag deelt het
      schooladvies mee aan de ouders.

      2 Indien uit de uitslag van de door de leerling afgelegde doorstroomtoets, bedoeld in
      [artikel 45b, derde lid][ref1], blijkt dat de leerling beschikt over meer kennis en vaardigheden dan waarop het
      schooladvies berust, stelt het bevoegd gezag het schooladvies overeenkomstig de uitslag van de doorstroomtoets bij.
      Het bevoegd gezag kan gemotiveerd van de eerste volzin afwijken, wanneer dat in het belang van de leerling is.

      3 Na de uitslag van de doorstroomtoets en, indien van toepassing, een bijstelling van het schooladvies, stelt
      het bevoegd gezag uiterlijk 24 maart het definitieve schooladvies vast. Indien de leerling, als gevolg van een
      omstandigheid als bedoeld in [artikel 45c][ref2], geen doorstroomtoets heeft afgelegd, stelt het bevoegd gezag
      uiterlijk 24 maart het definitieve schooladvies vast conform het schooladvies. Het bevoegd gezag maakt het
      definitieve schooladvies bekend aan de ouders.

      4 Het definitieve schooladvies maakt onderdeel uit van het onderwijskundig rapport, bedoeld in [artikel 42][ref3].


