  - number: '76'
    text: |-
      1 Het bevoegd gezag maakt met de belangstellingsmeting, bedoeld in [artikel 74, tweede lid, onder a][ref1],
      aannemelijk dat een school op 1 januari van het elfde jaar na de indiening van de aanvraag zal worden bezocht door
      ten minste het aantal leerlingen dat overeenkomt met de voor de gemeente geldende stichtingsnorm.

      2 Bij ministeriële regeling wordt voor elke gemeente een stichtingsnorm vastgesteld welke 10/6 bedraagt van de voor
      de gemeente geldende opheffingsnorm berekend op grond van [artikel 140][ref2]. De uitkomst wordt afgerond, waarbij
      de decimalen worden verwaarloosd indien het eerste cijfer achter de komma kleiner is dan 5 en de decimalen worden
      verwaarloosd en het getal verhoogd met 1 indien het eerste cijfer achter de komma gelijk is aan of groter is dan 5.
      De stichtingsnorm bedraagt minimaal 200.

      3 De stichtingsnormen, bedoeld in het tweede lid, worden telkens voor een tijdvak van 5 jaar gelijktijdig met
      de aanpassing van de opheffingsnormen op grond van [artikel 139][ref3] bij ministeriële regeling aangepast.
      De ministeriële regeling wordt voor 1 november van het jaar voorafgaand aan het laatste jaar waarin de
      stichtingsnormen van kracht zijn, bekendgemaakt in de Staatscourant.

      4 In het geval van een wijziging van de gemeentelijke indeling of een grenscorrectie als bedoeld in
      [artikel 3 van de Wet algemene regels herindeling][ref4], stelt Onze Minister op de wijze als aangegeven in het
      tweede lid de nieuwe stichtingsnormen voor de betrokken gemeenten vast, voor zover deze afwijken van de op grond
      van het tweede en derde lid bepaalde stichtingsnormen. De nieuwe stichtingsnormen treden in de plaats van de op
      grond van het tweede en derde lid bepaalde stichtingsnormen en treden in werking met ingang van 1 januari volgend
      op de datum van herindeling, bedoeld in [artikel 1, onderdeel h, van de Wet algemene regels herindeling][ref5]. Tot
      en met 31 december volgend op de datum van herindeling blijven op de scholen in de gemeenten die bij de wijziging
      van de gemeentelijke indeling of de grenscorrectie zijn betrokken, de stichtingsnormen van toepassing die golden op
      de dag voorafgaande aan de datum van herindeling.

      5 In het geval van een wijziging van de naam van een gemeente of een wijziging van het gemeentenummer past Onze
      Minister de ministeriële regeling, bedoeld in het tweede lid, dienovereenkomstig aan.


