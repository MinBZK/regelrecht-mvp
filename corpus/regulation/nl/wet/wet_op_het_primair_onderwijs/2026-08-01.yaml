  - number: 193k
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van hetgeen bij of krachtens deze wet is bepaald,
      voor een tijdelijke nieuwkomersvoorziening regels worden gesteld over:

      a. het doorstroomperspectief;

      b. het schoolplan en de schoolgids, bedoeld in de [artikelen 12 tot en met 13a][ref1];

      c. de plaatsing van leerlingen op een tijdelijke nieuwkomersvoorziening.


