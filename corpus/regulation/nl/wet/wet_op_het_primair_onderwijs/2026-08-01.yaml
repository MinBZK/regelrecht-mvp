  - number: '124'
    text: |-
      1 Onze Minister verstrekt aan het samenwerkingsverband bekostiging voor de inrichting van de
      ondersteuningsstructuur en voor de ondersteuningsvoorzieningen voor de zware ondersteuning. De bekostiging bestaat
      uit een bedrag per leerling.

      2 Onze Minister gaat bij het bepalen van de hoogte van de bekostiging, bedoeld in het eerste lid, uit van het
      aantal leerlingen op 1 februari van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt op de
      vestigingen van de scholen die op 1 januari zijn aangesloten bij een samenwerkingsverband.

      3 Bij ministeriële regeling wordt jaarlijks het bedrag, bedoeld in het eerste lid, vastgesteld.

      4 Voor elke leerling die op 1 februari van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt,
      was ingeschreven op een school voor speciaal onderwijs of voor speciaal en voortgezet speciaal onderwijs behorend
      tot cluster 3 of 4, bedoeld in de [Wet op de expertisecentra][ref1], voor zover het betreft het daaraan verzorgde
      speciaal onderwijs, wordt een bedrag in mindering gebracht op de bekostiging, bedoeld in het eerste lid, van het
      samenwerkingsverband dat de leerling op grond van [artikel 40, tiende lid, van de Wet op de expertisecentra][ref2]
      toelaatbaar heeft verklaard tot het speciaal onderwijs of het speciaal en voortgezet speciaal onderwijs.

      5 Het bedrag, bedoeld in het vierde lid, is afhankelijk van de in de toelaatbaarheidsverklaring opgenomen
      ondersteuningsbehoefte van de leerling en wordt jaarlijks bij ministeriële regeling vastgesteld.

      6 Het vierde lid is van overeenkomstige toepassing op leerlingen in residentiële instellingen, met uitzondering
      van de residentiële instellingen, bedoeld in [artikel 116, vijfde lid, van de Wet op de expertisecentra][ref3],
      die op 1 februari van het kalenderjaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt
      staan ingeschreven op een school op basis van een samenwerkingsovereenkomst als bedoeld in
      [artikel 71a, tweede lid, van de Wet op de expertisecentra][ref4], met dien verstande dat het bedrag, bedoeld in
      [artikel 119, vierde lid, van die wet][ref5] in mindering wordt gebracht op de bekostiging van:

      a. het samenwerkingsverband:

      1°. dat verantwoordelijk is voor de bekostiging tijdens de inschrijving op een school voor speciaal
      onderwijs of voor speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 of 4, bedoeld in de
      [Wet op de expertisecentra][ref6], indien de leerling onmiddellijk voorafgaand aan de opname in de residentiële
      instelling was ingeschreven op een school voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs, of

      2°. waartoe de vestiging van de school behoort waar de leerling was ingeschreven en bekostigd onmiddellijk
      voorafgaand aan de opname in de residentiële instelling, of

      b. het samenwerkingsverband in het gebied waar de leerling woont, indien de leerling onmiddellijk voorafgaand
      aan de opname in de residentiële instelling, niet was ingeschreven en bekostigd op een school of, een school
      voor speciaal onderwijs of speciaal en voortgezet speciaal onderwijs behorend tot cluster 3 of 4, bedoeld in de
      [Wet op de expertisecentra][ref7].

      7 De [artikelen 115][ref8], [119][ref9] en [120][ref10] zijn van overeenkomstige toepassing.


