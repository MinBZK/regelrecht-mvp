  - number: '202'
    text: >-
      1 Aan degene die de bevoegdheid tot het geven van onderwijs krachtens artikel 4 van de Wet op het basisonderwijs
      (Stb. 1984, 2) voor 17 april 1982 heeft verloren en deze bevoegdheid niet voordien onvoorwaardelijk is
      teruggegeven, is deze bevoegdheid alsnog teruggegeven op 17 april 1987.


      2 Aan degene die de bevoegdheid, bedoeld in het eerste lid, vijf jaar of minder voor 17 april 1987 krachtens
      de in het eerste lid bedoelde bepalingen heeft verloren en deze bevoegdheid niet voordien onvoorwaardelijk is
      teruggegeven, is deze bevoegdheid vijf jaar na het verlies daarvan alsnog teruggegeven.


      3 Onze Minister kan in bijzondere gevallen de bevoegdheid, bedoeld in het eerste lid, die krachtens de in
      het eerste lid bedoelde bepalingen is verloren en voor 17 april 1987 niet is teruggegeven, al dan niet onder
      voorwaarden, op schriftelijk verzoek van de betrokkene alsnog teruggeven. Deze voorwaarden vervallen vijf jaar na
      het verlies van de bevoegdheid, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel202
  - number: '203'
    text: >-
      1 De vergoeding voor een schoolterrein die voor 1 juni 1992 is aangevangen en plaatsvindt met toepassing van
      artikel 98, derde lid, van de Wet op het basisonderwijs, of artikel E 29, E 32 of E 43 van de Overgangswet WBO,
      zoals die voorschriften luidden op 31 mei 1992, wordt met ingang van 1 juni 1992 gewijzigd in een vergoeding
      ter grootte van twee-derde deel van de rente op basis van een fictieve lening voor de noodzakelijk geachte
      kosten, met een lineaire aflossing en, gerekend vanaf het tijdstip waarop voor het eerst een vergoeding voor
      het schoolterrein werd verleend, een looptijd van 40 jaar. Bij de toepassing van de eerste volzin wordt gerekend
      met het rentepercentage dat zou gelden voor een lening met een lineaire aflossing en een looptijd van 20 jaar,
      uitgaande van een herziening van het rentepercentage per 1 januari volgend op een periode van 20 kalenderjaren
      waarin vergoeding werd verleend. Onze Minister is bevoegd om in verband met de rentestand tot bijstelling van
      een ingevolge de tweede volzin geldend rentepercentage over te gaan. Indien Onze Minister tot bijstelling van
      het rentepercentage is overgegaan, wordt in afwijking van de tweede volzin uitgegaan van een herziening van het
      rentepercentage per 1 januari volgend op een periode van 20 kalenderjaren sinds die bijstelling, het kalenderjaar
      waarin die bijstelling plaatsvond daarbij inbegrepen.


      2 De vergoeding voor de niet op het schoolterrein betrekking hebbende kosten van stichting en eerste inrichting
      van een voorziening in de huisvesting bestemd voor blijvend gebruik die plaatsvindt met toepassing van artikel
      98, eerste lid, van de Wet op het basisonderwijs of artikel E 32 of E 43 van de Overgangswet WBO, zoals die
      voorschriften luidden op 31 december 1991, wordt met ingang van 1 januari 1992 vastgesteld op een vergoeding ter
      grootte van de rente en aflossing op basis van een fictieve lening voor de noodzakelijk geachte kosten met een
      lineaire aflossing en een looptijd van 60 jaar. Indien de vergoeding voor 1 januari 1992 is aangevangen, wordt
      deze met ingang van 1 januari 1992 vastgesteld op een vergoeding ter grootte van de rente en aflossing op basis van
      een fictieve lening voor de op die datum nog niet vergoede noodzakelijk geachte kosten met een lineaire aflossing
      en, gerekend vanaf 1 januari 1992, een looptijd van 60 jaar verminderd met het aantal jaren waarover reeds een
      vergoeding is verleend.


      3 Bij de toepassing van het tweede lid wordt gerekend met het rentepercentage dat zou gelden voor een lening met
      een lineaire aflossing en een looptijd van 20 jaar, uitgaande van een herziening van het rentepercentage telkens
      per 1 januari volgend op een periode van 20 kalenderjaren waarin vergoeding werd verleend. Onze Minister is bevoegd
      om in verband met de rentestand tot bijstelling van een ingevolge de eerste volzin geldend rentepercentage over
      te gaan. Indien Onze Minister tot bijstelling van het rentepercentage is overgegaan, wordt in afwijking van de
      eerste volzin uitgegaan van een herziening van het rentepercentage telkens per 1 januari volgend op een periode van
      20 kalenderjaren sinds die bijstelling, het kalenderjaar waarin die bijstelling plaatsvond daarbij inbegrepen.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel203
