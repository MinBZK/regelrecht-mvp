  - number: 214c
    text: |-
      Na inwerkingtreding van [artikel I, onderdeel D, van de Wet tot wijziging van een aantal onderwijswetten][ref1]
      in verband met aanpassingen op het gebied van de doorstroom van het basisonderwijs naar het voortgezet
      onderwijs en wijziging van de stelselinrichting van doorstroomtoetsen en toetsen verbonden aan
      leerling- en onderwijsvolgsystemen in het basisonderwijs, worden de leerresultaten als bedoeld in
      [artikel 10a, derde lid][ref2], op de volgende wijze beoordeeld:

      a. in het schooljaar na inwerkingtreding van dat artikel tot het moment waarop de resultaten van de
      doorstroomtoetsen, bedoeld in [artikel 45b, derde lid][ref3], van de Wet op het primair onderwijs
      beschikbaar zijn, beoordeeld op basis van de in de drie schooljaren voorafgaand aan inwerkingtreding
      van dat artikel, afgelegde centrale eindtoetsen of andere eindtoetsen als bedoeld in artikel 9b van
      de Wet op het primair onderwijs, zoals dat artikel luidde voorafgaand aan de inwerkingtreding van
      [artikel I, onderdeel C, van Wet tot wijziging van een aantal onderwijswetten][ref4] in verband met aanpassingen
      op het gebied van de doorstroom van het basisonderwijs naar het voortgezet onderwijs en wijziging van de
      stelselinrichting van doorstroomtoetsen en toetsen verbonden aan leerling- en onderwijsvolgsystemen in het
      basisonderwijs.

      b. in het schooljaar na inwerkingtreding van dat artikel, vanaf het moment dat de resultaten van de
      doorstroomtoetsen, bedoeld in artikel [45b, derde lid][ref5], van de Wet op het primair onderwijs, beschikbaar
      zijn:

      1°. voor het voorafgaande schooljaar beoordeeld op basis van de afgelegde doorstroomtoetsen, en

      2°. voor de twee daaraan voorafgaande schooljaren op basis van de afgelegde centrale
      eindtoetsen of andere eindtoetsen als bedoeld in [artikel 9b][ref6] van de Wet op het
      primair onderwijs, zoals dat artikel luidde voorafgaand aan de inwerkingtreding van
      [artikel I, onderdeel C, van de Wet tot wijziging van een aantal onderwijswetten][ref7] in verband met
      aanpassingen op het gebied van de doorstroom van het basisonderwijs naar het voortgezet onderwijs en wijziging
      van de stelselinrichting van doorstroomtoetsen en toetsen verbonden aan leerling- en onderwijsvolgsystemen in het
      basisonderwijs;

      3. in het tweede schooljaar na inwerkingtreding van dat artikel:

      1°. voor twee schooljaren beoordeeld op basis van de afgelegde doorstroomtoetsen, bedoeld in
      [artikel 45b, derde lid][ref8], van de Wet op het primair onderwijs, en

      2°. voor het daaraan voorafgaande schooljaar op basis van de afgelegde centrale eindtoetsen of andere eindtoetsen
      als bedoeld in [artikel 9b][ref9] van de Wet op het primair onderwijs, zoals dat artikel luidde voorafgaand aan
      de inwerkingtreding van [artikel I, onderdeel C, van de Wet tot wijziging van een aantal onderwijswetten][ref10]
      in verband met aanpassingen op het gebied van de doorstroom van het basisonderwijs naar het voortgezet
      onderwijs en wijziging van de stelselinrichting van doorstroomtoetsen en toetsen verbonden aan leerling- en
      onderwijsvolgsystemen in het basisonderwijs.


