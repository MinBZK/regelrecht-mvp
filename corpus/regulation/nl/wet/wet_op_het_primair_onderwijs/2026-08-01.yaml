  - number: '121'
    text: |-
      1 In aanvulling op de bekostiging, bedoeld in [artikel 116][ref1], ontvangt het bevoegd gezag van een speciale
      school voor basisonderwijs een bedrag per leerling voor wie een samenwerkingsverband heeft bepaald dat deze
      toelaatbaar is tot een speciale school voor basisonderwijs.

      2 Bij ministeriële regeling wordt jaarlijks het bedrag, bedoeld in het eerste lid, vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel116
