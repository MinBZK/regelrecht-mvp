  - number: 4a
    text: |-
      1 Indien het bevoegd gezag op enigerlei wijze bekend is geworden dat een ten behoeve van zijn
      school met taken belast persoon zich mogelijk schuldig maakt of heeft gemaakt aan een seksueel
      misdrijf als bedoeld in [Titel XIV van het Wetboek van Strafrecht][ref1] jegens een leerling van
      de school, treedt het bevoegd gezag onverwijld in overleg met de vertrouwensinspecteur, bedoeld in
      [artikel 6 van de Wet op het onderwijstoezicht][ref2].

      2 Indien uit het overleg, bedoeld in het eerste lid, moet worden geconcludeerd dat er sprake is van een redelijk
      vermoeden dat de desbetreffende persoon zich schuldig heeft gemaakt aan een misdrijf als bedoeld in het eerste
      lid jegens een leerling van de school, doet het bevoegd gezag onverwijld aangifte bij een opsporingsambtenaar als
      bedoeld in [artikel 127][ref3] juncto [artikel 141 van het Wetboek van Strafvordering][ref4], en stelt het bevoegd
      gezag de vertrouwensinspecteur daarvan onverwijld in kennis. Voordat het bevoegd gezag overgaat tot het doen van
      aangifte, stelt het de ouders van de betrokken leerling, onderscheidenlijk de betreffende ten behoeve van de school
      met taken belaste persoon, hiervan op de hoogte.

      3 Indien een personeelslid op enigerlei wijze bekend is geworden dat een ten behoeve van de school met taken belast
      persoon zich mogelijk schuldig maakt of heeft gemaakt aan een misdrijf als bedoeld in het eerste lid jegens een
      leerling van de school, stelt het personeelslid het bevoegd gezag daarvan onverwijld in kennis.


