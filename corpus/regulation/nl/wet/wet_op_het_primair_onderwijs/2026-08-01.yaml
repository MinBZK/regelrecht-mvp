  - number: 84a
    text: |-
      1 Het bevoegd gezag kan op de wijze als aangegeven in [artikel 74][ref1], met uitzondering van het tweede lid,
      onderdeel a, en [artikel 75, eerste lid, eerste volzin en tweede lid][ref2], bij Onze Minister een aanvraag
      indienen om een nevenvestiging, of een deel van een school of nevenvestiging die zich op een andere locatie bevindt
      dan de plaats van vestiging van die school, te verzelfstandigen en als school voor bekostiging in aanmerking te
      brengen. In afwijking van artikel 75, derde lid, vangt de bekostiging aan op 1 augustus volgend op het besluit van
      Onze Minister. Artikel 75, zesde en zevende lid, is van overeenkomstige toepassing.

      2 Onze Minister willigt een aanvraag in indien wordt voldaan aan voorwaarden die bij ministeriële regeling zijn
      vastgesteld. Deze voorwaarden hebben in elk geval betrekking op:

      a. het aantal leerlingen van de school op 1 oktober van het jaar dat voorafgaat aan de aanvraag;

      b. het aantal leerlingen waarvan redelijkerwijs kan worden aangenomen dat deze de scholen die na de
      verzelfstandiging ontstaan, zal bezoeken; en

      c. de wijze waarop op basis van de statistische gegevens, onder meer verstrekt door het Centraal Bureau voor
      de Statistiek aannemelijk wordt gemaakt dat op 1 januari van het elfde jaar na de aanvraag de school die na
      verzelfstandiging ontstaat, voldoet aan de stichtingsnorm en de bekostiging van het overblijvende deel van de
      school, met in achtneming van de [artikelen 140 tot en met 142][ref3], gedurende ten minste 10 achtereenvolgende
      jaren kan worden voortgezet.

      3 [Artikel 75, eerste lid, tweede volzin, derde tot en met zevende, tiende en elfde lid][ref4], is van
      overeenkomstige toepassing.


