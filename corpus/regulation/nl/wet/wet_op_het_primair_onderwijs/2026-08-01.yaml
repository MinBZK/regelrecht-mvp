  - number: 193h
    text: |-
      1 Het bevoegd gezag meldt de inrichting van een tijdelijke nieuwkomersvoorziening onverwijld aan Onze Minister.

      2 Na een melding als bedoeld in het eerste lid, zendt het bevoegd gezag binnen acht weken een inrichtingsplan aan
      Onze Minister.

      3 Het inrichtingsplan, bedoeld in het tweede lid, bevat in ieder geval een beschrijving van:

      a. de wijze waarop de tijdelijke nieuwkomersvoorziening zal worden ingericht;

      b. de wijze waarop de tijdelijke nieuwkomersvoorziening toewerkt naar de zo spoedig mogelijke doorstroom van de
      leerlingen;

      c. de wijze waarop ten aanzien van de tijdelijke nieuwkomersvoorziening zal worden voldaan aan de zorgplicht,
      bedoeld in [artikel 4c][ref1];

      d. het personeelsbeleid, bedoeld in [artikel 12, derde lid][ref2], voor zover dat betrekking heeft op de
      tijdelijke nieuwkomersvoorziening;

      e. de invulling van het onderwijsprogramma, bedoeld in [artikel 193i][ref3].

      4 Bij de inrichting van het onderwijs wijkt het bevoegd gezag niet af van het inrichtingsplan.

      5 Het tweede lid is van overeenkomstige toepassing op de wijziging van het inrichtingsplan.

      6 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de melding, bedoeld in
      het eerste lid, en over het inrichtingsplan, bedoeld in het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel4c
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel193i
