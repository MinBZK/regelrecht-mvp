  - number: '164'
    text: |-
      1 Voor 1 mei van het kalenderjaar volgend op het besluit, bedoeld in [artikel 75, derde lid][ref1], meldt het
      bevoegd gezag aan Onze Minister of de school uitgaat van een grondslag en zo ja, welke grondslag.

      2 Voor scholen die direct voorafgaand aan de datum van inwerkingtreding van de Wet van 20 mei 2020 tot wijziging
      van diverse onderwijswetten door het wijzigen van de systematiek van het in aanmerking brengen voor bekostiging
      van nieuwe openbare en bijzondere scholen zodat meer ruimte is voor een nieuw onderwijsaanbod (Wet meer ruimte voor
      nieuwe scholen) (Stb. 2020, 160) reeds werden bekostigd, geldt als grondslag de op die datum geldende richting van
      de school.

      3 Indien de school op enig moment alsnog uitgaat van een grondslag of indien de grondslag van de school wijzigt,
      wordt daarvan binnen vier weken melding gedaan aan Onze Minister.

      4 Het eerste, tweede en derde lid zijn van overeenkomstige toepassing op de nevenvestiging indien die van een
      andere grondslag uitgaat dan de school.

      5 Bij ministeriële regeling wordt een model vastgesteld voor de melding, bedoeld in het eerste en derde lid.


