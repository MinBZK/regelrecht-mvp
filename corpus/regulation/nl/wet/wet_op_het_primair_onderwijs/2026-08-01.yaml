  - number: '132'
    text: |-
      1 Indien een gemeente een of meer scholen in stand houdt, stelt het college van burgemeester en wethouders voor
      basisscholen en speciale scholen voor basisonderwijs jaarlijks voorlopig vast:

      a. het totaal van de bedragen, bedoeld in [artikel 115][ref1] die in het voorafgaande kalenderjaar zijn
      uitgegeven;

      b. het totaal van de ontvangsten, bedoeld in de [artikelen 115][ref2], [116][ref3], [117][ref4], [119][ref5] en
      [120][ref6], in het voorafgaande kalenderjaar;

      c. het totaal van de bedragen die in het voorafgaande kalenderjaar zijn uitgegeven voor de instandhouding van een
      rechtspersoon als bedoeld in [artikel 68][ref7],

      d. het totaal van de ontvangsten op grond van [artikel 69, zevende lid][ref8], en

      e. een staat van voorzieningen die zijn ingesteld voor de door de gemeente in stand gehouden scholen.

      2 Indien de gemeente een deel van de ontvangsten, bedoeld in het eerste lid, onderdeel d, toevoegt aan een
      voorziening, wordt dat deel aangemerkt als een uitgave als bedoeld in dat lid, onderdeel a, onderscheidenlijk als
      een uitgave als bedoeld in dat lid, onderdeel c. Indien de gemeente voor de personeelskosten, de nascholingskosten,
      de exploitatiekosten of de kosten voor de instandhouding van een rechtspersoon als bedoeld in [artikel 68][ref9],
      bedragen aan een voorziening onttrekt, worden deze aangemerkt als ontvangsten als bedoeld in het eerste lid,
      onderdeel b.

      3 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdeel c, worden buiten beschouwing gelaten de
      uitgaven en ontvangsten voor:

      a. administratie, beheer en bestuur, bedoeld in [artikel 115, tweede lid, onderdeel h][ref10];

      b. de exploitatie van een ruimte voor het onderwijs in lichamelijke oefening, en

      c. de toepassing van [artikel 158][ref11].

      4 De ontvangsten, bedoeld in het derde lid, onderdeel a, worden genormeerd vastgesteld op 0,65 procent van de
      bekostiging, bedoeld in [artikel 116][ref12].

      5 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdeel a, worden buiten beschouwing gelaten de
      uitgaven die door de gemeente met toepassing van [artikel 158][ref13], aan een openbare school wordt verbonden.

      6 Bij het vaststellen van de bedragen, bedoeld in het eerste lid, onderdelen a en c, worden buiten beschouwing
      gelaten:

      a. de uitgaven die worden gedekt door ontvangsten van bedragen die door derden zijn betaald,

      b. de uitgaven die worden gedekt door ontvangsten op grond van een besluit als bedoeld in
      [artikel 128, zesde lid][ref14],

      c. de uitgaven voor de voorzieningen waarvoor het bevoegd gezag van een niet door de gemeente in stand gehouden
      school op grond van de regeling, bedoeld in [artikel 129, eerste lid][ref15], een aanvraag bij de gemeente kon
      indienen en gedurende de periode waarvoor een dergelijke aanvraag kon worden gedaan.

      7 Indien de gemeente een deel van de bekostiging overdraagt aan een ander bevoegd gezag, wordt dat deel aangemerkt
      als een uitgave als bedoeld in het eerste lid, onderdeel a. Indien door een ander bevoegd gezag een deel van de
      bekostiging aan de gemeente wordt overgedragen, wordt dat deel aangemerkt als een ontvangst als bedoeld in het
      eerste lid, onderdeel b.

      8 Om de vijf jaar stelt het college van burgemeester en wethouders het totaal van de vastgestelde uitgaven en
      ontvangsten in de voorafgaande vijf kalenderjaren voorlopig vast, zoals in het eerste tot en met zevende lid is
      aangegeven. Indien de uitgaven hoger zijn dan de ontvangsten, bepaalt het college van burgemeester en wethouders
      tevens het bedrag van de overschrijding. Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar
      als bedoeld in de eerste volzin geen school in stand houdt, stelt het college van burgemeester en wethouders,
      in afwijking van die volzin, zo spoedig mogelijk na dat tijdstip het totaal van de vastgestelde uitgaven en
      ontvangsten voorlopig vast in het aan dat tijdstip voorafgaande deel van de periode van vijf jaar, zoals in het
      eerste tot en met zesde lid is aangegeven.

      9 Na sluiting van de rekening van de gemeente stelt het college van burgemeester en wethouders de bedragen, bedoeld
      in het eerste en zevende lid, zo nodig gewijzigd, vast. In het geval, bedoeld in het zevende lid, tweede volzin,
      drukt het college van burgemeester en wethouders vervolgens het bedrag van de overschrijding uit in een percentage
      van het totaal van de ontvangsten, bedoeld in het eerste lid, onderdelen b en d. Het percentage wordt afgerond tot
      twee decimalen. Afronding naar beneden vindt plaats indien de derde decimaal kleiner is dan 5, en naar boven indien
      deze decimaal ten minste 5 bedraagt.


