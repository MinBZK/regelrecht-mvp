  - number: '163'
    text: |-
      1 Bij algemene maatregel van bestuur worden de criteria vastgesteld op grond waarvan een gemeente in aanmerking
      komt voor een specifieke uitkering ter tegemoetkoming in de kosten van de uitvoering van de verplichtingen, bedoeld
      in de [artikelen 158][ref1], [159][ref2] en [160][ref3], alsmede de criteria voor de hoogte daarvan. De uitkering
      wordt per kalenderjaar verstrekt.

      2 Het college van burgemeester en wethouders verstrekt de middelen die de gemeente als specifieke uitkering uit
      ’s Rijks kas ontvangt voor de verplichtingen bedoeld in het eerste lid aan de rechtspersonen die daarvoor in
      aanmerking komen.

      3 Onze Minister kan de uitkering geheel of gedeeltelijk terugvorderen indien de uitkering niet is besteed in
      overeenstemming met de bepalingen van deze wet. Bij de algemene maatregel van bestuur, bedoeld in het eerste lid,
      worden criteria vastgesteld op basis waarvan de minister tot terugvordering kan overgaan.

      4 Het college van burgemeester en wethouders van een gemeente, die een uitkering ontvangt als bedoeld in het eerste
      lid, draagt er zorg voor dat het beschikt over geordende gegevens ten behoeve van het door Onze Minister te voeren
      beleid bedoeld in de [artikelen 158][ref4], [159][ref5] en [160][ref6], en verleent desgevraagd medewerking aan
      door of namens Onze Minister uit te voeren onderzoek dat geheel of mede op deze gegevens is gebaseerd.

      5 Bij of krachtens algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven omtrent de
      definiëring, de wijze van ordening en omtrent de beschikbaarstelling van de gegevens, bedoeld in het vierde lid.


