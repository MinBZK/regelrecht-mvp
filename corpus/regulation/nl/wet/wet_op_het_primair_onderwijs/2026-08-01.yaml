  - number: '117'
    text: |-
      1 In geval van samenvoeging van basisscholen, waarbij een of meer basisscholen worden opgeheven en sprake is
      van een minimale instroom van leerlingen in de samengevoegde basisschool, wordt de bekostiging, bedoeld in
      [artikel 116][ref1], van alle betrokken basisscholen gehandhaafd tot het einde van het kalenderjaar waarin de
      basisscholen zijn samengevoegd.

      2 In geval van samenvoeging van speciale scholen voor basisonderwijs, waarbij een of meer speciale scholen voor
      basisonderwijs worden opgeheven en sprake is van een minimale instroom van leerlingen in de samengevoegde speciale
      school voor basisonderwijs, wordt de bekostiging, bedoeld in [artikel 116][ref2] en [121][ref3], van alle
      betrokken speciale scholen voor basisonderwijs gehandhaafd tot het einde van het kalenderjaar waarin de speciale
      scholen voor basisonderwijs zijn samengevoegd.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de samenvoeging, bedoeld in het
      eerste en tweede lid, waaronder in ieder geval de minimale instroom.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel116
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel116
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel121
