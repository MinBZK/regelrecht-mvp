  - number: 193b
    text: |-
      Voor de toepassing van deze afdeling wordt onder nieuwkomer tevens verstaan een jongere in de zin van de
      [Leerplichtwet 1969][ref1] die vier jaren of korter in Nederland is en om die reden de Nederlandse taal onvoldoende
      beheerst om in het basisonderwijs in te stromen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel193b
    references:
      - id: ref1
        bwb_id: BWBR0002628
  - number: 193c
    text: >-
      1 Het college van burgemeester en wethouders voert ten minste jaarlijks overleg met de bevoegde gezagen van alle
      basisscholen in de gemeente en draagt zorg voor het maken van afspraken over de wijze waarop:


      a. wordt voorzien in voldoende onderwijsplaatsen voor nieuwkomers;


      b. wordt verzekerd dat nieuwkomers op een school worden ingeschreven;


      c. een doorlopende leerlijn voor nieuwkomers wordt georganiseerd.


      2 Alle partijen werken mee aan de totstandkoming van de afspraken en de uitvoering hiervan.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel193c
  - number: 193d
    text: >-
      1 Onze Minister kan op verzoek van het college van burgemeester en wethouders toestemming verlenen voor de
      inrichting van een tijdelijke nieuwkomersvoorziening door de bevoegde gezagen van de scholen in de gemeente.


      2 De toestemming wordt alleen verleend indien aannemelijk is dat:


      a. in de gemeente niet voor iedere nieuwkomer in basisonderwijs kan worden voorzien; of


      b. door de inrichting van een tijdelijke nieuwkomersvoorziening op doelmatigere wijze kan worden voorzien in het
      onderwijs aan nieuwkomers in een aangrenzende gemeente.


      3 De toestemming vervalt indien niet binnen acht weken melding is gemaakt van de inrichting van een tijdelijke
      nieuwkomersvoorziening.


      4 Onze Minister verbindt een termijn aan het bestaan van de tijdelijke nieuwkomersvoorziening. Onze Minister kan
      deze termijn verlengen. Het tweede lid is van overeenkomstige toepassing op het besluit tot verlenging.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel193d
  - number: 193e
    text: |-
      1 Onze Minister kan besluiten dat de bevoegde gezagen van de scholen in een gemeente binnen vier weken voorzien in
      voldoende onderwijsplaatsen voor nieuwkomers door de inrichting van een tijdelijke nieuwkomersvoorziening.

      2 Het besluit tot inrichting van een tijdelijke nieuwkomersvoorziening wordt uitsluitend genomen, indien:

      a. vaststaat dat in de gemeente niet voor iedere nieuwkomer in basisonderwijs kan worden voorzien; en

      b. alleen nadat Onze Minister over het voornemen tot het nemen van het besluit overleg heeft gevoerd met het
      college van burgemeester en wethouders van de gemeente, bedoeld in het eerste lid.

      3 Het besluit tot inrichting van een tijdelijke nieuwkomersvoorziening kan ook betrekking hebben op het bevoegd
      gezag van een school in een aangrenzende gemeente:

      a. indien door de inrichting van een tijdelijke nieuwkomersvoorziening in de aangrenzende gemeente op een meer
      doelmatige wijze kan worden voorzien in de vraag naar onderwijs van nieuwkomers in de gemeente bedoeld in het
      eerste lid; en

      b. Onze Minister over het voornemen tot het nemen van het besluit overleg heeft gevoerd met het college van
      burgemeester en wethouders van de aangrenzende gemeente.

      4 [Artikel 193d, vierde lid][ref1], is van overeenkomstige toepassing.

      5 Het besluit tot inrichting van tijdelijke nieuwkomersvoorzieningen wordt gepubliceerd in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel193d
