      1 In deze afdeling wordt verstaan onder:

      - *fusie:* institutionele fusie of bestuursoverdracht,
      - *institutionele fusie:* fusie waarbij een school ontstaat door samenvoeging van twee of meer scholen,
      - *bestuursoverdracht:* overdracht van een school door het bevoegd gezag dat deze in stand houdt aan een ander
      bevoegd gezag in de zin van deze wet of een andere onderwijswet.

      2 Het eerste lid, onderdeel c, is niet van toepassing op het instellen van een openbare rechtspersoon als bedoeld
      in [artikel 47, eerste lid, eerste volzin][ref1], de instandhouding van een of meer openbare scholen door een
      stichting als bedoeld in [artikel 48, eerste lid][ref2], of de overdracht aan de gemeente van de instandhouding
      van een openbare school of openbare nevenvestiging, bedoeld in [artikel 148, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel148
