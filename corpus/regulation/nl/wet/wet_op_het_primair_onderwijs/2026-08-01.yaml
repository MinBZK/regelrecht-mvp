  - number: '98'
    text: |-
      1 Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst die niet in het programma, bedoeld in [artikel 95][ref1], is opgenomen, maar die gelet op de voortgang van
      het onderwijs geen uitstel kan lijden, dient een aanvraag om bekostiging van die voorziening in bij het college van
      burgemeester en wethouders.

      2 De beschikking kan een gedeelte van de gewenste voorziening dan wel een andere voorziening dan gewenst omvatten.
      Het college van burgemeester en wethouders wijst de aanvraag af, indien:

      a. het besluit over de voorziening kan worden genomen bij de vaststelling van het eerstvolgende programma, of

      b. een van de weigeringsgronden, genoemd in
      [artikel 100, eerste lid, onderdelen a tot en met d en f, en tweede lid][ref2], van toepassing is.


