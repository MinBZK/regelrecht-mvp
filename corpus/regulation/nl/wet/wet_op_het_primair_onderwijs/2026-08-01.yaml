  - number: '215'
    text: |-
      1 [Titel IV, Afdeling 12, paragraaf 2][ref1], vervalt twee jaren na de inwerkingtreding van
      [artikel I, onderdeel C, artikel 180b van de Wet tijdelijke onderwijsvoorzieningen bij massale toestroom van
      ontheemden][ref2].

      2 Bij koninklijk besluit kan voor de in het eerste lid genoemde paragraaf of onderdelen daarvan worden bepaald dat
      zij op een eerder of later tijdstip vervallen.

      3 De voordracht voor een koninklijk besluit als bedoeld in het tweede lid wordt niet eerder gedaan dan twee weken
      nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd. Indien een der Kamers der Staten-Generaal
      binnen die termijn besluit niet in te stemmen met dat ontwerp, wordt ten aanzien van dat ontwerp geen voordracht
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#HoofdstukI
