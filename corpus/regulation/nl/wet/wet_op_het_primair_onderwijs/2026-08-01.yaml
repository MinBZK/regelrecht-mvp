  - number: '2'
    text: >-
      Het basisonderwijs is het onderwijs bestemd voor kinderen vanaf de leeftijd van omstreeks 4 jaar. Het legt mede de
      grondslag voor het volgen van aansluitend voortgezet onderwijs.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel2
  - number: '3'
    text: |-
      1 Schoolonderwijs mag, onverminderd het derde lid, slechts worden gegeven door degene die:

      a. in het bezit is van een verklaring omtrent het gedrag,

      b. in het bezit is van:

      1°. een getuigschrift, afgegeven krachtens de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1],
      waaruit blijkt dat ten aanzien van dat onderwijs of ten aanzien van een of meer bij algemene maatregel van
      bestuur aan te wijzen daartoe behorende onderwijsactiviteiten als bedoeld in [artikel 9][ref2] is voldaan aan
      de bekwaamheidseisen die zijn vastgesteld krachtens [artikel 32a, eerste lid][ref3], van deze wet, of krachtens
      [artikel 7.10, eerste lid, van de Wet voortgezet onderwijs 2020][ref4], of

      2°. een erkenning van beroepskwalificaties als bedoeld in
      [artikel 5 van de Algemene wet erkenning EU-beroepskwalificaties][ref5], verleend ten aanzien van het onderwijs dat
      betrokkene zal geven, of

      3°. een geschiktheidsverklaring als bedoeld in [artikel 171][ref6], en

      c. niet krachtens rechterlijke uitspraak van het geven van onderwijs is uitgesloten.

      2 Het onderwijs in de onderwijsactiviteit lichamelijke oefening in het derde tot en met achtste schooljaar kan
      in afwijking van het eerste lid, onderdeel b, onder 1, behalve door degene die beschikt over een in dat onderdeel
      b, onder 1, bedoeld getuigschrift waaruit blijkt dat wordt voldaan aan de bekwaamheidseisen voor het geven van
      lichamelijke opvoeding in het voortgezet onderwijs, uitsluitend worden gegeven door degene die beschikt over een in
      dat onderdeel b, onder 1, bedoeld getuigschrift waaruit blijkt dat wordt voldaan aan de bekwaamheidseisen die zijn
      vastgesteld krachtens [artikel 32a, eerste lid][ref7], en

      a. in het bezit is van een bij ministeriële regeling aangewezen getuigschrift dat specifiek is gericht op de
      bekwaamheid tot het geven van dat onderwijs, of

      b. onderwijs volgt ter verkrijging van een dergelijk getuigschrift, in welk geval betrokkene het onderwijs in deze
      onderwijsactiviteit mag geven gedurende ten hoogste twee aaneengesloten schooljaren, gerekend vanaf het moment
      waarop betrokkene het onderwijs ter verkrijging van dit getuigschrift voor de eerste maal volgt.

      3 Onze Minister kan aan personen die in het bezit zijn van een buiten de Europese Economische Ruimte of Zwitserland
      behaald bewijsstuk waarmee de bekwaamheid wordt aangetoond, de bevoegdheid tot het geven van schoolonderwijs
      verlenen. Hij kan daarbij voorwaarden en beperkingen stellen.

      4 Ten aanzien van studenten die een duale opleiding volgen als bedoeld in
      [artikel 7.7 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref8] leidend tot een
      getuigschrift als bedoeld in het eerste lid, onder b.1°, en aan die opleiding ten minste 180 studiepunten
      hebben behaald, kan worden afgeweken van de eisen in het eerste lid onder b, met dien verstande dat het
      tijdelijk dienstverband van de student een periode beslaat die overeenkomt met een volledig dienstverband
      van vijf maanden. De vorige volzin is van overeenkomstige toepassing ten aanzien van studenten die ten
      minste 166 doch nog geen 180 studiepunten hebben behaald, indien door de desbetreffende hogeschool wordt
      verklaard dat de student beschikt over met 180 studiepunten vergelijkbare en tevens voor het dienstverband
      relevante kennis, inzicht en vaardigheden. De toepassing van de vorige volzin vervalt ten aanzien van die
      student die niet binnen vier weken na aanvang van het dienstverband over 180 studiepunten beschikt. De in
      [artikel 7.7, vijfde lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9] bedoelde
      overeenkomst vermeldt tevens de leraar onder wiens verantwoordelijkheid de betrokken student werkzaamheden van
      onderwijskundige aard verricht.

      5 Op de inzet van een leraar voor schoolonderwijs is [artikel 31a][ref10] van toepassing.


