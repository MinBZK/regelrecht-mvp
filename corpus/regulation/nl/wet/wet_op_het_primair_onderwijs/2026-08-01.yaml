  - number: 193g
    text: |-
      1 Het onderwijs in een tijdelijke nieuwkomersvoorziening is gericht op de zo spoedig mogelijke doorstroom van de
      leerling.

      2 Een leerling volgt niet langer dan twee jaren onderwijs aan een tijdelijke nieuwkomersvoorziening of een
      tijdelijke onderwijsvoorziening als bedoeld in [artikel 180a][ref1].

      3 Het bevoegd gezag plaatst een leerling alleen in een tijdelijke nieuwkomersvoorziening als:

      a. de leerling een nieuwkomer is; en

      b. de leerling niet eerder was ingeschreven op een school voor basisonderwijs, speciale school voor basisonderwijs,
      school voor speciaal onderwijs, school voor voortgezet speciaal onderwijs, school voor speciaal en voortgezet
      speciaal onderwijs of een school voor voortgezet onderwijs.

      4 In afwijking van het tweede of derde lid kan het bevoegd gezag een nieuwkomer onderwijs laten volgen aan een
      tijdelijke nieuwkomersvoorziening indien:

      a. de nieuwkomer anders geen onderwijs zou kunnen volgen;

      b. het belang van de nieuwkomer zich niet verzet tegen het volgen van onderwijs aan een tijdelijke
      nieuwkomersvoorziening; en

      c. de nieuwkomer onmiddellijk voorafgaand aan de plaatsing in de tijdelijke nieuwkomersvoorziening woonachtig was
      in een andere gemeente.

      5 Het bevoegd gezag meldt de afwijking, bedoeld in het vierde lid, onverwijld aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel180a
