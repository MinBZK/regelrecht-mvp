      1 Het bevoegd gezag gebruikt een leerling- en onderwijsvolgsysteem waaruit de vorderingen in de kennis
      en vaardigheden blijken op het niveau van de leerling, de groep en de school. Aan een leerling- en
      onderwijsvolgsysteem zijn, behoudens voor de eerste twee schooljaren, in elk geval door het College voor toetsen en
      examens erkende toetsen verbonden.

      2 De toetsen, bedoeld in het eerste lid, meten kennis en vaardigheden van de leerling, in
      elk geval op het terrein van de Nederlandse taal en rekenen en wiskunde, met inachtneming
      van de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld in
      [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref1].

      3 Het bevoegd gezag neemt in de eerste of tweede volledige week van februari bij een leerling in het laatste
      leerjaar van het basisonderwijs een door het College voor toetsen en examens erkende doorstroomtoets af. De
      doorstroomtoets is een objectief, tweede gegeven voor het vaststellen van het niveau van de leerling voor het
      volgen van aansluitend voortgezet onderwijs of voortgezet speciaal onderwijs.

      4 Een doorstroomtoets meet kennis en vaardigheden van een leerling op het terrein van Nederlandse taal en rekenen
      en wiskunde, met inachtneming van de referentieniveaus Nederlandse taal en de referentieniveaus rekenen, bedoeld
      in [artikel 2, tweede lid, aanhef en onderdeel a, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2].
      Het bevoegd gezag kan bij een leerling tevens een doorstroomtoets voor de onderwerpen, genoemd in
      [artikel 9, vierde lid, onderdelen f, i, j en k][ref3], afnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0027679#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0027679#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel9
