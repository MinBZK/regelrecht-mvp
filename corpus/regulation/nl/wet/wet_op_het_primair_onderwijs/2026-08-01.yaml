  - number: '122'
    text: |-
      1 Onze Minister verstrekt aan het samenwerkingsverband bekostiging voor de inrichting van de
      ondersteuningsstructuur en voor de ondersteuningsvoorzieningen voor de lichte ondersteuning. De bekostiging bestaat
      uit een bedrag per leerling.

      2 Onze Minister gaat bij het bepalen van de hoogte van de bekostiging, bedoeld in het eerste lid, uit van het
      aantal leerlingen op 1 februari van het jaar voorafgaand aan het jaar waarover de bekostiging plaatsvindt op de
      vestigingen van de basisscholen die op 1 januari zijn aangesloten bij een samenwerkingsverband.

      3 Voor elke leerling die op 1 februari van het jaar voorafgaand aan het jaar waarover de bekostiging
      plaatsvindt, was ingeschreven op een speciale school voor basisonderwijs wordt een bedrag in mindering gebracht
      op de bekostiging, bedoeld in het eerste lid, van het samenwerkingsverband dat de leerling op grond van
      [artikel 40, achtste lid][ref1], toelaatbaar heeft verklaard tot een speciale school voor basisonderwijs.

      4 Bij ministeriële regeling worden jaarlijks de bedragen, bedoeld in het eerste en derde lid, vastgesteld.

      5 De [artikelen 115][ref2], [119][ref3] en [120][ref4] zijn van overeenkomstige toepassing.


