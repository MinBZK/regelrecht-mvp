  - number: 214a
    text: |-
      1 Vanaf het tijdstip van inwerkingtreding van artikel I, onderdelen B en E van de Wet van 11 oktober 2021 tot
      wijziging van de Wet op het primair onderwijs en de [Wet op de expertisecentra][ref1] in verband met beëindiging
      van de verplichte aansluiting bij een rechtspersoon in verband met kosten van vervanging en in verband met
      wijziging van de wijze waarop de werkloosheidsuitkeringen worden verevend (beëindiging vervangingsfonds en
      hervorming participatiefonds) kan het bevoegd gezag van een school of het bestuur van een centrale dienst of
      een samenwerkingsverband bij het participatiefonds een aanvraag indienen tot het vergoeden van de kosten van
      vervangingen in de periode tot en met de dag voor genoemd tijdstip.

      2 Op de afwikkeling van aanvragen, alsmede op geschillen daarover in bezwaar, beroep of hoger beroep, zijn de
      regelingen van toepassing zoals die luidden op de dag voor het tijdstip, bedoeld in het eerste lid, met inbegrip
      van de regels, bedoeld in [artikel 188, vierde lid][ref2], en [artikel 189][ref3] zoals luidend op de dag voor
      genoemd tijdstip.

      3 Het participatiefonds besluit op de aanvragen met inachtneming van de regelingen, bedoeld in het tweede lid
      van dit artikel. Het participatiefonds verantwoordt in zijn jaarrekening afzonderlijk de taken en werkzaamheden,
      bedoeld in dit artikel.

      4 De rechtspersoon, bedoeld in [artikel 188, eerste lid][ref4], van deze wet, zoals luidend op de dag voor het
      tijdstip, bedoeld in het eerste lid, brengt overeenkomstig de [artikelen 18][ref5], [34][ref6], [35][ref7] en
      [37 van de Kaderwet zelfstandige bestuursorganen][ref8] aan Onze Minister over het kalenderjaar dat direct vooraf
      gaat aan genoemd tijdstip verslag uit over zijn werkzaamheden.

      5 [Artikel 194, derde lid, onderdeel c][ref9], van deze wet, en de daarop berustende bepalingen, zoals luidend
      op de dag voor het tijdstip, bedoeld in het eerste lid, zijn van toepassing op de bestemming van de resterende
      middelen die op grond van [artikel 188, tweede lid][ref10], zoals luidend op de dag voor genoemd tijdstip, aan de
      rechtspersoon, bedoeld in artikel 188, eerste lid, zoals luidend op de dag voor genoemd tijdstip, zijn voldaan.


