  - number: '77'
    text: |-
      1 Indien uit schriftelijke verklaringen van ten minste 50 verschillende ouders van kinderen tot en met de leeftijd
      van 12 jaar behoefte blijkt te bestaan aan het volgen van openbaar onderwijs en dat in die behoefte niet of
      onvoldoende wordt voorzien, onderzoekt het college van burgemeester en wethouders of uit de belangstellingsmeting,
      bedoeld in [artikel 74, tweede lid, onderdeel a][ref1], voldoende belangstelling blijkt.

      2 Indien uit de belangstellingsmeting voldoende belangstelling is gebleken, dient het college van burgemeester en
      wethouders een aanvraag als bedoeld in [artikel 74, eerste tot en met derde lid][ref2], in, met uitzondering van
      een document waaruit blijkt dat de gemeente van de beoogde plaats van vestiging van de school is gevraagd om te
      overleggen over het voornemen tot het doen van een aanvraag om bekostiging.

      3 Voor een openbare school wordt in elk geval door het college van burgemeester en wethouders een aanvraag als
      bedoeld in [artikel 74][ref3] ingediend, indien binnen 10 kilometer van de plaats in de gemeente waar het onderwijs
      moet worden gegeven over de weg gemeten geen school aanwezig is waarbinnen openbaar onderwijs wordt gegeven en aan
      het volgen van openbaar onderwijs behoefte bestaat.

      4 Indien binnen 10 kilometer van de plaats in de gemeente waar het onderwijs moet worden gegeven over de weg
      gemeten geen school aanwezig is waar openbaar onderwijs wordt gegeven en aan het volgen van openbaar onderwijs
      behoefte bestaat, brengt Onze Minister een openbare school waarvoor een aanvraag is gedaan voor bekostiging in
      aanmerking, indien voldaan is aan de voorschriften van [artikel 74, eerste en tweede lid][ref4].


