  - number: '10'
    text: |-
      Het bevoegd gezag draagt zorg voor de kwaliteit van het onderwijs op de school. Onder zorg dragen voor de kwaliteit
      van het onderwijs wordt in elk geval verstaan het naleven van de bij of krachtens deze wet gegeven voorschriften en
      het uitvoeren van het stelsel van kwaliteitszorg, bedoeld in [artikel 12, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel12
