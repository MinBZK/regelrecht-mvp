  - number: '134'
    text: |-
      1 Aan het bevoegd gezag van de niet door de gemeente in stand gehouden scholen wordt een afschrift gezonden van de
      besluiten van het college van burgemeester en wethouders tot vaststelling van de mate waarin meer dan wel minder
      uitgaven worden gedaan, bedoeld in [artikel 131, eerste lid][ref1], tot verlening van het voorschot, bedoeld in
      artikel 131, tweede of derde lid, en tot voorlopige en definitieve vaststelling van het overschrijdingsbedrag,
      bedoeld in artikel 132, achtste en negende lid. De besluiten bevatten een staat van voorzieningen als bedoeld
      in [artikel 132, eerste lid][ref2], onderdeel e, waarin per kalenderjaar het verloop van de toevoegingen en de
      onttrekkingen aan de voorzieningen wordt aangegeven.

      2 De toezending, bedoeld in het eerste lid, geschiedt binnen twee weken na de dag waarop het college van
      burgemeester en wethouders een besluit als bedoeld in het eerste lid heeft genomen.

      3 Het bevoegd gezag van een niet door de gemeente in stand gehouden school kan tegen een besluit als bedoeld in de
      eerste lid administratief beroep instellen bij gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel131
