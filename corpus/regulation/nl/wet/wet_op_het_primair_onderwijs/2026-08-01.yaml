    text: >-
      De Overgangswet WBO zoals die luidde op 31 juli 1998 blijft van toepassing op aanspraken die op die datum op grond
      van artikel E 17 of E 18 van die wet bestonden.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel213
  - number: '214'
    text: |-
      1 De bekostiging voor een school, berekend op grond van
      [artikel 116, met uitzondering van het vierde lid, onderdelen b en c][ref1], en [artikel 121][ref2], wordt voor de
      eerste drie jaren na de inwerkingtreding van dit artikel per jaar vermeerderd met het bedrag, berekend volgens het
      tweede tot en met het vierde lid, als de uitkomst van die berekening positief is. Ingeval de uitkomst negatief is,
      wordt de bekostiging met het berekende bedrag verminderd.

      2 Het bedrag van de vermeerdering of vermindering, bedoeld in het eerste lid, wordt allereerst bepaald aan de hand
      van de formule (A – B) x C x T, waarbij:

      A = (D + H) / E x F gedeeld door het aantal leerlingen op 1 februari voorafgaand aan de inwerkingtreding van dit
      artikel;

      B = de bekostiging voor de school berekend op grond van
      [artikel 116, met uitzondering van het vierde lid, onderdelen b en c][ref3], en [artikel 121][ref4] gedeeld door
      het aantal leerlingen op de teldatum van 1 februari voor het betreffende kalenderjaar, bedoeld in artikel 118;

      C = 75% in het eerste jaar, 50% in het tweede jaar en 25% in het derde jaar na inwerkingtreding van dit artikel;

      D = de bekostiging voor een school op basis van de telgegevens van 1 oktober van het jaar voorafgaand aan de
      inwerkingtreding van dit artikel op grond van [artikel 120, met uitzondering van het vierde lid][ref5], en de
      aanvullende bekostiging voor groei van het aantal leerlingen van basisscholen gedurende het schooljaar, zoals
      bedoeld in het derde lid, [artikel 129][ref6] en [artikel 134][ref7] en de daarop gebaseerde lagere regelgeving,
      zoals deze luidden op de dag direct voorafgaand aan het tijdstip waarop dit artikel in werking zijn getreden, en de
      daarop gebaseerde bedragen;

      E = de bekostiging voor een school op grond van de telgegevens van 1 oktober
      van het jaar voorafgaand aan de inwerkingtreding van dit artikel op grond van
      [artikel 116, met uitzondering van het vierde lid, onderdelen b en c][ref8], en [artikel 121][ref9] en op
      grond van de bedragen zoals die zouden zijn bij een teldatum van 1 oktober van het jaar voorafgaand aan de
      inwerkingtreding van dit artikel en de daarop gebaseerde lagere regelgeving;

      F = de bekostiging voor een school op grond van
      [artikel 116, met uitzondering van het vierde lid, onderdelen b en c][ref10], en [artikel 121][ref11] en op grond
      van de telgegevens op 1 februari voorafgaand aan de inwerkingtreding van dit artikel;

      H = het bedrag bedoeld in [artikel 115, eerste lid][ref12], plus het bedrag bedoeld in
      [artikel 120, vierde lid][ref13], zoals deze luidden op de dag direct voorafgaand aan het tijdstip waarop de
      [artikelen 116][ref14] en [121][ref15] in werking zijn getreden, vermenigvuldigd met het aantal leerlingen van de
      speciale school voor basisonderwijs op 1 oktober van het jaar voorafgaand aan de inwerkingtreding van dit artikel;

      T = het aantal leerlingen op de teldatum van 1 februari voor het betreffende kalenderjaar, bedoeld in
      [artikel 118][ref16].

      3 Indien de uitkomst van de berekening, zoals bepaald in het tweede lid, positief is, wordt de vermeerdering
      zodanig vastgesteld dat de uitkomst van de formule [(B x T) + vermeerdering bedoeld in het tweede lid – (A x T)] /
      (A x T), in de eerste drie jaren na inwerkingtreding van dit artikel achtereenvolgens niet minder is dan -1%, -2%
      en -3%, waarbij A, B en T zijn vastgesteld volgens het tweede lid.

      4 Indien de uitkomst van de berekening, zoals bepaald in het tweede lid, negatief is, wordt de vermindering zodanig
      vastgesteld dat de uitkomst van de formule [(B x T) + vermindering bedoeld in het tweede lid – (A x T)] / (A x T),
      in de eerste drie jaren na inwerkingtreding achtereenvolgens niet meer is dan 1%, 2% en 3%, waarbij A, B en T zijn
      vastgesteld volgens het tweede lid.

      5 Indien de som van de bekostiging voor de scholen van het bevoegd gezag, bedoeld in het eerste lid, minus de
      uitkomst van de formule A x T, bedoeld in het tweede lid, in het vierde jaar na de inwerkingtreding van dit artikel
      gedeeld door de uitkomst van de formule A x T in de eerste drie jaren na de inwerkingtreding van dit artikel, voor
      die scholen minder is dan -3% en daardoor aantoonbare financiële problemen ontstaan, kan het bevoegd gezag in het
      vierde jaar na inwerkingtreding aanvullende bekostiging, bedoeld in [artikel 120][ref17], aanvragen.

      6 Bij de vaststelling van de bekostiging, bedoeld in het tweede, derde en vierde lid, is
      [artikel 116, zesde tot en met elfde lid][ref18], van overeenkomstige toepassing.

      7 Dit artikel is niet van toepassing op het bevoegd gezag van een school:

      a. indien de school in het schooljaar dat eindigt in het jaar waarin dit artikel in werking is getreden op grond
      van de destijds geldende regelgeving niet voor bekostiging in aanmerking kwam en;

      b. vanaf het kalenderjaar dat er voor de school gedurende de eerste drie jaren na de inwerkingtreding van dit
      artikel sprake is van een samenvoeging met een andere school als bedoeld in [artikel 117][ref19].


