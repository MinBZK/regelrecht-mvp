  - number: '89'
    text: >-
      1 De bekostiging van een nevenvestiging van een school neemt een aanvang met ingang van 1 augustus indien:


      a. 1°. de nevenvestiging, onmiddellijk voorafgaand aan het tijdstip van ingang van de bekostiging als
      nevenvestiging, bekostigd werd als een zelfstandige school, of


      2°. de nevenvestiging voor bekostiging in aanmerking kwam als nevenvestiging van de voormalige school bedoeld onder
      1°,


      b. ingeval het betreft een nevenvestiging van een openbare school die in stand wordt gehouden door een andere
      rechtspersoon dan de gemeente op wier grondgebied de nevenvestiging is gelegen, die gemeente bij notariële akte de
      instandhouding van de school die nevenvestiging is geworden, heeft overgedragen aan die andere rechtspersoon, en


      c. van de omvorming tot nevenvestiging voor 1 februari voorafgaand aan de datum, bedoeld in de aanhef, mededeling
      is gedaan aan Onze Minister, en indien het betreft een situatie als bedoeld onder b, onder overlegging van de
      gegevens waaruit blijkt dat aan het vereiste onder b is voldaan.


      2 Bij de akte, bedoeld in het eerste lid onder b, worden tevens overgedragen de rechten die het bevoegd gezag van
      een school toekomen ten aanzien van het gebouw en terrein, alsmede ten aanzien van de roerende zaken. In de akte
      wordt bepaald dat de rechtspersoon aan wie wordt overgedragen, het personeel in gelijke betrekkingen en onder
      dezelfde voorwaarden als vermeld in de arbeidsovereenkomst, benoemt met ingang van de datum van overdracht.


      3 Door overdracht met inachtneming van het eerste en tweede lid, treedt de verkrijgende rechtspersoon in alle uit
      de wet voortvloeiende rechten en verplichtingen van zijn rechtsvoorganger voor zover deze zijn hoedanigheid van
      bevoegd gezag betroffen.


      4 Onze Minister maakt voor 1 mei volgend op de mededeling, bedoeld in het eerste lid onder c, aan het bevoegd gezag
      van de beoogde nevenvestiging bekend of de nevenvestiging zal worden bekostigd.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel89
  - number: '90'
    text: >-
      1 Bij algemene maatregel van bestuur kunnen nadere voorschriften worden gegeven voor de uitvoering van deze
      afdeling.


      2 Een ontwerp van een algemene maatregel van bestuur als bedoeld in het eerste lid wordt geplaatst in de
      Staatscourant. De algemene maatregel van bestuur treedt niet in werking dan nadat 4 weken na de plaatsing zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel90
  - number: '91'
    text: >-
      1 De gemeenteraad en het college van burgemeester en wethouders dragen ten behoeve van de door de gemeente in stand
      gehouden scholen en ten behoeve van de niet door de gemeente in stand gehouden scholen zorg voor de voorzieningen
      in de huisvesting op het grondgebied van de gemeente overeenkomstig het bepaalde in deze afdeling. De gemeenteraad
      en het college van burgemeester en wethouders behandelen daarbij de door de gemeente in stand gehouden scholen en
      de niet door de gemeente in stand gehouden scholen op gelijke voet.


      2 Voor de toepassing van deze afdeling wordt onder een niet door de gemeente in stand gehouden school mede begrepen
      een op het grondgebied van de gemeente gelegen nevenvestiging van een school waarvan de hoofdvestiging op het
      grondgebied van een andere gemeente is gelegen.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel91
  - number: '92'
    text: >-
      1 Voor de toepassing van deze afdeling worden onder voorzieningen in de huisvesting begrepen:


      a. voor blijvend onderscheidenlijk voor tijdelijk gebruik bestemde voorzieningen, bestaande uit:


      1°. nieuwbouw, een bestaand gebouw of een gedeelte daarvan, verplaatsing van een bestaand gebouw of van een
      gedeelte daarvan, terreinen, alsmede eerste aanschaf van onderwijsleerpakketten en meubilair,


      2°. uitbreiding van de onder 1° bedoelde voorzieningen, en


      3°. medegebruik van een ruimte die geschikt is voor het onderwijs;


      b. herstel van constructiefouten aan het gebouw, alsmede herstel en vervanging in verband met schade aan gebouw,
      onderwijsleerpakketten en meubilair in geval van bijzondere omstandigheden.


      2 Bij algemene maatregel van bestuur worden bruto vloeroppervlakten per gelijktijdig aanwezige leerling
      voorgeschreven die voorzieningen in de huisvesting ten minste dienen te bevatten. Deze oppervlakten kunnen per
      schoolsoort verschillend worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel92
  - number: '93'
    text: >-
      1 Het college van burgemeester en wethouders stelt jaarlijks ten behoeve van het eerstvolgende jaar voor een door
      het college van burgemeester en wethouders te bepalen tijdstip een bekostigingsplafond vast voor de bekostiging van
      de voorzieningen in de huisvesting voor:


      a. scholen,


      b. scholen voor speciaal onderwijs, scholen voor voortgezet speciaal onderwijs, scholen voor speciaal en voortgezet
      speciaal onderwijs dan wel instellingen voor speciaal en voortgezet speciaal onderwijs, en


      c. scholen voor voorbereidend wetenschappelijk onderwijs, voor hoger en middelbaar algemeen voortgezet
      onderwijs, voor voorbereidend beroepsonderwijs en voor praktijkonderwijs.


      2 Het bekostigingsplafond wordt zodanig vastgesteld dat redelijkerwijs kan worden voorzien in de huisvesting van de
      in het eerste lid bedoelde scholen op het grondgebied van de gemeente.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel93
  - number: '94'
    text: |-
      1 Het bevoegd gezag van een niet door de gemeente in stand gehouden school dat een voorziening in de huisvesting
      wenst, dient een aanvraag voor opneming van die voorziening op het programma, bedoeld in [artikel 95][ref1], in bij
      het college van burgemeester en wethouders.

      2 Het college van burgemeester en wethouders kan ten aanzien van voorzieningen als bedoeld in [artikel 92][ref2]
      bekostiging verstrekken ter zake van de kosten van bouwvoorbereiding.

      3 Het college van burgemeester en wethouders stelt vast, voor welk tijdstip de aanvraag wordt ingediend en aan
      welke voorwaarden deze dient te voldoen.

      4 Het derde lid is van overeenkomstige toepassing op de door de gemeente in stand gehouden scholen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0003420#Artikel92
