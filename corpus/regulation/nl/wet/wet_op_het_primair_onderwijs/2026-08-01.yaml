        afdeling: '3'
  - number: '107'
    text: |-
      1 Het college van burgemeester en wethouders is bevoegd een gedeelte van een gebouw of terrein dat tijdelijk
      of gedurende een gedeelte van de dag niet nodig zal zijn voor de daar gevestigde school, gedurende die
      tijd als huisvesting voor een andere school, voor ander uit de openbare kas bekostigd onderwijs niet zijnde
      basisonderwijs, of voor educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref1] dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden te bestemmen. Het voorgenomen gebruik dient zich te
      verdragen met het onderwijs aan de in het gebouw gevestigde school. Tevens is het college van burgemeester en
      wethouders bevoegd ten behoeve van het onderwijs in lichamelijke oefening of expressie-activiteiten een gebouw
      of terrein dan wel een gedeelte daarvan dat tijdelijk gedurende gedeelten van de dag of in het geheel niet
      nodig zal zijn voor de daar gevestigde school, gedurende die tijd als huisvesting voor een andere school, voor
      ander uit de openbare kas bekostigd onderwijs niet zijnde basisonderwijs, of voor educatie als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref2] dan wel voor andere culturele, maatschappelijke of recreatieve doeleinden
      te bestemmen.

      2 Indien het gebouw of terrein in gebruik is voor een niet door de gemeente in stand gehouden school pleegt het
      college van burgemeester en wethouders vooraf overleg met het bevoegd gezag en, voor zover van toepassing, ook met
      het bevoegd gezag van die school of nevenvestiging waarvoor de huisvesting is bestemd.


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0007625
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0007625
  - number: '108'
    text: |-
      1 Voor zover [artikel 107][ref1] geen toepassing vindt, kan het bevoegd gezag een gedeelte van een gebouw
      of terrein in gebruik geven ten behoeve van uit de openbare kas bekostigd onderwijs dan wel voor andere
      culturele, maatschappelijke of recreatieve doeleinden. Voor zover niet nodig voor uit de openbare kas bekostigd
      onderwijs, kan het bevoegd gezag een gedeelte van het gebouw of terrein verhuren aan een derde, voor zover
      het gehuurde niet bestemd zal zijn als woon- of bedrijfsruimte in de zin van de vijfde en zesde afdeling van
      [titel 4 van Boek 7 van het Burgerlijk Wetboek][ref2]. Indien het een niet door de gemeente in stand gehouden
      school betreft, is voor verhuur toestemming van het college van burgemeester en wethouders vereist.

      2 De ingebruikgeving of verhuur ingevolge het eerste lid eindigt:

      a. indien het college van burgemeester en wethouders gebruik maakt van zijn bevoegdheid op grond van
      [artikel 107][ref3] zonder dat enige schadeplicht ontstaat, of

      b. indien het in gebruik gegeven dan wel verhuurde deel nodig is voor gebruik door de eigen school.

      3 Ingebruikgeving of verhuur ingevolge het eerste lid geschiedt niet indien het voorgenomen gebruik zich niet
      verdraagt met het onderwijs aan de in het gebouw gevestigde school.

      4 Op de ingebruikgeving en verhuur ingevolge het eerste lid is
      [artikel 230a van Boek 7 van het Burgerlijk Wetboek][ref4] niet van toepassing.

      5 Het zonder toestemming van het college van burgemeester en wethouders verhuren van een gebouw of terrein door het
      bevoegd gezag van een niet door de gemeente in stand gehouden school alsmede elk met dit artikel strijdig beding
      opgenomen in een huurovereenkomst met betrekking tot schoolgebouwen, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0005290
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel107
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel230a
