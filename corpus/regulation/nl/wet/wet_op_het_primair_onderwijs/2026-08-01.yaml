  - number: 10a
    text: |-
      1 De kwaliteit van het onderwijs is zeer zwak indien de leerresultaten op de school aan het eind van het zevende
      of het achtste schooljaar op groepsniveau ernstig en langdurig tekortschieten en het bevoegd gezag in verband
      met dit tekortschieten eveneens tekortschiet in de naleving van een of meer bij of krachtens deze wet gegeven
      voorschriften. Het bevoegd gezag voldoet in elk geval niet aan de wettelijke opdracht om zorg te dragen voor de
      kwaliteit van het onderwijs, bedoeld in [artikel 10][ref1], indien de kwaliteit van het onderwijs zeer zwak is.

      2 Er is sprake van onvoldoende leerresultaten als bedoeld in het eerste lid indien op de school de leerresultaten
      op het gebied van de Nederlandse taal en op het gebied van rekenen en wiskunde, gemeten over een periode van
      3 schooljaren, liggen onder de in het vijfde lid bedoelde normering die daarvoor geldt in vergelijking tot die
      leerresultaten over diezelfde schooljaren van scholen met een vergelijkbaar leerlingenbestand.

      3 De leerresultaten van de school worden jaarlijks beoordeeld op basis van de resultaten van de afgelegde
      doorstroomtoetsen, bedoeld in [artikel 45b, derde lid][ref2], op het gebied van Nederlandse taal en rekenen en
      wiskunde, met uitzondering van de resultaten van doorstroomtoetsen afgelegd door:

      a. zeer moeilijk lerende leerlingen;

      b. meervoudig gehandicapte leerlingen voor wie het zeer moeilijk lerend zijn een van de handicaps is; en

      c. leerlingen die vier jaar of korter in Nederland zijn en om die reden de Nederlandse taal onvoldoende beheersen.

      4 Indien de leerresultaten van de school niet kunnen worden beoordeeld op grond van de regels gesteld bij of
      krachtens het vijfde lid, is de kwaliteit van het onderwijs zeer zwak indien de school tekortschiet in de naleving
      van twee of meer bij of krachtens deze wet gegeven voorschriften en de school dientengevolge tekortschiet in het
      zorg dragen voor de veiligheid op school, bedoeld in [artikel 4c][ref3], of het zodanig inrichten van het onderwijs
      dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen dan wel het afstemmen van het onderwijs op de
      voortgang in de ontwikkeling van de leerlingen, bedoeld in [artikel 8, eerste lid][ref4].

      5 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de wijze waarop
      leerresultaten worden gemeten, genormeerd en beoordeeld. Voorts wordt de normering, bedoeld in het derde lid,
      bepaald en wordt bepaald bij welk aantal leerlingen in het achtste schooljaar van een bepaalde school voor die
      school voor de periode van 3 schooljaren, bedoeld in het tweede lid, wordt gelezen 5 schooljaren.

      6 De voordracht voor een krachtens het vijfde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


