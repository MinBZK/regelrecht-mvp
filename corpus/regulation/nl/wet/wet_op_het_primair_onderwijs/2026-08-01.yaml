    text: |-
      Indien niet binnen een redelijke termijn met alle partijen, bedoeld in [artikel 160, tweede lid][ref1],
      afspraken als bedoeld in artikel 160, eerste lid, zijn gemaakt, kan het college van burgemeester en
      wethouders de werkingssfeer van de gemaakte afspraken, voor zover noodzakelijk voor een samenhangend
      onderwijsachterstandenbeleid, uitbreiden naar de partijen, bedoeld in artikel 160, tweede lid, waarmee geen
      afspraken zijn gemaakt.


