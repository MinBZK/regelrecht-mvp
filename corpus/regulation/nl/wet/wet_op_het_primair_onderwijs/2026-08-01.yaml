        afdeling: '2'
  - number: '68'
    text: |-
      1 Op het personeel van een rechtspersoon met volledige rechtsbevoegdheid die

      a. uitsluitend wordt bestuurd door een bevoegd gezag al dan niet met een of meer andere bevoegde gezagsorganen als
      bedoeld in deze wet, de [Wet op de expertisecentra][ref1] of de [Wet voortgezet onderwijs 2020][ref2],

      b. zich blijkens de statuten dan wel de gemeenschappelijke regeling, bedoeld in de
      [Wet gemeenschappelijke regelingen][ref3], uitsluitend ten doel stelt om ten behoeve van scholen en andere
      onderwijsinstellingen die uit 's Rijks kas worden bekostigd, werkzaamheden te verrichten ter verzekering van
      de goede gang van het onderwijs met uitzondering van het leiden van de school, het geven van onderwijs en het
      verrichten van werkzaamheden op het terrein van de schoolbegeleiding,

      c. niet het maken van winst beoogt,

      d. wordt gefinancierd met behulp van bijdragen van de bevoegde gezagsorganen waarvoor diensten worden verricht, en

      e. Onze Minister heeft medegedeeld als rechtspersoon in de zin van dit artikel werkzaam te willen zijn,

      zijn van toepassing de in [artikel 33][ref4] bedoelde voorschriften en regels.

      2 Onder bevoegd gezag en bevoegde gezagsorganen in het eerste lid onderdeel a wordt mede verstaan het college van
      burgemeester en wethouders.

      3

      4 De in het eerste lid onder a bedoelde bevoegde gezagsorganen delen Onze Minister mede dat zij het bestuur vormen
      van een rechtspersoon in de zin van dit artikel. Voorts verschaffen zij Onze Minister en de door hem aangewezen
      personen desgevraagd alle inlichtingen omtrent de rechtspersoon en zijn activiteiten. De in het eerste lid
      onder a bedoelde bevoegde gezagsorganen kunnen Onze Minister mededelen dat zij erin toestemmen dat de gevraagde
      inlichtingen rechtstreeks door het bestuur van de rechtspersoon zelf aan Onze Minister en de door hem aangewezen
      personen worden verschaft.

      5 Het college van burgemeester en wethouders en het bevoegd gezag dat deel uitmaakt van het bestuur van de
      rechtspersoon, zijn verplicht op de naleving van de in de voorgaande leden genoemde voorschriften toe te zien.

      6 [Artikel 38][ref5] is van overeenkomstige toepassing ten aanzien van het personeel van de rechtspersoon.


