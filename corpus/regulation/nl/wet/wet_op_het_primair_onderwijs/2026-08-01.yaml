  - number: '33'
    text: Het bevoegd gezag draagt er zorg voor dat de rechtspositie van het personeel wordt geregeld.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel33
  - number: 33a
    text: Het bevoegd gezag benoemt, schorst en ontslaat het personeel.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel33a
  - number: '34'
    text: >-
      1 Het bevoegd gezag benoemt de directeur en de adjunct-directeur, de leraren en het onderwijsondersteunend
      personeel in algemene dienst van het bevoegd gezag.


      2 Onder benoeming in algemene dienst van het bevoegd gezag wordt in dit artikel verstaan een benoeming ten behoeve
      van het verrichten van werkzaamheden aan door het bevoegd gezag in stand gehouden scholen.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel34
  - number: 34a
    text: >-
      1 Het bevoegd gezag draagt er zorg voor dat afschriften van bewijsstukken waarmee de bekwaamheid wordt aangetoond,
      van geschiktheidsverklaringen, van verklaringen omtrent het gedrag en van arbeidsovereenkomsten van het aan de
      school verbonden personeel worden bewaard.


      2 Het eerste lid is van overeenkomstige toepassing op personeel dat is tewerkgesteld zonder benoeming.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel34a
  - number: 34b
    text: >-
      1 Het bevoegd gezag bewaart een afschrift van de verklaring omtrent het gedrag van een persoon die:


      a. werkzaam is als of voor een particuliere onderwijsaanbieder; en


      b. werkzaamheden verricht die een bijdrage leveren aan het onderwijsleerproces en die plaatsvinden:


      1°. in het schoolgebouw tijdens of aansluitend op de onderwijstijd; of


      2°. onder verantwoordelijkheid van het bevoegd gezag.


      2 Het bevoegd gezag bewaart het afschrift, bedoeld in het eerste lid, gedurende het schooljaar waarin de
      werkzaamheden worden verricht.


      3 Het bevoegd gezag controleert ieder schooljaar voorafgaand aan de eerste keer dat de persoon, bedoeld in het
      eerste lid, werkzaamheden verricht of de verklaring omtrent het gedrag waarvan een afschrift wordt verstrekt niet
      ouder is dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel34b
  - number: '36'
    text: >-
      1 Het bevoegd gezag is verplicht aan studenten die in opleiding zijn voor een functie in het basisonderwijs of in
      het voortgezet onderwijs, gelegenheid te bieden de als onderdeel van hun opleiding vereiste ervaring in de school
      te verkrijgen.


      2 De verplichting bedoeld in het eerste lid, betreft:


      a. studenten die op een school voor de opleiding van onderwijzend personeel zijn ingeschreven of anderszins
      studeren om aan de bekwaamheidseisen te voldoen;


      b. in een schooljaar gelijktijdig niet meer studenten als bedoeld onder a, dan de helft van het aantal
      groepsleraren in dat jaar.


      3 Een bevoegd gezag kan een student de verdere toegang tot de school ontzeggen indien deze in de school in strijd
      handelt met de grondslag en doelstellingen van de school. Van een beslissing tot ontzegging van de toegang tot
      de school wordt mededeling gedaan door toezending of uitreiking van een afschrift aan het bevoegd gezag van de
      betrokken opleidingsinstelling.


      4 De directeur regelt, onder verantwoordelijkheid van het bevoegd gezag, de werkzaamheden in verband met de
      begeleiding door het onderwijzend personeel van de studenten in de school in overeenstemming met dit personeel,
      alsmede in overeenstemming met de betrokken opleidingsinstellingen, dan wel, indien het betreft studenten die zich
      voorbereiden op het afleggen van een staatsexamen om te voldoen aan de bekwaamheidseisen, in overeenstemming met de
      betrokken staatsexamencommissie.


      5 Onze Minister kan het bevoegd gezag op grond van bijzondere omstandigheden gehele of gedeeltelijke ontheffing van
      de verplichting verlenen. De ontheffing geldt voor een schooljaar.


      6 De scholen waarop studenten als bedoeld in het eerste lid, zijn toegelaten, zijn toegankelijk voor de inspectie
      belast met het toezicht op de opleidingsinstellingen, voor de directeuren en de door deze aan te wijzen leraren
      van die opleidingsinstellingen, alsmede voor de leden van de betrokken staatsexamencommissies, een en ander voor
      zover zulks voor de uitoefening van het toezicht op de praktische vorming, onderscheidenlijk de begeleiding van de
      praktische vorming van de in de school aanwezige studenten noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel36
  - number: '38'
    text: |-
      Over de door het bevoegd gezag ingevolge [artikel 33][ref1] te treffen regelingen, alsmede over andere
      aangelegenheden van algemeen belang voor de rechtstoestand van het personeel, wordt door of namens het bevoegd
      gezag overleg gevoerd met de daarvoor in aanmerking komende verenigingen van werknemers, op een met deze
      schriftelijk overeengekomen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel33
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel38
