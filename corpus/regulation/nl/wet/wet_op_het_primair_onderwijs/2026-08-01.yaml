  - number: '131'
    text: |-
      1 Het college van burgemeester en wethouders stelt, onderscheiden al naar gelang het basisscholen of speciale
      scholen voor basisonderwijs betreft, jaarlijks vast in welke mate zij voor de door de gemeente in stand
      gehouden scholen meer dan wel minder uitgaven zullen doen dan door het Rijk worden bekostigd. Deze vaststelling
      geschiedt voor het komende begrotingsjaar en het resterende deel van het vijfjarig tijdvak, bedoeld in
      [artikel 130, eerste lid][ref1].

      2 Indien voor het komende begrotingsjaar meer uitgaven zullen worden gedaan dan door het Rijk worden bekostigd,
      verleent het college van burgemeester en wethouders in dat begrotingsjaar aan het bevoegd gezag van de niet door de
      gemeente in stand gehouden basisscholen onderscheidenlijk speciale scholen voor basisonderwijs in de gemeente een
      voorschot op het te verwachten overschrijdingsbedrag, bedoeld in [artikel 130, eerste lid][ref2].

      3 Indien uit het besluit van het college van burgemeester en wethouders, bedoeld in het eerste lid, blijkt dat
      de meeruitgaven, bedoeld in het tweede lid, in de resterende jaren van het vijfjarig tijdvak geheel of ten dele
      worden gecompenseerd door minder uitgaven, wordt hiermee rekening gehouden bij de bepaling van de hoogte van het
      voorschot.

      4 Indien uit de jaarlijkse voorlopige vaststelling van de bedragen, bedoeld in [artikel 132, eerste lid][ref3],
      blijkt dat, in afwijking van hetgeen is vastgesteld bij het besluit van het college van burgemeester en wethouders,
      bedoeld in het eerste lid, meer uitgaven zijn gedaan dan door het Rijk worden bekostigd, verleent het college
      van burgemeester en wethouders alsnog een voorschot aan het bevoegd gezag van de niet door de gemeente in stand
      gehouden basisscholen onderscheidenlijk speciale scholen voor basisonderwijs in de gemeente.

      5 Bij de bepaling van de hoogte van het voorschot, bedoeld in het vierde lid, is het derde lid van overeenkomstige
      toepassing.


