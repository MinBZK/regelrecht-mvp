  - number: '130'
    text: |-
      1 Indien een gemeente voor een of meer door haar in stand gehouden basisscholen of speciale scholen voor
      basisonderwijs meer uitgaven worden gedaan dan door het Rijk worden bekostigd, wordt met inachtneming van deze
      paragraaf aan het bevoegd gezag van de in die gemeente gevestigde, niet door de gemeente in stand gehouden
      basisscholen onderscheidenlijk speciale scholen voor basisonderwijs om de vijf jaar een overschrijdingsbedrag
      verstrekt.

      2 Voor de toepassing van het eerste lid worden ontvangsten op grond van [artikel 69, zevende lid][ref1], gelijk
      gesteld met ontvangsten van het Rijk.

      3 Indien een gemeente vanaf een tijdstip binnen een periode van vijf jaar als bedoeld in het eerste lid geen
      basisschool onderscheidenlijk speciale school voor basisonderwijs in stand houdt, wordt het overschrijdingsbedrag
      in afwijking van het eerste lid uiterlijk 31 december van het kalenderjaar dat volgt op dat tijdstip waarop de
      gemeente niet langer een school in stand houdt, toegekend.

      4 Voor de toepassing van deze paragraaf worden uitgaven voor een nevenvestiging aangemerkt als uitgaven voor de
      hoofdvestiging van de school waaraan de nevenvestiging is verbonden. Indien voor een school of nevenvestiging
      uitgaven worden gedaan door meer dan één gemeente, worden deze uitgaven aangemerkt als uitgaven van de gemeente
      op wier grondgebied de hoofdvestiging is gelegen. In het geval bedoeld in de vorige volzin worden de besluiten
      ingevolge het zesde lid en de [artikelen 131 tot en met 134][ref2] genomen door het college van burgemeester en
      wethouders van de laatstbedoelde gemeente en hebben deze mede betrekking op de uitgaven van de andere gemeente
      of gemeenten.

      5 Voor de toepassing van deze paragraaf wordt een nevenvestiging in een andere gemeente dan waarin de
      hoofdvestiging is gelegen, aangemerkt als een nevenvestiging die is gelegen in de gemeente van de hoofdvestiging.

      6 Het college van burgemeester en wethouders kan in overeenstemming met het bevoegd gezag van een niet door de
      gemeente in stand gehouden school besluiten dat voor een of meer scholen van dat bevoegd gezag uitgaven die de
      gemeente doet voor een door haar in stand gehouden school buiten beschouwing worden gelaten bij het vaststellen van
      de bedragen, bedoeld in de [artikelen 131][ref3] en [132][ref4].


