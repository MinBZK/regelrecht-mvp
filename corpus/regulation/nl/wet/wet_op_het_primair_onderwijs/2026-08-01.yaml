  - number: '148'
    text: |-
      1 De gemeenteraad kan besluiten tot vermindering van het aantal door de gemeente in stand gehouden openbare scholen
      en nevenvestigingen.

      2 De openbare rechtspersoon, bedoeld in [artikel 47][ref1], of de stichting, bedoeld in [artikel 17][ref2] of
      [48][ref3], kan besluiten tot opheffing van een door die openbare rechtspersoon of stichting in stand gehouden
      openbare school of nevenvestiging. Een besluit tot opheffing wordt uiterlijk op 1 augustus van het schooljaar
      voorafgaand aan de beoogde datum van opheffing medegedeeld aan de gemeenteraad. Indien de gemeenteraad voor
      1 februari daaropvolgend besluit dat hij de school in stand wenst te houden, wordt deze niet opgeheven, maar wordt
      de instandhouding daarvan overgedragen aan de gemeente.

      3 In afwijking van het eerste lid en het tweede lid, eerste volzin, vindt opheffing van een openbare school
      of nevenvestiging niet plaats in de gevallen, bedoeld in [artikel 139, vijfde lid][ref4], onderscheidenlijk
      [artikel 146, eerste lid, onder d][ref5].

      4 Indien een besluit tot opheffing, bedoeld in het tweede lid, in afwijking van de tweede volzin van dat lid na
      1 augustus, maar uiterlijk op 1 januari van het schooljaar voorafgaand aan de beoogde datum van opheffing wordt
      medegedeeld aan de gemeenteraad, dan wordt de school of nevenvestiging slechts opgeheven op grond van dat besluit
      indien:

      a. de op te heffen openbare school of nevenvestiging binnen 10 km over de weg gemeten niet de enige school is
      waarbinnen openbaar onderwijs wordt gegeven, en

      b. de gemeenteraad uiterlijk op 1 februari volgend op die mededeling besluit om in te stemmen met opheffing van de
      school of nevenvestiging.

      5 Indien het besluit, bedoeld in het tweede lid, na 1 januari van het schooljaar voorafgaand aan de beoogde datum
      van opheffing wordt medegedeeld aan de gemeenteraad, dan wordt de school of nevenvestiging niet opgeheven op grond
      van dat besluit.


