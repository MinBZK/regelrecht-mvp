      1 Het college van burgemeester en wethouders draagt er zorg voor dat er in een gemeente voldoende voorzieningen
      in aantal en spreiding zijn waar kinderen met een risico op een achterstand in de Nederlandse taal, als bedoeld in
      [artikel 160, eerste lid][ref1], deel kunnen nemen aan voorschoolse educatie die voldoet aan de bij of krachtens
      [artikel 1.50b van de Wet kinderopvang][ref2] vastgestelde bepalingen.

      2


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel160
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel1.50b
