  - number: 17a
    text: |-
      1 Het bevoegd gezag draagt mede in verband met de verplichting, bedoeld in [artikel 10][ref1], zorg voor een goed
      bestuurde school met een scheiding tussen de functies van bestuur en het toezicht daarop en met een rechtmatig
      bestuur en beheer.

      2 De benoeming in de functies van het bestuur en het interne toezicht op het bestuur, bedoeld in het eerste lid,
      geschiedt op basis van vooraf openbaar gemaakte profielen. Bij de benoeming van de leden van de raad van toezicht
      wordt de medezeggenschapsraad van de school, bedoeld in [artikel 3 van de Wet medezeggenschap op scholen][ref2],
      in de gelegenheid gesteld een bindende voordracht te doen voor een lid. Bij de benoeming van de leden
      van de raad van toezicht van het samenwerkingsverband wordt de ondersteuningsplanraad, bedoeld in
      [artikel 4a van de Wet medezeggenschap op scholen][ref3], in de gelegenheid gesteld een bindende voordracht te doen
      voor een lid.

      3 Het eerste lid en het tweede lid, eerste volzin, zijn van overeenkomstige toepassing op een samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel10
