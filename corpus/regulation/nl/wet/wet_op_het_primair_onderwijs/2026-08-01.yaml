  - number: 40a
    text: |-
      1 Het bevoegd gezag stelt nadat op overeenstemming gericht overleg is gevoerd met de ouders een
      ontwikkelingsperspectief vast:

      a. voor leerlingen van een basisschool, die extra ondersteuning behoeven;

      b. voor leerlingen van een speciale school voor basisonderwijs.

      2 In afwijking van het eerste lid, wordt het deel van het ontwikkelingsperspectief betreffende de individuele
      begeleiding, bedoeld in [artikel 8, vierde lid][ref1], vastgesteld nadat hierover overeenstemming bereikt is tussen
      het bevoegd gezag en de ouders.

      3 Het ontwikkelingsperspectief wordt zo spoedig mogelijk, doch uiterlijk binnen zes weken na de inschrijving van de
      leerling vastgesteld. Indien het betreft een inschrijving op grond van [artikel 40, zevende lid][ref2], wordt het
      ontwikkelingsperspectief uiterlijk binnen zes weken na de definitieve plaatsing van de leerling vastgesteld.

      4 Het bevoegd gezag evalueert het ontwikkelingsperspectief ten minste één keer per schooljaar met de ouders en
      de leerling.

      5 Nadat op overeenstemming gericht overleg is gevoerd met de ouders of nadat overeenstemming bereikt is met de
      ouders voor zover het betreft de individuele begeleiding, bedoeld in [artikel 8, vierde lid][ref3], kan het bevoegd
      gezag het ontwikkelingsperspectief bijstellen.

      6 Het bevoegd gezag stelt het ontwikkelingsperspectief vast of stelt het bij nadat het bevoegd gezag de leerling in
      de gelegenheid heeft gesteld op een door de leerling te bepalen wijze vrijelijk zijn mening hierover naar voren te
      brengen. Het bevoegd gezag biedt de leerling daartoe de ondersteuning die hij nodig heeft.

      7 Het bevoegd gezag licht aan de leerling toe op welke wijze diens mening van invloed is geweest op de vast- of
      bijstelling van het ontwikkelingsperspectief.

      8 Het bevoegd gezag beschrijft in het ontwikkelingsperspectief:

      a. de individuele begeleiding, bedoeld in [artikel 8, vierde lid][ref4];

      b. indien van toepassing: de onderdelen van het onderwijsprogramma waarvan wordt afgeweken;

      c. de inbreng van de leerling, bedoeld in het zesde lid, en hoe deze van invloed is geweest op de vast- of
      bijstelling van het ontwikkelingsperspectief.

      9 Bij algemene maatregel van bestuur worden nadere regels gesteld over de inhoud van het ontwikkelingsperspectief.


