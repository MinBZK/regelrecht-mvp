  - number: 13a
    text: >-
      1 Het bevoegd gezag stelt ten minste eenmaal in de vier jaar het schoolplan vast en stelt dit zo spoedig mogelijk
      na de vaststelling beschikbaar voor de inspectie.


      2 Het bevoegd gezag stelt jaarlijks de schoolgids vast ten behoeve van het eerstvolgende schooljaar en stelt deze
      zo spoedig mogelijk na de vaststelling beschikbaar voor de ouders en de inspectie.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel13a
  - number: 13b
    text: >-
      Voorafgaand aan de vaststelling van de schoolgids stelt het bevoegd gezag leerlingen in de gelegenheid op een
      door hen te bepalen wijze vrijelijk hun mening naar voren te brengen over de basisondersteuningsvoorzieningen en
      het ondersteuningsaanbod van de school. Het bevoegd gezag biedt leerlingen daartoe de ondersteuning die zij nodig
      hebben. Het bevoegd gezag beschrijft in de schoolgids op algemene wijze de inbreng van de leerlingen en de mate van
      invloed op de vaststelling van de basisondersteuningsvoorzieningen en het ondersteuningsaanbod van de school.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel13b
  - number: '14'
    text: >-
      1 Ouders dan wel verzorgers, en personeelsleden kunnen bij de klachtencommissie, bedoeld in het tweede lid,
      onderdeel a, een klacht indienen over gedragingen en beslissingen van het bevoegd gezag of het personeel, waaronder
      discriminatie, dan wel het nalaten van gedragingen en het niet nemen van beslissingen door het bevoegd gezag of
      het personeel.


      2 Het bevoegd gezag treft een regeling voor de behandeling van klachten. Deze regeling vermeldt in ieder geval:


      a. de instelling van een klachtencommissie, die klachten behandelt,


      b. de wijze waarop de klachtencommissie haar werkzaamheden verricht,


      c. de termijn waarbinnen de klager een klacht kan indienen en


      d. de termijn waarbinnen mededeling plaatsvindt van het oordeel, bedoeld in het zesde lid, en hoe bij noodzakelijke
      afwijking van deze termijn wordt gehandeld.


      3 Deze regeling strekt ter vervanging van klachtenregelingen op grond van andere voorschriften dan dit artikel en
      strekt niet ter vervanging van een andere voorziening die op grond van een wettelijke regeling, niet zijnde een
      klachtenregeling, voor de klager openstaat of heeft opengestaan.


      4 Deze regeling


      a. voorziet erin dat de klachten worden behandeld door een klachtencommissie die bestaat uit ten minste drie leden,
      waaronder een voorzitter die geen deel uitmaakt van het bevoegd gezag en niet werkzaam is voor of bij het bevoegd
      gezag en


      b. waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft.


      5 De klager en degene over wie is geklaagd dan wel de instantie waarover is geklaagd krijgen de gelegenheid:


      a. hun zienswijze mondeling of schriftelijk toe te lichten en


      b. zich bij de behandeling van de klacht te laten bijstaan.


      6 De klachtencommissie vormt zich een oordeel over de gegrondheid van de klacht en deelt dit oordeel, al dan niet
      vergezeld van aanbevelingen, schriftelijk mede aan de klager, degene over wie is geklaagd dan wel de instantie
      waarover is geklaagd en het bevoegd gezag.


      7 Het bevoegd gezag deelt de klager en de klachtencommissie, bedoeld in het tweede lid, onderdeel a, binnen 4
      weken na ontvangst van het in het zesde lid bedoelde oordeel van de klachtencommissie schriftelijk mede of hij het
      oordeel over de gegrondheid van de klacht deelt en of hij naar aanleiding van dat oordeel maatregelen zal nemen en
      zo ja welke. Bij afwijking van de in de eerste volzin bedoelde termijn, doet het bevoegd gezag daarvan met redenen
      omkleed mededeling aan de klager en de klachtencommissie onder vermelding van de termijn waarbinnen het bevoegd
      gezag zijn standpunt bekend zal maken.


      8 Degene die betrokken is bij de uitvoering van dit artikel en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijze moet vermoeden, is verplicht tot geheimhouding daarvan,
      behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit zijn taak de noodzaak tot
      mededeling voortvloeit.


      9 Gegevens die betrekking hebben op een klacht worden bewaard op een plaats die uitsluitend toegankelijk is voor de
      leden van de klachtencommissie en het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel14
  - number: '15'
    text: >-
      1 Indien een leerling gedurende een deel van het onderwijsprogramma onderwijs ontvangt op een andere school, op
      een school voor speciaal onderwijs, op een school voor speciaal en voortgezet speciaal onderwijs, dan wel op een
      instelling voor speciaal en voortgezet speciaal onderwijs telt de tijd gedurende welke de leerling dit onderwijs
      ontvangt mee voor het aantal uren onderwijs dat de leerling ten minste moet ontvangen.


      2 Bij ministeriële regeling kunnen voorschriften worden vastgesteld omtrent vakanties. Daarbij kunnen begin en eind
      van vakanties worden vastgesteld die niet voor alle scholen gelijk behoeven te zijn.


      3 Bij algemene maatregel van bestuur kunnen voorschriften worden gegeven omtrent de uitvoering van het eerste lid
      alsmede omtrent de aard en de eisen aan de scholen en instellingen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003420/2026-08-01#Artikel15
  - number: '17'
    text: |-
      1 De instandhouding van een of meer openbare en een of meer bijzondere scholen kan worden opgedragen of
      overgedragen aan een stichting die met dit doel wordt onderscheidenlijk is opgericht. De besluitvorming van de
      zijde van de gemeente vindt plaats door de gemeenteraad.

      2 Het statutaire doel van de stichting is in elk geval het geven van openbaar onderwijs en bijzonder onderwijs in
      afzonderlijke scholen voor openbaar onderscheidenlijk bijzonder onderwijs.

      3 De stichting oefent alle taken en bevoegdheden van het bevoegd gezag uit.

      4 De statuten voorzien in ieder geval in een regeling omtrent:

      a. de samenstelling, werkwijze en inrichting van het bestuur van de stichting,

      b. de wijze van benoeming, herbenoeming, schorsing en ontslag van de bestuursleden,

      c. de termijn waarvoor de bestuursleden worden benoemd,

      d. de vaststelling van de begroting en jaarrekening na overleg met de gemeenteraad van de gemeente waarin de school
      waar openbaar onderwijs wordt gegeven, gevestigd is,

      e. de wijze waarop de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt gegeven,
      gevestigd is, toezicht op het bestuur van die school uitoefent,

      f. de gronden waarop het bestuur kan besluiten de vergaderingen besloten te houden,

      g. de periode waarvoor de stichting in het leven wordt geroepen, met dien verstande dat deze periode ten minste 5
      jaren bedraagt, en

      h. de bevoegdheid de stichting te ontbinden, met dien verstande dat in de regeling een overheersende invloed van de
      overheid in het bestuur is verzekerd voor zover het openbaar onderwijs betreft.

      5 De statuten van de stichting kunnen slechts worden gewijzigd na instemming van de gemeenteraad van de gemeente
      waarin de school waar openbaar onderwijs wordt gegeven, gevestigd is. Instemming kan slechts worden onthouden
      indien overheersende invloed van de overheid in het bestuur niet is verzekerd voor zover het openbaar onderwijs
      betreft.

      6 Het bestuur brengt jaarlijks aan de gemeenteraad van de gemeente waarin de school waar openbaar onderwijs wordt
      gegeven, gevestigd is, verslag uit over de werkzaamheden, waarbij in ieder geval aandacht wordt geschonken aan de
      wezenskenmerken van het openbaar onderwijs. Het verslag wordt bekendgemaakt.

      7 De vergaderingen van het bestuur van de stichting zijn openbaar, tenzij het bestuur anders beslist, op gronden,
      vermeld in de statuten.

      8 In geval van ernstige taakverwaarlozing door het bestuur of functioneren in strijd met de wet, voor zover
      het openbaar onderwijs betreft, neemt de gemeenteraad van de gemeente waarin de openbare school is gelegen, de
      maatregelen die hij nodig acht om de continuïteit van het onderwijsproces te waarborgen voor zover het openbaar
      onderwijs betreft.

      9 Indien de laatste afzonderlijke openbare school en de laatste afzonderlijke bijzondere school die door de
      stichting in stand worden gehouden, zijn gefuseerd tot een samenwerkingsschool als bedoeld in [artikel 17d][ref1]
      kan de instandhouding van die samenwerkingsschool opgedragen blijven aan de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel17d
