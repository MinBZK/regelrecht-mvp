    text: |-
      1 Indien een bevoegd gezag scholen in stand houdt in uitsluitend 1 gemeente of, ingeval voor die gemeente op
      grond van [artikel 141][ref1] opheffingsnormen zijn vastgesteld, in uitsluitend 1 deel van die gemeente, wordt,
      in afwijking van [artikel 139, eerste tot en met derde lid][ref2], de bekostiging van een bijzondere school niet
      beëindigd en een openbare school niet opgeheven op grond van artikel 139 indien de school ten minste 23 leerlingen
      telt, de gemiddelde schoolgrootte van alle scholen van dat bevoegd gezag ten minste 10/6x de voor die gemeente
      onderscheidenlijk dat deel van de gemeente geldende opheffingsnorm, dan wel ten minste 290 bedraagt en het bevoegd
      gezag tijdig de in [artikel 149, tweede lid][ref3], bedoelde mededeling heeft gedaan. Indien het bevoegd gezag
      dat bij die mededeling aangeeft, tellen bij de toepassing van de gemiddelde schoolgrootte niet mee de door hem
      aangeduide scholen die sinds de aanvang van de bekostiging niet meer dan 8 schooljaren zijn bekostigd en waarvan
      het aantal leerlingen, voor zover het niet betreft het aantal leerlingen van een nevenvestiging, niet heeft voldaan
      aan de stichtingsnorm op grond waarvan de school voor bekostiging in aanmerking werd genomen. De tweede volzin is
      niet van toepassing op scholen als bedoeld in [artikel 84][ref4].

      2 Indien een bevoegd gezag scholen in stand houdt in meer dan 1 gemeente, of in meer dan 1 deel van een
      gemeente waarvoor op grond van [artikel 141][ref5] opheffingsnormen zijn vastgesteld, wordt, in afwijking van
      [artikel 139, eerste tot en met derde lid][ref6], de bekostiging van een bijzondere school niet beëindigd en
      een openbare school niet opgeheven op grond van artikel 139 indien de school ten minste 23 leerlingen telt en de
      gemiddelde schoolgrootte van alle scholen van dat bevoegd gezag ten minste 10/6x het gewogen gemiddelde van de
      voor elk van die gemeenten en delen van gemeenten geldende opheffingsnormen, dan wel ten minste 290 bedraagt en
      het bevoegd gezag tijdig de in [artikel 149, tweede lid][ref7], bedoelde mededeling heeft gedaan. Het gewogen
      gemiddelde, bedoeld in de eerste volzin, wordt vastgesteld door het aantal scholen van het bevoegd gezag in elke
      gemeente of elk deel van een gemeente te vermenigvuldigen met de voor die gemeente onderscheidenlijk dat deel
      geldende opheffingsnorm en de som van de verkregen uitkomsten te delen door het totale aantal scholen van het
      bevoegd gezag. Indien het bevoegd gezag dat bij de mededeling, bedoeld in de eerste volzin, aangeeft, tellen bij
      de toepassing van de gemiddelde schoolgrootte en het gewogen gemiddelde niet mee de door hem aangeduide scholen die
      sinds de aanvang van de bekostiging niet meer dan 8 schooljaren zijn bekostigd en waarvan het aantal leerlingen,
      voor zover het niet betreft het aantal leerlingen van een nevenvestiging, niet heeft voldaan aan de stichtingsnorm
      op grond waarvan de school voor bekostiging in aanmerking werd genomen. De derde volzin is niet van toepassing op
      scholen als bedoeld in [artikel 84][ref8].

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing indien een bevoegd gezag met ten minste 1 ander
      bevoegd gezag een samenwerkingsovereenkomst heeft gesloten, waarbij voldaan wordt aan de volgende voorwaarden:

      a. alle scholen van elk bevoegd gezag dat aan de overeenkomst deelneemt, bevinden zich in een gebied van aan elkaar
      grenzende gemeenten, dan wel delen van gemeenten als bedoeld in [artikel 141][ref9];

      b. de overeenkomst is aangegaan voor een termijn van ten minste 10 jaren en

      c. in de overeenkomst is in elk geval opgenomen de verplichting voor elk bevoegd gezag om geen personeel te
      benoemen met voorbijgaan van personeel van een der scholen waarvan het bevoegd gezag aan de overeenkomst deelneemt
      en dat

      1°. werkzaam is met gebruikmaking van bekostiging, die is toegekend op grond van [artikel 120, eerste lid][ref10],
      wegens samenvoeging van scholen, dan wel

      2°. voor zover zich geen geval voordoet als bedoeld onder 1° in het genot is van wachtgeld of van een andere
      ontslaguitkering en direct aan die ontslaguitkering voorafgaand langer dan een jaar onafgebroken in dienst is
      geweest van het bevoegd gezag.

      4 Indien de samenwerkingsovereenkomst, bedoeld in het derde lid, voor afloop van de termijn bedoeld in het derde
      lid, onder b, door een bevoegd gezag wordt beëindigd, wordt de bekostiging van een bijzondere school die op
      grond van de samenwerkingsovereenkomst in afwijking van [artikel 139, eerste tot en met derde lid][ref11], werd
      bekostigd, beëindigd, dan wel een openbare school die op grond van de samenwerkingsovereenkomst in afwijking van
      artikel 139, eerste tot en met derde lid, in stand werd gehouden, opgeheven overeenkomstig artikel 139 met dien
      verstande dat de bekostiging niet wordt beëindigd onderscheidenlijk de school niet wordt opgeheven voor 1 augustus
      volgend op de beëindiging van de samenwerkingsovereenkomst. Bij een beëindiging van de samenwerkingsovereenkomst
      voor afloop van de termijn, bedoeld in het derde lid, onder b, wordt op de bekostiging van het Rijk voor de school
      of scholen van elk bevoegd gezag dat aan de samenwerkingsovereenkomst deelnam een bedrag ingehouden, waarvan de
      hoogte door middel van een bij algemene maatregel van bestuur vast te stellen regeling wordt bepaald.

      5 Een bevoegd gezag kan slechts deelnemen aan 1 samenwerkingsovereenkomst als bedoeld in het derde lid. Bij
      deelname aan meer dan 1 samenwerkingsovereenkomst als bedoeld in het derde lid, is voor de toepassing van dit
      artikel uitsluitend de eerst gesloten samenwerkingsovereenkomst van belang.


