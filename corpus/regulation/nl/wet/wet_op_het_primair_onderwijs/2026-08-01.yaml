  - number: 214b
    text: |-
      1 Verzoeken tot vergoeding als bedoeld in de [artikelen 138, tweede lid][ref1], en
      [184, vierde en vijfde lid][ref2], zoals deze artikelen luidden op 31 maart 2022, kunnen tot zes maanden na
      inwerkingtreding van artikel II, onderdelen C, E, F, G, I en J van de Wet van 11 oktober 2021 tot wijziging van
      de Wet op het primair onderwijs en de [Wet op de expertisecentra][ref3] in verband met de beëindiging van de
      verplichte aansluiting bij een rechtspersoon in verband met de kosten van vervanging en in verband met wijziging
      van de wijze waarop de werkloosheidsuitkeringen worden verevend (beëindiging vervangingsfonds en hervorming
      participatiefonds) (Stb. 2021, 538) worden ingediend bij het participatiefonds.

      2 Op de afwikkeling van de aanvragen, alsmede op geschillen daarover in bezwaar en beroep of hoger beroep, zijn
      de [artikelen 138, tweede lid][ref4], en [184, vierde en vijfde lid][ref5], en de daarop gebaseerde regelingen,
      zoals deze luidden op 31 maart 2022, van toepassing, met dien verstande dat vanaf de inwerkingtreding van de Wet
      van 11 oktober 2021 tot wijziging van de Wet op het primair onderwijs en de [Wet op de expertisecentra][ref6]
      in verband met de beëindiging van de verplichte aansluiting bij een rechtspersoon in verband met de kosten
      van vervanging en in verband met wijziging van de wijze waarop de werkloosheidsuitkeringen worden verevend
      (beëindiging vervangingsfonds en hervorming participatiefonds) (Stb. 2021, 538) de financiële afwikkeling bij het
      participatiefonds ligt.


