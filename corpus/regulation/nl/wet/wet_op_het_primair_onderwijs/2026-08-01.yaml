  - number: '118'
    text: |-
      1 Bij het bepalen van de hoogte van de bekostiging, bedoeld in [artikel 116, eerste lid][ref1], gaat Onze Minister
      uit van het aantal leerlingen van de school op 1 februari van het voorafgaande kalenderjaar.

      2 Voor een school die voor het eerst wordt bekostigd, gaat Onze Minister bij het bepalen van de hoogte van de
      bekostiging, bedoeld in [artikel 116, eerste lid][ref2]:

      a. voor de resterende maanden van het kalenderjaar waarin de school wordt geopend, uit van het aantal leerlingen op
      1 oktober volgende op de opening en

      b. voor het daaropvolgende kalenderjaar, uit van het aantal leerlingen van de school op 1 februari volgende op
      de opening.

      3 In geval van een samenvoeging van scholen als bedoeld in [artikel 117, eerste of tweede lid][ref3], gaat Onze
      Minister bij het bepalen van de hoogte van de bekostiging, bedoeld in [artikel 116, eerste lid][ref4], uit van het
      aantal leerlingen van alle bij de samenvoeging betrokken scholen, voor elke school vastgesteld volgens het eerste
      lid.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld ter uitvoering van het eerste lid tot en
      met het derde lid.


