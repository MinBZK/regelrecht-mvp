  - number: '185'
    text: |-
      1 Het Rijk verstrekt aan schoolbegeleidingsdiensten bekostiging voor activiteiten die worden verricht met
      betrekking tot de ondersteuning bij het onderwijs aan zieke leerlingen als bedoeld in [artikel 9a][ref1]. Bij
      ministeriële regeling kunnen nadere regels worden gesteld voor de bekostiging, bedoeld in de vorige volzin.

      2 Schoolbegeleidingsdiensten als bedoeld in het eerste lid, zijn de schoolbegeleidingsdiensten die
      voor de ondersteuning bij het onderwijs aan zieke leerlingen als bedoeld in [artikel 9a][ref2] in
      de periode 1 augustus 1999 tot 1 augustus 2004 subsidie ontvingen van een gemeente op grond van
      [artikel IX van de Wet van 10 december 1998 (Stb. 733), tot wijziging van de Wet op de expertisecentra, de Wet op
      het primair onderwijs, de Wet op het voortgezet onderwijs, de Wet educatie en beroepsonderwijs en de Wet op het
      hoger onderwijs en wetenschappelijk onderzoek inzake de ondersteuning bij het onderwijs aan zieke
      leerlingen][ref3],
      zoals dat artikel luidde op de dag direct voorafgaand aan het tijdstip waarop [die wet][ref4] is vervallen.


