  - number: '8'
    text: |-
      1 Het onderwijs wordt zodanig ingericht dat de leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen.
      Het wordt afgestemd op de voortgang in de ontwikkeling van de leerlingen.

      2 Het onderwijs richt zich in elk geval op de emotionele en de verstandelijke ontwikkeling, en op het ontwikkelen
      van creativiteit, op het verwerven van noodzakelijke kennis en van sociale, culturele en lichamelijke vaardigheden.

      3 Het onderwijs bevordert actief burgerschap en sociale cohesie op doelgerichte en samenhangende wijze, waarbij het
      onderwijs zich in ieder geval herkenbaar richt op:

      a. het bijbrengen van respect voor en kennis van de basiswaarden van de democratische rechtsstaat, zoals verankerd
      in de [Grondwet][ref1], en de universeel geldende fundamentele rechten en vrijheden van de mens, en het handelen
      naar deze basiswaarden op school;

      b. het ontwikkelen van de sociale en maatschappelijke competenties die de leerling in staat stellen deel uit te
      maken van en bij te dragen aan de pluriforme, democratische Nederlandse samenleving; en

      c. het bijbrengen van kennis over en respect voor verschillen in godsdienst, levensovertuiging, politieke
      gezindheid, afkomst, geslacht, handicap of seksuele gerichtheid alsmede de waarde dat gelijke gevallen gelijk
      behandeld worden.

      3a Het bevoegd gezag draagt zorg voor een schoolcultuur die in overeenstemming is met de waarden, bedoeld in het
      derde lid, onderdeel a, creëert een omgeving waarin leerlingen worden gestimuleerd actief te oefenen met de omgang
      met en het handelen naar deze waarden en draagt voorts zorg voor een omgeving waarin leerlingen en personeel zich
      veilig en geaccepteerd weten, ongeacht de in het derde lid, onder c, genoemde verschillen.

      4 Ten aanzien van leerlingen die extra ondersteuning behoeven, is het onderwijs gericht op individuele begeleiding
      die is afgestemd op de behoeften van de leerling. Zo nodig treedt het bevoegd gezag daarbij in overleg met:

      a. het college van burgemeester en wethouders van de gemeente waar de leerling zijn woonplaats heeft als bedoeld in
      [artikel 1.1. van de Jeugdwet][ref2],

      b. een instantie die jeugdgezondheidszorg uitvoert als bedoeld in [artikel 5 van de Wet publieke gezondheid][ref3],

      c. een instantie die maatschappelijke ondersteuning biedt als bedoeld in
      [artikel 1, eerste lid, onder g, 2°, van de Wet maatschappelijke ondersteuning][ref4],

      d. een zorgaanbieder als bedoeld in
      [artikel 1, eerste lid, onder j, van de Algemene Wet Bijzondere Ziektekosten][ref5] of

      e. een zorgaanbieder die geneeskundige geestelijke gezondheidszorg levert welke behoort tot de prestaties
      omschreven bij of krachtens de [Zorgverzekeringswet][ref6].

      5

      6 Het onderwijs aan een speciale school voor basisonderwijs is er tevens op gericht leerlingen waar mogelijk tot
      het volgen van onderwijs in basisscholen of scholen voor voortgezet onderwijs te brengen.

      7 Het onderwijs wordt zodanig ingericht dat:

      a. de leerlingen in beginsel binnen een tijdvak van 8 aaneensluitende schooljaren de school kunnen doorlopen;

      b. de leerlingen in 8 schooljaren ten minste 7.520 uren onderwijs ontvangen, met dien verstande dat:

      1°. de leerlingen in de eerste 4 schooljaren ten minste 3.520 uren onderwijs en in de laatste 4 schooljaren ten
      minste 3.760 uren onderwijs ontvangen, en

      2°. aan de leerlingen in de laatste 6 schooljaren ten hoogste 7 weken van het schooljaar 4 dagen per week onderwijs
      wordt gegeven, die evenwichtig zijn verdeeld over het schooljaar, bij een schoolweek van in beginsel niet minder
      dan 5 dagen onderwijs; en

      c. de onderwijsactiviteiten evenwichtig over de dag worden verdeeld, tenzij afwijking van deze verdeling van belang
      is in verband met activiteiten in het kader van het voorkomen en bestrijden van onderwijsachterstanden.

      8 Het onderwijs wordt zodanig ingericht dat leerlingen die in verband met ziekte thuis verblijven dan wel zijn
      opgenomen in een ziekenhuis, op adequate wijze voldoende onderwijs kunnen genieten.

      9 Het onderwijs wordt zodanig ingericht dat daarbij op structurele en herkenbare wijze aandacht wordt besteed aan
      het bestrijden van achterstanden in het bijzonder in de beheersing van de Nederlandse taal, waarin ook door middel
      van vroegschoolse educatie kan worden voorzien.

      10 De inspectie kan op verzoek van het bevoegd gezag ermee instemmen dat om lichamelijke of psychische redenen voor
      individuele leerlingen wordt afgeweken van het zevende lid, onderdeel b.


