  - number: '190'
    text: |-
      1 Voor de toepassing van dit artikel en de [artikelen 190a][ref1], [191][ref2], [191a][ref3], [214a][ref4] en
      [214b][ref5] wordt onder participatiefonds verstaan de door Onze Minister aangewezen rechtspersoon, bedoeld in het
      tweede lid. Het tweede tot en met vijfde lid en artikel 191 zijn van overeenkomstige toepassing op het bestuur van
      een centrale dienst en op het samenwerkingsverband.

      2 Het bevoegd gezag is aangesloten bij een door Onze Minister aan te wijzen rechtspersoon met volledige
      rechtsbevoegdheid die zich het uitoefenen van de taken, genoemd in het derde lid, ten doel stelt.

      3 Het participatiefonds heeft tot taak:

      a. het bieden van waarborgen ten behoeve van het bevoegd gezag voor de kosten van werkloosheidsuitkeringen
      van gewezen personeel alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid anders dan op grond van de
      [Ziektewet][ref6];

      b. het namens het bevoegd gezag voldoen van de werkloosheidsuitkeringen aan het Uitvoeringsinstituut
      werknemersverzekeringen en het voldoen van de kosten van bovenwettelijke uitkeringen aan de instanties die de
      uitkeringen verstrekken, hebben verstrekt of zullen verstrekken;

      c. het namens het bevoegd gezag voeren van de administratie van de werkloosheidsuitkeringen die zijn vastgesteld
      door het Uitvoeringsinstituut werknemersverzekeringen;

      d. het namens het bevoegd gezag uitvoeren van de in [artikel 72a, onder a, van de Werkloosheidswet][ref7]
      opgedragen taak;

      e. het ondersteunen van het bevoegd gezag bij het beleid gericht op het terugdringen van ziekteverzuim en
      arbeidsongeschiktheid en het voorkomen van werkloosheid;

      f. het bij het bevoegd gezag in rekening brengen van de kosten van werkloosheidsuitkeringen van gewezen personeel
      alsmede uitkeringen wegens ziekte en arbeidsongeschiktheid anders dan op grond van de [Ziektewet][ref8] welke niet
      voor vergoeding van het participatiefonds in aanmerking komen.

      4 Het bevoegd gezag voldoet aan het participatiefonds een door het bestuur van het participatiefonds vast te
      stellen premie in verband met de uitoefening van de in het derde lid genoemde taken.

      5 Het bestuur van het participatiefonds stelt regels vast voor de wijze waarop en de voorwaarden waaronder de
      uitkeringskosten bij het bevoegd gezag in rekening worden gebracht. Als onderdeel daarvan stelt het bestuur van het
      participatiefonds de hoogte van de eigen bijdrage in deze kosten vast.

      6 Van de in het tweede lid bedoelde aansluiting kan Onze Minister op aanvraag van het bevoegd gezag of het bestuur
      van een centrale dienst ontheffing verlenen op grond van bezwaren van godsdienstige of levensbeschouwelijke aard,
      met dien verstande dat het participatiefonds na ontheffing in ieder geval de taken, bedoeld in het derde lid,
      onderdelen b, c, d en f uitvoert, met inachtneming van het vierde en vijfde lid. Het participatiefonds kan na
      ontheffing de taak, bedoeld in het derde lid, onderdeel e uitvoeren. Onze Minister verleent de ontheffing slechts,
      indien de aanvrager aantoont dat een afdoende andere voorziening is getroffen. Onze Minister besluit binnen zes
      maanden na ontvangst van een aanvraag.

      7 Het bestuur van het participatiefonds kan subsidie verstrekken voor activiteiten in het kader van de taken,
      genoemd in het derde lid. Het bestuur van het participatiefonds stelt regels vast voor de wijze waarop en de
      voorwaarden waaronder de subsidie wordt verstrekt. Daarbij kan een subsidieplafond worden vastgesteld.

      8 Op het participatiefonds is de [Kaderwet zelfstandige bestuursorganen][ref9] van toepassing.


