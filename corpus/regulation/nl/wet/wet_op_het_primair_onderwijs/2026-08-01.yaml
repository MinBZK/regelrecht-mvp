  - number: '12'
    text: |-
      1 Het schoolplan bevat een beschrijving van het beleid met betrekking tot de kwaliteit van het onderwijs dat
      binnen de school wordt gevoerd, en omvat in elk geval het onderwijskundig beleid, het personeelsbeleid en het
      stelsel van kwaliteitszorg. Het schoolplan omvat mede het beleid ten aanzien van de aanvaarding van materiële
      bijdragen of geldelijke bijdragen, niet zijnde ouderbijdragen of op de onderwijswetgeving gebaseerde bijdragen,
      indien het bevoegd gezag daarbij verplichtingen op zich neemt waarmee de leerlingen binnen de schooltijden
      en tijdens de activiteiten die worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, alsmede
      tijdens het overblijven, zullen worden geconfronteerd. In het schoolplan wordt aangegeven op welke wijze de
      identiteitscommissie, bedoeld in [artikel 17d][ref1], invulling geeft aan het openbare karakter onderscheidenlijk
      de identiteit voor zover het betreft een samenwerkingsschool.

      2 De beschrijving van het onderwijskundig beleid omvat in elk geval:

      a. de uitwerking van de wettelijke voorschriften betreffende de uitgangspunten en de doelstelling van het
      onderwijs,

      b. de uitwerking van de wettelijke voorschriften betreffende de inhoud van het onderwijs en de door het bevoegd
      gezag in het schoolplan opgenomen eigen opdrachten voor het onderwijs in een onderwijsprogramma,

      c. het pedagogisch-didactisch klimaat en het schoolklimaat, en

      d. het zorg dragen voor de veiligheid op school, bedoeld in [artikel 4c][ref2].

      Bij de beschrijving van het onderwijskundig beleid wordt tevens het ondersteuningsaanbod van de school betrokken.

      3 De beschrijving van het personeelsbeleid omvat in elk geval:

      a. het voldoen aan de eisen van bevoegdheid en de wijze waarop de bekwaamheid wordt onderhouden,

      b. cijfers over de mate van evenredige vertegenwoordiging van vrouwen in leidinggevende posities,

      c. de maatregelen met betrekking tot het personeel die bijdragen aan de ontwikkeling en de uitvoering van het
      onderwijskundig beleid, en

      d. het pedagogisch-didactisch handelen van het onderwijspersoneel.

      4 De beschrijving van het stelsel van kwaliteitszorg omvat in elk geval het zorg dragen voor:

      a. het bewaken dat leerlingen een ononderbroken ontwikkelingsproces kunnen doorlopen en dat het onderwijs wordt
      afgestemd op de voortgang in de ontwikkeling van leerlingen, bedoeld in [artikel 8, eerste lid][ref3], mede met
      behulp van het leerling- en onderwijsvolgsysteem, bedoeld in [artikel 45b, eerste lid][ref4], en

      b. het vaststellen welke maatregelen ter verbetering nodig zijn.


