  - number: 41a
    text: |-
      1 De deelname van leerlingen aan activiteiten die geen onderdeel uitmaken van het verplichte onderwijsprogramma
      en worden georganiseerd onder verantwoordelijkheid van het bevoegd gezag, wordt niet afhankelijk gesteld van een
      bijdrage als bedoeld in [artikel 40, eerste lid][ref1].

      2 Aan het eerste lid wordt in ieder geval voldaan voor de daar bedoelde activiteiten, indien:

      a. deze activiteiten buiten het onderwijs in de krachtens [artikel 9, tweede lid][ref2], vastgestelde kerndoelen
      langdurig aan leerlingen worden aangeboden door een school die door dat bevoegd gezag in stand gehouden wordt,

      b. die school is aangesloten bij een verband van scholen die dergelijke activiteiten organiseren, en

      c. krachtens een door dat verband vastgestelde code een regeling is getroffen voor de leerlingen ten aanzien van
      wie niet of niet geheel de gevraagde ouderbijdrage wordt betaald.

      3 Bij ministeriële regeling kunnen nadere voorschriften worden gesteld aan de scholen, bedoeld in het tweede lid,
      onderdeel b, en aan de code, bedoeld in het tweede lid, onderdeel c.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel40
