  - number: '123'
    text: |-
      1 Indien het totaal van de bedragen, bedoeld in [artikel 122, derde lid][ref1], de bekostiging van het
      samenwerkingsverband, bedoeld in artikel 122, eerste lid, overschrijdt, wordt het bedrag waarmee die bekostiging
      wordt overschreden door Onze Minister in mindering gebracht op de bekostiging van alle basisscholen waarvan een of
      meer vestigingen zijn aangesloten bij het samenwerkingsverband.

      2 Het bedrag dat in mindering wordt gebracht wordt per basisschool bepaald op basis van het leerlingenaantal van de
      desbetreffende vestiging of vestigingen in het samenwerkingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel122
