  - number: '84'
    text: |-
      1 Onze Minister kan onder door hem te stellen voorwaarden voor bekostiging in aanmerking brengen een school die
      wordt omgezet van een bijzondere school in een openbare school of omgekeerd dan wel een school die tot stand komt
      als samenwerkingsschool als bedoeld in [artikel 17d, eerste lid][ref1]. Een omzetting kan slechts plaatsvinden met
      ingang van 1 augustus van enig kalenderjaar.

      2 Indien het bevoegd gezag een school binnen een gemeente verplaatst binnen een straal van 3 kilometer van het
      huidige vestigingsadres, blijft de aanspraak op bekostiging bestaan.

      3 Indien het bevoegd gezag een school verplaatst buiten een straal van 3 kilometer van het huidige vestigingsadres,
      zijn de [artikelen 74][ref2], [74a][ref3], [75][ref4] en [76][ref5] van overeenkomstige toepassing. Onze Minister
      kan onder door hem te stellen voorwaarden een school voor bekostiging in aanmerking blijven brengen zonder dat de
      belangstellingsmeting aannemelijk maakt dat de school op 1 januari van het elfde jaar na de verplaatsing zal worden
      bezocht door ten minste het aantal leerlingen dat overeenkomt met de voor de gemeente geldende stichtingsnorm,
      bedoeld in artikel 76, eerste lid.


