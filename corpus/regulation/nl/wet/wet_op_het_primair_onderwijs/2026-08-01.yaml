  - number: '74'
    text: |-
      1 Het bevoegd gezag dient bij Onze Minister een aanvraag in voor bekostiging van een openbare en een bijzondere
      school. Deze aanvraag vermeldt of het openbaar of bijzonder onderwijs betreft en wat de beoogde plaats van
      vestiging van de school is.

      2 De aanvraag gaat vergezeld van:

      a. een belangstellingsmeting als bedoeld in [artikel 74a][ref1];

      b. een beschrijving van het voorgenomen beleid ten aanzien van de kwaliteit van het onderwijs dat binnen de school
      zal worden gevoerd, voor zover dit betreft de uitwerking van de wettelijke voorschriften voor:

      1° de inhoud van het onderwijs, bedoeld in [artikel 8, derde lid][ref2];

      2° leerlingen die extra ondersteuning behoeven, bedoeld in [artikel 8, vierde lid][ref3];

      3° de inrichting van het onderwijs, bedoeld in [artikel 8, eerste lid][ref4] en een leerling- en
      onderwijsvolgsysteem als bedoeld in [artikel 45b, eerste lid][ref5];

      4° de inrichting van het onderwijs, bedoeld in [artikel 8, zevende lid][ref6];

      5° de inhoud van het onderwijs, die dekkend zal zijn voor de kerndoelen, bedoeld in [artikel 9][ref7], en de
      referentieniveaus, bedoeld in [artikel 2 van de Wet referentieniveaus Nederlandse taal en rekenen;][ref8] en

      6° de scheiding tussen de functies van bestuur en het toezicht daarop, bedoeld in [artikel 17a][ref9] en
      [17b][ref10] en, indien toepassing wordt gegeven aan [artikel 30a][ref11], een beschrijving van de over te dragen
      taken;

      c. een document waaruit blijkt dat de gemeente van de beoogde plaats van vestiging van de school, het
      samenwerkingsverband en de bevoegde gezagsorganen van de scholen en vestigingen binnen het voedingsgebied van de
      school zijn gevraagd om te overleggen over het voornemen tot het doen van een aanvraag om bekostiging; en

      d. een verklaring omtrent het gedrag, die op het tijdstip van het doen van de aanvraag niet ouder is dan zes
      maanden, van de personen die het bestuur en het intern toezicht vormen.

      3 De aanvraag bevat tevens:

      a. een beschrijving van het beleid met betrekking tot de bewaking en verbetering van de kwaliteit van het
      onderwijs;

      b. een beschrijving van de beoogde samenstelling van de formatie van de school;

      c. een beschrijving van de wijze waarop invulling wordt gegeven aan de voorschriften die worden gesteld aan de
      bekwaamheid van leraren en degenen die onderwijsondersteunende of leidinggevende werkzaamheden verrichten;

      d. een beschrijving van de wijze waarop invulling wordt gegeven aan de zorg voor de sociale, psychische en fysieke
      veiligheid van leerlingen op school;

      e. een meerjarenbegroting over de eerste drie schooljaren gebaseerd op de bekostiging die de school zal ontvangen
      gegeven het aantal te verwachten leerlingen in die periode;

      f. de verwachtingen met betrekking tot de huisvesting en de samenwerking met de kinderopvang;

      g. informatie over de hoogte van en het beleid ten aanzien van de vrijwillige geldelijke bijdrage die van de ouders
      zal worden gevraagd en het jaarlijks verwachte totaalbedrag van die bijdragen;

      h. informatie over de wijze waarop het bevoegd gezag uitvoering zal geven aan de afspraken, bedoeld in
      [artikel 160][ref12] en [artikel 161][ref13]; en

      i. een beschrijving van de wijze waarop uitvoering wordt gegeven aan de [Wet medezeggenschap op scholen][ref14].

      4 Bij ministeriële regeling worden nadere regels gesteld aan de wijze waarop de aanvraag plaatsvindt en kan een
      model voor de aanvraag worden vastgesteld.


