  - number: 4c
    text: |-
      1 De jongere die als leerling, vavo-student of mbo-student van een school of instelling staat ingeschreven op
      grond van [artikel 4a, eerste lid][ref1], is verplicht het volledige onderwijsprogramma, het volledige programma
      van de combinatie leren en werken, het onderwijsprogramma, bedoeld in [artikel 2.107b, tweede lid][ref2], of
      [2.107l, tweede lid, van de Wet voortgezet onderwijs 2020][ref3] respectievelijk het onderwijsprogramma dat
      is vormgegeven volgens een samenwerkingsovereenkomst als bedoeld in [artikel 2.100, eerste lid][ref4], of
      [2.109, derde lid, van die wet][ref5], te volgen dat door die school of instelling wordt aangeboden.

      2 De jongere voldoet aan de verplichting, bedoeld in [artikel 4a, eerste lid][ref6], om de school of instelling na
      inschrijving geregeld te bezoeken, zolang hij geen les of praktijktijd verzuimt anders dan op een van de gronden,
      bedoeld in [artikel 11][ref7].


