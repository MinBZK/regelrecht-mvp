  - number: '28'
    text: De bij deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel28
  - number: '29'
    text: |-
      1 Bij ministeriële regeling worden nadere voorschriften gegeven voor de uitvoering van deze wet en
      worden de modellen vastgesteld van de kennisgevingen en mededelingen, bedoeld in de [artikelen 6][ref1],
      [18][ref2] en [25, tweede en derde lid][ref3]. Bij deze regeling kan tevens worden bepaald dat de in
      [artikel 25, tweede of derde lid][ref4], bedoelde opgave niet wordt gedaan aan Onze Minister maar aan het Centraal
      Bureau voor de Statistiek.

      2 De formulieren van de kennisgevingen en mededelingen, bedoeld in de [artikelen 6][ref5] en [18][ref6] zijn voor
      de belanghebbenden kosteloos ter gemeentesecretarie verkrijgbaar. De formulieren voor de opgaven van gegevens ten
      behoeve van statistisch onderzoek als bedoeld in [artikel 25, tweede en derde lid][ref7], worden door het Rijk
      verstrekt.


