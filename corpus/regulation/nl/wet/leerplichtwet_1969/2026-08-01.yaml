  - number: 1a
    text: |-
      1 Bij ministeriële regeling dan wel bij beschikking van Onze Minister kunnen onderwijsinstellingen dan wel
      groepen daarvan worden aangewezen als school als bedoeld in [artikel 1, onderdeel b, subonderdeel 4][ref1]. Aan de
      aanwijzing kunnen voorwaarden worden verbonden.

      2 Onze Minister kan de aanwijzing intrekken indien het hoofd of het personeel van de school in strijd handelt met
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
