  - number: '4'
    text: >-
      1 De verplichting om te zorgen, dat een jongere de school waar hij als leerling staat ingeschreven, geregeld
      bezoekt, begint op de dag waarop hij na inschrijving op die school kan plaats nemen, en eindigt tegelijk met de
      verplichting om te zorgen, dat hij als leerling van een school staat ingeschreven.


      2 Het schoolbezoek vindt geregeld plaats, zolang geen les of praktijktijd wordt verzuimd.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel4
  - number: 4a
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde personen zijn verplicht te zorgen dat de jongere
      overeenkomstig de bepalingen van deze paragraaf staat ingeschreven als leerling, vavo-student of mbo-
      student bij een school of instelling die volledig dagonderwijs, een bij de wet geregelde combinatie
      van leren en werken een onderwijsprogramma als bedoeld in [artikel 2.107b, tweede lid][ref2], of
      [2.107l, tweede lid, van de Wet voortgezet onderwijs 2020][ref3] dan wel een onderwijsprogramma dat is
      vormgegeven volgens een samenwerkingsovereenkomst als bedoeld in [artikel 2.100, eerste lid][ref4], of
      [2.109, derde lid, van die wet][ref5] verzorgt en dat hij deze school of instelling na inschrijving geregeld
      bezoekt, als:

      a. ten aanzien van de jongere de leerplicht, bedoeld in [paragraaf 2][ref6] van deze wet is geëindigd, en

      b. de jongere geen startkwalificatie heeft behaald.

      2 De verplichting, bedoeld in het eerste lid, geldt niet ten aanzien van jongeren
      die in het bezit zijn van een schooldiploma praktijkonderwijs, als bedoeld in
      [artikel 2.58, derde lid, van de Wet voortgezet onderwijs 2020][ref7], of een verklaring als bedoeld in
      [artikel 2.59, tweede lid, van die wet][ref8] en jongeren die voortgezet speciaal onderwijs in het uitstroomprofiel,
      bedoeld in [artikel 14, eerste lid, onderdeel b dan wel onderdeel c, van de Wet op de expertisecentra][ref9] hebben
      gevolgd.

      3 [Artikel 2, tweede lid][ref10], is van overeenkomstige toepassing ten aanzien van de verplichtingen, bedoeld in
      het eerste lid.

      4 Als de inschrijving, bedoeld in het eerste lid, plaats vindt aan een andere school of instelling dan daarvoor
      door de jongere werd bezocht, wordt bij de inschrijving een van overheidswege verstrekt document overgelegd
      waarop de gegevens van de jongere betreffende zijn geslachtsnaam, voorletters, geboortedatum, geslacht en
      burgerservicenummer zijn vermeld. Bij gebrek aan een burgerservicenummer wordt zo mogelijk het onderwijsnummer van
      de jongere overgelegd. Als de in [artikel 2, eerste lid][ref11], bedoelde personen bij de inschrijving aannemelijk
      hebben gemaakt dat zij geen burgerservicenummer of onderwijsnummer van de jongere kunnen overleggen, leggen zij het
      burgerservicenummer of onderwijsnummer van de jongere over aan de school zodra zij daarvan kennis hebben verkregen.

      5 Tot het tijdstip, bedoeld in
      [artikel XIa, vijfde lid, van de wet van 6 december 2001, Stb. 681, tot wijziging van enkele onderwijswetten in
      verband met de invoering van persoonsgebonden nummers in het onderwijs][ref12],
      kan, in afwijking van de eerste volzin van het vierde lid, inschrijving van een jongere als mbo-student of
      vavo-student aan een instelling plaatsvinden zonder overlegging van het onderwijsnummer en, indien de in
      [artikel 2, eerste lid][ref13], bedoelde personen aannemelijk maken dat zij geen burgerservicenummer van de jongere
      kunnen overleggen, eveneens zonder overlegging van het burgerservicenummer. Tot dat tijdstip is de tweede volzin
      van het vierde lid uitsluitend van toepassing met betrekking tot het burgerservicenummer.

      6 Het vierde en vijfde lid zijn van toepassing met ingang van het tijdstip van inwerkingtreding van
      [artikel IV van de wet van 6 december 2001, Stb. 681, tot wijziging van enkele onderwijswetten in verband met de
      invoering van persoonsgebonden nummers in het onderwijs][ref14].


