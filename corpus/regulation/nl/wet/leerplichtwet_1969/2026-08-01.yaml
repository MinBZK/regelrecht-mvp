  - number: '17'
    text: >-
      Gemeenschappelijke regelingen betreffende het toezicht op de naleving van deze wet, alsmede wijziging of intrekking
      daarvan, worden mede ter kennis gebracht van Onze Minister en van de hoofden in de gemeenten die bij de regeling
      zijn aangesloten.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel17
  - number: '18'
    text: |-
      1 De hoofden melden een beslissing tot verwijdering van een leerling, vavo-student of mbo-student terstond aan
      burgemeester en wethouders.

      2 Indien de jongere geen volledig onderwijsprogramma volgt, geeft het hoofd van een instelling aan het
      college van burgemeester en wethouders bericht van het programma van de combinatie leren en werken, bedoeld in
      [artikel 4c, eerste lid][ref1], dat door de jongere wordt gevolgd.

      3 De hoofden geven aan het college van burgemeester en wethouders en aan de ambtenaar alle inlichtingen die deze in
      verband met de uitvoering van deze wet verlangen.

      4 In de mededeling, bedoeld in het eerste en het tweede lid, vermeldt het hoofd zo mogelijk mede het
      burgerservicenummer of onderwijsnummer van de jongere.

      5 Indien het college van burgemeester en wethouders van de gemeente waar de leerling, vavo-student of mbo-student
      woon- of verblijfplaats heeft zijn bevoegdheden op grond van deze wet heeft ondergebracht in een gemeenschappelijke
      regeling als bedoeld in [artikel 1, eerste lid, van de Wet gemeenschappelijke regelingen][ref2], vindt de
      informatieverstrekking door de hoofden, bedoeld in dit artikel, plaats aan het orgaan dat daartoe volgens die
      gemeenschappelijke regeling is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel1
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel18
