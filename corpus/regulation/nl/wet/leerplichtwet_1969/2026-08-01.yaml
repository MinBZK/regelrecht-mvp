  - number: 3b
    text: |-
      1 Op aanvraag van de in [artikel 2, eerste lid][ref1], bedoelde personen kan het college van burgemeester en
      wethouders van de gemeente waar de jongere als ingezetene met een adres in de basisregistratie personen is
      ingeschreven, toestaan dat de inschrijving van de jongere aan een school voor het laatste schooljaar, bedoeld in
      [artikel 3, eerste lid, onder a of b][ref2], wordt vervangen door de inschrijving als mbo-student of vavo-student
      van een instelling als bedoeld in [paragraaf 2a][ref3].

      2 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van gegevens van de jongere betreffende:

      a. het persoonsgebonden nummer;

      b. de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats; en

      c. of eerder vervangende leerplicht is toegestaan.

      3 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van plan van aanpak dat voorziet in een
      begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door de instelling waar de jongere
      ingeschreven wenst te worden. Het begeleidingsprogramma bevat ten minste een beschrijving van de onderwijs- en
      vormingsdoelen, waaronder algemeen vormend onderwijs en op het beroep gericht onderwijs, alsmede de wijze waarop
      arbeid van lichte aard zal worden verricht, naast het volgen van onderwijs aan een instelling als bedoeld in
      [paragraaf 2a][ref4] doch niet in samenhang met het onderwijs. Indien het betreft een jongere, die ten tijde
      van de indiening van de aanvraag een programma als bedoeld in [artikel 3a, eerste lid][ref5], volgt, gaat de
      aanvraag tevens vergezeld van een verklaring van het hoofd van de school waar de jongere staat ingeschreven,
      waarin een overzicht is gegeven van de wijze waarop uitvoering is gegeven aan het programma en waaruit blijkt
      dat een terugkeer van de jongere naar het onderwijs, bedoeld in de [artikelen 2.12 tot en met 2.14][ref6]
      en [2.18 van de Wet voortgezet onderwijs 2020][ref7], dan wel een voortgezette toepassing van
      [artikel 3a, eerste lid][ref8], te ontraden is.

      4 Alvorens het college van burgemeester en wethouders besluit op de aanvraag, bedoeld in het eerste lid, hoort het
      college van burgemeester en wethouders in elk geval:

      a. degene die de aanvraag heeft ingediend en de jongere zelf;

      b. het hoofd van de school waar de jongere het laatst stond ingeschreven en het hoofd van de instelling waar de
      jongere ingeschreven wenst te worden, en

      c. de instellingen van maatschappelijke zorg die reeds bij de begeleiding van de jongere betrokken zijn.

      5 Het college van burgemeester en wethouders besluit binnen zes weken na ontvangst van de aanvraag.


