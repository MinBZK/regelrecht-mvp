  - number: 1a1
    text: |-
      1 Onverminderd [titel I van de Wet op het primair onderwijs][ref1] en de [artikelen 1.1][ref2],
      [1.4][ref3], [7.9, eerste lid][ref4], [3.39 tot en met 3.41][ref5], [8.28][ref6] en
      [8.29 van de Wet voortgezet onderwijs 2020][ref7], moet een school als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref8],

      a. wat de inrichting van het basisonderwijs betreft, voldoen aan de criteria, bedoeld in de
      [artikelen 8, eerste tot en met vierde, zevende lid, onderdeel a, achtste en negende lid][ref9],
      [9][ref10] en [10, eerste volzin, van de Wet op het primair onderwijs][ref11], en tevens heeft de school
      een schoolplan dat ten minste een beschrijving bevat van het beleid inzake het onderwijs, bedoeld in
      [artikel 8, derde lid, van genoemde wet][ref12];

      b. wat de inrichting van het voortgezet onderwijs betreft, voldoen aan de criteria, bedoeld in de
      [artikelen 2.2][ref13], [2.11][ref14] en [2.87, eerste volzin, van de Wet voortgezet onderwijs 2020][ref15], en
      tevens heeft de school een schoolplan dat ten minste een beschrijving bevat van het beleid inzake het onderwijs,
      bedoeld in [artikel 2.2 van genoemde wet][ref16] en besteedt het onderwijs binnen de eerste twee leerjaren van het
      voortgezet onderwijs aantoonbaar aandacht aan de kerndoelen, bedoeld in [artikel 2.13 van genoemde wet][ref17],
      en aansluitend aan de kerndoelen als onderwijsprogramma voor de eerste twee leerjaren, stelt het onderwijs de
      leerlingen aantoonbaar in staat om hun onderwijsloopbaan voort te zetten in het vervolgonderwijs op een niveau dat
      van de leerling verwacht mag worden.

      2 Het college van burgemeester en wethouders volgt bij zijn oordeel of een onderwijsvoorziening
      een school is als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref18], een door de
      inspectie van het onderwijs ter zake gegeven besluit. Indien het een besluit betreft als bedoeld in
      [artikel 11b, zevende lid, van de Wet op het onderwijstoezicht][ref19] en het college van burgemeester en
      wethouders van oordeel is dat een onderwijsvoorziening geen school is als bedoeld in de eerste volzin, zijn het
      vierde lid en [artikel 22, vierde lid][ref20], van overeenkomstige toepassing.

      3 Indien Onze Minister naar aanleiding van een melding als bedoeld in
      [artikel 14 van de Wet op het onderwijstoezicht][ref21] besluit dat een school niet langer voldoet aan de criteria
      die gelden voor een school als bedoeld in [artikel 1, onderdeel b, subonderdeel 3][ref22], dan volgt het college
      van burgemeester en wethouders van de gemeente waarin de school is gevestigd dit besluit en oordeelt het dat de
      school niet langer een school is als bedoeld in artikel 1, onderdeel b, subonderdeel 3.

      4 Indien het besluit, bedoeld in het derde lid daartoe aanleiding geeft, stelt het college van
      burgemeester en wethouders de ouders van de leerlingen van de onderwijsvoorziening binnen 7 dagen
      schriftelijk op de hoogte van het feit dat de onderwijsvoorziening niet langer een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref23], of verzekert het er zich van dat de onderwijsvoorziening de ouders
      daarvan schriftelijk op de hoogte heeft gesteld.


