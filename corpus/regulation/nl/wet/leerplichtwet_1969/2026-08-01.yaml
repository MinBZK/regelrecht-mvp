  - number: '6'
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde personen kunnen zich slechts beroepen op vrijstelling, indien zij
      aan het college van burgemeester en wethouders van de gemeente waar de jongere als ingezetene met een adres in de
      basisregistratie personen is ingeschreven, hebben kennis gegeven van:

      a. de gegevens van de jongere betreffende:

      1°. het persoonsgebonden nummer;

      2°. de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats; en

      3°. of eerder een beroep op vrijstelling van de leerplicht is gedaan.

      b. op welke grond zij een beroep op vrijstelling menen te mogen maken.

      2 Deze kennisgeving moet worden ingediend:

      a. ten minste een maand voordat de jongere leerplichtig wordt, indien zij betrekking heeft op de aanvang van de
      leerplicht, en

      b. zolang nadien aanspraak op vrijstelling wordt gemaakt, elk jaar opnieuw voor 1 juli.

      3 Het tweede lid onder b is niet van toepassing, indien uit de in [artikel 7][ref2] bedoelde verklaring blijkt, dat
      de jongere nooit geschikt zal zijn een school onderscheidenlijk een instelling te bezoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel7
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel6
