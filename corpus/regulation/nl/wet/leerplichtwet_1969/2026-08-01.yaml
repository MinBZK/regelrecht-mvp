        artikel: '15'
        paragraaf: '3'
  - number: '16'
    text: |-
      1 Het toezicht op de naleving van deze wet anders dan door de hoofden is opgedragen aan het college van
      burgemeester en wethouders. Het college van burgemeester en wethouders wijst daartoe een of meer ambtenaren aan.

      2 Alvorens hun ambt te aanvaarden, leggen deze ambtenaren in handen van de burgemeester de eed of de belofte af,
      waarvan het formulier bij ministeriële regeling wordt vastgesteld.

      3 Deze ambtenaren zijn bevoegd hun taak uit te oefenen ten aanzien van leerlingen, vavo-studenten of mbo-studenten
      die in Nederland woon- of verblijfplaats hebben.

      4 Het college van burgemeester en wethouders stelt een instructie vast voor deze ambtenaren, die ten minste bevat:

      a. de wijze waarop de ambtenaren aan de in de [artikelen 14, derde lid][ref1], [22][ref2] en [23][ref3] bedoelde
      taken uitvoering geven;

      b. de wijze waarop de gevallen van schoolverzuim die ter kennis van de gemeente worden gebracht, worden behandeld;

      c. de wijze waarop de ambtenaren bij de uitvoering van hun taken overleg plegen en samenwerken met hun ambtgenoten
      van de omliggende gemeenten;

      d. de aanwijzing van de diensten en instellingen waarmee de ambtenaren bij de uitvoering van hun taken dienen samen
      te werken;

      e. een meldcode waarin stapsgewijs wordt aangegeven hoe de ambtenaren bij de uitvoering van hun taken omgaan met
      signalen van huiselijk geweld of kindermishandeling en die er redelijkerwijs aan bijdraagt dat zo snel en adequaat
      mogelijk hulp kan worden geboden.

      5 De ambtenaren, bedoeld in het eerste lid, tweede volzin, zijn belast met de opsporing van de bij deze wet
      strafbaar gestelde feiten, onverminderd [artikel 141 van het Wetboek van Strafvordering][ref4].

      6 Onder huiselijk geweld wordt verstaan: huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref5].

      7 Onder kindermishandeling wordt verstaan: kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref6].

      8 Het college van burgemeester en wethouders bevordert de kennis en het gebruik van de meldcode onder deze
      ambtenaren.

      9 Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref5]: https://wetten.overheid.nl/BWBR0035362#Artikel1.1.1
      [ref6]: https://wetten.overheid.nl/BWBR0034925#Artikel1.1
