        artikel: '2'
        paragraaf: '2'
  - number: 1d
    text: >-
      1 Indien de kwaliteit van het niet uit 's Rijks kas bekostigde onderwijs ernstig of langdurig tekortschiet, kan
      Onze Minister op verzoek van het hoofd van een school of instelling of uit eigen beweging in overeenstemming met
      het hoofd maatregelen treffen.


      2 Tot de maatregelen, bedoeld in het eerste lid, behoort de mogelijkheid het hoofd van een school of instelling te
      laten bijstaan door een extern deskundige. Ook kunnen onder voorwaarden extra financiële middelen aan de school of
      instelling ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel1d
  - number: '2'
    text: >-
      1 Degene die het gezag over een jongere uitoefent, en degene die zich met de feitelijke verzorging van een jongere
      heeft belast, zijn verplicht overeenkomstig de bepalingen van deze wet te zorgen, dat de jongere als leerling
      van een school staat ingeschreven en deze school na inschrijving geregeld bezoekt. Bij de inschrijving wordt een
      van overheidswege verstrekt document overgelegd waarop de gegevens van de jongere betreffende zijn geslachtsnaam,
      voorletters, geboortedatum, geslacht en burgerservicenummer zijn vermeld. Bij gebrek aan een burgerservicenummer
      wordt zo mogelijk het onderwijsnummer van de jongere overgelegd. Indien de in de eerste volzin bedoelde personen
      bij de inschrijving aannemelijk hebben gemaakt dat zij geen burgerservicenummer of onderwijsnummer van de jongere
      kunnen overleggen, leggen zij het burgerservicenummer of onderwijsnummer van de jongere over aan de school zodra
      zij daarvan kennis hebben verkregen.


      2 De in het eerste lid bedoelde verplichtingen gelden niet voor zover de daarin bedoelde personen kunnen aantonen
      dat zij daarvoor niet verantwoordelijk kunnen worden geacht.


      3 De jongere die de leeftijd van 12 jaren heeft bereikt, is verplicht overeenkomstig de bepalingen van deze wet de
      school waaraan hij als leerling staat ingeschreven, geregeld te bezoeken, onverminderd het bepaalde in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel2
  - number: '3'
    text: >-
      1 De verplichting om te zorgen, dat een jongere als leerling van een school staat ingeschreven, begint op de eerste
      schooldag van de maand volgende op die waarin de jongere de leeftijd van vijf jaar bereikt, en eindigt:


      a. aan het einde van het schooljaar na afloop waarvan de jongere ten minste twaalf volledige schooljaren een of
      meer scholen heeft bezocht;


      b. aan het einde van het schooljaar waarin de jongere de leeftijd van zestien jaar heeft bereikt.


      2 Een jongere die een basisschool in minder dan acht schooljaren heeft doorlopen, wordt voor de toepassing van het
      eerste lid onder a geacht reeds acht schooljaren een school te hebben bezocht.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel3
  - number: 3a
    text: |-
      1 Indien het betreft een jongere die tenminste de leeftijd van 14 jaar heeft bereikt en waarvan naar het
      oordeel van het college van burgemeester en wethouders is komen vast te staan, dat hij niet geschikt is
      volledig dagonderwijs aan een school te volgen, kan het college van burgemeester en wethouders van de
      gemeente waar de jongere als ingezetene met een adres in de basisregistratie personen is ingeschreven, op
      aanvraag van de in [artikel 2, eerste lid][ref1], bedoelde personen, in overeenstemming met het bevoegd
      gezag van de school, toestaan dat gedurende een bepaald schooljaar, voor zover nodig, in afwijking van
      het bepaalde in de [artikelen 2.13 tot en met 2.15][ref2], [2.18][ref3], [2.31, vierde lid][ref4], en
      [2.38, zesde lid, van de Wet voortgezet onderwijs 2020][ref5] de jongere aan de school een programma volgt, dat
      naast algemeen vormend onderwijs en op het beroep gericht onderwijs tevens praktijktijd bevat, bestaande uit arbeid
      van lichte aard, te verrichten naast en in samenhang met het onderwijs.

      2 De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:

      a. een plan van aanpak dat voorziet in een begeleidingsprogramma ten behoeve van de jongere dat is opgesteld door
      de school en dat tenminste bevat een beschrijving van de onderwijsdoelen en van de praktijktijd; en

      b. gegevens van de jongere betreffende:

      1°. het persoonsgebonden nummer;

      2°. de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats; en

      3°. of eerder vervangende leerplicht is toegestaan.

      3 Alvorens het college van burgemeester en wethouders besluit op de aanvraag, bedoeld in het eerste lid, hoort het
      college van burgemeester en wethouders in elk geval:

      a. degene die de aanvraag heeft ingediend en de jongere zelf, en

      b. het hoofd van de school waar de jongere staat ingeschreven.

      4 Het college van burgemeester en wethouders besluit binnen zes weken na ontvangst van de aanvraag.

      5 Indien de jongere nog steeds niet geschikt is volledig dagonderwijs als bedoeld in het eerste lid aan een
      school te volgen, kunnen de in [artikel 2, eerste lid][ref6], bedoelde personen het college van burgemeester en
      wethouders ten minste acht weken voor het verstrijken van de periode waarvoor toestemming is verleend, aanvragen
      om de toestemming voor het daaropvolgend schooljaar te verlengen. De aanvraag gaat vergezeld van een verklaring
      van het hoofd van de school waar de jongere staat ingeschreven, waarin een overzicht is gegeven van de wijze waarop
      uitvoering is gegeven aan het programma en waaruit blijkt dat een terugkeer van de jongere naar het onderwijs,
      bedoeld in de [artikelen 2.12 tot en met 2.14][ref7] en [2.18 van de Wet voortgezet onderwijs 2020][ref8], te
      ontraden is, alsmede dat voortzetting van het programma bijdraagt aan de ontwikkeling van de jongere. Het tweede en
      derde lid zijn van toepassing.


