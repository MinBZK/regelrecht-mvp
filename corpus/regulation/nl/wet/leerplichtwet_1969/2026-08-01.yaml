  - number: '19'
    text: >-
      Het college van burgemeester en wethouders controleert, of de jongeren die als ingezetene in de basisregistratie
      personen zijn ingeschreven en nog leerplichtig of kwalificatieplichtig zijn, overeenkomstig de bepalingen van deze
      wet als leerling, vavo-student of mbo-student staan ingeschreven.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel19
  - number: 21a
    text: |-
      1 Indien een ingeschreven leerling van een school zonder geldige reden les- of praktijktijd heeft
      verzuimd en dit verzuim gedurende een periode van vier opeenvolgende lesweken in totaal zestien uren
      les- of praktijktijd bedraagt ontstaat voor het hoofd van de school de leveringsverplichting, bedoeld in
      [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref1].

      2 Indien een ingeschreven mbo-student of vavo-student van een instelling als bedoeld in
      [artikel 1, onderdeel c][ref2], zonder geldige reden gedurende een periode van vier opeenvolgende
      lesweken in totaal zestien uren van de lestijd heeft verzuimd ontstaat voor het hoofd van de instelling de
      leveringsverplichting, bedoeld in [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0042012#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0042012#Artikel12
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel21a
