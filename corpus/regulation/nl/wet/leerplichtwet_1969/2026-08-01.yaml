        paragraaf: '3'
  - number: '8'
    text: |-
      1 Een beroep op vrijstelling op grond van [artikel 5 onder b][ref1] kan slechts worden gedaan, indien de
      kennisgeving de verklaring bevat, dat tegen de richting van het onderwijs op alle binnen redelijke afstand
      van de woning - of, bij het ontbreken van een vaste verblijfplaats, op alle binnen Nederland - gelegen scholen
      onderscheidenlijk instellingen waarop de jongere geplaatst zou kunnen worden, overwegende bedenkingen bestaan.

      2 Deze verklaring is niet geldig, indien de jongere in het jaar, voorafgaande aan de dagtekening van de
      kennisgeving, geplaatst is geweest op een school onderscheidenlijk een instelling van de richting waartegen
      bedenkingen worden geuit.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel8
