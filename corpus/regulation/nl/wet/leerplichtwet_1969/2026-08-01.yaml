  - number: '27'
    text: |-
      Onze Minister kan een bestuurlijke boete van ten hoogste 1 000 euro per overtreding, met een maximum van 100 000
      euro per schooljaar, opleggen aan het hoofd dat:

      a. in strijd handelt met [artikel 13a, tweede lid][ref1], of [artikel 14, derde lid, eerste volzin][ref2],

      b. niet voldoet aan een der verplichtingen, opgelegd in [artikel 18][ref3] van deze wet en
      [artikel 12, derde lid, van de Wet register onderwijsdeelnemers][ref4] of

      c. bij de uitvoering van deze wet onjuiste of onvolledige inlichtingen verstrekt.


