  - number: 5a
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting om te zorgen, dat
      een jongere als leerling van een school staat ingeschreven, zolang zij een bij algemene maatregel van bestuur
      te omschrijven trekkend bestaan leiden waarbij de jongere hen vergezelt. De algemene maatregel van bestuur kan
      bijzondere regelen bevatten betreffende de vrijstelling in verband met:

      a. de leeftijd van de jongere waarop de verplichting ingaat om te zorgen dat een jongere als leerling van een
      school staat ingeschreven;

      b. de omstandigheden waarin de personen bedoeld in de eerste volzin, verkeren die van invloed zijn op de
      bereikbaarheid van een passende school voor de jongere.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel5a
