  - number: '11'
    text: |-
      De in [artikel 2, eerste lid][ref1], bedoelde personen zijn vrijgesteld van de verplichting te zorgen dat de
      jongere de school waarop hij staat ingeschreven, geregeld bezoekt, en de leerplichtige jongere die de leeftijd
      van 12 jaren heeft bereikt alsmede de jongere die kwalificatieplichtig is, zijn vrijgesteld van de verplichting de
      school of de instelling geregeld te bezoeken, indien

      a. de school onderscheidenlijk de instelling is gesloten of het onderwijs is geschorst;

      b. bij of op grond van algemeen verbindende voorschriften het bezoeken van de school onderscheidenlijk de
      instelling is verboden;

      c. de jongere bij wijze van tuchtmaatregel tijdelijk de toegang tot de school onderscheidenlijk de instelling is
      ontzegd;

      d. de jongere wegens ziekte verhinderd is de school onderscheidenlijk de instelling te bezoeken;

      e. de jongere wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging verhinderd is de
      school onderscheidenlijk de instelling te bezoeken;

      f. de jongere vanwege de specifieke aard van het beroep van één van de in [artikel 2, eerste lid][ref2], bedoelde
      personen slechts buiten de schoolvakanties met hen op vakantie kan gaan;

      g. de jongere door andere gewichtige omstandigheden verhinderd is de school onderscheidenlijk de instelling te
      bezoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: 11a
    text: |-
      1 De in [artikel 2, eerste lid][ref1], bedoelde personen zijn met betrekking tot de jongere die nog niet de
      leeftijd van zes jaar heeft bereikt, voor ten hoogste 5 uren per week vrijgesteld van de verplichting om te zorgen
      dat deze de school waarop hij staat ingeschreven, geregeld bezoekt. Van een beroep op deze vrijstelling wordt
      mededeling gedaan aan het hoofd.

      2 Naast de vrijstelling bedoeld in het eerste lid, kan het hoofd op aanvraag van de in
      [artikel 2, eerste lid][ref2], bedoelde personen ten behoeve van de jongere bedoeld in het eerste lid, tot ten
      hoogste 5 uren per week vrijstelling verlenen van de verplichting om te zorgen dat deze de school waarop hij staat
      ingeschreven, geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '12'
    text: >-
      Een beroep op vrijstelling wegens ziekte van de jongere kan slechts worden gedaan, indien daarvan binnen twee
      dagen na het ontstaan van de verhindering aan het hoofd kennis is gegeven, zo mogelijk met opgave van de aard van
      de ziekte.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel12
  - number: '13'
    text: >-
      Een beroep op vrijstelling wegens vervulling van plichten voortvloeiend uit godsdienst of levensovertuiging kan
      slechts worden gedaan indien daarvan uiterlijk twee dagen vóór de verhindering aan het hoofd kennis is gegeven.
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13
  - number: 13a
    text: |-
      1 Een beroep op vrijstelling wegens vakantie van de jongere, bedoeld in [artikel 11, onder f][ref1], kan slechts
      worden gedaan indien het hoofd op aanvraag van de in [artikel 2, eerste lid][ref2], bedoelde personen verlof heeft
      verleend dat de jongere voor de duur van het verlof de school onderscheidenlijk de instelling niet bezoekt.

      2 Verlof als bedoeld in het eerste lid kan door het hoofd slechts eenmaal voor ten hoogste tien dagen per
      schooljaar worden verleend en kan geen betrekking hebben op de eerste twee lesweken van het schooljaar. Het
      verlof, bedoeld in de eerste volzin, kan aan de jongere die kwalificatieplichtig is slechts worden verleend tot een
      evenredig deel van het aantal dagen dat hij op grond van [artikel 4c][ref3] verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13a
    machine_readable:
      # Wat het hoofd naast de aanvraag nodig heeft om te beslissen. Geen
      # parameters: die vormen de aanvraag (RFC-045).
      open_terms:
        # Lid 2: "de eerste twee lesweken van het schooljaar". Wanneer het
        # schooljaar van een school begint, zegt deze wet niet; dat staat in
        # het beleid van de school.
        # Bewust zonder delegated_to, expected_source of decided_per_case_by
        # (de enrich-check open-term meldt dat): de wet wijst niemand aan die
        # dit invult. Het eigen beleid van de school vult het in, hier het
        # fictieve beleid fictief_beleid_schooljaar_obs_de_klimop.
        - id: eerste_lesdag_schooljaar
          type: date
          required: true
          description: De eerste dag waarop de school in het schooljaar les geeft.
        # Lid 1 noemt de vakantie "bedoeld in artikel 11, onder f": de jongere
        # kan "vanwege de specifieke aard van het beroep" van een ouder
        # "slechts buiten de schoolvakanties met hen op vakantie". Dat zijn
        # twee gegevens: het beroep laat vakantie in de schoolvakanties niet
        # toe, en het gevraagde verlof valt buiten de schoolvakanties. Beide
        # oordeelt het hoofd per aanvraag: lid 1 noemt het geval "indien het
        # hoofd op aanvraag ... verlof heeft verleend".
        - id: specifieke_aard_beroep_ouder
          type: boolean
          required: true
          decided_per_case_by: het hoofd (artikel 13a, eerste lid)
          description: >-
            Of een van de in artikel 2, eerste lid, bedoelde personen een beroep
            heeft van zo specifieke aard dat de jongere niet binnen de
            schoolvakanties met hen op vakantie kan gaan (artikel 11, onder f).
        # Voor nu een oordeel van het hoofd bij het besluit; de school kent
        # haar vakanties. Het is geen veld van de aanvraag.
        - id: verlof_valt_buiten_schoolvakanties
          type: boolean
          required: true
          decided_per_case_by: het hoofd (artikel 13a, eerste lid)
          description: >-
            Of het gevraagde verlof buiten de schoolvakanties valt (artikel 11,
            onder f).
        # Lid 2: "kan door het hoofd slechts eenmaal ... per schooljaar worden
        # verleend". Of het hoofd de jongere dit schooljaar al verlof verleende,
        # weet het uit zijn eigen besluiten. Hoe het die terugleest, zegt deze
        # wet niet; dat staat in het beleid van de school.
        - id: verlof_al_verleend_in_schooljaar
          type: boolean
          required: true
          description: >-
            Of het hoofd de jongere in het schooljaar van het gevraagde verlof
            al verlof als bedoeld in het eerste lid verleende.
      execution:
        # Lid 1: het hoofd verleent verlof "op aanvraag". Dit artikel brengt
        # twee dingen voort (RFC-047). De aanvraag (RFC-045), waar de Awb op
        # haakt, met wat zij bevat en het besluit dat zij vraagt (Awb 4:2 lid
        # 1, onder c). En het verlenen of weigeren, een beschikking (Awb 1:3)
        # die de procedure van de Awb volgt, met de uitvoer die daarbij hoort.
        produces:
          - type: AANVRAAG
            requests: leerplichtwet_1969#13a
            parameters:
              - bsn_jongere
              - eerste_verlofdag
              - laatste_verlofdag
          - type: BESCHIKKING
            decision_type: TOEKENNING
            outputs:
              - verlofdagen
              - verlof_raakt_eerste_twee_lesweken
              - verlof_verleend
        parameters:
          # Alleen de inhoud van de aanvraag. Naam en adres van de aanvrager vraagt Awb 4:2
          # erbij. Wat het hoofd verder nodig heeft om te beslissen, staat bij de open
          # begrippen hierboven.
          - name: bsn_jongere
            type: string
            description: Burgerservicenummer van de jongere voor wie verlof wordt gevraagd.
          - name: eerste_verlofdag
            type: date
            description: Eerste dag waarop de jongere de school niet bezoekt.
          - name: laatste_verlofdag
            type: date
            description: Laatste dag waarop de jongere de school niet bezoekt.
        output:
          - name: verlofdagen
            type: number
            description: >-
              Het aantal dagen verlof (lid 2): de dagen van maandag tot en met
              vrijdag van de eerste tot en met de laatste verlofdag.
          - name: verlof_raakt_eerste_twee_lesweken
            type: boolean
            description: Of het verlof betrekking heeft op de eerste twee lesweken van het schooljaar (lid 2).
          - name: verlof_verleend
            type: boolean
            description: >-
              Of het hoofd het verlof verleent (lid 1). Lid 2 noemt alleen wanneer
              het niet kan; het evenredige deel voor een kwalificatieplichtige
              jongere is nog niet getoetst. Geweigerd wordt ook verlof waarvan
              de laatste verlofdag vóór de eerste ligt, en verlof dat geen dag
              van maandag tot en met vrijdag omvat: dan is er geen schoolbezoek
              om verlof voor te verlenen.
        actions:
          # Lid 2: "ten hoogste tien dagen". Verlof is verlof om de school niet
          # te bezoeken (lid 1), dus een dag telt als de jongere anders naar
          # school zou gaan. Eigen keuze: dat zijn maandag tot en met vrijdag.
          # Feestdagen en schoolvakanties binnen de periode tellen mee; het
          # rooster van de school is niet gemodelleerd.
          # Telling: hele weken tussen de maandag van de eerste en die van de
          # laatste verlofdag, maal vijf, plus de werkdagen in de laatste week
          # tot en met de laatste verlofdag, min die in de eerste week vóór de
          # eerste verlofdag.
          - output: verlofdagen
            value:
              operation: SUBTRACT
              values:
                - operation: ADD
                  values:
                    - operation: MULTIPLY
                      values:
                        - 5
                        - operation: FLOOR
                          precision: 0
                          value:
                            operation: DIVIDE
                            values:
                              - operation: SUBTRACT
                                values:
                                  - operation: ADD
                                    values:
                                      - operation: DATE_DIFF
                                        from: $eerste_verlofdag
                                        to: $laatste_verlofdag
                                        in: days
                                      - operation: DAY_OF_WEEK
                                        date: $eerste_verlofdag
                                  - operation: DAY_OF_WEEK
                                    date: $laatste_verlofdag
                              - 7
                    - operation: MIN
                      values:
                        - operation: ADD
                          values:
                            - operation: DAY_OF_WEEK
                              date: $laatste_verlofdag
                            - 1
                        - 5
                - operation: MIN
                  values:
                    - operation: DAY_OF_WEEK
                      date: $eerste_verlofdag
                    - 5
          # Lid 2: "geen betrekking hebben op de eerste twee lesweken". Eigen
          # keuze: een lesweek loopt van maandag tot en met zondag, en de
          # eerste is de week van de eerste lesdag. Het verlof raakt ze als
          # het begint vóór het einde van de tweede lesweek en eindigt op of
          # na de eerste lesdag.
          - output: verlof_raakt_eerste_twee_lesweken
            value:
              operation: AND
              conditions:
                - operation: GREATER_THAN_OR_EQUAL
                  subject:
                    operation: DATE_DIFF
                    from: $eerste_verlofdag
                    to:
                      operation: DATE_ADD
                      date: $eerste_lesdag_schooljaar
                      days:
                        operation: SUBTRACT
                        values:
                          - 13
                          - operation: DAY_OF_WEEK
                            date: $eerste_lesdag_schooljaar
                    in: days
                  value: 0
                - operation: GREATER_THAN_OR_EQUAL
                  subject:
                    operation: DATE_DIFF
                    from: $eerste_lesdag_schooljaar
                    to: $laatste_verlofdag
                    in: days
                  value: 0
          # Lid 1 met artikel 11, onder f (beide gegevens), en lid 2. Het evenredige deel voor
          # een kwalificatieplichtige jongere (lid 2, tweede volzin) is nog
          # niet gemodelleerd.
          # Eigen keuze: verlof is verlof om de school niet te bezoeken (lid 1),
          # dus een aanvraag met de laatste verlofdag vóór de eerste, of zonder
          # één dag van maandag tot en met vrijdag (alleen een weekend), wordt
          # geweigerd.
          - output: verlof_verleend
            value:
              operation: AND
              conditions:
                - $specifieke_aard_beroep_ouder
                - $verlof_valt_buiten_schoolvakanties
                - operation: GREATER_THAN_OR_EQUAL
                  subject:
                    operation: DATE_DIFF
                    from: $eerste_verlofdag
                    to: $laatste_verlofdag
                    in: days
                  value: 0
                - operation: GREATER_THAN_OR_EQUAL
                  subject: $verlofdagen
                  value: 1
                - operation: LESS_THAN_OR_EQUAL
                  subject: $verlofdagen
                  value: 10
                - operation: NOT
                  value: $verlof_raakt_eerste_twee_lesweken
                # Lid 2: "slechts eenmaal ... per schooljaar".
                - operation: NOT
                  value: $verlof_al_verleend_in_schooljaar
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 4c
        paragraaf: 2a
  - number: 13b
    text: |-
      Een beroep op vrijstelling wegens ziekte van de jongere, wegens vervulling van plichten voortvloeiend
      uit godsdienst of levensovertuiging wordt gedaan door middel van kennisgeving aan het hoofd door de
      in [artikel 2, eerste lid][ref1], bedoelde personen, tenzij de leerplichtige jongere of de jongere die
      kwalificatieplichtig is niet meer woonachtig is bij deze personen, in welk geval de kennisgeving wordt gedaan door
      de jongere zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel13b
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
  - number: '14'
    text: |-
      1 Een beroep op vrijstelling wegens andere gewichtige omstandigheden bedoeld in [artikel 11 onder g][ref1] kan
      slechts worden gedaan, indien het hoofd op aanvraag van de in [artikel 2, eerste lid][ref2], bedoelde personen
      verlof heeft verleend, dat de jongere de school onderscheidenlijk de instelling tijdelijk niet bezoekt.

      2 Indien geen verlof is gevraagd, kan het hoofd alsnog verlof verlenen, indien hem binnen twee dagen na het
      ontstaan van de verhindering de redenen daarvan worden medegedeeld.

      3 Het hoofd kan ten aanzien van dezelfde jongere wegens de in het eerste lid bedoelde omstandigheden voor
      ten hoogste tien dagen per schooljaar verlof als bedoeld in dat lid verlenen. Indien het verlof ten aanzien
      van dezelfde jongere wordt gevraagd voor meer dan tien dagen per schooljaar, besluit de ambtenaar van de
      woongemeente van de jongere, het hoofd gehoord. Het verlof, bedoeld in de eerste volzin, kan aan de jongere die
      kwalificatieplichtig is slechts worden verleend tot een evenredig deel van het aantal dagen dat hij op grond van
      [artikel 4c][ref3] verplicht is onderwijs te volgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel4c
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '11'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002628
        artikel: 4c
        paragraaf: 2a
  - number: '15'
    text: |-
      1 In andere gevallen dan genoemd in [artikel 5][ref1] kan het college van burgemeester en wethouders op grond van
      bijzondere omstandigheden vrijstelling verlenen van de in [artikel 4a][ref2] opgelegde verplichtingen, indien wordt
      aangetoond, dat de jongere op andere wijze voldoende onderwijs geniet.

      2 De vrijstelling, bedoeld in het eerste lid, kan alleen worden verleend indien de volgende gegevens van de jongere
      worden overlegd:

      a. de naam, de geboortedatum, het geslacht, het adres en de woonplaats, de postcode van de woonplaats;

      b. begin- en einddatum van de vrijstelling van de leerplicht; en

      c. of eerder een beroep is gedaan op vrijstelling van de leerplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel4a
    url: https://wetten.overheid.nl/BWBR0002628/2026-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002628
        artikel: 4a
        paragraaf: 2a
  - number: 15a
    text: |-
      Indien Onze Minister uit het register onderwijsdeelnemers is gebleken dat een jongere die op grond van
      [artikel 5][ref1], [5a][ref2] of [15][ref3] is vrijgesteld van de leerplicht, staat ingeschreven bij een school
      of instelling, meldt Onze Minister aan het hoofd van de betreffende school of instelling dat de jongere is
      vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002628#Artikel5a
      [ref3]: https://wetten.overheid.nl/BWBR0002628#Artikel15
