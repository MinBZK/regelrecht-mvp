  - number: '10'
    text: |-
      Op aanvraag van de in [artikel 2, eerste lid][ref1], bedoelde personen wordt een jongere binnen de in
      [artikel 3, eerste lid][ref2], en [artikel 4b][ref3] omschreven tijdvakken door het hoofd slechts van de lijst der
      leerlingen, vavo-studenten of mbo-studenten uitgeschreven:

      a. wegens inschrijving van de jongere op een andere school of instelling;

      b. wegens vrijstelling op een der gronden, genoemd in [artikel 5][ref4], nadat aan het hoofd gebleken is, dat aan
      de [artikelen 6 tot en met 9][ref5] is voldaan;

      c. wegens de vrijstelling, bedoeld in [artikel 5a][ref6] of [artikel 15][ref7].


