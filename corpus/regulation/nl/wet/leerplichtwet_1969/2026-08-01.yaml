        artikel: '5'
        paragraaf: '3'
  - number: '9'
    text: |-
      Een beroep op vrijstelling op grond van [artikel 5 onder c][ref1] kan slechts worden gedaan, indien bij de
      kennisgeving een verklaring is overgelegd van het hoofd van de inrichting van onderwijs waaruit blijkt, dat de
      jongere als leerling van deze inrichting staat ingeschreven en haar geregeld bezoekt.


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel5
