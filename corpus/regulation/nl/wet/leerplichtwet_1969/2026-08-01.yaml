  - number: '22'
    text: |-
      1 Indien blijkt, dat een leerplichtige of kwalificatieplichtige jongere niet als leerling, vavo-student of mbo-
      student staat ingeschreven, zonder dat een grond voor vrijstelling aanwezig is, of indien bericht van een
      kennisgeving is ontvangen als bedoeld in [artikel 21a, vierde lid][ref1], stelt de ambtenaar vanwege het college
      van burgemeester en wethouders een onderzoek in. Hij hoort de in [artikel 2, eerste lid][ref2], bedoelde personen
      en tracht hen ertoe te bewegen hun verplichtingen na te komen.

      2 Blijkt aan de ambtenaar dat de in [artikel 2, eerste lid][ref3], bedoelde personen weigeren de jongere als
      leerling van een school onderscheidenlijk als mbo-student of vavo-student bij een instelling te laten inschrijven,
      zonder dat zij op grond van [artikel 5][ref4], [5a][ref5] of [15][ref6] van deze verplichting zijn vrijgesteld, of
      dat zij niet zorgen, dat de leerplichtige jongere de school of de jongere die kwalificatieplichtig is de school of
      instelling geregeld bezoekt, zonder dat zij op grond van [artikel 11][ref7] van deze verplichting zijn vrijgesteld,
      dan zendt hij proces-verbaal van zijn bevindingen aan de officier van justitie.

      3 Blijkt aan de ambtenaar, dat de leerplichtige jongere die de leeftijd van 12 jaren heeft bereikt of de jongere
      die kwalificatieplichtig is het onderwijs aan de school of aan de instelling niet geregeld volgt zonder dat de
      jongere op grond van [artikel 11][ref8] van deze verplichting is vrijgesteld, dan hoort hij de jongere en tracht
      hem ertoe te bewegen zijn verplichtingen na te komen. Indien blijkt dat de leerplichtige jongere die de leeftijd
      van 12 jaren heeft bereikt, of de jongere die kwalificatieplichtig is, weigert deze verplichtingen na te komen,
      zendt de ambtenaar proces-verbaal van zijn bevindingen aan de officier van justitie.

      4 Indien een onderwijsvoorziening niet langer een school is als bedoeld in
      [artikel 1, onderdeel b, subonderdeel 3][ref9], onderzoekt de ambtenaar binnen vier weken nadat de ouders hiervan
      op de hoogte zijn gesteld, of de in [artikel 2, eerste lid][ref10], bedoelde personen de jongere bij een school
      hebben ingeschreven dan wel of een grond voor vrijstelling aanwezig is. Indien geen sprake is van een inschrijving
      bij een school dan wel een vrijstelling als bedoeld in [artikel 5][ref11], [5a][ref12] of [15][ref13], wijst hij
      onverwijld de in [artikel 2, eerste lid][ref14], bedoelde personen op de verplichting, bedoeld in dat artikel.
      Indien de jongere niet binnen vier weken nadat de ambtenaar de in de vorige volzin bedoelde personen op hun
      verplichting heeft gewezen op een school staat ingeschreven en geen sprake is van een vrijstelling als bedoeld
      in [artikel 5][ref15], [5a][ref16] of [15][ref17], zendt de ambtenaar proces-verbaal van zijn bevindingen aan de
      officier van justitie.

      5 Indien de in [artikel 2, eerste lid][ref18], bedoelde personen reeds eerder zijn veroordeeld wegens het niet
      nakomen van de verplichtingen, opgelegd in [artikel 2, eerste lid][ref19], of [artikel 4a][ref20], zendt de
      ambtenaar een afschrift van het proces-verbaal aan de raad voor de kinderbescherming.


