  - number: '7'
    text: |-
      1 Het bevoegd gezag van een school voor basisonderwijs en een school voor speciaal onderwijs kan de periode van
      de zomervakantie of van de grote vakantie, bedoeld in [artikel 6][ref1], verlengen met ten hoogste twee dagen
      voorafgaand aan die periode en met ten hoogste twee dagen na die periode.

      2 Indien meer dan de helft van de leerlingen van de school in een andere regio woont dan de regio waar de school
      gevestigd is, kan het bevoegd gezag, in afwijking van [artikel 2][ref2], beslissen dat de vestiging van de school
      voor het vaststellen van de zomervakantie behoort tot de regio waarin het merendeel van de leerlingen woont.
      Voor de vaststelling van het aantal leerlingen wordt uitgegaan van het aantal leerlingen dat in het voorafgaande
      schooljaar op 1 oktober bij de vestiging stond ingeschreven.

      3 In afwijking van [artikel 2][ref3] kan het bevoegd gezag van een school voor basisonderwijs, een school voor
      speciaal onderwijs, een school voor voortgezet speciaal onderwijs, een school voor speciaal en voortgezet speciaal
      onderwijs of een instelling voor speciaal en voortgezet speciaal onderwijs, indien gedurende drie achtereenvolgende
      schooljaren telkens meer dan zeventig procent van de leerlingen is doorgestroomd naar scholen voor voortgezet
      onderwijs in een andere regio dan die van de school, met ingang van het daaropvolgend schooljaar de zomervakantie
      vaststellen als in [artikel 6][ref4] is bepaald voor die andere regio.

      4 In afwijking van [artikel 2][ref5] kan het bevoegd gezag van een school voor voortgezet onderwijs met een
      tijdelijke nevenvestiging of nevenvestiging in een andere regio dan die van de hoofdvestiging, voor deze school de
      periode van de zomervakantie, bedoeld in [artikel 6][ref6], zodanig vaststellen dat die periode niet eerder begint
      dan de vroegste periode en niet later eindigt dan de laatste periode van een van de vestigingen.

      5 Het bevoegd gezag van een school voor cluster 3 en 4 onderwijs, als bedoeld in
      [artikel 2, vierde lid, van de Wet op de expertisecentra][ref7], kan de perioden van de zomervakantie en van de
      grote vakantie, bedoeld in [artikel 6][ref8], bekorten.

      6 In afwijking van [artikel 6][ref9] hebben in de gemeenten Vlieland, Terschelling, Ameland en Schiermonnikoog de
      zomervakanties op de scholen voor basisonderwijs en de scholen voor voortgezet onderwijs een duur van vijf weken.
      Deze gemeenten volgen de startdatum van de vakanties van regio Noord.


