articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      - *de Minister:* de Minister voor Primair en Voortgezet Onderwijs;
      - *school:* – een basisschool of een speciale school voor basisonderwijs als bedoeld in
      [artikel 1 Wet op het primair onderwijs][ref1]; – een school waar basisonderwijs wordt gegeven als
      bedoeld in [artikel 1 Wet primair onderwijs BES][ref2]; – een school voor speciaal onderwijs, een
      school voor voortgezet speciaal onderwijs of een school voor speciaal en voortgezet speciaal onderwijs
      als bedoeld [artikel 2, tweede lid, onder f, h, j, k, m of n, van de Wet op de expertisecentra][ref3],
      tenzij uit die [wet][ref4] het tegendeel blijkt; – een instelling voor speciaal en voortgezet speciaal
      onderwijs aan visueel gehandicapte kinderen of auditief of communicatief gehandicapte kinderen, als
      bedoeld in [artikel 8, eerste lid, tweede of derde volzin, van de Wet op de expertisecentra][ref5],
      tenzij uit die [wet][ref6] het tegendeel blijkt; – een school voor voortgezet onderwijs als
      bedoeld in [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref7] met uitzondering van een school
      voor voortgezet onderwijs die deel uitmaakt van een verticale scholengemeenschap als bedoeld in
      [artikel 2.6.1 van de Wet educatie en beroepsonderwijs][ref8];

      - *regio:* een regio als bedoeld in [artikel 3][ref9].


