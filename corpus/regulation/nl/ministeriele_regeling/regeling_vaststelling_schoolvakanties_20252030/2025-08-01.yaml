    url: https://wetten.overheid.nl/BWBR0049811/2025-08-01#Artikel5
    machine_readable:
      # De kerst- en meivakantie per schooljaar, voor elke school buiten
      # Caribisch Nederland. Buiten de schooljaren van de tabel, en in
      # Caribisch Nederland, stelt dit artikel geen periode vast (null).
      # "t/m" is tot en met: de laatste dag hoort bij de vakantie.
      execution:
        parameters:
          - name: eerste_jaar_schooljaar
            type: number
            description: >-
              Het jaar waarin het schooljaar begint: 2025 voor het schooljaar
              2025–2026.
          - name: regio
            type: string
            nullable: true
            description: De regio van artikel 3 waartoe de school behoort.
        output:
          - name: kerstvakantie_eerste_dag
            type: date
            nullable: true
            description: De eerste dag van de kerstvakantie.
          - name: kerstvakantie_laatste_dag
            type: date
            nullable: true
            description: De laatste dag van de kerstvakantie.
          - name: meivakantie_eerste_dag
            type: date
            nullable: true
            description: De eerste dag van de meivakantie.
          - name: meivakantie_laatste_dag
            type: date
            nullable: true
            description: De laatste dag van de meivakantie.
        actions:
          - output: kerstvakantie_eerste_dag
            value:
              operation: IF
              cases:
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $eerste_jaar_schooljaar
                        value: 2025
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $regio
                          value: Caribisch Nederland
                  then: '2025-12-20'
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $eerste_jaar_schooljaar
                        value: 2026
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $regio
                          value: Caribisch Nederland
                  then: '2026-12-19'
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $eerste_jaar_schooljaar
                        value: 2027
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $regio
                          value: Caribisch Nederland
                  then: '2027-12-25'
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $eerste_jaar_schooljaar
                        value: 2028
                      - operation: NOT
                        value:
                          operation: EQUALS
                          subject: $regio
                          value: Caribisch Nederland
                  then: '2028-12-23'
                - when:
                    operation: AND
                    conditions:
                      - operation: EQUALS
                        subject: $eerste_jaar_schooljaar
                        value: 2029
