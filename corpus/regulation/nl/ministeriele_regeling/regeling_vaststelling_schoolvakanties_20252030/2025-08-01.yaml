  - number: '2'
    text: |-
      Voor de vaststelling van de perioden van de zomervakantie of van de grote vakantie, bedoeld in [artikel 6][ref1],
      behoort een school tot één van de regio's. De plaats van vestiging is bepalend voor de regio waartoe een school
      behoort. Indien een school vestigingen heeft in meer dan één regio, behoort elke vestiging tot de regio waarin ze
      is gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0049811#Artikel6
    url: https://wetten.overheid.nl/BWBR0049811/2025-08-01#Artikel2
    machine_readable:
      # "De plaats van vestiging is bepalend voor de regio waartoe een school
      # behoort." Waar de school gevestigd is, zegt deze regeling niet; dat
      # is een feit over de school. Artikel 3 deelt de regio's in naar
      # provincie en gemeente, en voor vier gemeenten naar een voormalige
      # gemeente of kern daarbinnen. Daarom drie open begrippen. De regeling
      # wijst niemand aan die ze invult (de enrich-check open-term meldt dat,
      # zoals bij artikel 13a van de Leerplichtwet 1969): in de cel van de
      # school vult haar reductie ze uit wat zij over haar vestiging vastlegde
      # (RFC-051).
      # Niet gemodelleerd: een school met vestigingen in meer dan één regio
      # (derde volzin). De begrippen gaan over één vestiging.
      open_terms:
        - id: gemeente_van_vestiging
          type: string
          required: false
          description: >-
            De gemeente waarin de vestiging van de school ligt, of het
            openbaar lichaam in Caribisch Nederland (Bonaire, Sint-Eustatius,
            Saba).
        - id: provincie_van_vestiging
          type: string
          required: false
          description: >-
            De provincie waarin de vestiging van de school ligt. Afwezig voor
            een vestiging in Caribisch Nederland, dat niet in een provincie
            ligt.
        - id: deel_van_gemeente_van_vestiging
          type: string
          required: false
          description: >-
            De voormalige gemeente of de kern waarin de vestiging ligt, waar
            artikel 3 een gemeente zo verdeelt (Abcoude, Didam, Dodewaard,
            Aalburg, Hank, Dussen). Afwezig waar artikel 3 dat niet doet.
      execution:
        input:
          - name: regio_van_plaats_van_vestiging
            type: string
            nullable: true
            # Een verwijzing binnen dezelfde regeling geeft de parameters van
            # dit artikel door, niet de open begrippen; daarom naar de
            # regeling bij naam, met de parameters van artikel 3.
            source:
              regulation: regeling_vaststelling_schoolvakanties_20252030
              output: regio
              parameters:
                gemeente: $gemeente_van_vestiging
                provincie: $provincie_van_vestiging
                deel_van_gemeente: $deel_van_gemeente_van_vestiging
            description: De regio van artikel 3 waarin de plaats van vestiging ligt.
        output:
          - name: regio_van_school
            type: string
            nullable: true
            description: >-
              De regio waartoe de school behoort voor de perioden van de
              zomervakantie van artikel 6. Afwezig als artikel 3 de plaats van
              vestiging in geen regio noemt.
        actions:
          # Zonder plaats van vestiging is er geen regio (null): de regeling
          # zegt niet waar de school is, en wie haar zomervakantie vraagt,
          # krijgt er geen. Eigen keuze: de begrippen zijn daarom niet
          # verplicht; artikel 3 krijgt alleen een gemeente.
          - output: regio_van_school
            value:
              operation: IF
              cases:
                - when:
                    operation: EQUALS
                    subject: $gemeente_van_vestiging
                    value: null
                  then: null
              default: $regio_van_plaats_van_vestiging
            legal_basis:
              law: Regeling vaststelling schoolvakanties 2025–2030
              article: '2'
              explanation: >-
                "De plaats van vestiging is bepalend voor de regio waartoe een
                school behoort."
    references:
      - id: ref1
        bwb_id: BWBR0049811
        artikel: '6'
  - number: '3'
    text: >-
      De regio's zijn:


      a. Regio Noord, bestaande uit:


      1°. De provincie Groningen;


      2°. De provincie Friesland;


      3°. De provincie Drenthe;


      4°. De provincie Overijssel;


      5°. De provincie Flevoland, met uitzondering van de gemeente Zeewolde;


      6°. De provincie Noord-Holland;


      7°. Wat betreft de provincie Gelderland, de gemeente Hattem;


      8°. Wat betreft de provincie Utrecht, de gemeente Eemnes en de voormalige gemeente Abcoude;


      b. Regio Midden, bestaande uit:


      1°. De provincie Utrecht, met uitzondering van de gemeente Eemnes en de voormalige gemeente Abcoude;


      2°. De provincie Zuid-Holland;


      3°. Wat betreft de provincie Flevoland, de gemeente Zeewolde;


      4°. Wat betreft de provincie Gelderland, de gemeenten Aalten, Apeldoorn, Barneveld, Berkelland, Bronckhorst,
      Brummen, Buren, Culemborg, Doetinchem, Ede, Elburg, Epe, Ermelo, Geldermalsen, Harderwijk, Heerde, Lingewaal,
      Lochem, Montferland, met uitzondering van de voormalige gemeenten Didam, Neder-Betuwe, met uitzondering van de
      voormalige gemeenten Dodewaard, Neerijnen, Nijkerk, Nunspeet, Oldebroek, Oost-Gelre, Oude IJsselstreek, Putten,
      Scherpenzeel, Tiel, Voorst, Wageningen, Winterswijk en Zutphen;


      5°. Wat betreft de provincie Noord-Brabant, de gemeente Altena, met uitzondering van de voormalige gemeente Aalburg
      en de kernen Hank en Dussen;


      c. Regio Zuid, bestaande uit:


      1°. De provincie Limburg;


      2°. De provincie Noord-Brabant, met uitzondering van de gemeente Altena, voor zover het betreft de voormalige
      gemeente Aalburg en de kernen Hank en Dussen;


      3°. De provincie Zeeland;


      4°. Wat betreft de provincie Gelderland, de gemeenten Arnhem, Berg en Dal, Beuningen, Doesburg, Druten, Duiven,
      Heumen, Neder-Betuwe, voor zover het betreft de voormalige gemeenten Dodewaard, Lingewaard, Maasdriel, Montferland,
      voor zover het betreft de voormalige gemeente Didam, Nijmegen, Overbetuwe, Renkum, Rheden, Rijnwaarden, Rozendaal,
      Westervoort, West Maas en Waal, Wijchen, Zaltbommel en Zevenaar;


      d. Regio Caribisch Nederland, bestaande uit de openbare lichamen:


      1°. Bonaire


      2°. Sint-Eustatius


      3°. Saba.
    url: https://wetten.overheid.nl/BWBR0049811/2025-08-01#Artikel3
    machine_readable:
      # De indeling in regio's naar provincie en gemeente. Een gemeente of
      # provincie heet hier zoals de regeling haar noemt ("Friesland",
      # "Sint-Eustatius"). Waar de regeling een gemeente verdeelt naar een
      # voormalige gemeente of een kern, beslist het deel van de gemeente.
      # Eigen keuze: de openbare lichamen van onderdeel d staan in de
      # parameter gemeente, zonder provincie.
      # De voormalige gemeente Abcoude (a, 8°, en b, 1°) ligt nu in De Ronde
      # Venen. De regeling noemt die gemeente niet, dus het model kijkt
      # alleen naar het deel van de gemeente binnen Utrecht.
      # Wettekst-gevolg: de regeling noemt in onderdeel b, 4°, ook
      # Geldermalsen, Lingewaal en Neerijnen, die op 1 januari 2019 opgingen in
      # West Betuwe, en in onderdeel c, 4°, Rijnwaarden, dat in 2018 opging in
      # Zevenaar. West Betuwe noemt zij niet; artikel 4 gaat alleen over
      # samenvoegingen na de publicatie. Een vestiging in West Betuwe ligt zo
      # in geen regio: dan is er geen regio (null), en wie de zomervakantie
      # van zo'n school vraagt, krijgt er geen.
      # Onderdeel c, 2°: "met uitzondering van de gemeente Altena, voor zover
      # het betreft de voormalige gemeente Aalburg en de kernen Hank en
      # Dussen". Gelezen samen met onderdeel b, 5°: de rest van Altena hoort
      # bij Midden, Aalburg, Hank en Dussen bij Zuid.
      # De gevallen staan in volgorde: Noord vóór Midden, zodat Utrecht
      # zonder Eemnes en Abcoude (b, 1°) Midden is; Midden vóór Zuid, zodat
      # Noord-Brabant zonder het deel van Altena onder b, 5° (c, 2°) Zuid is.
      execution:
        parameters:
          - name: gemeente
            type: string
            description: De gemeente, of het openbaar lichaam in Caribisch Nederland.
          - name: provincie
            type: string
            nullable: true
            description: De provincie waarin de gemeente ligt; afwezig in Caribisch Nederland.
          - name: deel_van_gemeente
            type: string
            nullable: true
            description: >-
              De voormalige gemeente of de kern binnen de gemeente, waar dit
              artikel een gemeente zo verdeelt.
        output:
          - name: regio
            type: string
            nullable: true
            description: >-
              De regio: Noord, Midden, Zuid of Caribisch Nederland. Afwezig
              als dit artikel de plaats in geen regio noemt.
        actions:
          - output: regio
            value:
              operation: IF
              cases:
                # d. Regio Caribisch Nederland.
                - when:
                    operation: IN
                    subject: $gemeente
                    values:
                      - Bonaire
                      - Sint-Eustatius
                      - Saba
                  then: Caribisch Nederland
                # a. Regio Noord.
                - when:
                    operation: OR
                    conditions:
                      - operation: IN
                        subject: $provincie
                        values:
                          - Groningen
                          - Friesland
                          - Drenthe
                          - Overijssel
                          - Noord-Holland
                      - operation: AND
                        conditions:
                          - operation: EQUALS
                            subject: $provincie
                            value: Flevoland
                          - operation: NOT
                            value:
                              operation: EQUALS
                              subject: $gemeente
                              value: Zeewolde
                      - operation: AND
                        conditions:
                          - operation: EQUALS
                            subject: $provincie
                            value: Gelderland
                          - operation: EQUALS
                            subject: $gemeente
                            value: Hattem
                      - operation: AND
                        conditions:
                          - operation: EQUALS
                            subject: $provincie
                            value: Utrecht
                          - operation: OR
                            conditions:
                              - operation: EQUALS
                                subject: $gemeente
                                value: Eemnes
                              - operation: EQUALS
                                subject: $deel_van_gemeente
                                value: Abcoude
                  then: Noord
                # b. Regio Midden.
                - when:
                    operation: OR
                    conditions:
                      - operation: EQUALS
                        subject: $provincie
                        value: Utrecht
                      - operation: EQUALS
                        subject: $provincie
                        value: Zuid-Holland
                      - operation: AND
                        conditions:
                          - operation: EQUALS
                            subject: $provincie
                            value: Flevoland
                          - operation: EQUALS
                            subject: $gemeente
                            value: Zeewolde
                      - operation: AND
                        conditions:
                          - operation: EQUALS
                            subject: $provincie
                            value: Gelderland
                          - operation: OR
                            conditions:
                              - operation: IN
                                subject: $gemeente
                                values:
                                  - Aalten
                                  - Apeldoorn
                                  - Barneveld
                                  - Berkelland
                                  - Bronckhorst
                                  - Brummen
                                  - Buren
                                  - Culemborg
                                  - Doetinchem
                                  - Ede
                                  - Elburg
                                  - Epe
                                  - Ermelo
                                  - Geldermalsen
                                  - Harderwijk
                                  - Heerde
                                  - Lingewaal
                                  - Lochem
                                  - Neerijnen
                                  - Nijkerk
                                  - Nunspeet
                                  - Oldebroek
                                  - Oost-Gelre
                                  - Oude IJsselstreek
                                  - Putten
                                  - Scherpenzeel
                                  - Tiel
                                  - Voorst
                                  - Wageningen
                                  - Winterswijk
                                  - Zutphen
                              - operation: AND
                                conditions:
                                  - operation: EQUALS
                                    subject: $gemeente
                                    value: Montferland
                                  - operation: NOT
                                    value:
                                      operation: EQUALS
                                      subject: $deel_van_gemeente
                                      value: Didam
                              - operation: AND
                                conditions:
                                  - operation: EQUALS
                                    subject: $gemeente
                                    value: Neder-Betuwe
                                  - operation: NOT
                                    value:
                                      operation: EQUALS
                                      subject: $deel_van_gemeente
                                      value: Dodewaard
                      - operation: AND
                        conditions:
                          - operation: EQUALS
                            subject: $provincie
                            value: Noord-Brabant
                          - operation: EQUALS
                            subject: $gemeente
                            value: Altena
                          - operation: NOT
                            value:
                              operation: IN
                              subject: $deel_van_gemeente
                              values:
                                - Aalburg
                                - Hank
                                - Dussen
                  then: Midden
                # c. Regio Zuid.
                - when:
                    operation: OR
                    conditions:
                      - operation: EQUALS
                        subject: $provincie
                        value: Limburg
                      - operation: EQUALS
                        subject: $provincie
                        value: Noord-Brabant
                      - operation: EQUALS
                        subject: $provincie
                        value: Zeeland
                      - operation: AND
                        conditions:
                          - operation: EQUALS
                            subject: $provincie
                            value: Gelderland
                          - operation: OR
                            conditions:
                              - operation: IN
                                subject: $gemeente
                                values:
                                  - Arnhem
                                  - Berg en Dal
                                  - Beuningen
                                  - Doesburg
                                  - Druten
                                  - Duiven
                                  - Heumen
                                  - Lingewaard
                                  - Maasdriel
                                  - Nijmegen
                                  - Overbetuwe
                                  - Renkum
                                  - Rheden
                                  - Rijnwaarden
                                  - Rozendaal
                                  - Westervoort
                                  - West Maas en Waal
                                  - Wijchen
                                  - Zaltbommel
                                  - Zevenaar
                              - operation: AND
                                conditions:
                                  - operation: EQUALS
                                    subject: $gemeente
                                    value: Neder-Betuwe
                                  - operation: EQUALS
                                    subject: $deel_van_gemeente
                                    value: Dodewaard
                              - operation: AND
                                conditions:
                                  - operation: EQUALS
                                    subject: $gemeente
                                    value: Montferland
                                  - operation: EQUALS
                                    subject: $deel_van_gemeente
                                    value: Didam
                  then: Zuid
  - number: '4'
    text: >-
      Bij samenvoeging van gemeenten na publicatie van deze regeling behoort de nieuw te vormen gemeente tot dezelfde
      regio als die waartoe de samengevoegde gemeenten behoorden. Als de samen te voegen gemeenten tot verschillende
      regio’s behoorden, beslist de Minister tot welke regio de nieuwe gemeente gaat behoren. Voordat de Minister
      definitief beslist, wordt het college van burgemeester en wethouders van de nieuwe gemeente gehoord.
    url: https://wetten.overheid.nl/BWBR0049811/2025-08-01#Artikel4
  - number: '5'
    text: |-
      De perioden voor de kerst- en meivakanties worden voor de jaren 2025 tot en met 2030 voor alle scholen als volgt
      vastgesteld, met uitzondering van de scholen in de regio Caribisch Nederland.


