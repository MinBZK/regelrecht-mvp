  - number: '3'
    text: |-
      1 Ingeval de gehandicaptenparkeerkaart wordt afgegeven door het gemeentelijk gezag, bedoeld in
      [artikel 49 van het BABW][ref1], wordt het geneeskundig onderzoek verricht door de Gemeentelijke Gezondheidsdienst
      dan wel - bij externe advisering - door een vanwege het gemeentelijk gezag aangewezen deskundige.

      2 Ingeval de gehandicaptenparkeerkaart wordt afgegeven door de Minister van Verkeer en Waterstaat, wordt het
      onderzoek verricht door een door de Minister van Verkeer en Waterstaat aan te wijzen arts, die niet de behandelend
      arts van de aanvrager is.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel49
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004826
        artikel: '49'
  - number: '4'
    text: >-
      1 De gehandicaptenparkeerkaart moet op zodanige wijze bij de voorruit worden aangebracht, dat de voorzijde ervan
      buiten het voertuig behoorlijk leesbaar is.


      2 Als voorzijde geldt de zijde waarop de vervaldatum van de gehandicaptenparkeerkaart vermeld staat.
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel4
  - number: '5'
    text: >-
      1 Als model van de gehandicaptenparkeerkaart wordt vastgesteld het in de bijlage bij deze regeling opgenomen model.


      2 Blanco gehandicaptenparkeerkaarten worden door de met de afgifte van gehandicaptenparkeerkaarten belaste
      autoriteiten rechtstreeks besteld bij CIB verkoop en advies BV, onderdeel van VNG Diensten BV.
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel5
  - number: '6'
    text: |-
      Met een ingevolge [artikel 49 BABW][ref1] afgegeven gehandicaptenparkeerkaart wordt gelijkgesteld:

      a. een gehandicaptenparkeerkaart overeenkomstig het communautair model, afgegeven door het daartoe bevoegde gezag
      in een andere lidstaat van de Europese Gemeenschappen of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte;

      b. een gehandicaptenparkeerkaart, afgegeven door het daartoe bevoegde gezag buiten Nederland, voor zover aan de
      voorzijde van de kaart het in de bijlage bij deze regeling opgenomen symbool of een nagenoeg daaraan gelijk symbool
      voorkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0004826#Artikel49
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel6
    references:
