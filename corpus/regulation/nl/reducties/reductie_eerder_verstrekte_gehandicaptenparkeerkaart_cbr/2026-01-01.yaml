---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.9/schema/v0.8.9/schema.json
$id: reductie_eerder_verstrekte_gehandicaptenparkeerkaart_cbr
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van het CBR over de eigen kroniek
# (RFC-022 §4.1, RFC-048). De cel van het CBR geeft haar uitvoer als het
# antwoord aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt (cel.yaml,
# answers): of de aanvrager eerder een kaart van deze verstrekkende instantie
# kreeg. Het beleid van de gemeente die beslist, koppelt dat antwoord aan het
# open begrip van artikel 2, tweede lid, van de Regeling
# gehandicaptenparkeerkaart; daarvoor is elke verstrekkende instantie bevoegd
# (competent_authority van dat begrip, RFC-052). Een kopie van het filter van
# de reductie van de gemeente Wilgendaal
# (reductie_geldige_gehandicaptenparkeerkaart). Er is geen bekendmaking; de
# url wijst naar dat artikel.
url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel2
name: Eerder verstrekte gehandicaptenparkeerkaart bij het CBR (reductie)
competent_authority:
  name: CBR
articles:
  - number: '1'
    text: >-
      Geen regelgeving. Het systeem van het CBR kijkt door middel van een
      chronolexografische reductie op zijn eigen kroniek of het de aanvrager
      eerder een kaart verstrekte. De aanvrager kreeg eerder een kaart als deze
      instantie hem in een besluit op een aanvraag (artikel 49 van het BABW)
      een kaart verstrekte die niet herroepen is en niet door de
      bestuursrechter vernietigd, of als de bestuursrechter hem zelf een kaart
      verstrekte in de plaats van een besluit van deze instantie (Awb 8:72,
      derde lid, onder b); anders zegt het systeem niets.
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel2
    machine_readable:
      execution:
        parameters:
          - name: bsn_aanvrager
            type: string
            description: Burgerservicenummer van de gehandicapte die de kaart aanvraagt.
        input:
          - name: besluiten
            type: array
            source:
              decisions: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49
          - name: beslissingen_op_bezwaar
            type: array
            source:
              decisions: algemene_wet_bestuursrecht#7:11
          - name: uitspraken
            type: array
            source:
              facts: algemene_wet_bestuursrecht#8:79#afschrift_van_de_uitspraak
          - name: besluiten_in_stand
            type: array
            source:
              regulation: reductie_algemene_wet_bestuursrecht
              output: besluiten_in_stand
              parameters:
                besluiten: $besluiten
                beslissingen_op_bezwaar: $beslissingen_op_bezwaar
                uitspraken: $uitspraken
          # De kaarten die de bestuursrechter zelf verstrekte, in het besluit
          # dat hij in de plaats stelde (Awb 8:72, derde lid, onder b).
          - name: besluiten_in_de_plaats
            type: array
            source:
              regulation: reductie_algemene_wet_bestuursrecht
              output: besluiten_in_de_plaats
              parameters:
                uitspraken: $uitspraken
                grondslag: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49
        output:
          - name: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
            type: boolean
            nullable: true
            description: >-
              Waar, als deze instantie de aanvrager eerder een kaart
              verstrekte; anders afwezig.
        actions:
          # Zoals artikel 2 van de reductie van de gemeente Wilgendaal.
          - output: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
            value:
              operation: IF
              cases:
                - when:
                    operation: OR
                    conditions:
                      - operation: FOREACH
                        collection: $besluiten_in_stand
                        as: besluit
                        filter:
                          operation: AND
                          conditions:
                            - operation: EQUALS
                              subject: $besluit.gehandicaptenparkeerkaart_verstrekt
                              value: true
                            - operation: EQUALS
                              subject: $besluit.bsn_aanvrager
                              value: $bsn_aanvrager
                        body: true
                        combine: OR
                      - operation: FOREACH
                        collection: $besluiten_in_de_plaats
                        as: besluit
                        filter:
                          operation: AND
                          conditions:
                            - operation: EQUALS
                              subject: $besluit.outputs.gehandicaptenparkeerkaart_verstrekt
                              value: true
                            - operation: EQUALS
                              subject: $besluit.fields.bsn_aanvrager
                              value: $bsn_aanvrager
                        body: true
                        combine: OR
                  then: true
              default: null
