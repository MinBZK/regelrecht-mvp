---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.9/schema/v0.8.9/schema.json
$id: reductie_geldige_gehandicaptenparkeerkaart
regulatory_layer: REDUCTIE
publication_date: '2025-12-01'
valid_from: '2026-01-01'
# Geen regelgeving: een reductie van het college van de (fictieve) gemeente
# Wilgendaal over zijn eigen kroniek (RFC-022 §4.1, RFC-048). Ze zoekt de
# besluiten die ertoe doen; de geldigheidsduur staat al in elk besluit (artikel
# 51 van het BABW). De cel van de gemeente geeft haar uitvoer als twee
# antwoorden (cel.yaml, answers): of de aanvrager een geldige kaart heeft
# (artikel 1), en of hij eerder een kaart van het college kreeg (artikel 2).
# Het beleid van het college
# (fictief_beleid_gehandicaptenparkeerkaart_gemeente_wilgendaal) koppelt het
# eerste aan zijn eigen open begrip, ook als Awb 7:11 artikel 49 opnieuw
# aanroept, en het tweede aan het open begrip van artikel 2, tweede lid, onder
# a en b, van de Regeling gehandicaptenparkeerkaart. Voor dat laatste is elke
# verstrekkende instantie bevoegd (competent_authority van dat begrip,
# RFC-052), dus ook de colleges van andere gemeenten en het CBR antwoorden.
# Twee artikelen, omdat het tweede antwoord de dag van het besluit niet kent:
# artikel 2 van de regeling geeft die niet mee. Er is geen bekendmaking; de
# url wijst naar artikel 49.
url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel49
name: Geldige gehandicaptenparkeerkaart bij de gemeente Wilgendaal (reductie)
competent_authority:
  name: Het college van burgemeester en wethouders van de gemeente Wilgendaal
articles:
  - number: '1'
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      kijkt door middel van een chronolexografische reductie op zijn eigen
      kroniek of er een niet-herroepen besluit is waarin het de aanvrager een
      kaart verstrekte. De aanvrager heeft een geldige
      gehandicaptenparkeerkaart als het college hem in een besluit op een
      aanvraag (artikel 49 van het BABW) een kaart verstrekte die op de dag van
      het besluit nog geldig is.
    url: https://wetten.overheid.nl/BWBR0004826/2026-01-01#Artikel49
    machine_readable:
      execution:
        # Wat het antwoord vraagt; het beleid dat het koppelt, geeft ze op
        # naam mee.
        parameters:
          - name: bsn_aanvrager
            type: string
            description: Burgerservicenummer van de gehandicapte die de kaart aanvraagt.
          - name: besluit_datum
            type: date
            description: De dag waarop het college op de aanvraag besluit.
        input:
          # De besluiten onder artikel 49, één rij per besluit, met de gegevens
          # en de uitvoer van dat besluit onder hun eigen naam: onder meer
          # bsn_aanvrager, gehandicaptenparkeerkaart_verstrekt en
          # kaart_geldig_tot (afgeleid, maar bij het besluit bewaard), en het
          # id van het besluit.
          - name: besluiten
            type: array
            source:
              decisions: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49
          # De beslissingen op bezwaar (Awb 7:11), ook één rij per besluit.
          # Een rij noemt het bestreden besluit bij zijn id
          # (bestreden_besluit), en of zij het herriep
          # (bestreden_besluit_herroepen). De cel moet daarvoor de Awb
          # geladen hebben.
          - name: beslissingen_op_bezwaar
            type: array
            source:
              decisions: algemene_wet_bestuursrecht#7:11
        output:
          - name: herroepen_besluiten
            type: array
            description: >-
              De ids van de besluiten die een beslissing op bezwaar herriep
              (Awb 7:11, tweede lid).
          - name: aanvrager_heeft_geldige_gehandicaptenparkeerkaart
            type: boolean
            description: >-
              Of het college de aanvrager een kaart verstrekte die op de dag van
              het besluit nog geldig is.
        actions:
          # Een besluit dat een beslissing op bezwaar herriep, is er niet meer
          # (Awb 7:11, tweede lid). De koppeling loopt via een lijst ids:
          # binnen een FOREACH is de binding van een buitenste FOREACH niet te
          # lezen.
          - output: herroepen_besluiten
            value:
              operation: FOREACH
              collection: $beslissingen_op_bezwaar
              as: beslissing
              filter:
                operation: EQUALS
                subject: $beslissing.bestreden_besluit_herroepen
                value: true
              body: $beslissing.bestreden_besluit
          # Een besluit dat dezelfde aanvrager een kaart verstrekte, geldig tot
          # en met de dag van het besluit of later. Een weigering telt niet, en
          # een besluit dat op bezwaar is herroepen ook niet (Awb 7:11, tweede
          # lid); het besluit dat in zijn plaats kwam, telt als elk ander
          # (RFC-050). Een kaart die haar geldigheid op een andere grond
          # verloor (artikel 53, eerste lid, onder b tot en met e), en een kaart
          # van een andere gemeente, ziet deze reductie niet: die staan niet in
          # de kroniek. Met `as` is een besluit alleen als `$besluit.<veld>` te
          # lezen (RFC-049).
          - output: aanvrager_heeft_geldige_gehandicaptenparkeerkaart
            value:
              operation: FOREACH
              collection: $besluiten
              as: besluit
              filter:
                operation: AND
                conditions:
                  # Deze voorwaarde moet vóór de DATE_DIFF staan: AND stopt bij
                  # de eerste onwaar, en een weigering heeft geen
                  # kaart_geldig_tot, waarop DATE_DIFF faalt.
                  - operation: EQUALS
                    subject: $besluit.gehandicaptenparkeerkaart_verstrekt
                    value: true
                  - operation: NOT
                    value:
                      operation: IN
                      subject: $besluit.id
                      value: $herroepen_besluiten
                  - operation: EQUALS
                    subject: $besluit.bsn_aanvrager
                    value: $bsn_aanvrager
                  - operation: GREATER_THAN_OR_EQUAL
                    subject:
                      operation: DATE_DIFF
                      from: $besluit_datum
                      to: $besluit.kaart_geldig_tot
                      in: days
                    value: 0
              body: true
              combine: OR
  - number: '2'
    text: >-
      Geen regelgeving. Het systeem van het college van de gemeente Wilgendaal
      kijkt door middel van een chronolexografische reductie op zijn eigen
      kroniek of het de aanvrager eerder een kaart verstrekte. Hij kreeg
      eerder een kaart als het college hem in een besluit op een aanvraag
      (artikel 49 van het BABW) een kaart verstrekte die niet op bezwaar is
      herroepen, geldig of niet; anders zegt het systeem niets.
    url: https://wetten.overheid.nl/BWBR0012625/2013-01-01#Artikel2
    machine_readable:
      execution:
        # Artikel 2 van de regeling kent de dag van het besluit niet; dit
        # antwoord heeft hem ook niet nodig.
        parameters:
          - name: bsn_aanvrager
            type: string
            description: Burgerservicenummer van de gehandicapte die de kaart aanvraagt.
        input:
          - name: besluiten
            type: array
            source:
              decisions: besluit_administratieve_bepalingen_inzake_het_wegverkeer_babw#49
          - name: beslissingen_op_bezwaar
            type: array
            source:
              decisions: algemene_wet_bestuursrecht#7:11
        output:
          - name: eerder_herroepen_besluiten
            type: array
            description: >-
              De ids van de besluiten die een beslissing op bezwaar herriep
              (Awb 7:11, tweede lid).
          - name: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
            type: boolean
            nullable: true
            description: >-
              Waar, als het college de aanvrager eerder een kaart verstrekte;
              anders afwezig.
        actions:
          - output: eerder_herroepen_besluiten
            value:
              operation: FOREACH
              collection: $beslissingen_op_bezwaar
              as: beslissing
              filter:
                operation: EQUALS
                subject: $beslissing.bestreden_besluit_herroepen
                value: true
              body: $beslissing.bestreden_besluit
          # Een besluit dat dezelfde aanvrager eerder een kaart verstrekte,
          # geldig of niet, en niet herroepen. Vindt het systeem er geen, dan
          # zwijgt het (null): een kaart van een andere gemeente of van het
          # CBR kent het niet; die cel antwoordt zelf (RFC-052).
          - output: aanvrager_eerder_gehandicaptenparkeerkaart_verstrekt
            value:
              operation: IF
              cases:
                - when:
                    operation: FOREACH
                    collection: $besluiten
                    as: besluit
                    filter:
                      operation: AND
                      conditions:
                        - operation: EQUALS
                          subject: $besluit.gehandicaptenparkeerkaart_verstrekt
                          value: true
                        - operation: NOT
                          value:
                            operation: IN
                            subject: $besluit.id
                            value: $eerder_herroepen_besluiten
                        - operation: EQUALS
                          subject: $besluit.bsn_aanvrager
                          value: $bsn_aanvrager
                    body: true
                    combine: OR
                  then: true
              default: null
