---
$schema: https://raw.githubusercontent.com/NederlandseDigitaleDienst/regelrecht/refs/tags/schema-v0.8.9/schema/v0.8.9/schema.json
$id: reductie_plaats_van_vestiging
regulatory_layer: REDUCTIE
publication_date: '2026-07-01'
valid_from: '2026-08-01'
# Geen regelgeving: een reductie van het hoofd van OBS De Klimop over zijn
# eigen kroniek (RFC-022 §4.1, RFC-048, RFC-051). Ze leest de executogrammen
# van het feit vestiging, dat het fictieve beleid
# fictief_beleid_vestiging_obs_de_klimop (artikel 1) vereist, en geeft de
# vestiging die op de verlofdagen geldt. De cel van de school geeft haar
# uitvoer als de antwoorden gemeente_van_vestiging, provincie_van_vestiging en
# deel_van_gemeente_van_vestiging (cel.yaml, answers). Het beleid van het hoofd
# (fictief_beleid_vakantieverlof_obs_de_klimop) koppelt ze aan de open
# begrippen van artikel 2 van de Regeling vaststelling schoolvakanties
# 2025–2030 ("De plaats van vestiging is bepalend voor de regio"). Er is geen
# bekendmaking; de url wijst naar dat artikel.
# De houder is het hoofd en niet het bevoegd gezag, dat de vestiging vastlegt:
# het hoofd beslist op het verlof en de vestiging staat in zijn kroniek (eigen
# keuze). De verlofdagen zijn parameters van artikel 13a. Artikel 2 van de
# regeling vraagt ze niet; wie de regio vraagt voor een verlof, geeft ze daar
# mee, en het beleid dat koppelt, geeft ze door (de reductie voor artikel 11,
# onder f). In de cel faalt een vraag naar de regio zonder verlofdagen;
# buiten de cel geeft niemand dit antwoord.
# Later kan een cel van DUO, met het register van instellingen, dit antwoord
# geven in plaats van de school; dat is hier niet gebouwd (zie
# docs/src/content/docs/concepts/chronolexography-open-points.md).
url: https://wetten.overheid.nl/BWBR0049811/2025-08-01#Artikel2
name: Plaats van vestiging van OBS De Klimop (reductie)
competent_authority:
  name: Het hoofd van OBS De Klimop
articles:
  - number: '1'
    text: >-
      Geen regelgeving. Het systeem van het hoofd van OBS De Klimop kijkt door
      middel van een chronolexografische reductie op zijn eigen kroniek welke
      vastgelegde vestiging op de verlofdagen geldt. De plaats van vestiging
      van de school is die van het executogram van haar vestiging dat op de
      eerste en op de laatste verlofdag geldt: het executogram met de laatste
      dag "sinds" op of vóór die dag. Verhuist de school binnen het verlof, dan
      zijn dat twee vestigingen en geeft het systeem geen antwoord maar een
      fout.
    url: https://wetten.overheid.nl/BWBR0049811/2025-08-01#Artikel2
    machine_readable:
      execution:
        parameters:
          - name: eerste_verlofdag
            type: date
            description: Eerste dag van het gevraagde verlof (artikel 13a).
          - name: laatste_verlofdag
            type: date
            description: Laatste dag van het gevraagde verlof (artikel 13a).
        input:
          # De vastgelegde vestigingen van de school, één rij per
          # executogram, met gemeente, provincie, deel_van_gemeente en sinds.
          - name: vestigingen
            type: array
            source:
              facts: fictief_beleid_vestiging_obs_de_klimop#1#vestiging
        output:
          - name: dagen_sinds_vestiging_op_eerste_verlofdag
            type: number
            nullable: true
            description: >-
              Hoeveel dagen de vestiging op de eerste verlofdag al geldt;
              afwezig zonder vestiging op of vóór die dag.
          - name: dagen_sinds_vestiging_op_laatste_verlofdag
            type: number
            nullable: true
            description: Hetzelfde voor de laatste verlofdag.
          - name: vestiging
            type: object
            nullable: true
            description: De vestiging die op de verlofdagen geldt.
          - name: gemeente_van_vestiging
            type: string
            nullable: true
          - name: provincie_van_vestiging
            type: string
            nullable: true
          - name: deel_van_gemeente_van_vestiging
            type: string
            nullable: true
        actions:
          # Per verlofdag de vestiging met de laatste dag "sinds" op of vóór
          # die dag.
          - output: dagen_sinds_vestiging_op_eerste_verlofdag
            value:
              operation: FOREACH
              collection: $vestigingen
              as: v
              filter:
                operation: GREATER_THAN_OR_EQUAL
                subject:
                  operation: DATE_DIFF
                  from: $v.sinds
                  to: $eerste_verlofdag
                  in: days
                value: 0
              body:
                operation: DATE_DIFF
                from: $v.sinds
                to: $eerste_verlofdag
                in: days
              combine: MIN
          - output: dagen_sinds_vestiging_op_laatste_verlofdag
            value:
              operation: FOREACH
              collection: $vestigingen
              as: v
              filter:
                operation: GREATER_THAN_OR_EQUAL
                subject:
                  operation: DATE_DIFF
                  from: $v.sinds
                  to: $laatste_verlofdag
                  in: days
                value: 0
              body:
                operation: DATE_DIFF
                from: $v.sinds
                to: $laatste_verlofdag
                in: days
              combine: MIN
          # De vestiging die op de eerste of op de laatste verlofdag geldt.
          # Is dat één executogram, dan geldt het het hele verlof (een latere
          # vestiging binnen het verlof zou op de laatste dag gelden). Zijn
          # het er twee, omdat de school binnen het verlof verhuist, dan
          # weigert ONLY en faalt het besluit: welke regio dan geldt, zegt de
          # regeling niet. Ook twee vestigingen met dezelfde dag "sinds"
          # weigert ONLY. Zonder vestiging is er geen (null).
          - output: vestiging
            value:
              operation: FOREACH
              collection: $vestigingen
              as: v
              filter:
                operation: OR
                conditions:
                  - operation: AND
                    conditions:
                      - operation: GREATER_THAN_OR_EQUAL
                        subject:
                          operation: DATE_DIFF
                          from: $v.sinds
                          to: $eerste_verlofdag
                          in: days
                        value: 0
                      - operation: EQUALS
                        subject:
                          operation: DATE_DIFF
                          from: $v.sinds
                          to: $eerste_verlofdag
                          in: days
                        value: $dagen_sinds_vestiging_op_eerste_verlofdag
                  - operation: AND
                    conditions:
                      - operation: GREATER_THAN_OR_EQUAL
                        subject:
                          operation: DATE_DIFF
                          from: $v.sinds
                          to: $laatste_verlofdag
                          in: days
                        value: 0
                      - operation: EQUALS
                        subject:
                          operation: DATE_DIFF
                          from: $v.sinds
                          to: $laatste_verlofdag
                          in: days
                        value: $dagen_sinds_vestiging_op_laatste_verlofdag
              body: $v
              combine: ONLY
          - output: gemeente_van_vestiging
            value: $vestiging.gemeente
          - output: provincie_van_vestiging
            value: $vestiging.provincie
          - output: deel_van_gemeente_van_vestiging
            value: $vestiging.deel_van_gemeente
