name: Claude Code Review

# A dispatch run has no pull request in its payload; the title names the PR so
# the merge gate can find the run. The gate does not trust this title: it only
# narrows the search, the trusted record is the review job's name (see below).
run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
  && format('Claude Code Review: PR #{0}', inputs.pr)
  || github.event.pull_request.title }}

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]
  # Re-review by hand: `gh workflow run "Claude Code Review" -f pr=<n>`.
  # The run executes this file from the default branch and reviews the PR's
  # current head, resolved through the API. A rerun of a pull_request run
  # cannot do that: it keeps the original payload, and with it the old commit.
  workflow_dispatch:
    inputs:
      pr:
        description: Nummer van de pull request die opnieuw gereviewd moet worden
        required: true
        type: number

# No workflow-level concurrency. Cancelling whole runs also cancelled their
# merge gate, and a payload-based skip decision let a run that skipped the
# review cancel the only run that would have done it (PR 1801). Concurrency now
# sits on `claude-review` alone, keyed on facts `target` fetched at run time.

jobs:
  # Decides from the API, at run time, whether there is something to review and
  # which commit that is. The payload is not good enough: a `synchronize` event
  # for a push made just before "ready for review" still says `draft: true`, and
  # a `ready_for_review` event can carry the commit from before that push.
  target:
    name: Resolve the commit to review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      review: ${{ steps.resolve.outputs.review }}
      pr: ${{ steps.resolve.outputs.pr }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Resolve the pull request and its head commit
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # Not being able to look is an error on any event: a green job with a
          # skipped review would hide it.
          fail() {
            echo "::error title=Claude review::$1"
            exit 1
          }
          # A manual run was asked for explicitly, so a refusal is an error. On a
          # pull_request event it is the normal outcome for drafts and forks.
          refuse() {
            if [ "$EVENT_NAME" = workflow_dispatch ]; then
              echo "::error title=Claude review::$1"
              exit 1
            fi
            echo "::notice title=Claude review::$1"
            echo "review=false" >>"$GITHUB_OUTPUT"
            exit 0
          }
          [[ "$PR" =~ ^[1-9][0-9]*$ ]] || fail "'${PR}' is geen nummer van een pull request."
          pr=$(gh api "repos/${REPO}/pulls/${PR}") ||
            fail "Pull request ${PR} is niet op te halen, dus niet vast te stellen of er iets te reviewen is. Draai deze run opnieuw."
          field() { jq -r "${1} // \"\"" <<<"$pr"; }
          head_sha=$(field '.head.sha')
          [ "$(field '.state')" = open ] || refuse "Pull request ${PR} is niet open."
          # Same rules as before: a cross-repo PR gets no secrets, a draft is not
          # ready, and dependabot goes through claude-dependabot.yml. Compare
          # full_name rather than `head.repo.fork`: inside a fork of this repo its
          # own PRs are not cross-repo and do have secrets.
          [ "$(field '.head.repo.full_name')" = "$REPO" ] ||
            refuse "Pull request ${PR} komt uit een andere repository; die krijgt geen secrets en dus geen automatische review."
          [ "$(field '.draft')" != true ] ||
            refuse "Pull request ${PR} staat op draft; de review volgt bij 'ready for review'."
          [ "$(field '.user.login')" != 'dependabot[bot]' ] ||
            refuse "Pull request ${PR} komt van dependabot en loopt via claude-dependabot.yml."
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] ||
            fail "De head-commit van pull request ${PR} is niet uit de API te lezen. Draai deze run opnieuw."
          # A run for a commit that is no longer the head does not review: its gate
          # reports on that old commit, and the gate on the new head judges the
          # new one (and blocks with instructions if nothing reviews it).
          if [ "$EVENT_NAME" = pull_request ] && [ "$head_sha" != "$EVENT_HEAD_SHA" ]; then
            refuse "Deze run is voor commit ${EVENT_HEAD_SHA}, maar pull request ${PR} staat inmiddels op ${head_sha}. Deze run reviewt daarom niet; de poort op ${head_sha} beoordeelt die commit."
          fi
          echo "Te reviewen: pull request ${PR} op commit ${head_sha}."
          {
            echo "review=true"
            echo "pr=${PR}"
            echo "sha=${head_sha}"
          } >>"$GITHUB_OUTPUT"

  # The job name is what the merge gate reads. On a pull_request run it stays
  # `claude-review`. On a dispatch run it also names the PR and the commit:
  # that run's own head is the default branch, and this name is the only record
  # of what it reviewed that the gate can read and that only the default-branch
  # copy of this file can write. Keep it in step with `dispatch_job_name` in
  # script/await-claude-review.sh; the test suite binds the two.
  claude-review:
    name: >-
      ${{ github.event_name == 'workflow_dispatch'
      && format('claude-review (PR #{0} @ {1})', needs.target.outputs.pr, needs.target.outputs.sha)
      || 'claude-review' }}
    needs: target
    if: needs.target.outputs.review == 'true'
    # One review per pull request at a time, whichever event started it: a
    # newer push or a manual run replaces the review in progress. A run that
    # has nothing to review gets a group of its own, so even if GitHub weighs
    # concurrency before `if:`, it cannot cancel a review.
    concurrency:
      group: >-
        ${{ github.workflow }}-pr-${{ needs.target.outputs.review == 'true'
        && needs.target.outputs.pr || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      # A pull_request run checks out the test merge, as before. A dispatch run
      # checks out the head commit that `target` resolved, not its own ref.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && needs.target.outputs.sha || '' }}

      # On a pull_request event the review action restores these paths from the
      # base branch itself, because the CLI reads them at startup and the PR
      # controls them. On a dispatch event it does not (there is no PR in the
      # payload), so do it here, from the default-branch commit this run runs.
      # The list is SENSITIVE_PATHS from the action's restore-config.ts, plus
      # AGENTS.md (which CLAUDE.md imports) and the comment script the next
      # steps execute: this job runs with the default branch's cache scope and
      # OIDC subject, so it must not execute code from the PR.
      - name: Restore Claude configuration from the default branch
        if: github.event_name == 'workflow_dispatch'
        env:
          TRUSTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "$TRUSTED_SHA"
          for path in .claude .mcp.json .claude.json .gitmodules .ripgreprc CLAUDE.md CLAUDE.local.md .husky \
            AGENTS.md script/claude-review-comments.sh; do
            rm -rf -- "$path"
            if git cat-file -e "${TRUSTED_SHA}:${path}" 2>/dev/null; then
              git checkout "$TRUSTED_SHA" -- "$path"
            fi
          done

      # Opruimen gebeurt ná de review, niet ervoor. Wat hier gebeurt is alleen
      # vastleggen wat er staat: de ids om straks op te ruimen, en de teksten om
      # aan de review mee te geven. Klapt de run hierna, dan is er niets
      # weggegooid en staat de vorige bevinding er nog. Dat is precies het geval
      # waarin de oude opzet — eerst wissen, dan reviewen — hem kwijtraakte,
      # terwijl de poort op een kritieke bevinding rood wordt: opnieuw pushen tot
      # de review het niet meer opmerkt zou dan groen opleveren.
      - name: Snapshot the previous review
        id: snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.target.outputs.pr }}
        run: script/claude-review-comments.sh snapshot

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@f27be6b65a4652f08a2ba3cff79114829b588967  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          use_sticky_comment: true
          claude_args: "--allowedTools Bash,Read,Glob,Grep"
          prompt: |
            Review PR #${{ needs.target.outputs.pr }} in ${{ github.repository }}, at head
            commit ${{ needs.target.outputs.sha }}.

            Read `REVIEW.md` for the project context, review dimensions, severity scale, and
            skip rules. Follow those guidelines strictly.

            ## CRITICAL SCOPE RULE

            **ONLY review lines that were actually added or modified in this PR's diff.**

            You MUST NOT comment on:
            - Pre-existing code that was not changed in this PR
            - Context lines shown in the diff that were not added/modified (lines without + prefix)
            - Issues in unchanged files or unchanged sections of changed files
            - Pre-existing patterns, naming, style, or technical debt in surrounding code

            You may read full files for context to understand the changes, but every single
            finding you report MUST point to a line that was added or modified in the diff.
            If a line was not changed by this PR, it is OUT OF SCOPE, no matter how wrong it looks.

            Before submitting each finding, verify: "Was this line actually changed in the PR diff?"
            If the answer is no, drop the finding.

            Skip dimensions that have no findings. Be precise and actionable — no "consider"
            or "you might want to" comments.

            ## Output format

            Structure your review as a single comment with sections for each dimension that has
            findings. Use this severity scale:

            - 🔴 **Critical** — wrong legal outcome, data loss, runtime crash, security vulnerability
            - 🟠 **Significant** — likely bug, broken reference, missing edge case, lost jobs
            - 🟡 **Minor** — code quality, style, non-blocking improvement

            Also leave inline comments on specific lines where possible.

            If there are no issues, say so briefly. Do not pad the review with praise or filler.

            ## Post the review yourself

            Nothing you write as your final answer reaches the pull request: this workflow
            does not post it. Post the review with the GitHub CLI, which is authenticated:

            - The summary comment, always, also when there is nothing to report:
              `gh pr comment ${{ needs.target.outputs.pr }} --repo ${{ github.repository }} --body-file <file>`.
              With no findings it says so and names in one line what you checked.
            - Each inline comment: `gh api repos/${{ github.repository }}/pulls/${{ needs.target.outputs.pr }}/comments
              -F body=@<file> -f commit_id=${{ needs.target.outputs.sha }} -f path=<path> -F line=<line> -f side=RIGHT`.
              Take `<line>` from the `+` side of `gh pr diff ${{ needs.target.outputs.pr }}`, not from the
              files on disk, which may be a merge with the base branch. A finding the API refuses
              goes into the summary comment instead.

            The merge gate blocks a review that left nothing on the pull request, so a
            review that is not posted counts as no review.

            ## The Critical marker is read by a machine

            The merge gate `Claude review completed` searches this comment, your inline
            comments and the body of the review you submit for the exact string
            `🔴 **Critical**`, and turns red when it finds one, which blocks the merge.
            Write the marker exactly as it appears above — same
            emoji, same bold, same word — and only on a finding that is genuinely critical.
            Do not reword it, do not drop the emoji, and do not write it anywhere you are
            not reporting a critical finding: not in a heading, not in a legend of the
            scale, not in an example. A merge is held or let through on that string.

            End every comment you write for this review — the summary comment and each
            inline comment — with this line, exactly:

            <!-- claude-review -->

            It renders as nothing and it is how the workflow tells your review apart from
            an ordinary `@claude` answer in the same thread. A comment without it is left
            alone: it is not cleaned up after the next review, and it is not handed to that
            review as context.
            ${{ steps.snapshot.outputs.context }}

      # Het bewijs waar review-gate op afgaat. `execution_file` wijst naar het
      # uitvoerbestand van Claude en wordt pas gezet nadat de CLI gedraaid heeft;
      # stapt de actie er eerder uit — de workflow-validation-skip, wanneer dit
      # bestand afwijkt van de versie op de default branch — dan blijft die
      # output leeg en wordt deze stap overgeslagen. De poort leest de uitkomst
      # van deze stap uit de jobs van déze run, dus het bewijs is per constructie
      # run-gebonden, en het bestaat ook wanneer de review nul bevindingen had.
      # Hernoem deze stap niet zonder `PROOF_STEP` in review-gate mee te nemen.
      - name: Record that the review ran
        if: steps.claude-review.outputs.execution_file != ''
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
          HEAD_SHA: ${{ needs.target.outputs.sha }}
        run: |
          echo "De review-actie is uitgevoerd; uitvoerbestand: ${EXECUTION_FILE}"
          {
            echo "### Claude review uitgevoerd"
            echo
            echo "De review-actie heeft gedraaid voor commit \`${HEAD_SHA}\`."
            echo "Nul bevindingen is hier een geldige uitkomst; deze stap zegt alleen dat er gereviewd is."
          } >>"$GITHUB_STEP_SUMMARY"

      # Nu de nieuwe review er staat, mag de vorige weg, en alleen de vorige:
      # wat in de momentopname stond en sindsdien niet is aangeraakt. Deze stap
      # draait onder dezelfde voorwaarde als de bewijsstap, dus een run die
      # klapte voordat er iets geschreven was gooit niets weg.
      - name: Clean up the superseded review
        if: steps.claude-review.outputs.execution_file != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ needs.target.outputs.pr }}
        run: script/claude-review-comments.sh clean-up

  # The merge gate. Unlike claude-review it runs on every pull_request event,
  # cross-repo and dependabot included, because a required check that never
  # reports blocks such a PR forever. A dispatch run has no PR to report on (its
  # checks land on the default branch); the gate of the PR picks that review up.
  review-gate:
    name: Claude review completed
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # Ruim boven de ~10 minuten die de review kost, zodat een trage run niet
    # onterecht rood wordt; het script stopt zelf eerder met een duidelijke melding.
    timeout-minutes: 40
    permissions:
      actions: read
      contents: read
      # `issues: read` is voor de samenvattende comment: die is een issue-comment
      # en komt van `issues/{n}/comments`. Zonder die scope leest de poort hem
      # niet en blokkeert elke PR op "niet op te halen".
      issues: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      # De poort mag niet draaien op de versie van zichzelf die in de PR staat:
      # een PR die het script naar `exit 0` verandert zou anders per definitie
      # groen zijn. Draai daarom de versie van de base-branch, en blokkeer als
      # die niet te krijgen is — terugvallen op de PR-versie is precies de
      # bypass die deze stap moet dichten.
      - name: Take the gate script from the base branch
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GATE: script/await-claude-review.sh
        run: |
          set -uo pipefail
          fail() {
            echo "::error title=Claude review gate::$1"
            exit 1
          }
          git fetch --depth=1 origin "$BASE_SHA" ||
            fail "base-commit ${BASE_SHA} is niet op te halen, dus de versie van de poort is niet vast te stellen. Draai deze job opnieuw."
          git cat-file -e "${BASE_SHA}:${GATE}" 2>/dev/null ||
            fail "${GATE} bestaat niet op de base-branch (${BASE_SHA}). De poort kan dan niet voor zichzelf instaan; deze PR moet met de hand gereviewd worden."
          git checkout "$BASE_SHA" -- "$GATE" ||
            fail "${GATE} is niet uit ${BASE_SHA} te checkouten, dus de poort zou de versie uit deze PR draaien. Draai deze job opnieuw."
          echo "Poort draait de versie van ${BASE_SHA}."

      - name: Wait for the Claude review of this commit
        # Alleen de coördinaten van deze run. Wat de poort als feit behandelt —
        # fork, draft, auteur, de versie van dit workflowbestand — haalt zij zelf
        # op, want dit env-blok staat in de PR die gereviewd wordt.
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MAX_WAIT_SECONDS: '2100'
          POLL_SECONDS: '20'
        run: script/await-claude-review.sh
