---
name: Release Engine Binary

on:
  push:
    tags:
      - "engine-v*"
  # Een workflow die alleen op een tag draait zegt tussen twee releases niets,
  # dus een kapotte route bleek pas bij de volgende release (#1282: van april
  # tot september rood op engine-v0.2.0 zonder dat iemand het zag). Daarom
  # bouwt hij ook bij een wijziging aan dit bestand en eens per maand, zonder
  # iets te publiceren; alleen een tag maakt een release.
  pull_request:
    paths:
      - ".github/workflows/release-engine.yml"
      - ".github/actions/setup-mold/**"
  schedule:
    - cron: "17 5 1 * *"
  workflow_dispatch:

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            binary: evaluate
            asset: evaluate-linux-amd64

          # macos-latest is arm64, waar dit target alleen gecross-compileerd kan
          # worden. macos-15-intel is de Intel-runner die macos-13 opvolgt en
          # bouwt dit target native. GitHub biedt x86_64-macOS aan tot het
          # macOS 15-image in het najaar van 2027 vervalt.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            binary: evaluate
            asset: evaluate-macos-amd64

          - target: aarch64-apple-darwin
            os: macos-latest
            binary: evaluate
            asset: evaluate-macos-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install mold linker (Linux)
        # x86_64-linux builds use the mold linker from packages/.cargo/config.toml.
        # The macOS targets fall outside that target-scoped config, so no mold there.
        if: runner.os == 'Linux'
        # Checksum-verified release binary, not apt; why, and how to bump the
        # version and its sha256: .github/actions/setup-mold/action.yml.
        uses: ./.github/actions/setup-mold

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-release-${{ hashFiles('packages/**/Cargo.toml', 'packages/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.target }}-cargo-release-

      - name: Build release binary
        run: |
          cd packages/engine
          cargo build --release --locked --bin evaluate --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          cp packages/target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset }}
          chmod +x ${{ matrix.asset }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/engine-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v2
        with:
          generate_release_notes: true
          files: |
            artifacts/evaluate-linux-amd64/evaluate-linux-amd64
            artifacts/evaluate-macos-amd64/evaluate-macos-amd64
            artifacts/evaluate-macos-arm64/evaluate-macos-arm64
