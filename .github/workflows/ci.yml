---
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # De merge queue bouwt zijn eigen branch (`gh-readonly-queue/main/...`) met
  # main plus de wachtende pull requests erin, en mergt pas als de checks daar
  # groen zijn. Zonder deze trigger draait hier niets en blijft elke entry
  # hangen tot de queue-timeout hem eruit gooit.
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Op main niet afbreken: een tweede merge zou de run van de eerste afkappen
  # en main zonder afgeronde CI achterlaten.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ci: ${{ steps.filter.outputs.ci }}
      docs: ${{ steps.filter.outputs.docs }}
      docs-source: ${{ steps.filter.outputs.docs-source }}
      rust-image: ${{ steps.filter.outputs.rust-image }}
      walkthrough: ${{ steps.filter.outputs.walkthrough }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        id: filter
        with:
          # Geen `base:` en geen `ref:`, ook niet voor de rij. De action kent
          # merge_group zelf (sinds v4.0.1) en pakt dan `base_sha` en `head_sha`
          # uit de payload: twee commits, rechtstreeks met elkaar vergeleken.
          # Dat is precies de gewenste verzameling — wat de groep toevoegt
          # bovenop de commit waarop hij bouwt.
          #
          # Zet hier vooral geen `base: refs/heads/main` bij als het ooit lijkt
          # te helpen. De action strípt dat naar `main`, en dat is geen SHA meer,
          # dus valt hij terug op een vergelijking met de merge-base tegen de
          # punt van main. In een rij is de punt van main juist niet waar de
          # groep vandaan vertakt, en dan klopt de lijst niet meer.
          filters: |
            ci:
              # Alle crates; een handmatige opsomming dreef eerder weg.
              - packages/**
              - frontend/**
              - frontend-lawmaking/**
              - frontend-demo/**
              - frontend-poc-portal/**
              - frontend-poc-terugbetaalregimes/**
              - frontend-poc-nieuwkomersbekostiging/**
              - frontend-poc-napp/**
              - corpus-poc/**
              - pocs/**
              - packages/frontend-shared/**
              - bdd/**
              - corpus/regulation/**
              # De reducties van de cellen (RFC-048): gevalideerd en gelezen door de celtests.
              - corpus/cells/**
              # De demo-wetten en -scenario's: gevalideerd en gedraaid als bucket demo.
              - corpus/demo/**
              - schema/**
              - script/**
              # De npm-workspace zelf: een dependency-bump raakt alleen deze
              # drie bestanden en zou anders elke frontend-, e2e- en wasm-baan
              # overslaan.
              - package.json
              - package-lock.json
              - .npmrc
              # De Rust-versie waarop alle Rust-banen draaien.
              - rust-toolchain.toml
              # copy-laws.js leest het register om te bepalen welke wetten in
              # de bundel meegaan.
              - corpus-registry.yaml
              # The schema reference doc is version-locked to schema/latest by
              # provenance-checks; edit it and that guard must re-run. The
              # committed snapshot the page renders from is part of that lock
              # (the guard asserts it matches schema/latest byte for byte), so
              # it and the script that writes it belong here too.
              - docs/src/content/docs/reference/schema.mdx
              - docs/src/data/schema-latest.json
              - docs/scripts/sync-schema.mjs
              - docs/scripts/check-schema-version.mjs
              - Justfile
              - .pre-commit-config.yaml
              - .yamllint
              - .github/workflows/ci.yml
            docs:
              - docs/**
              # De landingspagina leest het corpus bij het bouwen en draait het
              # zorgtoeslag-scenario in de browser. De parsers in
              # docs/src/lib/landing-demo.ts staan op exacte posities in de
              # YAML, dus een herformattering van de wet laat de docs-build
              # omvallen; zonder deze paden merkt de toegankelijkheidspoort dat
              # niet en valt het pas om bij de volgende docs-wijziging.
              - corpus/regulation/**
              - corpus/annotations/**
              - packages/frontend-shared/**
              - script/landing-laws.sh
              # What the gate installs in the Playwright image.
              - script/install-a11y-debs.sh
              - .github/workflows/ci.yml
            # De broncontroles op de documentatie (geciteerde paden, proza,
            # RFC-dekking, schemaversie) hebben geen astro-build nodig en
            # moeten juist draaien als de *code* verschuift, niet alleen als
            # iemand docs/ aanraakt. Dat is de richting waaruit de afdrijving
            # komt: een hernoemd veld of een verplaatste map laat de proza
            # stilletjes achter. Daarom een eigen, lichte filter naast `docs`.
            docs-source:
              - docs/**
              - packages/**
              - bdd/**
              - schema/**
              - corpus/regulation/**
              - Justfile
              - .claude/skills/docs-writing/**
              - .github/workflows/ci.yml
            # Wat de bouw van een Rust-image kan breken. Smaller dan `ci`: een
            # wijziging in frontend/ of bdd/ raakt deze Dockerfiles niet, en die
            # build kost 4,5 minuut.
            rust-image:
              - packages/**
              # De Dockerfile doet `COPY schema/ /schema/`; de engine leest die
              # paden met include_str!, en die kloppen in de image om een andere
              # reden dan in de repo.
              - schema/**
              - rust-toolchain.toml
              - .github/workflows/ci.yml
            # Wat de opgenomen rondleiding kan breken: de demo zelf, het
            # demo-corpus en de rondleiding erin, en de engine die de demo
            # rekent. Een wijziging elders raakt geen knop waar de opname op
            # klikt.
            walkthrough:
              - frontend-demo/**
              - corpus/demo/**
              - packages/engine/**
              - packages/law-model/**
              - packages/frontend-shared/**
              - schema/**
              - package-lock.json
              - .github/workflows/ci.yml

  protect-schema:
    name: Protect schema versions
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Alleen op een pull request, ook nu er een wachtrij is. Deze baan is een
    # required check, maar een baan die op een `if:` hieronder overslaat meldt
    # `skipped`, en dat telt bij GitHub als geslaagd; alleen een workflow die
    # in het geheel niet draait blijft op "Expected" staan en laat een entry
    # hangen. Deze workflow draait in de rij wél, dus de check rapporteert.
    #
    # Hem daar echt laten draaien zou schadelijk zijn. De vergelijking
    # hieronder is `origin/main...HEAD`, en HEAD is in de rij niet één pull
    # request maar de hele groep: raakt één ervan een vrijgegeven
    # schemaversie, dan valt de groep om en vliegen de andere mee. Op de pull
    # request zelf wordt dat al afgevangen, per wijziging, tegen een main die
    # niet onder de baan door beweegt.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.changes.outputs.ci == 'true'
        with:
          fetch-depth: 0

      - name: Check for modifications to released schema versions
        if: needs.changes.outputs.ci == 'true'
        run: |
          # Get list of versioned schema directories that exist on main.
          # Two version axes: the law schema under schema/vX.Y.Z, and a
          # companion format on its own axis under schema/<name>/vN, because a
          # trace shape and a law shape change for different reasons (RFC-039).
          # Both are immutable once on main, so both are listed here; without
          # the second pattern a published trace schema could be edited in
          # place, which is the thing this job exists to prevent.
          # `-r` is needed for the second pattern: the companion directories sit
          # one level deeper, and a non-recursive ls-tree stops at schema/trace.
          git fetch origin main
          EXISTING_VERSIONS=$(git ls-tree -d -r --name-only origin/main schema/ 2>/dev/null \
            | grep -E '^schema/(v[0-9]+\.[0-9]+\.[0-9]+|[a-z0-9_-]+/v[0-9]+)$' || true)

          if [ -z "$EXISTING_VERSIONS" ]; then
            echo "No existing schema versions on main, skipping check"
            exit 0
          fi

          echo "Existing schema versions on main:"
          echo "$EXISTING_VERSIONS"
          echo ""

          # Check if any of these directories have modifications in this PR
          VIOLATIONS=""
          for version_dir in $EXISTING_VERSIONS; do
            # Check for modified or deleted files in this version directory
            CHANGES=$(git diff --name-status origin/main...HEAD -- "$version_dir" | grep -E '^[MD]\s' || true)
            if [ -n "$CHANGES" ]; then
              VIOLATIONS="$VIOLATIONS
          $CHANGES"
            fi
          done

          if [ -n "$VIOLATIONS" ]; then
            echo "Schema Protection Error!"
            echo "=================================================="
            echo ""
            echo "Cannot modify or delete files in released schema versions:"
            echo "$VIOLATIONS"
            echo ""
            echo "Schema versions are immutable once released to main."
            echo "To make changes, create a new schema version directory."
            echo "(schema/latest/ can be updated freely)"
            exit 1
          fi

          echo "Schema protection check passed"

      - name: Skip (no relevant changes)
        if: needs.changes.outputs.ci != 'true'
        run: echo "No schema changes, skipping"

  provenance-checks:
    name: Provenance checks (RFC-013)
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Check schema versions registered in schema.rs
        run: |
          # Every schema/vX.Y.Z/ directory must appear in the embedded schema table.
          VALIDATE_RS="packages/engine/src/schema.rs"
          MISSING=""
          for dir in schema/v*/; do
            version=$(basename "$dir")
            if ! grep -q "\"$version\"" "$VALIDATE_RS"; then
              MISSING="$MISSING  $version\n"
            fi
          done
          if [ -n "$MISSING" ]; then
            echo "ERROR: Schema versions not registered in schema.rs:"
            printf "$MISSING"
            exit 1
          fi
          echo "All schema versions registered in schema.rs"

      - name: Check corpus schema references
        run: |
          # Every $schema URL in corpus YAML must reference a known schema version
          KNOWN_VERSIONS=$(ls -d schema/v*/ | xargs -n1 basename)
          FAILED=false
          # A cell holds rulework only under reducties (RFC-048).
          for file in $(find corpus/regulation -name "*.yaml"; find corpus/cells -path "*/reducties/*" -name "*.yaml"); do
            SCHEMA_URL=$(grep '^\$schema:' "$file" | head -1 | sed 's/\$schema: *//')
            # Handle multi-line $schema with >-
            if [ -z "$SCHEMA_URL" ] || [ "$SCHEMA_URL" = ">-" ]; then
              SCHEMA_URL=$(sed -n '2p' "$file" | sed 's/^ *//' | grep 'schema.json' || true)
              if [ -z "$SCHEMA_URL" ]; then
                SCHEMA_URL=$(sed -n '3p' "$file" | sed 's/^ *//' | grep 'schema.json' || true)
              fi
            fi
            if [ -z "$SCHEMA_URL" ]; then
              echo "WARN: $file has no \$schema URL"
              continue
            fi
            FOUND=false
            for ver in $KNOWN_VERSIONS; do
              if echo "$SCHEMA_URL" | grep -q "$ver"; then
                FOUND=true
                break
              fi
            done
            if [ "$FOUND" = "false" ]; then
              echo "ERROR: $file references unknown schema version: $SCHEMA_URL"
              FAILED=true
            fi
          done
          if [ "$FAILED" = "true" ]; then
            exit 1
          fi
          echo "All corpus schema references valid"

      - name: Check schema examples validate against their own subschema
        run: |
          # An `examples` value is rendered as copyable YAML on
          # /reference/schema, so an invalid one hands a law author a file that
          # `just validate` rejects.
          python3 script/check-schema-examples.py

      - name: Check schema/latest symlink
        run: |
          TARGET=$(readlink schema/latest)
          HIGHEST=$(ls -d schema/v*/ | xargs -n1 basename | sort -V | tail -1)
          if [ "$TARGET" != "$HIGHEST" ]; then
            echo "ERROR: schema/latest points to $TARGET but highest version is $HIGHEST"
            exit 1
          fi
          echo "schema/latest correctly points to $HIGHEST"

      # The schema reference doc hand-states the current version; this asserts
      # it tracks schema/latest so a schema bump can't leave the docs behind.
      # Node-only, reads source files (no astro build).
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'

      - name: Check schema reference doc tracks schema/latest
        run: node docs/scripts/check-schema-version.mjs

      - name: Check engine version bump on source changes
        if: needs.changes.outputs.ci == 'true' && github.event_name == 'pull_request'
        run: |
          git fetch origin main
          # Check if engine source files changed (excluding binaries and tests)
          ENGINE_CHANGES=$(git diff --name-only origin/main...HEAD -- \
            'packages/engine/src/*.rs' \
            'packages/engine/src/**/*.rs' \
            ':!packages/engine/src/bin/*' \
            ':!packages/engine/src/wasm.rs' || true)
          if [ -z "$ENGINE_CHANGES" ]; then
            echo "No engine source changes, skipping version check"
            exit 0
          fi
          # Compare engine version between main and this branch
          MAIN_VERSION=$(git show origin/main:packages/engine/Cargo.toml 2>/dev/null \
            | grep '^version' | head -1 | sed 's/.*"\(.*\)"/\1/')
          PR_VERSION=$(grep '^version' packages/engine/Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          if [ "$MAIN_VERSION" = "$PR_VERSION" ]; then
            echo "WARNING: Engine source files changed but version is still $PR_VERSION"
            echo "Changed files:"
            echo "$ENGINE_CHANGES"
            echo ""
            echo "Consider bumping the engine version in packages/engine/Cargo.toml"
            # Warning only, not a hard failure (yet)
          else
            echo "Engine version bumped: $MAIN_VERSION -> $PR_VERSION"
          fi

  cross-law-integrity:
    name: Cross-law integrity
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: needs.changes.outputs.ci == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.x'

      - name: Install pyyaml
        run: pip install pyyaml

      # Fail-closed gate over the corpus: MISPLACED / DANGLING / PLAIN-PARAM
      # source bindings and IMPL-DANGLING / IMPL-NO-DATE implements declarations
      # are all modelling errors. The script exits non-zero on any finding.
      - name: Check cross-law binding integrity
        run: |
          python3 script/cross-law-integriteit.py corpus/regulation

  pre-commit:
    name: Pre-commit
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # sccache caches compilations across runs; the GHA backend is wired up by
      # the sccache-action step below. Incremental must be off for sccache.
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      # Het target moet mee, ook al bouwt deze baan geen wasm: de hooks roepen
      # cargo aan, rustup leest dan rust-toolchain.toml, en een ontbrekend target
      # laat het de toolchain als half geïnstalleerd behandelen. De reparatie die
      # daarop volgt strandt op een component die er al staat ("detected
      # conflict: bin/cargo-clippy") en neemt de hook mee die cargo nodig heeft.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      - name: Install mold linker
        # The release binary from GitHub, not apt: `apt-get update` alone took
        # 30 to 110 s on the runners. make-default stays off, so /usr/bin/ld is
        # untouched and only the -fuse-ld=mold link-arg picks mold. 2.42.1 is
        # the last C++ release; 3.0 is a rewrite in Rust and gets its own bump.
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038  # v1
        with:
          mold-version: 2.42.1
          make-default: false

      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Cache cargo registry (shared)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # De deploy-filters leiden zichzelf af uit de cargo-graaf, dus een crate
      # die van eigenaar wisselt kan een component stil buiten de deploy laten
      # vallen. Die test hoort in een required check, en deze baan heeft cargo
      # al staan; `cargo metadata` bouwt niets en kost seconden.
      # Ongegate: de security-headers-guard verderop bewaakt bestanden
      # (deploy/nginx, de twee nginx.conf's, het Grafana-Dockerfile) die niet
      # onder het `ci`-filter vallen. Gegate zou hij precies de wijzigingen
      # missen waarvoor hij bestaat.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'

      - name: Check deploy filters
        if: needs.changes.outputs.ci == 'true'
        run: just deploy-filters-test

      # De GHCR-opruimer verwijdert onomkeerbaar manifesten uit de registry,
      # dus zijn veiligheidsregels horen in een required check en niet alleen
      # in een pre-commit hook.
      - name: Check GHCR cleanup
        if: needs.changes.outputs.ci == 'true'
        run: just ghcr-cleanup-test

      - name: Check asset precompression
        if: needs.changes.outputs.ci == 'true'
        run: just precompress-test

      - name: Check security headers
        run: just security-headers-test

      - name: Check first-load guard
        if: needs.changes.outputs.ci == 'true'
        run: just first-load-test

      # Leak-guard laag 2: voorzie het git-ignored aanvulbestand met de casus-/
      # sector-specifieke patronen uit een secret, zodat de skills-no-casus hook in
      # CI op volle sterkte draait zonder die patronen in de publieke repo te zetten.
      # De waarde wordt nooit gelogd. Ontbreekt het secret (bv. PR's vanuit forks,
      # die geen toegang tot secrets hebben), dan draait alleen laag 1 — expliciet
      # gelogd, zodat een groene run nooit "volledig gescand" suggereert.
      - name: Provision leak-guard supplement (laag 2)
        env:
          SKILLS_CASUS_DENYLIST: ${{ secrets.SKILLS_CASUS_DENYLIST }}
        run: |
          if [ -n "${SKILLS_CASUS_DENYLIST:-}" ]; then
            printf '%s\n' "$SKILLS_CASUS_DENYLIST" > script/.skills-casus-denylist.local
            echo "Leak-guard laag 2 voorzien vanuit secret (volle sterkte)."
          else
            echo "WAARSCHUWING: geen SKILLS_CASUS_DENYLIST secret — alleen laag 1 (domein-loze vorm) draait. Casus-/sector-patronen worden in deze run NIET gescand."
          fi

      # De hooks draaien over de hele boom (--all-files). Raakt de PR geen Rust
      # of corpus, dan zijn rust-format, rust-lint en validate-law-yaml drie
      # minuten werk aan bestanden die niemand heeft aangeraakt; die worden dan
      # overgeslagen. De job blijft `Pre-commit` heten: dat is een required check.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd  # v3.0.1
        env:
          SKIP: ${{ needs.changes.outputs.ci == 'true' && '' || 'rust-format,rust-lint,validate-law-yaml' }}

  rust-tests:
    name: Rust tests (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Gesneden langs de grens die er al is: de crates met een
        # testcontainers-suite tegenover de rest. Beide benen zijn precies één
        # cargo-aanroep, want twee selecties in dezelfde target-dir laten cargo
        # elkaars artefacten herbouwen.
        include:
          - leg: unit
            recipe: test-no-docker
            postgres-url: ''
          - leg: db
            recipe: test-db
            # De testhelper start zelf een container als deze leeg is. Hier
            # staat er al een als service naast de job, en dat scheelt de
            # opstart in elk van de ruim twintig testbinaries.
            postgres-url: postgres://postgres:postgres@127.0.0.1:5432
    services:
      # Dezelfde image als de testhelper zelf zou starten, zodat de tests op
      # dezelfde Postgres draaien als lokaal zonder deze variabele. Het
      # unit-been gebruikt hem niet; die paar seconden opstart zijn de
      # eenvoud van één matrix waard.
      postgres:
        image: postgres:11-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      TEST_POSTGRES_URL: ${{ matrix.postgres-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Install mold linker
        # Why not apt, and why make-default is off: see the Pre-commit job.
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038  # v1
        with:
          mold-version: 2.42.1
          make-default: false

      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Cache cargo registry (shared)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Run tests
        run: just ${{ matrix.recipe }}

  bdd-conformance:
    name: BDD conformance
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Install mold linker
        # Why not apt, and why make-default is off: see the Pre-commit job.
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038  # v1
        with:
          mold-version: 2.42.1
          make-default: false

      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Cache cargo registry (shared)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # Alleen bucket B. Die bewijst dat de engine de hele BDD-taal spreekt
      # tegen synthetische `test_*`-wetten, en hangt aan niets buiten de repo.
      # Bucket A toetst de levende wetten: daar betekent rood dat een wet is
      # veranderd of een scenario verouderd is, en dat is een oordeel van een
      # mens, geen merge-blokkade.
      #
      # Het testtarget staat op `test = false` en loopt dus niet mee in
      # `cargo test --workspace`; het wordt hier expliciet genoemd. RUSTFLAGS
      # herhaalt de mold-link-arg uit packages/.cargo/config.toml, omdat een
      # expliciete RUSTFLAGS die configuratie overschrijft.
      - name: Run conformance bucket
        working-directory: packages/engine
        env:
          BDD_BUCKET: conformance
          RUSTFLAGS: -Dwarnings -C link-arg=-fuse-ld=mold
        run: cargo test --test bdd -- --nocapture

      # Dezelfde scenario's met de acties van elk artikel in omgekeerde
      # volgorde: de volgorde in het bestand mag geen uitkomst veranderen.
      - name: Run conformance bucket with reversed actions
        working-directory: packages/engine
        env:
          BDD_BUCKET: conformance
          BDD_REVERSE_ACTIONS: "1"
          RUSTFLAGS: -Dwarnings -C link-arg=-fuse-ld=mold
        run: cargo test --test bdd -- --nocapture

  # Bucket A over het demo-corpus: de 80 gemigreerde POC-wetten onder
  # corpus/demo met hun scenario's en persona-data (REGULATION_PATH wijst wetten
  # én scenario's daarheen). Anders dan bucket A over corpus/regulation hangt
  # dit aan niets buiten de repo en zijn de gegevens synthetisch, dus rood hier
  # is een echte fout (een wet, een binding of de engine) en geen oordeel van
  # een mens.
  bdd-demo:
    name: BDD demo (${{ matrix.leg }})
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Each leg runs one action order of the demo bucket on its own runner.
        # The demo-law validation and the Awb lifecycle run only in the
        # `forward` leg, which is the shorter of the two. The `Test` gate
        # reads `needs.bdd-demo.result`, which fails when either leg fails.
        include:
          - leg: forward
            reverse: ''
          - leg: reversed
            reverse: '1'
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Install mold linker
        # Why not apt, and why make-default is off: see the Pre-commit job.
        uses: rui314/setup-mold@339e96b4ff1f3bd865856ba4cbbe8818a7acb038  # v1
        with:
          mold-version: 2.42.1
          make-default: false

      - name: Run sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Cache cargo registry (shared)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # De pre-commit-hook valideert corpus/demo ook, maar alleen de bestanden
      # in de commit; hier het hele demo-corpus tegen schema/latest.
      - name: Validate demo laws
        if: matrix.leg == 'forward'
        env:
          RUSTFLAGS: -Dwarnings -C link-arg=-fuse-ld=mold
        run: |
          find corpus/demo/regulation -name '*.yaml' ! -name '.*' -print0 | sort -z \
            | xargs -0 script/validate.sh

      # An empty BDD_REVERSE_ACTIONS keeps the file order; "1" reverses the
      # actions of every article (packages/engine/tests/common/reverse_actions.rs).
      - name: Run demo bucket (${{ matrix.leg }} actions)
        working-directory: packages/engine
        env:
          BDD_BUCKET: corpus
          BDD_REVERSE_ACTIONS: ${{ matrix.reverse }}
          REGULATION_PATH: ${{ github.workspace }}/corpus/demo/regulation
          RUSTFLAGS: -Dwarnings -C link-arg=-fuse-ld=mold
        run: cargo test --test bdd -- --nocapture

      # Zoals `just bdd-demo`: de Awb-levensloop over hetzelfde democorpus.
      # De unit-baan draait deze test alleen tegen corpus/regulation.
      - name: Run Awb lifecycle over demo corpus
        if: matrix.leg == 'forward'
        working-directory: packages/engine
        env:
          REGULATION_PATH: ${{ github.workspace }}/corpus/demo/regulation
          RUSTFLAGS: -Dwarnings -C link-arg=-fuse-ld=mold
        run: cargo test --test awb_lifecycle

  nldd-imports:
    name: Ontwerpsysteem-imports
    needs: changes
    # Deze guard bewaakt frontend/src en docs/src, maar stond als stap in
    # frontend-tests en draaide dus alleen bij `ci`. Een docs-only PR liet hem
    # over en kon docs/src/nldd-components.js ongemerkt uit de pas laten lopen;
    # de volgende PR die wel frontend raakte, kreeg de rekening. Vandaar een
    # eigen baan op beide filters.
    if: needs.changes.outputs.ci == 'true' || needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # --ignore-scripts om dezelfde reden als in frontend-tests: een gekaapte
      # release mag zijn install-hooks hier niet draaien.
      #
      # De hele werkruimte installeren is nodig omdat de guard de entry points
      # van @nldd/design-system uit de geïnstalleerde package leest.
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      # Niet in `npm run build`: de Docker-images bouwen met alleen hun eigen
      # workspace als context (docs/Dockerfile doet `COPY docs/ .`), dus een
      # script buiten die map is daar onbereikbaar. Hier is de hele repo
      # uitgecheckt.
      - name: Ontwerpsysteem-imports in sync met de gebruikte tags
        run: |
          node script/check-nldd-imports.mjs frontend/src frontend/src/nldd-components.js
          node script/check-nldd-imports.mjs docs/src docs/src/nldd-components.js

  frontend-tests:
    name: Frontend tests
    needs: changes
    if: needs.changes.outputs.ci == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # --ignore-scripts: een gekaapte release mag zijn preinstall/postinstall
      # niet in onze CI draaien. Dependabot lost zelf al met --ignore-scripts
      # op, dus de PR is onschuldig; het venster zit hier, in de eerste install
      # op die branch.
      #
      # Geen enkele install-hook in deze workspace levert iets op wat de build
      # nodig heeft. De uitzondering zit in docs/ (puppeteer voor pa11y) en
      # wordt daar in een eigen stap opgevangen.
      - name: Install frontend dependencies
        run: npm ci --ignore-scripts

      - name: BDD grammar codegen is in sync
        run: |
          node bdd/codegen/gen-js.mjs
          git diff --exit-code packages/frontend-shared/src/gherkin/grammar.generated.js \
            || { echo "::error::grammar.generated.js is stale — run 'just bdd-codegen' and commit the result"; exit 1; }

      # De pre-commit-baan draait de slot-guard ook, maar zonder `npm ci`: daar
      # ontbreekt het ontwerpsysteem en slaan de guard en zijn ijktest zich
      # over. Hier staat het er wel.
      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      # Zonder ontwerpsysteem slaan guard en ijktest zich groen over. Hier
      # moet het er staan; verhuist de package, dan valt deze baan om.
      - name: Design-system slot guard
        run: |
          test -d node_modules/@nldd/design-system/dist/components \
            || { echo "::error::@nldd/design-system/dist/components ontbreekt; de slot-guard zou zich overslaan"; exit 1; }
          just nldd-slots
          just nldd-slots-test

      - name: Run frontend tests
        # Directory form (`-w frontend`) rather than the package name, so a
        # rename of the `name` field can't silently skip the tests.
        run: npm test -w frontend

      - name: Type check editor
        run: npm run typecheck -w frontend

      - name: Run lawmaking tests
        run: npm test -w frontend-lawmaking

      - name: Type check lawmaking
        run: npm run typecheck -w frontend-lawmaking

      - name: Run demo tests
        run: npm test -w frontend-demo

      - name: Type check demo
        run: npm run typecheck -w frontend-demo

      - name: Run chronolexografie poc tests
        run: npm test -w packages/poc-chronolexografie/frontend

      # De rekenkunde van de opgenomen rondleiding (knippen, hoofdstukken,
      # ondertitels): pure Python zonder ffmpeg, dus hier in een paar seconden.
      - name: Run walkthrough pipeline tests
        # In een eigen venv: de systeem-Python van de runner weigert een
        # globale pip install (PEP 668). Het project zelf erin, zodat zijn
        # dependencies (pyproject.toml) meekomen, zoals `just walkthrough test`
        # ze lokaal via uv krijgt.
        run: |
          python3 -m venv "$RUNNER_TEMP/walkthrough"
          "$RUNNER_TEMP/walkthrough/bin/pip" install -q ./script/walkthrough pytest
          "$RUNNER_TEMP/walkthrough/bin/python" -m pytest -q script/walkthrough/tests

      # packages/arch-extract/ui is geen workspace-member (eigen package.json en
      # lockfile), dus `npm test -w` bereikt het niet en de test die er ligt
      # draaide nergens.
      - name: Run arch-explorer tests
        working-directory: packages/arch-extract/ui
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Run shared-package tests
        run: npm test -w packages/frontend-shared

      # vue-tsc, niet tsc: alleen vue-tsc leest de <script>-blokken in .vue.
      # Gepind op TypeScript 6 (override in de root-package.json), omdat
      # vue-tsc nog niet op TypeScript 7 draait.
      - name: Type check shared package
        run: npm run typecheck -w packages/frontend-shared

      # De productiebundel werd tot nu toe alleen in frontend/Dockerfile
      # gemaakt, en sinds de images uit de standaardloop van een PR zijn
      # gehaald draaide `vite build` nergens meer. Dit dekt in één stap de
      # bundel plus de drie scripts die eraan hangen: copy-laws (prebuild),
      # check-first-load en precompress.
      #
      # Na de tests: `prebuild` schrijft in frontend/public/data, en die map
      # hoort niet onder de vitest-run te veranderen.
      - name: Build editor bundle
        run: npm run build -w frontend

      - name: Build lawmaking bundle
        run: npm run build -w frontend-lawmaking

      # De demo bundelt corpus/demo (prebuild) en verwacht de WASM-engine onder
      # public/wasm/pkg; die bouwt frontend-demo/Dockerfile zelf. Hier volstaat
      # de bundel zonder engine: het gaat om de Vue-build en de corpuskopie.
      - name: Build demo bundle
        run: npm run build -w frontend-demo

  # Verplichte check op main. De benen hierboven dragen nieuwe namen en mogen
  # dus van vorm veranderen; deze naam moet blijven bestaan, want een required
  # check die niet verschijnt laat elke PR eeuwig hangen. Skipped benen (geen
  # relevante wijziging) gelden hier als geslaagd.
  test:
    name: Test
    needs:
      # Niet als voorganger die iets test, maar omdat elke baan hieronder eraan
      # hangt: valt `changes` om, dan slaan ze allemaal over.
      - changes
      - rust-tests
      - bdd-conformance
      - bdd-demo
      - frontend-tests
      - nldd-imports
      # Deze vier draaiden al bij elke PR maar blokkeerden niets. Ze hier
      # aanhangen kost geen runnerminuut en geen nieuwe required context bij
      # branch protection.
      - e2e
      - cross-law-integrity
      - provenance-checks
      - docs-a11y
      - docs-source
      - rust-image
      - walkthrough-replay
      # A required check of its own as well. It is listed here because e2e and
      # walkthrough-replay need its artifact: when it fails they are skipped,
      # and this gate would read those two as passed.
      - wasm
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Elke voorganger krijgt een eigen `check`-regel; script/ci-gate.test.mjs
      # rekent na dat de lijst hieronder en `needs` niet uiteenlopen, en dat
      # skipped geslaagd blijft.
      - name: Gate
        run: |
          status=0
          check() {
            case "$2" in
              failure|cancelled) echo "::error::$1 gaf $2"; status=1 ;;
              *) echo "$1: $2" ;;
            esac
          }
          # `changes` is de enige voorganger die geslaagd MOET zijn. Overgeslagen
          # geldt hieronder als geslaagd, en terecht: een PR die geen Rust raakt
          # hoort niet te blijven hangen op een testbaan die niets te doen had.
          # Maar valt `changes` zelf om, dan slaan al zijn afhankelijken over om
          # een heel andere reden, en zou de poort die zes stuk voor stuk als
          # geslaagd lezen. De hele required set wordt dan groen terwijl er niets
          # gedraaid is.
          require() {
            case "$2" in
              success) echo "$1: $2" ;;
              *) echo "::error::$1 gaf $2, dus de banen erachter zijn nooit gedraaid"; status=1 ;;
            esac
          }
          require changes "${{ needs.changes.result }}"
          check rust-tests "${{ needs.rust-tests.result }}"
          check bdd-conformance "${{ needs.bdd-conformance.result }}"
          check bdd-demo "${{ needs.bdd-demo.result }}"
          check frontend-tests "${{ needs.frontend-tests.result }}"
          check nldd-imports "${{ needs.nldd-imports.result }}"
          check e2e "${{ needs.e2e.result }}"
          check cross-law-integrity "${{ needs.cross-law-integrity.result }}"
          check provenance-checks "${{ needs.provenance-checks.result }}"
          check docs-a11y "${{ needs.docs-a11y.result }}"
          check docs-source "${{ needs.docs-source.result }}"
          check rust-image "${{ needs.rust-image.result }}"
          check walkthrough-replay "${{ needs.walkthrough-replay.result }}"
          check wasm "${{ needs.wasm.result }}"
          exit "$status"

  # Besides proving that the engine builds for wasm32, this job builds the
  # browser engine once for every job that runs it in Chromium: e2e and
  # walkthrough-replay download the artifact instead of compiling it inside
  # the Playwright image, which has no C compiler and would need apt for one.
  # It builds whenever either of them runs; `walkthrough` is a subset of `ci`
  # today, and BUILD names both so that narrowing `ci` cannot leave the
  # replay without an engine.
  wasm:
    name: WASM Build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_ENABLED: "true"
      CARGO_INCREMENTAL: "0"
      BUILD: ${{ needs.changes.outputs.ci == 'true' || needs.changes.outputs.walkthrough == 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: env.BUILD == 'true'

      - name: Install just
        if: env.BUILD == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Install Rust toolchain
        if: env.BUILD == 'true'
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Run sccache
        if: env.BUILD == 'true'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Cache cargo registry (shared)
        if: env.BUILD == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      # `just wasm-build` expects `wasm-bindgen` on PATH; the script reads
      # version and checksum from frontend/Dockerfile.
      - name: Install wasm-bindgen-cli
        if: env.BUILD == 'true'
        run: script/install-wasm-bindgen.sh

      # The same recipe the jobs below used to run themselves: a release build
      # with the `wasm` feature, wasm-bindgen `--target web`, and the copies
      # for the demo and the docs. wasm32 links with rust-lld, not mold, so
      # the default RUSTFLAGS (-Dwarnings, no mold link-arg) is correct here.
      - name: Build for WASM
        if: env.BUILD == 'true'
        run: just wasm-build

      # Every path `just wasm-build` writes, so a download at the repository
      # root puts the engine exactly where a local build would. Only jobs in
      # this run read it; a week leaves room for "Re-run failed jobs" on e2e
      # or the replay without re-running this job.
      - name: Upload WASM engine
        if: env.BUILD == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: wasm-engine
          path: |
            frontend/public/wasm/pkg
            frontend-demo/public/wasm/pkg
            docs/public/wasm/pkg
          if-no-files-found: error
          retention-days: 7

      # The chronolexografie poc runs the cel and the engine in the visitor's
      # browser (packages/poc-chronolexografie); a dependency that does not
      # build for wasm32 would otherwise only show in the poc image on main.
      - name: Build chronolexografie for WASM
        if: env.BUILD == 'true'
        run: cargo build --manifest-path packages/Cargo.toml -p regelrecht-poc-chronolexografie --target wasm32-unknown-unknown --features wasm

      - name: Skip (no relevant changes)
        if: env.BUILD != 'true'
        run: echo "No relevant changes, skipping WASM build"

  # Sinds de previews opt-in werden (#1204) bouwt een PR geen images meer, dus
  # of een Rust-image überhaupt bouwt bleek pas op main, met deploy-production
  # er direct achteraan. De machinerie die daar stuk kan: de musl-toolchain, het
  # release-profiel, de cargo-chef-lagen, de `COPY schema/` waar include_str!
  # aan hangt, en de bin-naam in `COPY --from=builder`.
  #
  # Eén image is genoeg. De drie Rust-Dockerfiles delen deze hele machinerie en
  # verschillen alleen in welke members ze kopiëren en welke binary ze eruit
  # halen; dat verschil dekt script/dockerfile-consistency.test.mjs statisch af.
  # pipeline-api is de goedkoopste van de drie: gemeten 4,4 tot 4,8 minuut met
  # warme cache.
  #
  # Hij hangt aan de `Test`-poort en blokkeert dus. Een build waarop gewacht
  # wordt maar die niets tegenhoudt kost de wandklok zonder de garantie te
  # leveren; dan kun je hem net zo goed niet draaien.
  rust-image:
    name: Rust image build
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Alleen lezen: deze build duwt niets naar GHCR. Zie `push: false`.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.changes.outputs.rust-image == 'true'

      - name: Set up Docker Buildx
        if: needs.changes.outputs.rust-image == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      # Nodig om de buildcache uit GHCR te mogen lezen; zonder login bouwt hij
      # alles koud en loopt de job richting het kwartier.
      - name: Log in to Container Registry
        if: needs.changes.outputs.rust-image == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Zelfde namespace als build-image.yml: de eigenaar van de repo, in
      # kleine letters.
      - name: Resolve registry namespace
        if: needs.changes.outputs.rust-image == 'true'
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Dezelfde inputs als build-pipeline-api in deploy.yml, op push na. Lopen
      # die twee uiteen, dan bewijst deze baan iets anders dan er gedeployd
      # wordt; script/dockerfile-consistency.test.mjs bewaakt de namen.
      - name: Build pipeline-api image
        if: needs.changes.outputs.rust-image == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: packages/pipeline/Dockerfile
          target: pipeline-api
          build-args: BIN=regelrecht-pipeline-api
          # Niets pushen en niets in de daemon laden: het gaat om de bouw, niet
          # om het artefact. Ook geen cache-to, want alleen main schrijft cache.
          push: false
          load: false
          cache-from: type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/regelrecht-buildcache:pipeline-api

      - name: Skip (no relevant changes)
        if: needs.changes.outputs.rust-image != 'true'
        run: echo "Geen wijziging die een Rust-image raakt, image-build overgeslagen"

  # De enige job die de editor in een echte browser laadt. Unit-tests draaien op
  # happy-dom, en die ziet het WASM-laadpad in
  # frontend/src/composables/useEngine.js niet: fetch -> Blob -> object-URL ->
  # `import(/* @vite-ignore */ blobUrl)` wordt door de bundler juist buiten de
  # analyse gehouden, dus een groene build zegt daar niets over.
  #
  # Alleen de gemockte suite (frontend/e2e/). De smoketest uit
  # `just smoke-preview` draait tegen een gedeployde preview met echte Keycloak-
  # credentials en hoort niet in de PR-gate.
  e2e:
    name: E2E (mocked)
    # The engine comes from the wasm job. If that job fails, this one is
    # skipped, so the `Test` gate reads `wasm` too.
    needs: [changes, wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The official Playwright image: Chromium and every system library it
    # needs are already in it (under /ms-playwright, PLAYWRIGHT_BROWSERS_PATH),
    # so the job skips `playwright install --with-deps`, whose apt round-trip
    # on the runner took anywhere from 10 s to over 9 minutes. The tag has to
    # be the Playwright version both lockfiles resolve (package-lock.json and
    # docs/package-lock.json), or the package looks for a browser revision the
    # image does not have; script/playwright-image.test.mjs fails when they
    # drift. Pinned by the digest of the multi-arch index:
    #   curl -sI -H 'Accept: application/vnd.oci.image.index.v1+json' \
    #     https://mcr.microsoft.com/v2/playwright/manifests/v<version>-noble \
    #     | grep -i docker-content-digest
    # The same image runs walkthrough-replay and docs-a11y. It runs as root, without sudo.
    # --ipc=host is what Playwright recommends for Chromium in Docker: the
    # default 64 MB /dev/shm makes it crash on large pages.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    # A step without `shell:` runs under `bash -e` on the runner but under
    # `sh -e` in a container job, and the steps are written for bash.
    # `shell: bash` gives `bash -e -o pipefail`, which is also stricter than
    # the runner's default.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      # Parity met de andere npm-jobs: de workspace kan @nldd-pakketten van
      # npm.pkg.github.com halen.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: needs.changes.outputs.ci == 'true'

      # Built by the wasm job, on the runner. Building it here needs a C
      # compiler the image lacks, and its apt install once took 22 minutes.
      - name: Download WASM engine
        if: needs.changes.outputs.ci == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wasm-engine

      - name: Setup Node.js
        if: needs.changes.outputs.ci == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        if: needs.changes.outputs.ci == 'true'
        run: npm ci --ignore-scripts

      # What `just test-e2e` runs after its `wasm-build` dependency, which the
      # download above replaces. Playwright's webServer config starts the vite
      # dev server.
      - name: Run mocked e2e suite
        if: needs.changes.outputs.ci == 'true'
        run: npm run test:e2e -w frontend

      # De poc-tests draaien de echte WASM-engine tegen het casus-corpus
      # (Gherkin-scenario's incluis), dus ze horen in deze baan en niet bij de
      # gewone frontend-tests: daar is geen wasm-artefact. Hier staat het
      # klaar uit de download hierboven.
      - name: Run poc tests
        if: needs.changes.outputs.ci == 'true'
        run: |
          npm test -w frontend-poc-terugbetaalregimes
          npm test -w frontend-poc-nieuwkomersbekostiging
          # De assistent-backend is geen workspace-member (het is een server,
          # geen frontend), dus `npm test -w` bereikt hem niet. De vitest uit
          # de root draait zijn tests wel.
          npx vitest run --root packages/poc-assistent

      - name: Upload Playwright report
        if: failure() && needs.changes.outputs.ci == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

      - name: Skip (no relevant changes)
        if: needs.changes.outputs.ci != 'true'
        run: echo "No relevant changes, skipping e2e suite"

  # De opgenomen rondleiding (/rondleiding) is een stem plus een log van wat
  # de presentator deed; de replay doet dat opnieuw in de echte demo. Een
  # wijziging in de demo kan een opgenomen klik of scroll zonder doel laten
  # (een hernoemde knop, een verplaatst paneel, een wet die weg is), en dan
  # laat de rondleiding iets anders zien dan de stem zegt. Deze baan speelt
  # elk hoofdstuk terug in twee vensterformaten en faalt op elke handeling
  # die zijn element niet meer vindt. Hetzelfde commando als lokaal:
  # `just walkthrough verify`. Zonder timeline.json slaagt hij meteen.
  walkthrough-replay:
    name: Rondleiding speelt terug
    # The engine comes from the wasm job; see e2e.
    needs: [changes, wasm]
    if: needs.changes.outputs.walkthrough == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # See the e2e job for the image and why its tag is pinned to the lockfiles.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    # bash, not the container's `sh`; see the e2e job.
    defaults:
      run:
        shell: bash
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      # Built by the wasm job; see e2e.
      - name: Download WASM engine
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: wasm-engine

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      # Start zelf een dev-server (de testhaak van de replay bestaat alleen in
      # een dev-build) en haalt alleen de stem uit de release.
      - name: Replay every chapter
        run: just walkthrough verify

  # Security audit
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7  # stable

      - name: Cache cargo registry (shared)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('packages/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-registry-

      - name: Install cargo-deny
        run: |
          CARGO_DENY_VERSION="0.19.0"
          CARGO_DENY_SHA256="0e8c2aa59128612c90d9e09c02204e912f29a5b8d9a64671b94608cbe09e064f"
          curl -sSL "https://github.com/EmbarkStudios/cargo-deny/releases/download/${CARGO_DENY_VERSION}/cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz" \
            -o /tmp/cargo-deny.tar.gz
          echo "${CARGO_DENY_SHA256}  /tmp/cargo-deny.tar.gz" | sha256sum -c -
          tar -xz --strip-components=1 -C /usr/local/bin \
            -f /tmp/cargo-deny.tar.gz \
            "cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl/cargo-deny"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Run security audit
        run: just audit

  # De broncontroles op de documentatie. Los van docs-a11y omdat ze geen
  # astro-build, geen Chromium en geen pa11y nodig hebben: ze lezen de
  # markdown en de repo zelf, draaien in seconden, en kunnen daarom breed
  # getriggerd worden op elke wijziging in de code die de documentatie
  # beschrijft.
  #
  # Dat brede filter is de kern. De afdrijving die deze controles moeten
  # vangen ontstaat niet in docs/ maar erbuiten: een map verhuist, een veld
  # krijgt een andere naam, een bewerking komt erbij, en de proza die dat
  # beschrijft blijft staan. Een poort die alleen op docs/** draait kijkt
  # precies de verkeerde kant op.
  docs-source:
    name: Docs source checks
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # check-schema-version telt de schema-tags, en die komen niet mee in
          # een ondiepe checkout. Zonder tags slaat die controle zichzelf over
          # in plaats van te liegen, maar dan vangt ze ook niets.
          fetch-depth: 0

      - name: Setup Node.js
        if: needs.changes.outputs.docs-source == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'

      # De controles gebruiken alleen de standaardbibliotheek van Node, dus
      # geen npm ci: dat zou een minuut kosten voor niets.
      - name: Run docs source checks
        if: needs.changes.outputs.docs-source == 'true'
        working-directory: docs
        run: npm run check:source

  docs-a11y:
    name: Docs accessibility gate (${{ matrix.shard }})
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # See the e2e job for the image and why its tag is pinned to the lockfiles.
    # The docs build renders mermaid diagrams with the image's Chromium.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    # bash, not the container's `sh`; see the e2e job.
    defaults:
      run:
        shell: bash
    # pa11y checks about 2.5 s per page and the full site has some 200, so
    # the pages are split over three runners, each with its own Chromium.
    # gen-pa11yci.mjs takes every third page for its shard. Without docs
    # changes there is nothing to split and one shard reports the skip. Not a
    # required check by name: the `Test` gate reads `needs.docs-a11y.result`,
    # which fails when any shard fails.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.docs == 'true' && '[1, 2, 3]' || '[1]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # De gate beperkt zich tot de gewijzigde pagina's als dat veilig kan,
          # en daarvoor is de diff tegen de base nodig.
          fetch-depth: 0

      # The checkout belongs to the runner's user and the container runs as
      # root, so git refuses the repository ("dubious ownership") for the
      # `git diff` and `git worktree` below unless it is marked safe.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install just
        if: needs.changes.outputs.docs == 'true'
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3  # v4.0.0

      - name: Setup Node.js
        if: needs.changes.outputs.docs == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: docs/package-lock.json

      - name: Install docs dependencies
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs
        run: npm ci --ignore-scripts

      # Two packages the image lacks: `unzip` for Puppeteer's Chrome download,
      # and the DejaVu fonts the runner image renders code blocks in. The
      # script installs the exact .debs apt would pick, pinned by checksum,
      # without going through the image's apt mirror; why, and how to refresh
      # them, is in the script.
      - name: Install unzip and fonts
        if: needs.changes.outputs.docs == 'true'
        run: script/install-a11y-debs.sh

      # pa11y draait niet op playwright maar op puppeteer, met een eigen
      # browsercache (~/.cache/puppeteer). Die download zat in puppeteers
      # postinstall en verdween met --ignore-scripts hierboven; hij hoort
      # daarom expliciet te staan. Zonder deze stap faalt de gate met
      # "Could not find Chrome".
      #
      # This step fetches only the browser itself. The shared libraries it
      # needs to start (libnss3, libgbm, libasound2, ...) come with the
      # Playwright image, which carries everything Chromium links against.
      # pa11y starts it with --no-sandbox (docs/scripts/gen-pa11yci.mjs),
      # which running as root in the container requires.
      #
      # `--no` houdt npx bij de puppeteer uit docs/package-lock.json. Zonder
      # die vlag zou npx bij een resolutiewijziging stilletjes puppeteer@latest
      # van de registry halen — inclusief de postinstall die we hierboven net
      # hebben uitgezet.
      - name: Install Puppeteer Chrome
        if: needs.changes.outputs.docs == 'true'
        working-directory: docs
        run: npx --no puppeteer browsers install chrome

      # Op een pull request en in de rij: de lijst gewijzigde bestanden, waarmee
      # gen-pa11yci.mjs de gate tot de geraakte pagina's beperkt. Raakt de
      # wijziging iets anders dan inhoud (layout, component, stylesheet,
      # configuratie), dan valt dat script terug op de volledige site. Bij een
      # push naar main blijft de lijst leeg en draait de gate altijd volledig.
      - name: Bepaal gewijzigde bestanden
        if: needs.changes.outputs.docs == 'true'
        id: changed
        env:
          BASE_SHA: >-
            ${{ github.event.pull_request.base.sha
                || github.event.merge_group.base_sha }}
        run: |
          files=""
          # Is de basis hier niet bereikbaar, dan geen lijst, en draait de poort
          # over de volledige site. Zonder dit vangnet stopt `bash -e` de baan
          # bij een `bad object`, valt de Test-poort om en gaat in de rij de
          # hele groep eruit — een strengere uitkomst dan de poort bedoelt, om
          # een commit die alleen maar niet op te halen was.
          #
          # Eerst `cat-file`, en niet alleen `git diff` in een `if`: de uitkomst
          # van een pijplijn is die van het laatste onderdeel, dus `| tr` zou de
          # fout van `git diff` opslokken zodra `pipefail` er niet is. Actions
          # zet die vlag vandaag wel, maar dan hangt deze poort aan een
          # standaard die een `shell:` of `defaults:` elders ongemerkt wegneemt.
          if [ -n "$BASE_SHA" ] && ! git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            echo "::warning title=Toegankelijkheidspoort::$BASE_SHA is hier niet bereikbaar; de poort draait over de volledige site."
          elif [ -n "$BASE_SHA" ]; then
            files=$(git diff --name-only "$BASE_SHA" HEAD | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      # `just docs-a11y` builds the site, regenerates .pa11yci from the build,
      # then runs pa11y-ci (htmlcs + axe) over the selected pages. Non-zero
      # exit fails. Welke pagina's dat waren staat in het log van die stap.
      - name: Run accessibility gate
        if: needs.changes.outputs.docs == 'true'
        env:
          A11Y_CHANGED_FILES: ${{ steps.changed.outputs.files }}
          # Expressions have no arithmetic, so N comes from the matrix itself.
          A11Y_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: just docs-a11y

      # Een gepubliceerd adres blijft bereikbaar. Een documentatiepagina wordt
      # geciteerd in een RFC, in een issue, in een bladwijzer en in mail buiten
      # deze repo; hernoemen mag, het oude adres laten verdwijnen niet, want die
      # rekening ligt bij een lezer die niet kan weten waar het heen ging.
      #
      # De vorige stap heeft de site al gebouwd. Hier komt daar de bouw van de
      # base-branch naast, puur om te vragen welke routes die uitgaf. Een route
      # die daar bestond en hier niet meer laat de job vallen, met de
      # redirect-regel die het oplost erbij.
      #
      # Alleen op een pull request: bij een push naar main is er geen "ervoor"
      # om tegen te vergelijken.
      #
      # It compares whole builds, not pages, so one shard is enough.
      - name: Check no published URL disappeared
        if: needs.changes.outputs.docs == 'true' && github.event_name == 'pull_request' && matrix.shard == 1
        run: |
          set -euo pipefail
          base="$(mktemp -d)"
          git worktree add --detach "$base" "${{ github.event.pull_request.base.sha }}"
          cp -R docs/node_modules "$base/docs/node_modules"
          ( cd "$base/docs" && npm run build >/dev/null 2>&1 ) || {
            # Faalt de base-bouw, dan zegt dat niets over deze PR. Overslaan is
            # dan eerlijker dan rood gaan op andermans probleem.
            echo "::warning::kon de base-branch niet bouwen, URL-controle overgeslagen"
            exit 0
          }
          find "$base/docs/dist" -name index.html \
            | sed "s|^$base/docs/dist||; s|/index.html$||; s|^$|/|" \
            | sort > /tmp/base-routes.txt
          node docs/scripts/check-no-dead-urls.mjs /tmp/base-routes.txt

      - name: Skip (no relevant changes)
        if: needs.changes.outputs.docs != 'true'
        run: echo "No docs changes, skipping accessibility gate"
