---
name: Warm build cache

# The cook layer of every Rust image (all dependencies in release, 4 to 6
# minutes) comes from the registry cache that only main writes. Until now only
# the deploy wrote it, so a deploy that did not go ahead (CI green too late, a
# failed build) left it on the old Cargo.lock, and every PR rebuilt all
# dependencies until the next successful deploy of that image. On every push
# to main this workflow builds just the `deps` stage and writes it to a tag of
# its own (`<name>-deps`), independent of the deploy. The image builds read
# that tag next to their own cache, which stays as it is.
#
# No path filter: besides the manifests, every file cargo discovers as a
# target (tests/, src/bin/, benches/, examples/, build.rs) ends up in
# recipe.json, and a filter that misses one leaves the cache stale again.
# When nothing changed the build is fully cached and takes about a minute.
#
# mode=max leaves the previous cache manifest untagged on each push, so storage
# grows the same way the per-image cache tags already do. Pruning the
# buildcache package is a separate concern, not handled here.

on:
  push:
    branches: [main]
  # To fill an empty or stale cache by hand.
  workflow_dispatch:

# Queue rather than cancel: on a busy main a newer push would otherwise keep
# cancelling a cook that is minutes from done.
concurrency:
  group: warm-buildcache
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  warm:
    name: Warm ${{ matrix.scope }}
    # A manual run from another branch would overwrite the tags main reads.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - scope: editor
            dockerfile: frontend/Dockerfile
          - scope: admin
            dockerfile: packages/admin/Dockerfile
          - scope: pipeline
            dockerfile: packages/pipeline/Dockerfile
          - scope: poc-napp
            dockerfile: packages/poc-napp/Dockerfile
          - scope: poc-portal
            dockerfile: packages/poc-portal/Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4

      - name: Log in to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve registry namespace
        id: ns
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      # Reads its own deps tag too: when only a Dockerfile changed outside the
      # deps stage, everything is cached and this is done in a minute.
      - name: Build deps stage
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: deps
          push: false
          load: false
          cache-from: type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/regelrecht-buildcache:${{ matrix.scope }}-deps
          cache-to: type=registry,ref=ghcr.io/${{ steps.ns.outputs.owner }}/regelrecht-buildcache:${{ matrix.scope }}-deps,mode=max
