<svg viewBox="0 0 1000 478" xmlns="http://www.w3.org/2000/svg" role="img" font-family="RijksSansVF, 'Source Sans 3', Arial, sans-serif"><title>Het systeemlandschap van RegelRecht</title><defs><marker id="systeemlandschap-kop" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f3b5c"/></marker><g id="systeemlandschap-pers" fill="#7d8792"><circle cx="5" cy="3" r="3"/><path d="M0,12 C0,7 10,7 10,12 z"/></g></defs><text x="14" y="30" style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: rgb(90, 104, 117);">BRONNEN</text><text x="217" y="30" style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: rgb(90, 104, 117);">REGELRECHT</text><text x="822" y="30" style="font-size: 12px; font-weight: 600; letter-spacing: 0.04em; fill: rgb(90, 104, 117);">GEBRUIK</text><rect x="10" y="40" width="180" height="290" rx="6" fill="#f6f8fa" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3"/><rect x="205" y="38" width="590" height="392" rx="6" fill="#eef2f6" stroke="#9aa5b1" stroke-width="1.2" stroke-dasharray="4 3"/><g><rect x="20" y="50" width="160" height="68" rx="4" fill="#fff" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3"/><text x="30" y="71" style="font-size: 13.5px; font-weight: 600; fill: rgb(26, 26, 26);">Landelijke regelgeving</text><text x="30" y="89" style="font-size: 12.5px; fill: rgb(74, 74, 74);">wetten en regelingen</text><text x="30" y="104" style="font-size: 12.5px; fill: rgb(74, 74, 74);">(wetten.nl, BWB)</text><rect x="20" y="128" width="160" height="68" rx="4" fill="#fff" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3"/><text x="30" y="149" style="font-size: 13.5px; font-weight: 600; fill: rgb(26, 26, 26);">Lokale regelgeving</text><text x="30" y="167" style="font-size: 12.5px; fill: rgb(74, 74, 74);">gemeenten, provincies,</text><text x="30" y="182" style="font-size: 12.5px; fill: rgb(74, 74, 74);">waterschappen (CVDR)</text><rect x="20" y="234" width="160" height="82" rx="4" fill="#fff" stroke="#9aa5b1" stroke-width="1.3" stroke-dasharray="4 3"/><text x="30" y="255" style="font-size: 13.5px; font-weight: 600; fill: rgb(26, 26, 26);">Parlementaire</text><text x="30" y="271" style="font-size: 13.5px; font-weight: 600; fill: rgb(26, 26, 26);">geschiedenis</text><text x="30" y="287" style="font-size: 12.5px; fill: rgb(74, 74, 74);">memorie van toelichting</text><text x="30" y="302" style="font-size: 12.5px; fill: rgb(74, 74, 74);">en andere kamerstukken</text><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M180 84 H198 V120 H216" marker-end="url(#systeemlandschap-kop)"/><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M180 162 H198 V120"/><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M180 270 H216" marker-end="url(#systeemlandschap-kop)"/></g><g><rect x="218" y="50" width="165" height="236" rx="4" fill="#fff"/><path d="M222 50 H379 a4 4 0 0 1 4 4 V90 H218 V54 a4 4 0 0 1 4 -4 z" fill="#1f3b5c"/><rect x="218" y="50" width="165" height="236" rx="4" fill="none" stroke="#1f3b5c" stroke-width="1.5"/><text x="228" y="75" style="font-size: 15px; font-weight: 700; fill: rgb(255, 255, 255);">Inlezen</text><text x="228" y="110" style="font-size: 13px; font-weight: 700; fill: rgb(31, 59, 92);">Wettekst</text><text x="228" y="128" style="font-size: 13px; fill: rgb(26, 26, 26);">de officiële tekst, per</text><text x="228" y="144" style="font-size: 13px; fill: rgb(26, 26, 26);">artikel en per versie</text><use href="#systeemlandschap-pers" x="229" y="166"/><text x="244" y="176" style="font-size: 12.5px; fill: rgb(58, 58, 58);">automatisch</text><path d="M228 192 H373" stroke="#c9d1da" stroke-width="1"/><text x="228" y="214" style="font-size: 13px; font-weight: 700; fill: rgb(31, 59, 92);">Scenario's</text><text x="228" y="232" style="font-size: 13px; fill: rgb(26, 26, 26);">voorbeelden uit de</text><text x="228" y="248" style="font-size: 13px; fill: rgb(26, 26, 26);">toelichting als testgeval</text><use href="#systeemlandschap-pers" x="229" y="262"/><text x="244" y="272" style="font-size: 12.5px; fill: rgb(58, 58, 58);">automatisch</text><rect x="411" y="50" width="152" height="236" rx="4" fill="#fff"/><path d="M411 194 H563 V282 a4 4 0 0 1 -4 4 H415 a4 4 0 0 1 -4 -4 z" fill="#eceff2"/><path d="M415 50 H559 a4 4 0 0 1 4 4 V90 H411 V54 a4 4 0 0 1 4 -4 z" fill="#1f3b5c"/><rect x="411" y="50" width="152" height="236" rx="4" fill="none" stroke="#1f3b5c" stroke-width="1.5"/><text x="421" y="75" style="font-size: 15px; font-weight: 700; fill: rgb(255, 255, 255);">Werkplaats</text><text x="421" y="110" style="font-size: 13px; fill: rgb(26, 26, 26);">wettekst interpreteren</text><text x="421" y="126" style="font-size: 13px; fill: rgb(26, 26, 26);">tot regelwerk,</text><text x="421" y="142" style="font-size: 13px; fill: rgb(26, 26, 26);">doorrekenen met de</text><text x="421" y="158" style="font-size: 13px; fill: rgb(26, 26, 26);">scenario's en laten</text><text x="421" y="174" style="font-size: 13px; fill: rgb(26, 26, 26);">toetsen</text><use href="#systeemlandschap-pers" x="422" y="206"/><text x="437" y="216" style="font-size: 12.5px; fill: rgb(58, 58, 58);">juristen, beleids-</text><text x="437" y="230" style="font-size: 12.5px; fill: rgb(58, 58, 58);">medewerkers en</text><text x="437" y="244" style="font-size: 12.5px; fill: rgb(58, 58, 58);">uitvoeringsexperts,</text><text x="437" y="258" style="font-size: 12.5px; fill: rgb(58, 58, 58);">ondersteund door AI</text><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M384 120 H409" marker-end="url(#systeemlandschap-kop)"/><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M384 214 H396 V150 H409" marker-end="url(#systeemlandschap-kop)"/><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M564 120 H631" marker-end="url(#systeemlandschap-kop)"/><text x="597" y="100" text-anchor="middle" style="font-size: 12.5px; font-style: italic; fill: rgb(31, 59, 92);">vaststellen</text><text x="597" y="113" text-anchor="middle" style="font-size: 12.5px; font-style: italic; fill: rgb(31, 59, 92);">en publiceren</text><text x="597" y="140" text-anchor="middle" style="font-size: 12.5px; fill: rgb(58, 58, 58);">door het</text><text x="597" y="154" text-anchor="middle" style="font-size: 12.5px; fill: rgb(58, 58, 58);">bevoegd</text><text x="597" y="168" text-anchor="middle" style="font-size: 12.5px; fill: rgb(58, 58, 58);">gezag</text><rect x="633" y="50" width="150" height="236" rx="4" fill="#fff"/><path d="M633 186 H783 V282 a4 4 0 0 1 -4 4 H637 a4 4 0 0 1 -4 -4 z" fill="#eceff2"/><path d="M637 50 H779 a4 4 0 0 1 4 4 V90 H633 V54 a4 4 0 0 1 4 -4 z" fill="#1f3b5c"/><rect x="633" y="50" width="150" height="236" rx="4" fill="none" stroke="#1f3b5c" stroke-width="1.5"/><text x="643" y="75" style="font-size: 15px; font-weight: 700; fill: rgb(255, 255, 255);">Corpus Juris</text><text x="643" y="110" style="font-size: 13px; fill: rgb(26, 26, 26);">vastgestelde regel-</text><text x="643" y="126" style="font-size: 13px; fill: rgb(26, 26, 26);">werken naast de</text><text x="643" y="142" style="font-size: 13px; fill: rgb(26, 26, 26);">wettekst, met elke</text><text x="643" y="158" style="font-size: 13px; fill: rgb(26, 26, 26);">versie bewaard</text><text x="643" y="208" style="font-size: 13px; font-weight: 700; fill: rgb(26, 26, 26);">Openbaar, tenzij</text><text x="643" y="225" style="font-size: 12.5px; fill: rgb(58, 58, 58);">de uitvoering niet</text><text x="643" y="239" style="font-size: 12.5px; fill: rgb(58, 58, 58);">openbaar mag zijn</text><text x="643" y="253" style="font-size: 12.5px; fill: rgb(58, 58, 58);">(opsporing, defensie):</text><text x="643" y="267" style="font-size: 12.5px; fill: rgb(58, 58, 58);">dan binnen de overheid</text><rect x="218" y="310" width="565" height="108" rx="4" fill="#fff"/><path d="M222 310 H779 a4 4 0 0 1 4 4 V338 H218 V314 a4 4 0 0 1 4 -4 z" fill="#1f3b5c"/><rect x="218" y="310" width="565" height="108" rx="4" fill="none" stroke="#1f3b5c" stroke-width="1.5"/><text x="228" y="329" style="font-size: 15px; font-weight: 700; fill: rgb(255, 255, 255);">Rekenkern<tspan dx="5" style="font-size: 14px; font-weight: 400; fill: rgb(255, 255, 255);">(rule engine)</tspan></text><text x="228" y="357" style="font-size: 13px; fill: rgb(26, 26, 26);">voert het regelwerk uit: dezelfde invoer geeft altijd dezelfde uitkomst, met een verantwoording</text><text x="228" y="373" style="font-size: 13px; fill: rgb(26, 26, 26);">tot op artikel en lid; draait in de werkplaats, op een website of in de systemen van de uitvoerder</text><path d="M228 389 H773" stroke="#c9d1da" stroke-width="1"/><text x="228" y="407" style="font-size: 13.5px; font-weight: 700; font-style: italic; fill: rgb(31, 59, 92);">Zonder AI: volgt alleen het vastgelegde regelwerk</text><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M487 286 V308" stroke-dasharray="4 3" marker-end="url(#systeemlandschap-kop)"/><text x="495" y="301" style="font-size: 12.5px; font-style: italic; fill: rgb(31, 59, 92);">scenario's proefdraaien</text><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M708 286 V308" marker-end="url(#systeemlandschap-kop)"/></g><g><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M783 364 H805"/><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M805 92 V357"/><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M805 92 H820" marker-end="url(#systeemlandschap-kop)"/><rect x="822" y="50" width="160" height="90" rx="4" fill="#fff" stroke="#1f3b5c" stroke-width="1.5"/><use href="#systeemlandschap-pers" x="832" y="63"/><text x="848" y="74" style="font-size: 14px; font-weight: 700; fill: rgb(31, 59, 92);">Uitvoerders</text><text x="832" y="98" style="font-size: 13px; fill: rgb(26, 26, 26);">nemen besluiten op basis</text><text x="832" y="114" style="font-size: 13px; fill: rgb(26, 26, 26);">van het regelwerk</text><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M805 222 H820" marker-end="url(#systeemlandschap-kop)"/><rect x="822" y="180" width="160" height="90" rx="4" fill="#fff" stroke="#1f3b5c" stroke-width="1.5"/><use href="#systeemlandschap-pers" x="832" y="193"/><text x="848" y="204" style="font-size: 14px; font-weight: 700; fill: rgb(31, 59, 92);">Burgers en bedrijven</text><text x="832" y="228" style="font-size: 13px; fill: rgb(26, 26, 26);">zien waar ze recht op</text><text x="832" y="244" style="font-size: 13px; fill: rgb(26, 26, 26);">hebben, en waarom</text><path stroke="#1f3b5c" stroke-width="1.6" fill="none" d="M805 352 H820" marker-end="url(#systeemlandschap-kop)"/><rect x="822" y="310" width="160" height="90" rx="4" fill="#fff" stroke="#1f3b5c" stroke-width="1.5"/><use href="#systeemlandschap-pers" x="832" y="323"/><text x="848" y="334" style="font-size: 14px; font-weight: 700; fill: rgb(31, 59, 92);">Wetgevers</text><text x="832" y="358" style="font-size: 13px; fill: rgb(26, 26, 26);">zien hoe de wet uitwerkt</text><text x="832" y="374" style="font-size: 13px; fill: rgb(26, 26, 26);">en verkennen wijzigingen</text></g><path d="M902 400 V458 H100 V332" fill="none" stroke="#1f3b5c" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#systeemlandschap-kop)"/><rect x="398" y="450" width="204" height="16" fill="#fff"/><text x="500" y="462" text-anchor="middle" style="font-size: 12.5px; font-style: italic; fill: rgb(31, 59, 92);">nieuwe of gewijzigde regelgeving</text></svg>
